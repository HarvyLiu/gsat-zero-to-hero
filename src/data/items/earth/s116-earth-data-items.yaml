# Practice items for earth/s116-earth-data-items (116 sprint, Earth science exam skills). All original.
# This chapter has no curriculum codes (earth.json: codes []), so the items carry none.
# No number or setting is reused from a worked example in the chapter (the chapter uses a harbour with
# 1.6 m / -0.9 m (the turn), a half-day tide table every 2 h with 1.3 m / -1.1 m, station A's monthly mean
# temperatures, a 20,000-year ash layer with imaginary isotopes 甲 5000 yr / 乙 1e9 yr (en X / Y) and why 乙
# FAILS, and a cross-section A, B, F, C, D; the items use a day's tide record in cm with two high and two
# low tides (the LARGEST neighbouring range), a plotting checklist, a typhoon's central-pressure record, a
# scoring case with key (1)(3), a 1.2-billion-year rock with imaginary isotopes 丙 / 丁 / 戊 (en U / V / W)
# and why 丁 IS suitable, and a cross-section P, Q, R, S, T given in words).
# All data are illustrative. Every answer key is recomputed by harness/checks/m_earth_s116_earth_data_items.py.
# Strings with TeX are single-quoted so YAML keeps backslashes.
chapter: earth/s116-earth-data-items
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_turn_tidal_range
    text:
      zh-tw:
        stem: '某港一天的潮位紀錄（示意數據）裡，有一次滿潮是1.6公尺，接著的乾潮是−0.9公尺。這兩次之間的潮差是幾公尺？'
        options: ['0.7', '0.9', '1.6', '2.5', '3.4']
        hint: '潮差是滿潮潮位減去乾潮潮位。乾潮是負的，減一個負數會怎樣？'
        explain: '潮差＝滿潮潮位−乾潮潮位＝$1.6-(-0.9)=1.6+0.9=2.5$ 公尺。算成 $1.6-0.9=0.7$ 是把負號丟了：乾潮比參考高度低0.9公尺，從乾潮到滿潮要先升0.9公尺到0，再升1.6公尺。'
      en:
        stem: 'In one day''s tide record at a harbour (illustrative data) there is a high tide of 1.6 m, and the low tide after it is −0.9 m. What is the tidal range between them, in metres?'
        options: ['0.7', '0.9', '1.6', '2.5', '3.4']
        hint: 'The tidal range is the high-tide level minus the low-tide level. The low tide is negative: what happens when you subtract a negative number?'
        explain: 'Tidal range = high-tide level − low-tide level = $1.6-(-0.9)=1.6+0.9=2.5$ m. Working out $1.6-0.9=0.7$ loses the minus sign: the low tide is 0.9 m below the reference level, so from low to high tide the sea first rises 0.9 m to 0 and then another 1.6 m.'
    answer: 3

  - id: q-order@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_turn_cross_section
    text:
      zh-tw:
        stem: '某地的地層剖面示意圖中，A、B是兩層沉積岩，A在下、B在上；斷層F切過A和B。沉積岩C在最上面，覆蓋在斷層F的上端，C沒有被F切斷。岩脈D從底部穿過A、B、C直到地表。由老到新，這五個事件的順序是哪一個？'
        options: ['A、B、C、F、D', 'A、B、F、C、D', 'A、B、C、D、F', 'D、C、F、B、A', 'A、F、B、C、D']
        hint: '截切其他岩石的岩體比被截切的年輕；蓋在上面、沒有被切斷的岩層，比它下面的岩體年輕。'
        explain: '疊置：A比B老。F切過A、B，所以F比B新；C蓋在F上端而且沒被切斷，所以C比F新。D切過C，最新。由老到新是A、B、F、C、D，選 (2)。(1)、(3) 把F排在C之後，忽略了C沒有被F切斷；(4) 是由新到老；(5) 把F排在B之前，但F切過了B。'
      en:
        stem: 'In a schematic cross-section, A and B are two sedimentary layers, A below B, and a fault F cuts through A and B. Sedimentary layer C is at the top; it covers the upper end of fault F, and C is not cut by F. A dyke D runs from the bottom through A, B and C to the surface. From oldest to youngest, which is the order of these five events?'
        options: ['A, B, C, F, D', 'A, B, F, C, D', 'A, B, C, D, F', 'D, C, F, B, A', 'A, F, B, C, D']
        hint: 'A rock body that cuts others is younger than what it cuts; a layer that lies on top without being cut is younger than the rock body below it.'
        explain: 'Superposition: A is older than B. F cuts A and B, so F is younger than B; C covers the top of F without being cut, so C is younger than F. D cuts C and is the youngest. Oldest to youngest: A, B, F, C, D, option (2). (1) and (3) put F after C, ignoring that C is not cut by F; (4) is youngest to oldest; (5) puts F before B, but F cuts B.'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_plot_checklist
    text:
      zh-tw:
        stem: '要把某潮位站一天的逐時潮位資料（示意數據，其中有幾筆是負值）畫成圖。下列哪一種作法最恰當？'
        options: ['橫軸寫「時刻（時）」、縱軸寫「潮位（公尺）」，刻度均勻且包含負值，描出每一點後用平滑曲線連接', '縱軸從0開始往上標，負的潮位都畫在0的位置上，再用平滑曲線連接', '兩軸只標數字、不寫物理量和單位，刻度均勻，描點後用平滑曲線連接', '把各筆潮位數值依大小、以相同間隔寫在縱軸上，描點後連線', '只描出最高和最低的兩筆，其餘資料不畫']
        hint: '作圖要做到四件事：座標軸寫上物理量和單位、刻度均勻、每個點描在正確的位置、把點連起來。'
        explain: '只有 (1) 四件事都做到。(2) 負值畫在0上，點的位置錯了。(3) 沒有寫物理量和單位，看不出畫的是什麼。(4) 把數值等距寫在軸上，刻度不均勻，點的位置也就不對。(5) 漏畫了大部分的資料。'
      en:
        stem: 'You are to plot a tide station''s hourly tide levels for one day (illustrative data, some of them negative). Which way of plotting is best?'
        options: ['Label the horizontal axis "time (h)" and the vertical axis "tide level (m)", use an even scale that includes the negative values, plot every point and join them with a smooth curve', 'Start the vertical axis at 0, draw every negative tide level on the 0 line, then join the points with a smooth curve', 'Put numbers on both axes but no quantity or unit, use an even scale, plot the points and join them with a smooth curve', 'Write the tide values themselves up the vertical axis in order of size at equal gaps, plot the points and join them', 'Plot only the highest and lowest readings and leave out the rest']
        hint: 'A plot needs four things: the quantity and unit on each axis, an even scale, every point in the right place, and the points joined.'
        explain: 'Only (1) does all four. (2) draws the negative values on 0, so those points are in the wrong place. (3) has no quantities or units, so you cannot tell what is plotted. (4) writes the values at equal gaps, so the scale is uneven and the points are misplaced. (5) leaves out most of the data.'
    answer: 0

  - id: q2@1
    type: fill
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_largest_tidal_range
    text:
      zh-tw:
        stem: '某潮位站一天的紀錄以公分為單位（示意數據）：3時滿潮 $52$ 公分，9時乾潮 $-131$ 公分，15時滿潮 $78$ 公分，21時乾潮 $12$ 公分。相鄰的一次滿潮與一次乾潮之間的潮差，最大是 ①②③ 公分。'
        hint: '依時間順序，相鄰的滿潮和乾潮共有三對。每一對都算「滿潮潮位−乾潮潮位」，注意乾潮的負號。'
        explain: '三對相鄰的滿潮與乾潮：3時和9時，$52-(-131)=183$ 公分；9時和15時，$78-(-131)=209$ 公分；15時和21時，$78-12=66$ 公分。最大的是 $209$ 公分，所以 ① 劃 $2$、② 劃 $0$、③ 劃 $9$。若把 $-131$ 的負號丟了，會算出 $78-131$ 這種負的潮差，一看就知道錯了。'
      en:
        stem: 'A tide station records in centimetres (illustrative data). In one day: high tide at 3 h, $52$ cm; low tide at 9 h, $-131$ cm; high tide at 15 h, $78$ cm; low tide at 21 h, $12$ cm. Of the tidal ranges between a high tide and the neighbouring low tide, the largest is ①②③ cm.'
        hint: 'In time order there are three neighbouring high–low pairs. For each pair work out high-tide level − low-tide level, and watch the minus sign on the low tide.'
        explain: 'The three neighbouring pairs: 3 h and 9 h, $52-(-131)=183$ cm; 9 h and 15 h, $78-(-131)=209$ cm; 15 h and 21 h, $78-12=66$ cm. The largest is $209$ cm, so ① is $2$, ② is $0$ and ③ is $9$. Dropping the minus sign on $-131$ would give something like $78-131$, a negative range, which is clearly wrong.'
    answer: ['2', '0', '9']

  - id: q3@1
    type: multi
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_typhoon_statements
    text:
      zh-tw:
        stem: '某颱風連續六天中午的中心氣壓（示意數據）依序是：第1天990、第2天975、第3天955、第4天950、第5天965、第6天985 hPa。資料只有這些。根據這些資料，下列哪些敘述可以確定是正確的？（多選）'
        options: ['第4天的中心氣壓最低', '從第1天到第4天，中心氣壓每天都下降', '第3天到第4天中心氣壓下降的幅度，比第2天到第3天大', '第4天時，颱風中心正好通過臺灣', '第6天和第1天的中心氣壓相差5 hPa']
        hint: '把每個敘述判成「資料支持」「資料否定」或「資料沒說」，只選資料支持的。'
        explain: '(1) 支持：950 hPa 最低。(2) 支持：990→975→955→950，每天都下降。(3) 否定：第3天到第4天降了 $955-950=5$ hPa，第2天到第3天降了 $975-955=20$ hPa，前者較小。(4) 資料沒說：資料沒有颱風的位置。(5) 支持：$990-985=5$ hPa。所以選 (1)(2)(5)。'
      en:
        stem: 'A typhoon''s central pressure at noon on six days in a row (illustrative data) is: day 1, 990; day 2, 975; day 3, 955; day 4, 950; day 5, 965; day 6, 985 hPa. That is all the data. Based on these data, which statements are certainly correct? (Choose all that apply.)'
        options: ['The central pressure is lowest on day 4', 'From day 1 to day 4, the central pressure falls every day', 'The fall in central pressure from day 3 to day 4 is larger than from day 2 to day 3', 'On day 4 the typhoon''s centre passes right over Taiwan', 'The central pressures on day 6 and day 1 differ by 5 hPa']
        hint: 'Judge each statement as supported, contradicted or not covered by the data, and choose only the supported ones.'
        explain: '(1) Supported: 950 hPa is the lowest. (2) Supported: 990 → 975 → 955 → 950, falling every day. (3) Contradicted: from day 3 to day 4 it fell $955-950=5$ hPa, from day 2 to day 3 it fell $975-955=20$ hPa, so the first fall is smaller. (4) Not covered: the data give no position for the typhoon. (5) Supported: $990-985=5$ hPa. So the answer is (1)(2)(5).'
    answer: [0, 1, 4]

  - id: q4@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_isotope_choice
    text:
      zh-tw:
        stem: '一塊岩石估計約12億年前形成，想用放射性定年確認它的年代。可用的是三種假想的同位素：丙的半衰期1萬年，丁的半衰期4億年，戊的半衰期3000億年。假設母元素剩下的比例要在1%到99%之間才測得準，哪一種適合？'
        options: ['只有丙', '只有丁', '只有戊', '丙和丁都適合', '三種都不適合']
        hint: '先算 $r=$ 年代÷半衰期，再算剩下 $\left(\tfrac{1}{2}\right)^r$，看它落不落在1%到99%之間。'
        explain: '丙：$r=\frac{12\times10^8}{10^4}=120000$，剩下 $\left(\tfrac{1}{2}\right)^{120000}$，遠小於1%，母元素剩不下來。丁：$r=\frac{12}{4}=3$，剩下 $\tfrac{1}{8}=12.5\%$，可以。戊：$r=\frac{12}{3000}=\frac{1}{250}$，剩下約99.7%，大於99%，幾乎還沒衰變。所以只有丁適合。'
      en:
        stem: 'A rock is thought to have formed about 1.2 billion years ago, and you want to confirm its age by radiometric dating. Three imaginary isotopes are available: U has a half-life of 10,000 years, V a half-life of 400 million years and W a half-life of 300 billion years. Assuming a measurement is reliable only when between 1% and 99% of the parent is left, which is suitable?'
        options: ['U only', 'V only', 'W only', 'both U and V', 'none of them']
        hint: 'First work out $r=$ age ÷ half-life, then the fraction left, $\left(\tfrac{1}{2}\right)^r$, and see whether it lies between 1% and 99%.'
        explain: 'U: $r=\frac{12\times10^8}{10^4}=120000$, leaving $\left(\tfrac{1}{2}\right)^{120000}$, far below 1%: no parent is left. V: $r=\frac{12}{4}=3$, leaving $\tfrac{1}{8}=12.5\%$, which works. W: $r=\frac{12}{3000}=\frac{1}{250}$, leaving about 99.7%, above 99%: it has hardly decayed. So only V is suitable.'
    answer: 1

  - id: q5@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_best_reason
    text:
      zh-tw:
        stem: '承上題（岩石約12億年，丁的半衰期4億年）。題目要你說明「為什麼丁適合」，限20字以內（標點也算）。下列哪一個答案最完整，而且符合字數限制？'
        options: ['丁適合。', '因為丁的半衰期。', '丁約經3個半衰期，剩1/8可測', '丁半衰期遠長於岩石年齡，幾乎未衰變', '因為岩石的年齡十二億年大約是丁的半衰期四億年的三倍，所以母元素剩下八分之一，落在測得準的範圍內']
        hint: '完整的理由要有證據（年代是半衰期的幾倍）和後果（剩下多少、測不測得準），內容要對，還要數一數字數。'
        explain: '(3) 先寫證據：$12\div4=3$，約經過3個半衰期；再寫後果：剩下 $\left(\tfrac{1}{2}\right)^3=\tfrac{1}{8}$，在1%到99%之間，測得準。共15字，最完整。(1) 只有結論。(2) 只說了關鍵字，沒有證據也沒有後果。(4) 比較錯了：丁的半衰期4億年比12億年短，不是遠長於，而且「幾乎未衰變」是不適合的理由。(5) 內容對，但遠超過20字。'
      en:
        stem: 'Following on (the rock is about 1.2 billion years old; V, written 丁 in the Chinese answers, has a half-life of 400 million years). The question asks why V is suitable, in no more than 20 Chinese characters, punctuation included. Which answer is the most complete and within the limit?'
        options: ['丁適合。 ("V is suitable.")', '因為丁的半衰期。 ("Because of V''s half-life.")', '丁約經3個半衰期，剩1/8可測 ("V has gone through about 3 half-lives; 1/8 is left, which can be measured.")', '丁半衰期遠長於岩石年齡，幾乎未衰變 ("V''s half-life is far longer than the rock''s age; it has hardly decayed.")', '因為岩石的年齡十二億年大約是丁的半衰期四億年的三倍，所以母元素剩下八分之一，落在測得準的範圍內 ("Because the rock''s age of 1.2 billion years is about three times V''s half-life of 400 million years, one eighth of the parent is left, within the reliable range.")']
        hint: 'A complete reason has evidence (how many half-lives the age is) and a consequence (how much is left, and whether that can be measured); it must be right, and you must count the characters.'
        explain: '(3) first gives the evidence: $12\div4=3$, about 3 half-lives have passed; then the consequence: $\left(\tfrac{1}{2}\right)^3=\tfrac{1}{8}$ is left, between 1% and 99%, so it can be measured. 15 characters: the most complete. (1) is a conclusion only. (2) is only a keyword, with no evidence and no consequence. (4) gets the comparison wrong: V''s half-life of 400 million years is shorter than 1.2 billion years, not far longer, and "hardly decayed" is a reason for being unsuitable. (5) is right but far over 20 characters.'
    answer: 2

  - id: q6@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_cross_section_words
    text:
      zh-tw:
        stem: '某剖面由下而上有三層沉積岩P、Q、R，沒有翻轉。岩脈S切過P和Q，頂端停在R的底下，R覆蓋在S上面而沒有被切斷。斷層T切過P、Q、R，也切斷了S。由老到新，這五個事件的順序是哪一個？'
        options: ['P、Q、R、S、T', 'P、Q、S、R、T', 'T、R、S、Q、P', 'P、Q、R、T、S', 'S、P、Q、R、T']
        hint: '先用疊置排出P、Q、R，再看S、T各自切過或被誰蓋住。'
        explain: '疊置：P、Q、R由老到新。S切過P、Q，比Q新；R蓋在S上而沒被切斷，比S新。T切過所有岩層和S，最新。所以是P、Q、S、R、T，選 (2)。(1) 忽略了R蓋住S；(3) 是由新到老；(4) 把S排在T之後，但T切斷了S；(5) 把S排在P之前，但S切過了P。'
      en:
        stem: 'A cross-section has three sedimentary layers, P, Q and R from bottom to top, not overturned. A dyke S cuts P and Q, its top stops under R, and R covers S without being cut. A fault T cuts P, Q and R, and also cuts S. From oldest to youngest, which is the order of these five events?'
        options: ['P, Q, R, S, T', 'P, Q, S, R, T', 'T, R, S, Q, P', 'P, Q, R, T, S', 'S, P, Q, R, T']
        hint: 'First order P, Q and R by superposition, then see what S and T each cut or are covered by.'
        explain: 'Superposition: P, Q, R from oldest to youngest. S cuts P and Q, so it is younger than Q; R covers S without being cut, so R is younger than S. T cuts every layer and S, so it is the youngest. The order is P, Q, S, R, T, option (2). (1) ignores that R covers S; (3) is youngest to oldest; (4) puts S after T, but T cuts S; (5) puts S before P, but S cuts P.'
    answer: 1

  - id: q7@1
    type: single
    origin: original
    codes: []
    verify: m_earth_s116_earth_data_items:dx_scoring_fraction
    text:
      zh-tw:
        stem: '學測的某一題多選題有5個選項，正確答案是(1)(3)。某考生選了(1)(2)(3)(4)。依多選題的計分方式，他得到這一題的幾分之幾？'
        options: ['$\tfrac{4}{5}$', '$\tfrac{3}{5}$', '$\tfrac{1}{5}$', '0', '$\tfrac{1}{2}$']
        hint: '各選項獨立判定。先數出判定錯了幾個選項 $k$，再算 $\frac{n-2k}{n}$。'
        explain: '(1)(3) 選了，判定對；(2)(4) 不該選卻選了，判定錯；(5) 沒選，判定對。所以 $k=2$，得 $\frac{5-2\times2}{5}=\frac{1}{5}$ 的分數。'
      en:
        stem: 'A GSAT multi-select item has 5 options, and the correct answer is (1)(3). A candidate chooses (1)(2)(3)(4). Under the multi-select scoring rule, what fraction of the item''s points does the candidate earn?'
        options: ['$\tfrac{4}{5}$', '$\tfrac{3}{5}$', '$\tfrac{1}{5}$', '0', '$\tfrac{1}{2}$']
        hint: 'Each option is judged on its own. Count the options judged wrong, $k$, then work out $\frac{n-2k}{n}$.'
        explain: '(1) and (3) were chosen: judged right. (2) and (4) should not have been chosen but were: judged wrong. (5) was not chosen: judged right. So $k=2$, earning $\frac{5-2\times2}{5}=\frac{1}{5}$ of the points.'
    answer: 2

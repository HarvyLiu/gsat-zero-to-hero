# Practice items for earth/s116-waves-tides (116 sprint: EIc-Ⅴc-2, EIc-Ⅴc-3, EIc-Ⅴc-4). All original;
# no number or setting is reused from a worked example in the chapter (the chapter uses a harbour with
# 1.9 m / −1.2 m at 03:00 / 09:12 / 15:25 / 21:37, the 50-minute delay of a high tide, 2 m/s and 1 m/s
# wave speeds, an 80 m / 8 s wave, a Moon part of 1 m and a Sun part of 0.5 m, and stations A/B/C along
# the strait with ranges 1.0 / 4.2 / 0.9 m; the items use an island harbour's four-tide record
# (1.20 / −1.35 / 1.45 / −0.60 m, largest neighbouring range asked), first high tides on three days in a

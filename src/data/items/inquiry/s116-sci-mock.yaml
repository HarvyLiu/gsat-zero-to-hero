        hint: 'P波從震源走到甲站要幾秒？波速由什麼決定？S波能不能在液體中傳播？'
        explain: '(1) 對：P波走 $36\ \mathrm{km}$ 要 $\dfrac{36}{6.0}=6.0\ \mathrm{s}$，所以地震發生在 $8.0-6.0=2.0$ 秒；用S波算，$v_{S}=\dfrac{90-36}{27.0-12.0}=3.6\ \mathrm{km/s}$，$12.0-\dfrac{36}{3.6}=2.0$ 秒，結果相同。(2) 錯：P波是縱波，S波是橫波。(3) 對：兩個時刻都是 $17.0$ 秒。(4) 錯：同一種介質中，頻率改變時波長跟著改變，波速不變；P波和S波是兩種不同的波，波速不同不是頻率造成的。(5) 錯：S波傳不過液體，這正是推論外核是液態的依據。答案是 (1)(3)。複習：地球的分層與板塊構造學說、波的性質、都卜勒效應與光的波動性。'
      en:
        stem: '(Continuing item 50.) From the data in the table and what you have learnt, which of the following statements are correct? (Choose all that apply.)'
        options: ['The earthquake happened at a clock reading of about $2.0$ s', 'The P wave is a transverse wave and the S wave is a longitudinal wave', 'At the moment station B receives the S wave, station C is just receiving the P wave', 'The P and S waves have different speeds in the same stretch of crust because their frequencies differ', 'If a layer of liquid lies between the focus and a station, the S wave still crosses the liquid, only more slowly']
        hint: 'How many seconds does the P wave take from the focus to station A? What sets the speed of a wave? Can an S wave travel through a liquid?'
        explain: '(1) Correct: the P wave takes $\dfrac{36}{6.0}=6.0\ \mathrm{s}$ to travel $36\ \mathrm{km}$, so the earthquake happened at $8.0-6.0=2.0$ s; the S wave gives the same result, since $v_{S}=\dfrac{90-36}{27.0-12.0}=3.6\ \mathrm{km/s}$ and $12.0-\dfrac{36}{3.6}=2.0$ s. (2) Wrong: the P wave is longitudinal and the S wave is transverse. (3) Correct: both times are $17.0$ s. (4) Wrong: in one medium, a change of frequency changes the wavelength, not the wave speed; the P and S waves are two different kinds of wave, and their different speeds are not caused by frequency. (5) Wrong: S waves cannot pass through a liquid, which is exactly why we infer that the outer core is liquid. The answer is (1)(3). Review: Earth''s layers and the theory of plate tectonics, Wave properties, the Doppler effect and light as a wave.'

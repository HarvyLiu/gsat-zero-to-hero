      en:
        stem: 'Red–green colour blindness is sex-linked recessive, with its gene on the X chromosome. A colour-blind man''s daughter has normal colour vision; she marries a man with normal colour vision. Ignoring mutation, which statements are correct? (Choose all that apply.)'
        options: ['The daughter must carry the colour-blindness allele', 'The chance that a son of theirs is colour-blind is $\frac{1}{2}$', 'A daughter of theirs could be colour-blind', 'If they have a colour-blind son, his colour-blindness allele came through his mother from his maternal grandfather', 'The chance that a child of theirs (either sex) is colour-blind is $\frac{1}{2}$']
        hint: 'A father always passes his X chromosome to a daughter; a son''s X chromosome always comes from his mother.'

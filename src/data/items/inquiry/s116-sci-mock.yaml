        stem: '紅綠色盲是性聯隱性遺傳，基因位在X染色體上。一位紅綠色盲男性的女兒色覺正常，她和一位色覺正常的男性結婚。不考慮突變，下列敘述哪些正確？（多選）'
        options: ['這位女兒一定帶有紅綠色盲等位基因', '他們生的兒子是紅綠色盲的機率是 $\frac{1}{2}$', '他們生的女兒可能是紅綠色盲', '若他們生下紅綠色盲的兒子，這個兒子的色盲等位基因是經由母親、從外祖父傳來的', '他們的孩子（不分性別）是紅綠色盲的機率是 $\frac{1}{2}$']
        hint: '父親一定把他的X染色體傳給女兒；兒子的X染色體一定來自母親。'

chapter: inquiry/s116-sci-mock
items:
  # ---------- q-turn ----------
  - id: q-turn@1
    type: single
    origin: original
    codes: []
    verify: m_inquiry_s116_sci_mock_cross:x_turn_pacing
    text:
      zh-tw:
        stem: '自然考科限時 $110$ 分鐘，第壹部分有 $36$ 題選擇題。如果第壹部分平均每題用 $1.5$ 分鐘，還剩幾分鐘可以做第貳部分的六個題組和檢查？'
        options: ['$36$ 分鐘', '$54$ 分鐘', '$56$ 分鐘', '$64$ 分鐘', '$74$ 分鐘']
        hint: '先算第壹部分總共用掉幾分鐘。'
        explain: '第壹部分用掉 $36\times1.5=54$ 分鐘，剩下 $110-54=56$ 分鐘。(2) 是用掉的時間，不是剩下的時間。'
      en:
        stem: 'The science paper lasts $110$ minutes and Part 1 has $36$ choice items. If you spend $1.5$ minutes per Part 1 item on average, how many minutes are left for the six item sets of Part 2 and for checking?'
        options: ['$36$ minutes', '$54$ minutes', '$56$ minutes', '$64$ minutes', '$74$ minutes']
        hint: 'First work out how many minutes Part 1 takes in total.'
        explain: 'Part 1 takes $36\times1.5=54$ minutes, which leaves $110-54=56$ minutes. Option (2) is the time used, not the time left.'
    answer: 2


  # ---------- 第壹部分 物理 q1–q9 ----------
  - id: q1@1
    type: single
    origin: original
    codes: [nat:PEa-Vc-2]
    verify: m_inquiry_s116_sci_mock_phys:ph_density_by_difference
    text:
      zh-tw:
        stem: '用天平量得一個空量筒的質量為 $52\ \mathrm{g}$。倒入某種液體到 $40.0\ \mathrm{cm^{3}}$ 的刻度後，量筒和液體的總質量為 $84\ \mathrm{g}$。這種液體的密度是多少 $\mathrm{kg/m^{3}}$？'
        options: ['$0.80$', '$800$', '$1.3\times10^{3}$', '$2.1\times10^{3}$', '$8.0\times10^{5}$']
        hint: '液體的質量要扣掉量筒。再把 $\mathrm{g}$ 換成 $\mathrm{kg}$、$\mathrm{cm^{3}}$ 換成 $\mathrm{m^{3}}$。'
        explain: '液體的質量是 $84-52=32\ \mathrm{g}=3.2\times10^{-2}\ \mathrm{kg}$，體積是 $40.0\ \mathrm{cm^{3}}=4.0\times10^{-5}\ \mathrm{m^{3}}$，密度 $=\dfrac{3.2\times10^{-2}}{4.0\times10^{-5}}=800\ \mathrm{kg/m^{3}}$。(1) 是 $\mathrm{g/cm^{3}}$ 的數值，沒有換單位；(3) 用了空量筒的質量；(4) 用了總質量。複習：自然界的尺度與單位。'
      en:
        stem: 'A balance shows that an empty measuring cylinder has a mass of $52\ \mathrm{g}$. A liquid is poured in up to the $40.0\ \mathrm{cm^{3}}$ mark, and the cylinder and liquid together then have a mass of $84\ \mathrm{g}$. What is the density of the liquid in $\mathrm{kg/m^{3}}$?'
        options: ['$0.80$', '$800$', '$1.3\times10^{3}$', '$2.1\times10^{3}$', '$8.0\times10^{5}$']
        hint: 'Subtract the cylinder to get the mass of the liquid. Then change $\mathrm{g}$ to $\mathrm{kg}$ and $\mathrm{cm^{3}}$ to $\mathrm{m^{3}}$.'
        explain: 'The liquid has mass $84-52=32\ \mathrm{g}=3.2\times10^{-2}\ \mathrm{kg}$ and volume $40.0\ \mathrm{cm^{3}}=4.0\times10^{-5}\ \mathrm{m^{3}}$, so its density is $\dfrac{3.2\times10^{-2}}{4.0\times10^{-5}}=800\ \mathrm{kg/m^{3}}$. Option (1) is the value in $\mathrm{g/cm^{3}}$, with the units left unchanged; (3) uses the mass of the empty cylinder; (4) uses the total mass. Review: Scales of nature and units.'
    answer: 1

  - id: q2@1
    type: single
    origin: original
    codes: [nat:PEb-Vc-4, nat:PEb-Vc-5]
    verify: m_inquiry_s116_sci_mock_phys:ph_sled_constant_speed
    text:
      zh-tw:
        stem: '小傑用一條水平的繩子拉著雪橇，在水平雪地上以等速度直線前進，繩子對雪橇的拉力是 $30\ \mathrm{N}$。下列敘述何者正確？'
        options: ['拉力大於摩擦力，雪橇才會一直前進', '雪地對雪橇的摩擦力也是 $30\ \mathrm{N}$，雪橇所受合力為零', '雪橇所受合力的方向朝前', '繩子拉雪橇的力，大於雪橇拉繩子的力', '若繩子突然斷掉，雪橇會在那一瞬間立刻停下']
        hint: '等速度直線前進，速度有沒有改變？速度不變時，合力是多少？'
        explain: '等速度表示速度沒有改變，由第一定律，合力為零。水平方向只有拉力和摩擦力，所以摩擦力和拉力一樣大，都是 $30\ \mathrm{N}$、方向相反。(1)、(3) 把「在動」誤當成「要有向前的合力」；(4) 違反第三定律，作用力與反作用力一樣大；(5) 繩子斷掉後合力變成向後的摩擦力，速度會慢慢變小，而不是瞬間變成零。複習：牛頓運動定律、萬有引力與行星運動。'
      en:
        stem: 'Jie pulls a sled with a horizontal rope, and the sled moves in a straight line at constant velocity across level snow. The rope pulls on the sled with a force of $30\ \mathrm{N}$. Which statement is correct?'
        options: ['The pull is larger than the friction, which is why the sled keeps moving', 'The friction from the snow on the sled is also $30\ \mathrm{N}$, and the net force on the sled is zero', 'The net force on the sled points forwards', 'The rope pulls on the sled harder than the sled pulls on the rope', 'If the rope suddenly snapped, the sled would stop at that very instant']
        hint: 'At constant velocity in a straight line, does the velocity change? What is the net force when the velocity does not change?'
        explain: 'Constant velocity means the velocity does not change, so by the first law the net force is zero. The only horizontal forces are the pull and friction, so the friction equals the pull: $30\ \mathrm{N}$, in the opposite direction. Options (1) and (3) mistake "moving" for "needing a forward net force"; (4) breaks the third law, since action and reaction are equal in size; (5) is wrong because once the rope snaps the net force is the backward friction, which slows the sled gradually rather than stopping it instantly. Review: Newton''s laws, universal gravitation and planetary motion.'
    answer: 1

  - id: q3@1
    type: single
    origin: original
    codes: [nat:PEb-Vc-3]
    verify: m_inquiry_s116_sci_mock_phys:ph_kepler_period
    text:
      zh-tw:
        stem: '一顆假想的彗星繞太陽運行，軌道半長軸是 $16$ 天文單位。依克卜勒第三定律，它的公轉週期約為多少年？（地球的半長軸為 $1$ 天文單位、週期為 $1$ 年）'
        options: ['$16$', '$32$', '$64$', '$128$', '$256$']
        hint: '用天文單位和年當單位時，第三定律寫成 $T^2=a^3$。'
        explain: '$T^2=a^3=16^3=4096$，所以 $T=\sqrt{4096}=64$ 年。(1) 把週期當成和半長軸成正比；(5) 是 $16^2$，誤用 $T=a^2$。複習：運動學的發展：伽利略與克卜勒。'
      en:
        stem: 'An imaginary comet orbits the Sun on an orbit with a semi-major axis of $16$ astronomical units. By Kepler''s third law, about how many years is its orbital period? (Earth has a semi-major axis of $1$ astronomical unit and a period of $1$ year.)'
        options: ['$16$', '$32$', '$64$', '$128$', '$256$']
        hint: 'In astronomical units and years, the third law reads $T^2=a^3$.'
        explain: '$T^2=a^3=16^3=4096$, so $T=\sqrt{4096}=64$ years. Option (1) treats the period as proportional to the semi-major axis; (5) is $16^2$, from wrongly using $T=a^2$. Review: How the study of motion grew: Galileo and Kepler.'
    answer: 2

  - id: q4@1
    type: multi
    origin: original
    codes: [nat:PKe-Vc-2, nat:PKe-Vc-3, nat:PKc-Vc-1]
    verify: m_inquiry_s116_sci_mock_phys:ph_nucleus_forces
    text:
      zh-tw:
        stem: '某原子核裡有好幾個質子和中子，彼此相距約 $10^{-15}\ \mathrm{m}$。關於原子核裡的力，下列哪些敘述正確？（多選）'
        options: ['在這個距離上，兩個質子之間強力的吸引比電的排斥強得多', '若兩個質子的距離由 $1\times10^{-15}\ \mathrm{m}$ 變為 $3\times10^{-15}\ \mathrm{m}$，它們之間的電排斥力變為原來的 $\dfrac{1}{9}$', '兩個原子相距約 $10^{-10}\ \mathrm{m}$ 時，原子核之間的強力仍是最主要的力', '兩個中子之間也有強力的吸引', '自由中子衰變成質子、電子和反微中子，是強力造成的']
        hint: '強力的作用範圍大約多大？電力和距離是什麼關係？'
        explain: '(1) 正確：強力在原子核的距離上比電排斥強得多，才能把原子核綁在一起。(2) 正確：電力是平方反比，距離變 $3$ 倍，力變 $\dfrac{1}{3^2}=\dfrac{1}{9}$。(3) 錯：強力的作用範圍只有約 $10^{-15}\ \mathrm{m}$，在原子的距離上幾乎沒有作用。(4) 正確：強力在質子與質子、質子與中子、中子與中子之間都是吸引。(5) 錯：改變粒子種類的是弱作用。複習：物質的組成與四種基本交互作用。'
      en:
        stem: 'A nucleus contains several protons and neutrons, about $10^{-15}\ \mathrm{m}$ apart. Which statements about the forces in the nucleus are correct? (Choose all that apply.)'
        options: ['At this distance, the strong-force attraction between two protons is much stronger than their electric repulsion', 'If the distance between two protons changes from $1\times10^{-15}\ \mathrm{m}$ to $3\times10^{-15}\ \mathrm{m}$, their electric repulsion becomes $\dfrac{1}{9}$ of what it was', 'When two atoms are about $10^{-10}\ \mathrm{m}$ apart, the strong force between their nuclei is still the main force', 'Two neutrons also attract each other through the strong force', 'A free neutron decaying into a proton, an electron and an antineutrino is caused by the strong force']
        hint: 'Over about what range does the strong force act? How does the electric force depend on distance?'
        explain: '(1) Correct: at nuclear distances the strong force is much stronger than the electric repulsion, which is how it holds the nucleus together. (2) Correct: the electric force is an inverse-square force, so $3$ times the distance gives $\dfrac{1}{3^2}=\dfrac{1}{9}$ of the force. (3) Wrong: the strong force reaches only about $10^{-15}\ \mathrm{m}$ and has almost no effect at atomic distances. (4) Correct: the strong force attracts between proton and proton, proton and neutron, and neutron and neutron. (5) Wrong: changing one kind of particle into another is the weak interaction. Review: The make-up of matter and the four fundamental interactions.'
    answer: [0, 1, 3]

  - id: q5@1
    type: single
    origin: original
    codes: [nat:PKa-Vc-1]
    verify: m_inquiry_s116_sci_mock_phys:ph_rope_wave_speed
    text:
      zh-tw:
        stem: '一條長繩上有一列連續的週期波，手每秒上下振動 $3.0$ 次。某一瞬間量得連續 $5$ 個波峰，從第 $1$ 個到第 $5$ 個波峰的距離是 $2.0\ \mathrm{m}$。這列波的波速是多少 $\mathrm{m/s}$？'
        options: ['$0.17$', '$0.50$', '$1.2$', '$1.5$', '$6.0$']
        hint: '$5$ 個波峰之間有幾個波長？'
        explain: '$5$ 個波峰之間有 $4$ 個波長，所以 $\lambda=\dfrac{2.0}{4}=0.50\ \mathrm{m}$。頻率 $f=3.0\ \mathrm{Hz}$，波速 $v=f\lambda=3.0\times0.50=1.5\ \mathrm{m/s}$。(2) 是波長；(3) 把 $5$ 個波峰當成 $5$ 個波長；(5) 把 $2.0\ \mathrm{m}$ 當成一個波長。複習：波的性質、都卜勒效應與光的波動性。'
      en:
        stem: 'A continuous periodic wave travels along a long rope; the hand moves up and down $3.0$ times per second. At one instant there are $5$ crests in a row, and the distance from the $1$st to the $5$th crest is $2.0\ \mathrm{m}$. What is the wave speed in $\mathrm{m/s}$?'
        options: ['$0.17$', '$0.50$', '$1.2$', '$1.5$', '$6.0$']
        hint: 'How many wavelengths lie between $5$ crests?'
        explain: 'Between $5$ crests there are $4$ wavelengths, so $\lambda=\dfrac{2.0}{4}=0.50\ \mathrm{m}$. The frequency is $f=3.0\ \mathrm{Hz}$, so the wave speed is $v=f\lambda=3.0\times0.50=1.5\ \mathrm{m/s}$. Option (2) is the wavelength; (3) counts $5$ crests as $5$ wavelengths; (5) takes $2.0\ \mathrm{m}$ as one wavelength. Review: Wave properties, the Doppler effect and light as a wave.'
    answer: 3

  - id: q6@1
    type: single
    origin: original
    codes: [nat:PKc-Vc-3]
    verify: m_inquiry_s116_sci_mock_phys:ph_ring_follows_magnet
    text:
      zh-tw:
        stem: '一個很輕的封閉鋁環用細線掛著，靜止不動。一根磁棒的N極原本靠近鋁環、正對著環面，然後把磁棒沿著環的軸線快速拉開。在拉開的過程中，下列敘述何者正確？'
        options: ['鋁環被推離磁棒，環面對磁棒的一面相當於N極', '鋁環被推離磁棒，環面對磁棒的一面相當於S極', '鋁環跟著磁棒移動，環面對磁棒的一面相當於S極', '鋁環跟著磁棒移動，環面對磁棒的一面相當於N極', '鋁環不動，因為磁棒沒有碰到鋁環']
        hint: '感應電流的磁場要反抗什麼變化？磁棒遠離時，反抗它就是要怎麼樣？'
        explain: '磁棒遠離時，穿過鋁環的磁場變弱，鋁環產生感應電流。由冷次定律，感應電流的磁場要反抗這個變化，也就是「遠離就吸引」：鋁環吸引磁棒，所以會跟著磁棒移動。要吸引N極，環面對磁棒的一面必須相當於S極。(5) 錯：電磁感應不需要接觸，只要磁場在變化。複習：電流磁效應與電磁感應。'
      en:
        stem: 'A very light closed aluminium ring hangs at rest on a thin thread. The N pole of a bar magnet starts close to the ring, facing its face, and the magnet is then pulled quickly away along the ring''s axis. While the magnet is being pulled away, which statement is correct?'
        options: ['The ring is pushed away from the magnet, and its face towards the magnet acts as an N pole', 'The ring is pushed away from the magnet, and its face towards the magnet acts as an S pole', 'The ring moves after the magnet, and its face towards the magnet acts as an S pole', 'The ring moves after the magnet, and its face towards the magnet acts as an N pole', 'The ring does not move, because the magnet never touches it']
        hint: 'What change does the magnetic field of the induced current oppose? When the magnet moves away, what does opposing that mean?'
        explain: 'As the magnet moves away, the magnetic field through the ring gets weaker, so a current is induced in the ring. By Lenz''s law the magnetic field of that current opposes the change: "moving away, so attract". The ring attracts the magnet and moves after it. To attract an N pole, the face of the ring towards the magnet must act as an S pole. Option (5) is wrong: induction needs no contact, only a changing magnetic field. Review: Magnetic effects of current and electromagnetic induction.'
    answer: 2

  - id: q7@1
    type: multi
    origin: original
    codes: [nat:PBb-Vc-1, nat:PBb-Vc-2]
    verify: m_inquiry_s116_sci_mock_phys:ph_water_heated_temperatures
    text:
      zh-tw:
        stem: '一鍋水從 $15\,{}^{\circ}\mathrm{C}$ 加熱到 $65\,{}^{\circ}\mathrm{C}$。取 $T=t+273$，下列哪些敘述正確？（多選）'
        options: ['水的絕對溫度變為原來的 $\dfrac{65}{15}$ 倍', '水的溫度升高了 $50\ \mathrm{K}$', '用絕對溫標表示，水的溫度升高了 $323\ \mathrm{K}$', '水的絕對溫度由 $288\ \mathrm{K}$ 變為 $338\ \mathrm{K}$', '加熱後水分子的平均動能比加熱前大']
        hint: '溫度的「差」用攝氏或絕對溫標都一樣；溫度的「倍數」一定要先換成絕對溫度。'
        explain: '$T_1=15+273=288\ \mathrm{K}$，$T_2=65+273=338\ \mathrm{K}$，所以 (4) 正確。兩種溫標每一度一樣大，升高 $50\,{}^{\circ}\mathrm{C}$ 就是升高 $50\ \mathrm{K}$，(2) 正確、(3) 錯（$323\ \mathrm{K}$ 是 $50+273$，溫差不能加 $273$）。倍數要用絕對溫度：$\dfrac{338}{288}\approx1.17$ 倍，不是 $\dfrac{65}{15}$ 倍，(1) 錯。絕對溫度越高，分子的平均動能越大，(5) 正確。複習：溫度、熱與能量的品質。'
      en:
        stem: 'A pot of water is heated from $15\,{}^{\circ}\mathrm{C}$ to $65\,{}^{\circ}\mathrm{C}$. Using $T=t+273$, which statements are correct? (Choose all that apply.)'
        options: ['The absolute temperature of the water becomes $\dfrac{65}{15}$ times what it was', 'The temperature of the water rises by $50\ \mathrm{K}$', 'On the absolute scale, the temperature of the water rises by $323\ \mathrm{K}$', 'The absolute temperature of the water goes from $288\ \mathrm{K}$ to $338\ \mathrm{K}$', 'After heating, the average kinetic energy of the water molecules is larger than before']
        hint: 'A temperature *difference* is the same in degrees Celsius and in kelvin; a temperature *ratio* must use absolute temperatures.'
        explain: '$T_1=15+273=288\ \mathrm{K}$ and $T_2=65+273=338\ \mathrm{K}$, so (4) is correct. A degree is the same size on both scales, so a rise of $50\,{}^{\circ}\mathrm{C}$ is a rise of $50\ \mathrm{K}$: (2) is correct and (3) is wrong ($323\ \mathrm{K}$ is $50+273$; you never add $273$ to a difference). A ratio must use absolute temperatures: $\dfrac{338}{288}\approx1.17$, not $\dfrac{65}{15}$, so (1) is wrong. The higher the absolute temperature, the larger the average kinetic energy of the molecules, so (5) is correct. Review: Temperature, heat and the quality of energy.'
    answer: [1, 3, 4]

  - id: q8@1
    type: single
    origin: original
    codes: [nat:PKd-Vc-3, nat:PKd-Vc-4]
    verify: m_inquiry_s116_sci_mock_phys:ph_hydrogen_longest_wavelength
    text:
      zh-tw:
        stem: '氫原子的前四個能階約為 $-13.6\ \mathrm{eV}$、$-3.40\ \mathrm{eV}$、$-1.51\ \mathrm{eV}$、$-0.85\ \mathrm{eV}$。電子在下列哪一種跳躍中放出的光子，波長最長？'
        options: ['由 $-1.51\ \mathrm{eV}$ 跳到 $-3.40\ \mathrm{eV}$', '由 $-3.40\ \mathrm{eV}$ 跳到 $-13.6\ \mathrm{eV}$', '由 $-0.85\ \mathrm{eV}$ 跳到 $-1.51\ \mathrm{eV}$', '由 $-0.85\ \mathrm{eV}$ 跳到 $-3.40\ \mathrm{eV}$', '由 $-1.51\ \mathrm{eV}$ 跳到 $-13.6\ \mathrm{eV}$']
        hint: '光子能量 $hf=E_{\text{高}}-E_{\text{低}}$。能量越大，頻率越高，波長越長還是越短？'
        explain: '五種跳躍放出的光子能量依序是 $1.89$、$10.2$、$0.66$、$2.55$、$12.09\ \mathrm{eV}$。由 $E=hf=\dfrac{hc}{\lambda}$，光子能量越小，波長越長，所以能量最小的 $0.66\ \mathrm{eV}$（由 $-0.85$ 跳到 $-1.51\ \mathrm{eV}$）波長最長。(5) 能量最大，波長反而最短。複習：光子、光電效應與原子能階。'
      en:
        stem: 'The first four energy levels of hydrogen are about $-13.6\ \mathrm{eV}$, $-3.40\ \mathrm{eV}$, $-1.51\ \mathrm{eV}$ and $-0.85\ \mathrm{eV}$. In which of these jumps does the electron give out the photon with the longest wavelength?'
        options: ['From $-1.51\ \mathrm{eV}$ to $-3.40\ \mathrm{eV}$', 'From $-3.40\ \mathrm{eV}$ to $-13.6\ \mathrm{eV}$', 'From $-0.85\ \mathrm{eV}$ to $-1.51\ \mathrm{eV}$', 'From $-0.85\ \mathrm{eV}$ to $-3.40\ \mathrm{eV}$', 'From $-1.51\ \mathrm{eV}$ to $-13.6\ \mathrm{eV}$']
        hint: 'The photon energy is $hf=E_{\text{high}}-E_{\text{low}}$. The more energy, the higher the frequency: is the wavelength then longer or shorter?'
        explain: 'The five jumps give photons of $1.89$, $10.2$, $0.66$, $2.55$ and $12.09\ \mathrm{eV}$ in turn. Since $E=hf=\dfrac{hc}{\lambda}$, the smaller the photon energy, the longer the wavelength, so the smallest energy, $0.66\ \mathrm{eV}$ (from $-0.85$ to $-1.51\ \mathrm{eV}$), has the longest wavelength. Option (5) has the largest energy and so the shortest wavelength. Review: Photons, the photoelectric effect and atomic energy levels.'
    answer: 2

  - id: q9@1
    type: multi
    origin: original
    codes: [nat:PKc-Vc-5, nat:PKd-Vc-1]
    verify: m_inquiry_s116_sci_mock_phys:ph_em_wave_030m
    text:
      zh-tw:
        stem: '某電磁波在真空中的波長是 $0.30\ \mathrm{m}$。取光速 $c=3.0\times10^{8}\ \mathrm{m/s}$，下列哪些敘述正確？（多選）'
        options: ['它的頻率是 $1.0\times10^{9}\ \mathrm{Hz}$', '它在真空中跑得比可見光快', '它屬於微波', '它的一個光子的能量，比可見光一個光子的能量小', '它的頻率比X射線高']
        hint: '先用 $c=f\lambda$ 算頻率，再對照電磁波譜的順序。'
        explain: '$f=\dfrac{c}{\lambda}=\dfrac{3.0\times10^{8}}{0.30}=1.0\times10^{9}\ \mathrm{Hz}$，(1) 正確。所有電磁波在真空中的速率都是 $c$，(2) 錯。波長在約 $1\ \mathrm{mm}$ 到 $1\ \mathrm{m}$ 之間的是微波，(3) 正確。可見光的波長只有約 $400$ 到 $700\ \mathrm{nm}$，頻率高得多；由 $E=hf$，這個電磁波的光子能量比可見光小，(4) 正確。X射線的波長更短、頻率更高，(5) 錯。複習：電磁波與光，以及電在生活中的應用、光子、光電效應與原子能階。'
      en:

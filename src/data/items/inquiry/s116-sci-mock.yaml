        stem: '（承第40題）分別說明乙管為什麼變成黃色、甲管為什麼變成藍色。答案要寫出有關的生物作用、二氧化碳溶於水的反應式，以及pH怎樣改變。（非選擇題，4分，須寫出理由）'
        explain: '把「生物作用使水中的二氧化碳變多或變少」和「二氧化碳溶於水生成弱酸碳酸」接起來，再對照溴瑞香草藍的變色範圍。只寫「照光變藍、黑暗變黃」是重述結果，不是說明。複習：ATP與光合、呼吸作用的能量轉換、酸鹼反應、環境汙染、永續發展與能源。'
      en:
        stem: '(Continuing item 40.) Explain why tube B turned yellow and why tube A turned blue. Your answer must name the biological processes involved, give the equation for carbon dioxide dissolving in water, and say how the pH changes. (Written item, 4 points: give your reasons.)'
        explain: 'Link "a biological process makes the carbon dioxide in the water increase or decrease" with "carbon dioxide dissolves in water to form the weak acid carbonic acid", then compare with the colour ranges of bromothymol blue. Writing only "light turns it blue, dark turns it yellow" repeats the result; it does not explain it. Review: ATP and energy conversion in photosynthesis and respiration, Acid–base reactions, Pollution, sustainability and energy.'
    rubric:
      criteria:
        - id: dark-process
          points: 1
          text:
            zh-tw: '乙管：黑暗中水蘊草不能進行光合作用，但呼吸作用仍在進行，放出二氧化碳，使水中的二氧化碳變多。'
            en: 'Tube B: in the dark the waterweed cannot photosynthesise, but it still respires and gives off carbon dioxide, so the carbon dioxide in the water increases.'
        - id: dark-acid
          points: 1
          text:
            zh-tw: '寫出 $\mathrm{CO_2+H_2O\rightleftharpoons H_2CO_3}$，碳酸解離出 $\mathrm{H^{+}}$，$[\mathrm{H^{+}}]$ 變大、pH下降到約 $6.0$ 以下，所以呈黃色。'
            en: 'Writes $\mathrm{CO_2+H_2O\rightleftharpoons H_2CO_3}$: the carbonic acid releases $\mathrm{H^{+}}$, so $[\mathrm{H^{+}}]$ rises and the pH falls below about $6.0$, which is yellow.'
        - id: light-process
          points: 1
          text:
            zh-tw: '甲管：照光時水蘊草進行光合作用吸收二氧化碳，吸收的比呼吸作用放出的多，使水中的二氧化碳變少（只寫「光合作用」而沒有說二氧化碳變少，不給分）。'
            en: 'Tube A: in the light the waterweed photosynthesises and takes up carbon dioxide, more than its respiration gives off, so the carbon dioxide in the water decreases (no point for "photosynthesis" without saying that the carbon dioxide decreases).'
        - id: light-base
          points: 1
          text:
            zh-tw: '水中的碳酸變少，$[\mathrm{H^{+}}]$ 變小、pH上升到約 $7.6$ 以上，所以呈藍色。'
            en: 'There is less carbonic acid in the water, so $[\mathrm{H^{+}}]$ falls and the pH rises above about $7.6$, which is blue.'
    model:
      zh-tw: '乙管在黑暗中，水蘊草不能進行光合作用，但細胞仍持續進行呼吸作用，放出二氧化碳。二氧化碳溶於水：$\mathrm{CO_2+H_2O\rightleftharpoons H_2CO_3}$，碳酸是弱酸，會解離出一部分 $\mathrm{H^{+}}$，所以 $[\mathrm{H^{+}}]$ 變大，pH由 $7.0$ 降到 $5.8$，低於 $6.0$，溴瑞香草藍呈黃色。甲管照光，水蘊草進行光合作用吸收二氧化碳，吸收的比呼吸作用放出的多，水中的二氧化碳變少，碳酸也跟著變少，$[\mathrm{H^{+}}]$ 變小，pH由 $7.0$ 升到 $9.0$，高於 $7.6$，所以呈藍色。'
      en: 'Tube B is in the dark, so the waterweed cannot photosynthesise, but its cells keep respiring and give off carbon dioxide. Carbon dioxide dissolves in water: $\mathrm{CO_2+H_2O\rightleftharpoons H_2CO_3}$. Carbonic acid is a weak acid and releases some $\mathrm{H^{+}}$, so $[\mathrm{H^{+}}]$ rises and the pH falls from $7.0$ to $5.8$, below $6.0$, and bromothymol blue turns yellow. Tube A is in the light, so the waterweed photosynthesises and takes up carbon dioxide, more than its respiration gives off. The carbon dioxide in the water decreases, and so does the carbonic acid; $[\mathrm{H^{+}}]$ falls and the pH rises from $7.0$ to $9.0$, above $7.6$, so the solution turns blue.'

  - id: q43@1
    type: mixed
    origin: original
    codes: [nat:BDa-Vc-4, inq:plan/find-variables, inq:plan/draft-plan]
    verify: m_inquiry_s116_sci_mock_cross:x_mixed_light_design
    text:
      zh-tw:
        stem: '（承第40題）（1）小芳想再用同樣的方法，探討「光的強弱是否影響水蘊草的光合作用」。寫出這個新實驗的操縱變因與應變變因（都要寫成可以測量的量），以及兩個控制變因。（2）原來的實驗中，每一種處理都只做了一支試管。說明為什麼這樣得到的結論還不夠可靠，並提出一個改進的方法。（非選擇題，4分，須寫出理由）'
        explain: '變因要寫成可以量的量：「光」不夠，「燈和試管的距離」或「用照度計量得的照度」才是。只有一支試管時，就算條件盡量相同，每一管還是會有一點差別，只做一次看不出這個差別有多大；重複的目的，就是看出這個差別。複習：發現問題與規劃研究、ATP與光合、呼吸作用的能量轉換。'
      en:
        stem: '(Continuing item 40.) (1) Fang wants to use the same method to find out whether the strength of the light affects the photosynthesis of the waterweed. Write down the manipulated variable and the responding variable of this new experiment (both as quantities that can be measured), and two controlled variables. (2) In the original experiment each treatment had only one tube. Explain why a conclusion drawn this way is not yet reliable enough, and suggest one way to improve it. (Written item, 4 points: give your reasons.)'
        explain: 'A variable must be a quantity you can measure: "light" is not enough, but "the distance from the lamp to the tube" or "the illuminance read on a light meter" is. With only one tube, even when conditions are kept as alike as possible each tube differs a little, and a single run cannot show how large that difference is; seeing it is what repeats are for. Review: Finding problems and planning an investigation, ATP and energy conversion in photosynthesis and respiration.'
    rubric:
      criteria:
        - id: manipulated
          points: 1
          text:
            zh-tw: '操縱變因寫成可以測量的量，例如燈與試管的距離，或用照度計量得的照度（只寫「光」或「光照」不給分）。'
            en: 'Gives the manipulated variable as a measurable quantity, such as the distance from the lamp to the tube or the illuminance read on a light meter (no point for just "light").'
        - id: responding
          points: 1
          text:
            zh-tw: '應變變因寫成可以測量的量，例如照光 $3$ 小時後用pH計量得的pH，或溶液由綠變藍所需的時間（只寫「顏色」不給分）。'
            en: 'Gives the responding variable as a measurable quantity, such as the pH read on a pH meter after $3$ hours of light, or the time the solution takes to turn from green to blue (no point for just "the colour").'
        - id: controlled
          points: 1
          text:
            zh-tw: '寫出兩個合理的控制變因，例如水蘊草的大小或質量、池塘水的來源與體積、指示劑的滴數、水溫、照光的時間（只寫一個不給分）。'
            en: 'Gives two sensible controlled variables, such as the size or mass of the waterweed, the source and volume of the pond water, the number of drops of indicator, the water temperature, or the time in the light (no point for only one).'
        - id: repeats
          points: 1
          text:
            zh-tw: '指出每種處理只有一支試管：就算條件盡量相同，每段水蘊草、每支試管還是會有一點差別，只做一次看不出結果的差別有多大，結果也可能剛好是偶然；改進方法是每種處理各做幾支試管（重複），比較結果是否一致（只寫「多做幾次」而沒有理由不給分）。'
            en: 'Points out that each treatment has only one tube: even with conditions kept as alike as possible, each piece of waterweed and each tube differs a little, so a single run cannot show how large that spread is and the result could be a fluke; the improvement is to set up several tubes for each treatment (repeats) and see whether their results agree (no point for "do it more times" without a reason).'
    model:
      zh-tw: '（1）操縱變因：燈與試管的距離（例如 $10$、$20$、$40\ \mathrm{cm}$），代表光的強弱。應變變因：照光 $3$ 小時後，用pH計量得的水的pH。控制變因：水蘊草的大小、池塘水的來源與體積（都用同一桶水、各 $20\ \mathrm{mL}$）、指示劑的滴數、水溫和照光的時間。（2）只有一支試管時，就算條件盡量相同，每段水蘊草、每支試管還是會有一點差別；只做一次，看不出結果的差別有多大，結果也可能剛好是偶然。改進：每種處理各準備 $3$ 支試管（用同一桶池塘水、大小相近的水蘊草），比較同一種處理的三管結果是否一致。'
      en: '(1) Manipulated variable: the distance from the lamp to the tube (for example $10$, $20$ and $40\ \mathrm{cm}$), which sets how strong the light is. Responding variable: the pH of the water read on a pH meter after $3$ hours in the light. Controlled variables: the size of the waterweed, the source and volume of the pond water (the same bucket, $20\ \mathrm{mL}$ each), the number of drops of indicator, the water temperature and the time in the light. (2) With one tube per treatment, even with conditions kept as alike as possible, each piece of waterweed and each tube differs a little; a single run cannot show how large that spread is, and the result might be a fluke. Improvement: set up $3$ tubes for each treatment (water from the same bucket, pieces of waterweed of similar size) and see whether the three tubes of each treatment agree.'


  # ---------- 第貳部分 化學題組 q44–q46 ----------
  - id: q44@1
    type: single
    origin: original
    codes: [nat:CAa-Vc-1]
    verify: m_inquiry_s116_sci_mock_chem:mc_set_mass_loss
    text:
      zh-tw:
        stem: '第44至46題為題組。某生想知道一種胃藥粉末中碳酸氫鈉 $\ce{NaHCO3}$ 的含量。粉末中的其他成分不和酸反應，也不產生氣體。他把裝有足量稀鹽酸的開口燒杯放在電子秤上，加入粉末，發生反應$$\begin{aligned}&\ce{NaHCO3 + HCl}\\ &\ce{-> NaCl + H2O + CO2}\end{aligned}$$生成的氯化鈉和其他成分都留在燒杯的溶液中。等不再冒泡後，記錄秤的讀數比反應前（燒杯、鹽酸和粉末的總質量）減少多少。結果如下表，列出粉末質量和讀數減少的質量（示意數據）：$$\begin{array}{c|c}\text{粉末（g）}&\text{減少（g）}\\ \hline 0.50&0.22\\ 1.00&0.44\\ 1.50&0.66\\ 2.00&0.88\end{array}$$秤的讀數減少，最主要的原因是什麼？'
        options: ['反應中有一部分質量消失了，有氣體生成的反應不遵守質量守恆', '生成的氯化鈉溶在水中，它的質量就不再算進讀數', '粉末中不反應的成分溶在鹽酸裡，離開了燒杯', '生成的二氧化碳氣體逸散到燒杯外的空氣中', '反應前後的原子總數不同']
        hint: '如果把整個裝置密封起來，讀數會變嗎？開口燒杯和密封容器差在哪裡？'
        explain: '任何化學反應都遵守質量守恆：原子只是重新組合，數目不變，所以(1)(5)錯。溶在水中的物質仍在燒杯裡，質量照樣算進讀數，所以(2)(3)錯。燒杯是開口的，生成的二氧化碳是氣體，會逸散到空氣中，讀數減少的就是它的質量，(4)正確。若在密閉容器中進行，讀數不會改變。複習：化學基本定律與原子說。'
      en:
        stem: 'Items 44 to 46 form a set. A student wants to find how much sodium hydrogen carbonate, $\ce{NaHCO3}$, an antacid powder contains. The powder''s other ingredients do not react with acid and give off no gas. He puts an open beaker of excess dilute hydrochloric acid on an electronic balance and adds the powder; the reaction is $$\begin{aligned}&\ce{NaHCO3 + HCl}\\ &\ce{-> NaCl + H2O + CO2}\end{aligned}$$ The sodium chloride formed and the other ingredients stay in the solution in the beaker. When the bubbling stops, he records how much the reading has fallen compared with before the reaction (the total mass of beaker, acid and powder). The results are in the table, which lists the powder mass and the fall in the reading (illustrative data): $$\begin{array}{c|c}\text{powder (g)}&\text{fall (g)}\\ \hline 0.50&0.22\\ 1.00&0.44\\ 1.50&0.66\\ 2.00&0.88\end{array}$$ What is the main reason the reading falls?'
        options: ['Some mass is destroyed in the reaction: reactions that produce a gas do not obey conservation of mass', 'The sodium chloride formed dissolves in the water, so its mass no longer counts in the reading', 'The unreactive ingredients dissolve in the acid and leave the beaker', 'The carbon dioxide gas formed escapes from the beaker into the air', 'The total number of atoms is different before and after the reaction']
        hint: 'If the whole set-up were sealed, would the reading change? What is the difference between an open beaker and a sealed container?'
        explain: 'Every chemical reaction obeys conservation of mass: the atoms are only rearranged and their number does not change, so (1) and (5) are false. A dissolved substance is still in the beaker and its mass still counts in the reading, so (2) and (3) are false. The beaker is open and the carbon dioxide formed is a gas, so it escapes into the air: the fall in the reading is its mass, and (4) is correct. In a sealed container the reading would not change. Review: Basic laws of chemistry and atomic theory.'
    answer: 3

  - id: q45@1
    type: multi
    origin: original
    codes: [nat:CJa-Vc-2, nat:CJa-Vc-3, nat:CMa-Vc-1]
    verify: m_inquiry_s116_sci_mock_chem:mc_set_statements
    text:
      zh-tw:
        stem: '（承第44題）假設讀數減少的質量全部是逸出的二氧化碳，取H＝$1$、C＝$12$、O＝$16$、Na＝$23$。下列敘述哪些正確？（多選）'
        options: ['讀數減少的質量和粉末質量成正比', '反應消耗的 $\ce{HCl}$ 莫耳數，是生成 $\ce{CO2}$ 莫耳數的 $2$ 倍', '每 $1.00$ 公克粉末反應，生成 $0.010$ 莫耳的 $\ce{CO2}$', '若改取 $3.00$ 公克粉末（鹽酸仍足量），預期讀數減少 $1.32$ 公克', '碳酸氫鈉的水溶液是強鹼性，所以能中和胃酸']
        hint: '每一列「讀數減少÷粉末質量」是否相同？反應式的係數就是莫耳數比。'
        explain: '(1) 四列的讀數減少÷粉末質量都是 $0.44$，成正比。(3) $\ce{CO2}$ 的莫耳質量是 $44$，$\dfrac{0.44}{44}=0.010$ 莫耳。(4) $3.00\times0.44=1.32$ 公克。(2) 錯：反應式中 $\ce{HCl}$ 和 $\ce{CO2}$ 的係數都是 $1$，莫耳數相同。(5) 錯：碳酸氫鈉的水溶液只是弱鹼性，它是和胃酸中的 $\ce{H+}$ 反應生成二氧化碳。答案是(1)(3)(4)。複習：化學反應式與化學計量、化學與生活、科學史。'
      en:
        stem: '(Continuing item 44.) Assume the whole fall in the reading is carbon dioxide escaping, and take H = $1$, C = $12$, O = $16$ and Na = $23$. Which statements are correct? (Choose all that apply.)'
        options: ['The fall in the reading is proportional to the powder mass', 'Twice as many moles of $\ce{HCl}$ are used up as moles of $\ce{CO2}$ are formed', 'Each $1.00$ gram of powder gives $0.010$ moles of $\ce{CO2}$', 'With $3.00$ grams of powder (acid still in excess), the reading should fall by $1.32$ grams', 'Sodium hydrogen carbonate solution is strongly basic, which is why it neutralises stomach acid']
        hint: 'Is "fall in reading ÷ powder mass" the same in every row? The coefficients of the equation are mole ratios.'
        explain: '(1) In all four rows the fall in the reading divided by the powder mass is $0.44$, so they are proportional. (3) The molar mass of $\ce{CO2}$ is $44$, and $\dfrac{0.44}{44}=0.010$ moles. (4) $3.00\times0.44=1.32$ grams. (2) False: $\ce{HCl}$ and $\ce{CO2}$ both have the coefficient $1$, so their moles are equal. (5) False: sodium hydrogen carbonate solution is only weakly basic; it reacts with the $\ce{H+}$ in stomach acid to give carbon dioxide. The answer is (1)(3)(4). Review: Chemical equations and stoichiometry, Chemistry in daily life and the history of science.'
    answer: [0, 2, 3]

  - id: q46@1
    type: mixed
    origin: original
    codes: [nat:CJa-Vc-3, nat:CJa-Vc-2]
    verify: m_inquiry_s116_sci_mock_chem:mc_set_percent
    text:
      zh-tw:
        stem: '（承第44題）假設讀數減少的質量全部是逸出的二氧化碳。用表中的數據，求這種胃藥粉末中碳酸氫鈉的質量百分率。取H＝$1$、C＝$12$、O＝$16$、Na＝$23$。（非選擇題，4分，須寫出計算過程）'
        explain: '路線是「質量→莫耳→係數比→莫耳→質量」：先由逸出的 $\ce{CO2}$ 質量求莫耳數，再用反應式的係數比換成 $\ce{NaHCO3}$ 的莫耳數，乘上莫耳質量 $84$，最後除以粉末質量。表中任一列都得到同樣的答案。複習：化學反應式與化學計量。'
      en:
        stem: '(Continuing item 44.) Assume the whole fall in the reading is carbon dioxide escaping. Use the data in the table to find the percentage by mass of sodium hydrogen carbonate in the antacid powder. Take H = $1$, C = $12$, O = $16$ and Na = $23$. (Written item, 4 points: show your working.)'
        explain: 'The route is mass → moles → coefficient ratio → moles → mass: find the moles of $\ce{CO2}$ from the mass that escaped, convert to moles of $\ce{NaHCO3}$ with the coefficient ratio, multiply by the molar mass $84$, then divide by the powder mass. Every row of the table gives the same answer. Review: Chemical equations and stoichiometry.'
    rubric:
      criteria:
        - id: mol-co2
          points: 1
          text:
            zh-tw: '由任一列的讀數減少求出 $\ce{CO2}$ 的莫耳數，例如 $\dfrac{0.44}{44}=0.010$ 莫耳（列出莫耳質量 $44$）。'
            en: 'From any row''s fall in reading, finds the moles of $\ce{CO2}$, e.g. $\dfrac{0.44}{44}=0.010$ moles (with the molar mass $44$ shown).'
        - id: ratio
          points: 1
          text:
            zh-tw: '依反應式係數比 $\ce{NaHCO3}:\ce{CO2}=1:1$，寫出 $\ce{NaHCO3}$ 也是 $0.010$ 莫耳。'
            en: 'Uses the coefficient ratio $\ce{NaHCO3}:\ce{CO2}=1:1$ to state that $\ce{NaHCO3}$ is also $0.010$ moles.'
        - id: mass
          points: 1
          text:
            zh-tw: '求出 $\ce{NaHCO3}$ 的質量 $0.010\times84=0.84$ 公克（列出莫耳質量 $84$）。'
            en: 'Finds the mass of $\ce{NaHCO3}$, $0.010\times84=0.84$ grams (with the molar mass $84$ shown).'
        - id: percent
          points: 1
          text:
            zh-tw: '除以粉末質量，得到質量百分率 $\dfrac{0.84}{1.00}\times100\%=84\%$。'
            en: 'Divides by the powder mass to get $\dfrac{0.84}{1.00}\times100\%=84\%$ by mass.'
    model:
      zh-tw: '取粉末 $1.00$ 公克的那一列：逸出的 $\ce{CO2}$ 是 $0.44$ 公克，$\ce{CO2}$ 的莫耳質量是 $12+2\times16=44$，所以 $\ce{CO2}$ 有 $\dfrac{0.44}{44}=0.010$ 莫耳。反應式 $\ce{NaHCO3 + HCl -> NaCl + H2O + CO2}$ 中 $\ce{NaHCO3}$ 和 $\ce{CO2}$ 的係數比是 $1:1$，所以反應的 $\ce{NaHCO3}$ 也是 $0.010$ 莫耳。$\ce{NaHCO3}$ 的莫耳質量是 $23+1+12+3\times16=84$，質量 $0.010\times84=0.84$ 公克。質量百分率 $=\dfrac{0.84}{1.00}\times100\%=84\%$。（驗算：用 $2.00$ 公克那一列，$\dfrac{0.88}{44}=0.020$ 莫耳，$0.020\times84=1.68$ 公克，$\dfrac{1.68}{2.00}=84\%$。）'
      en: 'Take the row for $1.00$ gram of powder: $0.44$ grams of $\ce{CO2}$ escaped, and the molar mass of $\ce{CO2}$ is $12+2\times16=44$, so there were $\dfrac{0.44}{44}=0.010$ moles of $\ce{CO2}$. In $\ce{NaHCO3 + HCl -> NaCl + H2O + CO2}$ the coefficient ratio of $\ce{NaHCO3}$ to $\ce{CO2}$ is $1:1$, so $0.010$ moles of $\ce{NaHCO3}$ reacted. The molar mass of $\ce{NaHCO3}$ is $23+1+12+3\times16=84$, so its mass is $0.010\times84=0.84$ grams. Percentage by mass $=\dfrac{0.84}{1.00}\times100\%=84\%$. (Check with the $2.00$ gram row: $\dfrac{0.88}{44}=0.020$ moles, $0.020\times84=1.68$ grams, and $\dfrac{1.68}{2.00}=84\%$.)'


  # ---------- 第貳部分 生物題組 q47–q49 ----------
  - id: q47@1
    type: single
    origin: original
    codes: [nat:BDa-Vc-4]
    verify: m_inquiry_s116_sci_mock_bio:bio_enzyme_time_course
    text:
      zh-tw:
        stem: '第47至49題為題組。某生從一種生物取得一種酵素，它能把受質分解成產物。他準備兩支試管，各加入等量的受質溶液和等量的酵素液，pH相同，一支放在 $30\ {}^{\circ}\mathrm{C}$、一支放在 $50\ {}^{\circ}\mathrm{C}$，每隔 $2$ 分鐘測一次累積的產物量。受質的量足夠，$10$ 分鐘內不會用完。下表中 $t$ 為時間（min），另兩欄為兩組累積的產物量（mg）（示意數據）。 $$\begin{array}{c|c|c}t&30\ {}^{\circ}\mathrm{C}&50\ {}^{\circ}\mathrm{C}\\ \hline 0&0&0\\ 2&4&7\\ 4&8&11\\ 6&12&13\\ 8&16&14\\ 10&20&14\end{array}$$ 下列敘述何者正確？'
        options: ['溫度越高，酵素作用越快，所以每一段 $2$ 分鐘內，$50\ {}^{\circ}\mathrm{C}$ 組生成的產物都比 $30\ {}^{\circ}\mathrm{C}$ 組多', '前 $2$ 分鐘內，$50\ {}^{\circ}\mathrm{C}$ 組平均每分鐘生成 $3.5$ mg 產物，比 $30\ {}^{\circ}\mathrm{C}$ 組的 $2$ mg 多', '$50\ {}^{\circ}\mathrm{C}$ 組在 $6$ 分鐘後產物幾乎不再增加，是因為受質用完了', '$10$ 分鐘時 $30\ {}^{\circ}\mathrm{C}$ 組的產物比較多，所以一開始 $30\ {}^{\circ}\mathrm{C}$ 組的酵素就作用得比較快', '第 $8$ 到 $10$ 分鐘，$50\ {}^{\circ}\mathrm{C}$ 組平均每分鐘生成 $7$ mg 產物']
        hint: '表中是「累積」的產物量。某一段時間的平均速率＝這段時間增加的產物量÷經過的時間。'
        explain: '平均速率要用「增加量÷時間」：前 $2$ 分鐘，$50\ {}^{\circ}\mathrm{C}$ 組是 $(7-0)\div2=3.5$ mg/min，$30\ {}^{\circ}\mathrm{C}$ 組是 $(4-0)\div2=2$ mg/min，所以 (2) 正確、(4) 錯。(1) 錯：第 $2$ 到 $4$ 分鐘兩組都只增加 $4$ mg，之後 $50\ {}^{\circ}\mathrm{C}$ 組增加得比 $30\ {}^{\circ}\mathrm{C}$ 組少。(3) 錯：題目說受質不會用完，所以變慢不是受質用完造成的。(5) 錯：$14\div2=7$ 是拿累積量除以時間；第 $8$ 到 $10$ 分鐘其實增加了 $14-14=0$ mg。複習：ATP與光合、呼吸作用的能量轉換；由累積量算平均速率，見作圖與列式。'
      en:
        stem: 'Items 47 to 49 form a set. A student obtains an enzyme from an organism; it breaks a substrate down into a product. He sets up two test tubes, each with the same amount of substrate solution and the same amount of enzyme solution at the same pH. One is kept at $30\ {}^{\circ}\mathrm{C}$ and the other at $50\ {}^{\circ}\mathrm{C}$, and the total amount of product so far is measured every $2$ minutes. There is enough substrate that it does not run out within $10$ minutes. In the table $t$ is the time (min) and the other two columns give the total product in each tube (mg) (illustrative data). $$\begin{array}{c|c|c}t&30\ {}^{\circ}\mathrm{C}&50\ {}^{\circ}\mathrm{C}\\ \hline 0&0&0\\ 2&4&7\\ 4&8&11\\ 6&12&13\\ 8&16&14\\ 10&20&14\end{array}$$ Which statement is correct?'
        options: ['The higher the temperature, the faster the enzyme works, so in every $2$-minute interval the $50\ {}^{\circ}\mathrm{C}$ tube makes more product than the $30\ {}^{\circ}\mathrm{C}$ tube', 'In the first $2$ minutes the $50\ {}^{\circ}\mathrm{C}$ tube makes $3.5$ mg of product per minute on average, more than the $2$ mg of the $30\ {}^{\circ}\mathrm{C}$ tube', 'The product in the $50\ {}^{\circ}\mathrm{C}$ tube hardly increases after $6$ minutes because the substrate has run out', 'At $10$ minutes the $30\ {}^{\circ}\mathrm{C}$ tube has more product, so its enzyme was working faster from the start', 'From minute $8$ to minute $10$ the $50\ {}^{\circ}\mathrm{C}$ tube makes $7$ mg of product per minute on average']
        hint: 'The table gives the total product so far. The average rate over an interval = the product added in that interval ÷ the time it took.'
        explain: 'An average rate is increase ÷ time: in the first $2$ minutes the $50\ {}^{\circ}\mathrm{C}$ tube makes $(7-0)\div2=3.5$ mg/min and the $30\ {}^{\circ}\mathrm{C}$ tube $(4-0)\div2=2$ mg/min, so (2) is correct and (4) is wrong. (1) is wrong: from minute $2$ to $4$ both tubes add only $4$ mg, and after that the $50\ {}^{\circ}\mathrm{C}$ tube adds less than the $30\ {}^{\circ}\mathrm{C}$ tube. (3) is wrong: the stem says the substrate does not run out, so that is not why the tube slows down. (5) is wrong: $14\div2=7$ divides a total by a time; from minute $8$ to $10$ the tube actually adds $14-14=0$ mg. Review: ATP and energy conversion in photosynthesis and respiration; for average rates from totals, see Plotting and showing working.'
    answer: 1

  - id: q48@1
    type: single
    origin: original
    codes: [nat:BDa-Vc-4]
    verify: m_inquiry_s116_sci_mock_bio:bio_enzyme_control
    text:
      zh-tw:
        stem: '（承第47題）有同學擔心：受質在 $50\ {}^{\circ}\mathrm{C}$ 下，也許不需要酵素就會自己分解出產物。要檢驗這個疑慮，最適當的做法是增加下列哪一組實驗？'
        options: ['在同樣的兩種溫度下，各加入等量的受質溶液和等體積的水（不加酵素液），其他條件相同，每隔 $2$ 分鐘測一次產物量', '只在 $50\ {}^{\circ}\mathrm{C}$ 再做一管，加入兩倍的酵素液', '在同樣的兩種溫度下，各加入等量的酵素液，但不加受質溶液', '把每一管的反應時間延長為 $20$ 分鐘', '改用另一種生物的酵素，重做兩種溫度']
        hint: '對照組和實驗組應該只差你懷疑的那一個因素。這裡懷疑的是什麼？'
        explain: '疑慮是「沒有酵素時受質也會分解」，所以對照組要只拿掉酵素、其他都相同：同樣的溫度、同樣的受質、用等體積的水代替酵素液，(1) 正確。若某溫度的對照組也有產物，就要從實驗組扣掉。(3) 沒有受質，檢驗不了受質會不會自己分解；(2)、(4)、(5) 都改了別的條件，沒有回答這個疑慮。複習：ATP與光合、呼吸作用的能量轉換；對照組的想法見跨科資料題組。'
      en:
        stem: '(Continuing item 47.) A classmate worries that at $50\ {}^{\circ}\mathrm{C}$ the substrate might break down into product by itself, without the enzyme. Which extra experiment is the most suitable way to test this worry?'
        options: ['At the same two temperatures, add the same amount of substrate solution and an equal volume of water (no enzyme solution), everything else the same, and measure the product every $2$ minutes', 'Do one more tube at $50\ {}^{\circ}\mathrm{C}$ only, with twice the enzyme solution', 'At the same two temperatures, add the same amount of enzyme solution but no substrate solution', 'Lengthen every tube''s reaction time to $20$ minutes', 'Repeat the two temperatures with an enzyme from a different organism']
        hint: 'A control should differ from the experimental tubes in only the one factor you are suspicious of. What is that factor here?'
        explain: 'The worry is that the substrate breaks down even without the enzyme, so the control must remove only the enzyme and keep everything else the same: the same temperatures, the same substrate, and an equal volume of water instead of enzyme solution, so (1) is correct. If a control tube makes product at some temperature, that amount is subtracted from the experimental tube. Option (3) has no substrate, so it cannot show whether the substrate breaks down by itself; (2), (4) and (5) change other conditions and do not answer the worry. Review: ATP and energy conversion in photosynthesis and respiration; for the idea of a control, see Cross-subject data groups.'
    answer: 0

  - id: q49@1
    type: mixed
    origin: original
    codes: [nat:BDa-Vc-4]
    verify: m_inquiry_s116_sci_mock_bio:bio_enzyme_pretreatment
    text:
      zh-tw:
        stem: '（承第47題）該生再取兩管同一批的酵素液（先不加受質）：甲管先放在 $50\ {}^{\circ}\mathrm{C}$ 中 $10$ 分鐘，乙管先放在 $10\ {}^{\circ}\mathrm{C}$ 中 $10$ 分鐘；然後把兩管都移到 $30\ {}^{\circ}\mathrm{C}$，加入和第47題等量的受質溶液，反應 $10$ 分鐘後測得產物量：甲管 $1$ mg，乙管 $20$ mg。另有一管酵素液和受質溶液一直放在 $10\ {}^{\circ}\mathrm{C}$ 下反應 $10$ 分鐘，產物只有 $5$ mg（以上都是示意數據）。請根據這些數據，分別說明高溫與低溫對這種酵素的影響有什麼不同。（非選擇題，4分，須引用數據說明）'
        explain: '關鍵是拿兩管「回到 $30\ {}^{\circ}\mathrm{C}$ 之後」的產物量，和第47題一直在 $30\ {}^{\circ}\mathrm{C}$ 的組 $10$ 分鐘的 $20$ mg 比：回不來的是被破壞了，回得來的只是暫時變慢。高溫會破壞酵素的構造、降溫通常也恢復不了，這是生物課講過的；低溫的影響則要由這裡的數據推論。複習：ATP與光合、呼吸作用的能量轉換。'
      en:
        stem: '(Continuing item 47.) The student takes two more tubes of the same batch of enzyme solution, with no substrate yet: tube X is first kept at $50\ {}^{\circ}\mathrm{C}$ for $10$ minutes and tube Y at $10\ {}^{\circ}\mathrm{C}$ for $10$ minutes. Both are then moved to $30\ {}^{\circ}\mathrm{C}$ and given the same amount of substrate solution as in item 47; after $10$ minutes of reaction the product is $1$ mg in tube X and $20$ mg in tube Y. A further tube of enzyme and substrate solutions kept at $10\ {}^{\circ}\mathrm{C}$ throughout makes only $5$ mg in $10$ minutes (all illustrative data). Using these data, explain how the effect of high temperature on this enzyme differs from the effect of low temperature. (Written item, 4 points: quote the data in your explanation.)'
        explain: 'The key is to compare each tube''s product once it is back at $30\ {}^{\circ}\mathrm{C}$ with the $20$ mg made in $10$ minutes by the tube kept at $30\ {}^{\circ}\mathrm{C}$ all along in item 47: what does not recover has been damaged; what recovers was only slowed down for a while. That high temperature damages an enzyme''s structure, and that cooling usually does not restore it, is taught in biology; the effect of low temperature has to be inferred from the data here. Review: ATP and energy conversion in photosynthesis and respiration.'
    rubric:
      criteria:
        - id: heat-data
          points: 1
          text:
            zh-tw: '引用數據：甲管回到 $30\ {}^{\circ}\mathrm{C}$ 後 $10$ 分鐘只生成 $1$ mg，遠少於第47題一直在 $30\ {}^{\circ}\mathrm{C}$ 的組的 $20$ mg。'
            en: 'Quotes the data: back at $30\ {}^{\circ}\mathrm{C}$, tube X makes only $1$ mg in $10$ minutes, far less than the $20$ mg of the tube kept at $30\ {}^{\circ}\mathrm{C}$ in item 47.'
        - id: heat-damage
          points: 1
          text:
            zh-tw: '說明高溫破壞了酵素的構造，使它失去作用，回到 $30\ {}^{\circ}\mathrm{C}$ 也不能恢復。'
            en: 'Explains that high temperature damaged the enzyme''s structure so that it lost its activity, which moving back to $30\ {}^{\circ}\mathrm{C}$ does not restore.'
        - id: cold-data
          points: 1
          text:
            zh-tw: '引用數據：乙管回到 $30\ {}^{\circ}\mathrm{C}$ 後生成 $20$ mg，和一直在 $30\ {}^{\circ}\mathrm{C}$ 的組相同；一直在 $10\ {}^{\circ}\mathrm{C}$ 的那一管只有 $5$ mg。'
            en: 'Quotes the data: back at $30\ {}^{\circ}\mathrm{C}$, tube Y makes $20$ mg, the same as the tube kept at $30\ {}^{\circ}\mathrm{C}$; the tube kept at $10\ {}^{\circ}\mathrm{C}$ makes only $5$ mg.'
        - id: cold-inference
          points: 1
          text:
            zh-tw: '由這些數據推論：低溫使反應變慢（$5$ mg 少於 $20$ mg），但沒有破壞酵素，回溫後作用就恢復。'
            en: 'Infers from these data that low temperature slows the reaction ($5$ mg is less than $20$ mg) but does not damage the enzyme, so its activity returns on warming.'
    model:
      zh-tw: '高溫：甲管在 $50\ {}^{\circ}\mathrm{C}$ 放過 $10$ 分鐘以後，即使移到 $30\ {}^{\circ}\mathrm{C}$，$10$ 分鐘也只生成 $1$ mg，遠少於第47題一直在 $30\ {}^{\circ}\mathrm{C}$ 的組的 $20$ mg。可見高溫破壞了酵素（大多數是蛋白質）的構造，使它失去作用，降溫也恢復不了。低溫：一直在 $10\ {}^{\circ}\mathrm{C}$ 的那一管只生成 $5$ mg，比 $30\ {}^{\circ}\mathrm{C}$ 的 $20$ mg 少，表示低溫使反應變慢；但乙管在 $10\ {}^{\circ}\mathrm{C}$ 放過以後移到 $30\ {}^{\circ}\mathrm{C}$，生成 $20$ mg，和一直在 $30\ {}^{\circ}\mathrm{C}$ 的組相同。由這些數據可以推論：低溫沒有破壞這種酵素，回溫後作用就恢復。'
      en: 'High temperature: after $10$ minutes at $50\ {}^{\circ}\mathrm{C}$, tube X makes only $1$ mg in $10$ minutes even at $30\ {}^{\circ}\mathrm{C}$, far less than the $20$ mg of the tube kept at $30\ {}^{\circ}\mathrm{C}$ in item 47. So high temperature damaged the structure of the enzyme (most enzymes are proteins) and it lost its activity, which cooling cannot restore. Low temperature: the tube kept at $10\ {}^{\circ}\mathrm{C}$ makes only $5$ mg, less than the $20$ mg at $30\ {}^{\circ}\mathrm{C}$, so low temperature slows the reaction; but tube Y, after its time at $10\ {}^{\circ}\mathrm{C}$, makes $20$ mg at $30\ {}^{\circ}\mathrm{C}$, the same as the tube kept at $30\ {}^{\circ}\mathrm{C}$. From these data we can infer that low temperature did not damage this enzyme, and its activity returns on warming.'


  # ---------- 第貳部分 地科＋物理跨科題組 q50–q53 ----------
  - id: q50@1
    type: single
    origin: original
    codes: [nat:EMd-Vc-4, nat:EFa-Vc-1]
    verify: m_inquiry_s116_sci_mock_cross:x_quake_p_speed
    text:
      zh-tw:
        stem: '第50至53題為題組。某次淺層地震後，甲、乙、丙三個地震測站記錄到P波與S波抵達的時刻。表中的時刻都是同一個時鐘的讀數（單位：秒），地震發生的時刻沒有列在表中（示意數據）。假設地震波在這一帶的地殼中以固定的波速沿直線傳播。表中 $d$ 為測站離震源的距離（km），$t_P$、$t_S$ 為P波、S波抵達的時刻（s）。 $$\begin{array}{c|c|c|c}\text{測站}&d&t_P&t_S\\ \hline \text{甲}&36&8.0&12.0\\ \text{乙}&54&11.0&17.0\\ \text{丙}&90&17.0&27.0\end{array}$$ P波在這一帶地殼中的波速約為多少？'
        options: ['$3.6\ \mathrm{km/s}$', '$4.5\ \mathrm{km/s}$', '$5.3\ \mathrm{km/s}$', '$6.0\ \mathrm{km/s}$', '$9.0\ \mathrm{km/s}$']
        hint: '時鐘不是在地震發生時從 $0$ 開始的，所以不能直接用「距離÷時刻」。看兩個測站之間多出的距離和多花的時間。'
        explain: '從甲到丙，P波多走了 $90-36=54\ \mathrm{km}$，多花了 $17.0-8.0=9.0\ \mathrm{s}$，所以 $v_{P}=\dfrac{54}{9.0}=6.0\ \mathrm{km/s}$；用甲、乙兩站算也一樣：$\dfrac{18}{3.0}=6.0$。(2) 是 $36\div8.0$，(3) 是 $90\div17.0$，都把時鐘讀數當成波走的時間；(1) 是S波的波速；(5) 是丙站的距離除以S、P的時間差。複習：板塊邊界、臺灣的板塊環境與地震。'
      en:
        stem: 'Items 50 to 53 form a set. After a shallow earthquake, three seismic stations A, B and C recorded when the P wave and the S wave arrived. All the times in the table are readings of the same clock (in seconds); the time of the earthquake itself is not in the table (illustrative data). Assume the seismic waves travel in straight lines at constant speeds through the crust of this area. In the table $d$ is the distance from the station to the focus (km), and $t_P$ and $t_S$ are the arrival times of the P and S waves (s). $$\begin{array}{c|c|c|c}&d&t_P&t_S\\ \hline \text{A}&36&8.0&12.0\\ \text{B}&54&11.0&17.0\\ \text{C}&90&17.0&27.0\end{array}$$ What is the speed of the P wave in the crust of this area?'
        options: ['$3.6\ \mathrm{km/s}$', '$4.5\ \mathrm{km/s}$', '$5.3\ \mathrm{km/s}$', '$6.0\ \mathrm{km/s}$', '$9.0\ \mathrm{km/s}$']
        hint: 'The clock did not start at $0$ when the earthquake happened, so you cannot just divide a distance by a clock reading. Compare the extra distance and the extra time between two stations.'
        explain: 'From A to C the P wave travels $90-36=54\ \mathrm{km}$ further and takes $17.0-8.0=9.0\ \mathrm{s}$ longer, so $v_{P}=\dfrac{54}{9.0}=6.0\ \mathrm{km/s}$; stations A and B give the same: $\dfrac{18}{3.0}=6.0$. Option (2) is $36\div8.0$ and (3) is $90\div17.0$: both treat a clock reading as the travel time. Option (1) is the speed of the S wave, and (5) is the distance of C divided by its S–P time difference. Review: Plate boundaries, Taiwan''s tectonic setting and earthquakes.'
    answer: 3

  - id: q51@1
    type: multi

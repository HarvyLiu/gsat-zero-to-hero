    text:
      zh-tw:
        stem: '（假想的資料）比較甲、乙、丙、丁四種生物同一段DNA，兩兩之間不同的位置數 $n$ 如下。 $$\begin{array}{c|c}\text{兩種}&n\\ \hline \text{甲、乙}&3\\ \text{甲、丙}&8\\ \text{乙、丙}&8\\ \text{甲、丁}&13\\ \text{乙、丁}&13\\ \text{丙、丁}&13\end{array}$$ 把親緣關係樹用括號寫出，一對括號代表一個分支點。下列哪一棵樹最符合這些資料？'
        options: ['(((甲,乙),丙),丁)', '((甲,乙),(丙,丁))', '(((甲,丙),乙),丁)', '(((乙,丙),甲),丁)', '(((甲,丁),乙),丙)']
        hint: 'DNA差異越少，共同祖先通常越近。先找差異最少的一對，再看誰依序和它們會合。'
        explain: '甲、乙只差 $3$ 處，最近共同祖先最近，先成一支 (甲,乙)；丙和甲、乙都差 $8$ 處，在下一個分支點會合，得 ((甲,乙),丙)；丁和其他三種都差 $13$ 處，最早分開。所以是 (((甲,乙),丙),丁)。(2) 把丙、丁放成一支，但丙、丁差 $13$ 處，比丙和甲（$8$ 處）還多。複習：分類系統的演變與生物多樣性。'
      en:
        stem: '(Imaginary data.) The same stretch of DNA is compared in four organisms A, B, C and D; the number $n$ of positions that differ between each pair is below. $$\begin{array}{c|c}\text{pair}&n\\ \hline \text{A, B}&3\\ \text{A, C}&8\\ \text{B, C}&8\\ \text{A, D}&13\\ \text{B, D}&13\\ \text{C, D}&13\end{array}$$ Write the evolutionary tree with brackets, one pair of brackets for each branch point. Which tree fits the data best?'
        options: ['(((A,B),C),D)', '((A,B),(C,D))', '(((A,C),B),D)', '(((B,C),A),D)', '(((A,D),B),C)']
        hint: 'The fewer the DNA differences, the more recent the common ancestor usually is. Find the pair with the fewest differences first, then see who joins them, in order.'
        explain: 'A and B differ at only $3$ positions, so their most recent common ancestor is the most recent: they form the branch (A,B). C differs from both A and B at $8$ positions and joins at the next branch point, giving ((A,B),C). D differs from all three at $13$ positions and split off first. So the tree is (((A,B),C),D). Option (2) puts C and D in one branch, but C and D differ at $13$ positions, more than C and A ($8$). Review: Changing classification systems and biodiversity.'
    answer: 0


  # ---------- 第壹部分 地球科學 q28–q36 ----------
  - id: q28@1
    type: single
    origin: original
    codes: [nat:EEd-Vc-2]
    verify: m_inquiry_s116_sci_mock_earth:me_equal_brightness_stars
    text:
      zh-tw:
        stem: '（示意數據）甲、乙兩顆恆星在夜空中看起來一樣亮，視星等都是 $4$。甲的絕對星等是 $4$，乙的絕對星等是 $-1$。下列敘述何者正確？'
        options: ['乙的距離是甲的 $100$ 倍，光度是甲的 $100$ 倍', '乙的距離是甲的 $5$ 倍，光度是甲的 $5$ 倍', '乙的距離是甲的 $10$ 倍，光度是甲的 $100$ 倍', '兩顆星的距離相同，光度也相同', '甲的距離是乙的 $10$ 倍，光度是乙的 $100$ 倍']
        hint: '絕對星等是把恆星搬到 $10$ 秒差距處看到的視星等。每一顆星的視星等和絕對星等差幾等？'
        explain: '甲的視星等等於絕對星等，所以甲約在 $10$ 秒差距。乙的視星等比絕對星等大 $4-(-1)=5$ 等：從 $10$ 秒差距搬回原位，亮度變成 $\tfrac{1}{100}$，距離是 $10$ 倍，約 $100$ 秒差距，所以乙的距離是甲的 $10$ 倍。光度可以用兩種方法看：絕對星等差 $4-(-1)=5$ 等，光度差 $100$ 倍；或者，兩星一樣亮而乙遠 $10$ 倍，乙的光度必須是 $10^{2}=100$ 倍。答案是 (3)。(1) 把亮度的 $100$ 倍誤當成距離的倍數；(2) 把星等差直接當成倍數。複習：宇宙的組成與恆星的觀測。'
      en:
        stem: '(Illustrative data.) Stars A and B look equally bright in the night sky: both have apparent magnitude $4$. The absolute magnitude of A is $4$ and that of B is $-1$. Which statement is correct?'
        options: ['B is $100$ times as far as A and $100$ times as luminous', 'B is $5$ times as far as A and $5$ times as luminous', 'B is $10$ times as far as A and $100$ times as luminous', 'The two stars are at the same distance and have the same luminosity', 'A is $10$ times as far as B and $100$ times as luminous']
        hint: 'The absolute magnitude is the apparent magnitude a star would have at $10$ parsecs. For each star, how many magnitudes apart are its apparent and absolute magnitudes?'
        explain: 'A''s apparent magnitude equals its absolute magnitude, so A is at about $10$ parsecs. B''s apparent magnitude is $4-(-1)=5$ larger than its absolute magnitude: moving it back from $10$ parsecs to where it is makes it $\tfrac{1}{100}$ as bright, so it is $10$ times as far, about $100$ parsecs, and B is $10$ times as far as A. The luminosity can be seen two ways: the absolute magnitudes differ by $4-(-1)=5$, so the luminosities differ by a factor of $100$; or, the two stars look equally bright while B is $10$ times as far, so B must be $10^{2}=100$ times as luminous. The answer is (3). (1) takes the factor of $100$ in brightness as the distance factor; (2) treats the magnitude difference as the factor itself. Review: The universe and observing stars.'
    answer: 2

  - id: q29@1
    type: multi
    origin: original
    codes: [nat:EFb-Vc-1]
    verify: m_inquiry_s116_sci_mock_earth:me_southern_sky
    text:
      zh-tw:
        stem: '某人在南緯 $30°$ 的地方，整晚觀察星空。下列敘述哪些正確？（多選）'
        options: ['面向南方看，星星繞著天南極逆時針轉', '看不到北極星', '天南極在南方地平線上方，仰角約 $30°$', '連續曝光 $4$ 小時，離天南極越遠的星，星軌轉過的圓心角越大', '天球（星空）仍然每天由東向西轉動，多數星星東升西落']
        hint: '北極星的仰角等於北緯的度數；到了赤道，北極星已經貼在地平線上。天球每小時轉幾度？轉的角度和星星的位置有關嗎？'
        explain: '在赤道，北極星已經貼在地平線上，再往南天北極就落到地平線以下，所以看不到北極星，(2) 正確。南半球的天南極仰角等於當地的南緯度數，約 $30°$，(3) 正確。天球每天由東向西轉動、多數星星東升西落，是地球自西向東自轉造成的，在南半球也一樣，(5) 正確（靠近天南極的拱極星不會落下，所以說「多數」）。(1) 錯：面向南方看，星星繞天南極是順時針轉。(4) 錯：整個天球一起轉，每小時約 $15°$，$4$ 小時所有星星都轉過約 $60°$；離天南極遠的星只是弧比較長。答案是 (2)(3)(5)。複習：恆星的視運動與太陽的季節位置。'
      en:
        stem: 'An observer at latitude $30°$S watches the sky all night. Which statements are correct? (Choose all that apply.)'
        options: ['Facing south, the stars turn anticlockwise around the south celestial pole', 'Polaris cannot be seen', 'The south celestial pole is above the southern horizon, at an altitude of about $30°$', 'In a $4$-hour exposure, the farther a star is from the south celestial pole, the larger the angle its trail turns through', 'The sky still turns from east to west every day, and most stars rise in the east and set in the west']
        hint: 'The altitude of Polaris equals the northern latitude; at the equator Polaris is already on the horizon. How many degrees does the celestial sphere turn per hour? Does the angle depend on where the star is?'
        explain: 'At the equator Polaris is already on the horizon, and farther south the north celestial pole sinks below the horizon, so Polaris cannot be seen: (2) is correct. In the southern hemisphere the altitude of the south celestial pole equals the southern latitude, about $30°$: (3) is correct. The sky turns from east to west every day and most stars rise in the east and set in the west, because Earth spins from west to east; that is the same in the southern hemisphere: (5) is correct (the circumpolar stars near the south celestial pole never set, hence "most"). (1) is wrong: facing south, the stars turn clockwise around the south celestial pole. (4) is wrong: the whole celestial sphere turns together, about $15°$ an hour, so in $4$ hours every star turns through about $60°$; stars far from the pole just draw longer arcs. The answer is (2)(3)(5). Review: Apparent motion of the stars and the Sun through the seasons.'
    answer: [1, 2, 4]

  - id: q30@1
    type: single
    origin: original
    codes: [nat:EHb-Vc-1, nat:EHb-Vc-2]
    verify: m_inquiry_s116_sci_mock_earth:me_sandstone_bracket
    text:
      zh-tw:
        stem: '（示意數據）某剖面中，一層砂岩的頂面被一層熔岩流覆蓋；一條岩脈切穿了砂岩，但沒有切進上方的熔岩流。用兩種假想的同位素定年：熔岩流中的甲同位素（半衰期 $0.6$ 億年）只剩原來的 $\tfrac{1}{4}$；岩脈中的乙同位素（半衰期 $0.5$ 億年），子元素與母元素的原子數比為 $7:1$。假設岩石剛形成時沒有子元素，且地層沒有翻轉。關於砂岩的形成年代，下列何者最合理？'
        options: ['約在 $1.2$ 億年前到 $1.5$ 億年前之間', '早於 $1.5$ 億年前', '晚於 $1.2$ 億年前', '約在 $1.35$ 億年前', '早於 $1.2$ 億年前，但無法判斷是否早於 $1.5$ 億年前']
        hint: '先分別算出熔岩流和岩脈的年齡。再用疊置和截切排出砂岩、岩脈、熔岩流的先後。'
        explain: '熔岩流：$\tfrac{1}{4}=\left(\tfrac12\right)^{2}$，經過 $2$ 個半衰期，約 $2\times0.6=1.2$ 億年。岩脈：子元素：母元素 $=7:1$，$2^{n}-1=7$，$n=3$，約 $3\times0.5=1.5$ 億年。先後：岩脈切穿砂岩，所以砂岩比岩脈老；熔岩流蓋在砂岩上、又沒有被岩脈切穿，所以熔岩流最年輕（$1.2$ 億年比 $1.5$ 億年年輕，和定年一致）。所以砂岩早於 $1.5$ 億年前形成，答案是 (2)。(1) 是把砂岩夾在兩個年齡之間，但兩個火成岩體都比砂岩年輕，夾不住它。複習：太陽系、宜居的地球與地質年代。'
      en:
        stem: '(Illustrative data.) In a cross-section, the top of a sandstone layer is covered by a lava flow; a dike cuts through the sandstone but does not cut into the lava flow above. Two imaginary isotopes are used for dating: isotope X in the lava flow (half-life $60$ million years) has only $\tfrac{1}{4}$ of its original amount left; for isotope Y in the dike (half-life $50$ million years), the ratio of daughter to parent atoms is $7:1$. Assume the rocks had no daughter atoms when they formed and the strata are not overturned. Which statement about when the sandstone formed is most reasonable?'
        options: ['Between about $120$ and $150$ million years ago', 'More than $150$ million years ago', 'Less than $120$ million years ago', 'About $135$ million years ago', 'More than $120$ million years ago, but we cannot tell whether it was more than $150$ million years ago']
        hint: 'First work out the ages of the lava flow and the dike. Then use superposition and cross-cutting to order the sandstone, the dike and the lava flow.'
        explain: 'Lava flow: $\tfrac{1}{4}=\left(\tfrac12\right)^{2}$, so $2$ half-lives have passed, about $2\times60=120$ million years. Dike: daughter : parent $=7:1$, $2^{n}-1=7$, $n=3$, about $3\times50=150$ million years. Order: the dike cuts the sandstone, so the sandstone is older than the dike; the lava flow lies on the sandstone and is not cut by the dike, so the lava flow is the youngest ($120$ million years is younger than $150$ million years, which agrees with the dating). So the sandstone formed more than $150$ million years ago: (2). (1) puts the sandstone between the two ages, but both igneous bodies are younger than the sandstone, so they cannot bracket it. Review: The solar system, habitable Earth and geologic time.'
    answer: 1

  - id: q31@1
    type: multi
    origin: original
    codes: [nat:EIa-Vc-1]
    verify: m_inquiry_s116_sci_mock_earth:me_ridge_two_sides
    text:
      zh-tw:
        stem: '（示意數據）某中洋脊兩側的海底岩石定年結果如下表，$d$ 為距中洋脊的距離（km），$T$ 為岩石年齡（百萬年）。$$\begin{array}{c|c|c}\text{位置}&d&T\\ \hline \text{西側}&60&3.0\\ \text{西側}&30&1.5\\ \text{中洋脊}&0&0\\ \text{東側}&30&1.0\\ \text{東側}&60&2.0\end{array}$$ 假設每一側的海底各以固定的速率離開中洋脊。下列敘述哪些正確？（多選）'
        options: ['中洋脊上的海底岩石最年輕', '西側的海底離開中洋脊的速率比東側快', '東側的海底每年約離開中洋脊 $3$ 公分', '在距中洋脊 $60$ km處，東側海底上的沉積物比西側厚', '兩側的海底彼此分開的速率約為每年 $5$ 公分']
        hint: '每一側的速率 $=$ 距離 $\div$ 年齡。先把公里換成公分。沉積物的厚薄和海底存在多久有關。'
        explain: '中洋脊處年齡為 $0$，越往兩側越老，(1) 正確。西側：$60$ km $=6\times10^{6}$ 公分，$\dfrac{6\times10^{6}\ \text{公分}}{3.0\times10^{6}\ \text{年}}=2$ 公分／年；東側：$\dfrac{6\times10^{6}\ \text{公分}}{2.0\times10^{6}\ \text{年}}=3$ 公分／年，(3) 正確、(2) 錯。兩側分開的速率是 $2+3=5$ 公分／年，(5) 正確。(4) 錯：$60$ km處西側岩石 $3.0$ 百萬年、東側 $2.0$ 百萬年，西側的海底存在得比較久，沉積物比較厚。答案是 (1)(3)(5)。複習：地球的分層與板塊構造學說。'
      en:
        stem: '(Illustrative data.) Dating of the sea-floor rocks on both sides of a mid-ocean ridge gives the following, where $d$ is the distance from the ridge (km) and $T$ the age of the rock (million years). $$\begin{array}{c|c|c}\text{Position}&d&T\\ \hline \text{west}&60&3.0\\ \text{west}&30&1.5\\ \text{ridge}&0&0\\ \text{east}&30&1.0\\ \text{east}&60&2.0\end{array}$$ Assume the sea floor on each side moves away from the ridge at a steady rate of its own. Which statements are correct? (Choose all that apply.)'
        options: ['The sea-floor rock at the ridge is the youngest', 'The sea floor on the west side moves away from the ridge faster than on the east side', 'The sea floor on the east side moves away from the ridge by about $3$ cm a year', 'At $60$ km from the ridge, the sediment on the east side is thicker than on the west side', 'The two sides move apart from each other at about $5$ cm a year']
        hint: 'The rate on each side $=$ distance $\div$ age. Convert kilometres to centimetres first. How thick the sediment is depends on how long the sea floor has existed.'
        explain: 'The age is $0$ at the ridge and grows towards both sides, so (1) is correct. West: $60$ km $=6\times10^{6}$ cm, $\dfrac{6\times10^{6}\ \text{cm}}{3.0\times10^{6}\ \text{yr}}=2$ cm/yr; east: $\dfrac{6\times10^{6}\ \text{cm}}{2.0\times10^{6}\ \text{yr}}=3$ cm/yr, so (3) is correct and (2) is wrong. The two sides move apart at $2+3=5$ cm/yr: (5) is correct. (4) is wrong: at $60$ km the west-side rock is $3.0$ million years old and the east-side rock $2.0$ million, so the west-side sea floor has existed longer and has thicker sediment. The answer is (1)(3)(5). Review: Earth''s layers and the theory of plate tectonics.'
    answer: [0, 2, 4]

  - id: q32@1
    type: single
    origin: original
    codes: [nat:EIa-Vc-2, nat:EIa-Vc-3]
    verify: m_inquiry_s116_sci_mock_earth:me_boundary_from_evidence
    text:
      zh-tw:
        stem: '（示意情境）某高大山脈地區的地質調查發現：岩層中有許多褶皺與逆斷層；山脈中有大範圍的變質岩；地震頻繁，但震源都很淺，沒有排成由淺到深的傾斜帶；附近沒有海溝，也沒有火山。這裡最可能是哪一種情形？'
        options: ['張裂型板塊邊界，兩個板塊互相分開', '錯動型板塊邊界，兩個板塊沿邊界水平錯開', '聚合型板塊邊界，海洋板塊隱沒到另一個板塊之下', '聚合型板塊邊界，兩個大陸板塊互相碰撞擠壓', '不是板塊邊界，因為沒有深源地震']
        hint: '先看最有分辨力的證據：有沒有深的、排成斜帶的震源？再看地質構造是張力、擠壓，還是水平錯開。'
        explain: '褶皺和逆斷層是擠壓造成的，大範圍的變質岩也來自擠壓、埋深，這些都指向聚合型邊界。可是沒有由淺到深的傾斜震源帶、沒有海溝和火山，表示沒有板塊斜插下去，不是隱沒帶。兩個大陸板塊相撞時，雙方都不容易沉下去，就互相擠壓、隆起成高大的山脈，所以答案是 (4)。(1) 張裂型的構造是正斷層；(2) 錯動型是平移斷層，變質作用不明顯；(5) 錯：判斷邊界不能只看一項證據，臺灣本島的地震大多很淺，仍是聚合型邊界。複習：板塊邊界、臺灣的板塊環境與地震。'
      en:
        stem: '(Illustrative setting.) A geological survey of a region of high mountains finds: many folds and reverse faults in the rock layers; large areas of metamorphic rock in the mountains; frequent earthquakes, but all with shallow foci, not arranged in a band sloping from shallow to deep; and no trench and no volcanoes nearby. What is this most likely to be?'
        options: ['A divergent plate boundary, where two plates move apart', 'A transform plate boundary, where two plates slide past each other horizontally', 'A convergent plate boundary where an oceanic plate is subducted beneath another plate', 'A convergent plate boundary where two continental plates collide and are squeezed together', 'Not a plate boundary, because there are no deep earthquakes']
        hint: 'Start with the evidence that tells boundaries apart best: are there deep foci in a sloping band? Then ask whether the structures come from tension, compression or horizontal sliding.'
        explain: 'Folds and reverse faults come from compression, and large areas of metamorphic rock also come from squeezing and burial, so everything points to a convergent boundary. But there is no sloping band of foci from shallow to deep, and no trench or volcanoes, so no plate is being pushed down at a slant: this is not a subduction zone. When two continental plates collide, neither sinks easily, so they squeeze each other and rise into high mountains: the answer is (4). (1) A divergent boundary has normal faults; (2) a transform boundary has strike-slip faults and little metamorphism; (5) is wrong: a boundary is not judged from one piece of evidence alone, and most earthquakes under Taiwan itself are shallow, yet it is a convergent boundary. Review: Plate boundaries, Taiwan''s tectonic setting and earthquakes.'
    answer: 3

  - id: q33@1
    type: single
    origin: original
    codes: [nat:EIb-Vc-2, nat:EIb-Vc-3]
    verify: m_inquiry_s116_sci_mock_earth:me_two_towns_dew_point
    text:
      zh-tw:
        stem: '（示意數據）氣溫與飽和水氣壓：$10$℃為 $12$ hPa、$15$℃為 $17$ hPa、$20$℃為 $23$ hPa、$25$℃為 $32$ hPa、$30$℃為 $42$ hPa、$35$℃為 $56$ hPa。同一時刻，甲地氣溫 $35$℃、相對濕度 $40\%$；乙地氣溫 $15$℃、相對濕度 $100\%$。下列敘述何者正確？'
        options: ['甲地的露點比乙地高', '乙地的相對濕度較高，所以乙地空氣的水氣壓比甲地大', '甲地的露點約為 $35$℃', '兩地的露點相同', '乙地的氣溫若再下降，空氣中的水氣也不會凝結']
        hint: '先用相對濕度和飽和水氣壓算出兩地的水氣壓。露點只由水氣壓決定。'
        explain: '甲地水氣壓 $=0.40\times56=22.4$ hPa；乙地已飽和，水氣壓 $=17$ hPa。露點是飽和水氣壓等於水氣壓時的溫度：乙地是 $15$℃；甲地的 $22.4$ hPa 介於 $17$ hPa（$15$℃）與 $23$ hPa（$20$℃）之間，接近 $20$℃。水氣壓越大，露點越高，所以甲地的露點比乙地高，答案是 (1)。(2) 錯：相對濕度說的是離飽和多近，不是水氣有多少。(3) 錯：$35$℃是甲地的氣溫。(5) 錯：乙地已飽和，再降溫，飽和水氣壓變小，多出來的水氣就會凝結。複習：大氣的垂直結構、水氣與成雲。'
      en:
        stem: '(Illustrative data.) Air temperature and saturation vapour pressure: $10$℃, $12$ hPa; $15$℃, $17$ hPa; $20$℃, $23$ hPa; $25$℃, $32$ hPa; $30$℃, $42$ hPa; $35$℃, $56$ hPa. At the same moment, town A has an air temperature of $35$℃ and a relative humidity of $40\%$; town B has $15$℃ and $100\%$. Which statement is correct?'
        options: ['The dew point in A is higher than in B', 'B has the higher relative humidity, so the vapour pressure of the air in B is larger than in A', 'The dew point in A is about $35$℃', 'The two towns have the same dew point', 'If the temperature in B falls further, none of the water vapour in the air will condense']
        hint: 'First use the relative humidity and the saturation vapour pressure to find the vapour pressure in each town. The dew point depends only on the vapour pressure.'
        explain: 'Vapour pressure in A $=0.40\times56=22.4$ hPa; B is saturated, so its vapour pressure is $17$ hPa. The dew point is the temperature at which the saturation vapour pressure equals the vapour pressure: $15$℃ in B; in A, $22.4$ hPa lies between $17$ hPa ($15$℃) and $23$ hPa ($20$℃), close to $20$℃. The larger the vapour pressure, the higher the dew point, so A has the higher dew point: (1). (2) is wrong: relative humidity says how close the air is to saturation, not how much water vapour it holds. (3) is wrong: $35$℃ is the air temperature in A. (5) is wrong: B is already saturated, so if it cools further the saturation vapour pressure falls and the extra water vapour condenses. Review: Vertical structure of the atmosphere, water vapour and clouds.'
    answer: 0

  - id: q34@1

        options: ['低壓大約在這個地點的西南方', '如果換成南半球某地近地面吹東風，低壓大約在那裡的西北方', '這裡的風吹向東方', '高壓大約在這個地點的東北方', '如果這裡是海面而不是陸地，風穿過等壓線的角度會比較大']
        hint: '風向是風吹來的方向。北半球近地面，背對著風站好，低壓在你的左前方；南半球把「左」換成「右」。'
        explain: '東風是從東方吹來、吹向西方的風，所以 (3) 錯。背對東風就是面向西方：北半球左方是南，左前方是西南，所以低壓大約在西南方，(1) 正確；高壓在相反的一側，大約在東北方，(4) 正確。南半球把左換成右：右方是北，右前方是西北，(2) 正確。(5) 錯：海面摩擦小，風比較接近沿等壓線吹，穿過等壓線的角度比陸地上小。答案是 (1)(2)(4)。複習：風的成因與天氣圖。'
      en:
        stem: 'Near the surface at a place in the northern hemisphere an east wind is blowing, and the isobars nearby are roughly straight. Which statements are correct? (Choose all that apply.)'
        options: ['The low pressure is roughly to the south-west of this place', 'If an east wind blows near the surface at a place in the southern hemisphere, the low pressure is roughly to the north-west of that place', 'The wind here blows towards the east', 'The high pressure is roughly to the north-east of this place', 'If this were the sea surface rather than land, the wind would cross the isobars at a larger angle']
        hint: 'A wind is named after the direction it blows from. Near the surface in the northern hemisphere, stand with your back to the wind and the low pressure is ahead of you on the left; in the southern hemisphere, swap left for right.'
        explain: 'An east wind blows from the east towards the west, so (3) is wrong. With your back to an east wind you face west: in the northern hemisphere your left is south and ahead-left is south-west, so the low is roughly to the south-west: (1) is correct; the high is on the opposite side, roughly to the north-east: (4) is correct. In the southern hemisphere swap left for right: right is north and ahead-right is north-west, so (2) is correct. (5) is wrong: friction is small over the sea, so the wind blows closer to along the isobars and crosses them at a smaller angle than over land. The answer is (1)(2)(4). Review: What drives the wind, and weather maps.'

        hint: '質量數＝質子數＋中子數；中性原子的電子數等於質子數。價電子數可以用前面最近的鈍氣相減。'
        explain: '中子數＝$34-16=18$，不是 $16$；中性原子的電子數等於質子數 $16$，不是質量數 $34$。前面最近的鈍氣是氖（$Z=10$），所以價電子有 $16-10=6$ 個，(3) 正確。氯有 $17-10=7$ 個價電子，價電子數不同，化學性質不會最相似（和它相似的是同族、也有 $6$ 個價電子的氧）。原子序 $16$ 是硫，在週期表的非金屬區。複習：原子結構、同位素與週期表。'
      en:
        stem: 'A neutral atom has atomic number $16$ and mass number $34$. Which statement about this atom is correct? (Atomic number of chlorine: $17$.)'
        options: ['It has $16$ neutrons', 'It has $34$ electrons', 'It has $6$ valence electrons', 'Its chemistry is most like that of chlorine', 'It is a metal']
        hint: 'Mass number = protons + neutrons; a neutral atom has as many electrons as protons. Find the valence electrons by subtracting the nearest earlier noble gas.'
        explain: 'Neutrons $=34-16=18$, not $16$; a neutral atom has as many electrons as protons, $16$, not the mass number $34$. The nearest earlier noble gas is neon ($Z=10$), so there are $16-10=6$ valence electrons: (3) is correct. Chlorine has $17-10=7$ valence electrons, a different number, so its chemistry is not the most similar (oxygen, in the same group with $6$ valence electrons, is). Atomic number $16$ is sulfur, in the non-metal region of the periodic table. Review: Atomic structure, isotopes and the periodic table.'
    answer: 2

  - id: q12@1

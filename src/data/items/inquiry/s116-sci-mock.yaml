        options: ['乙站時雨量最大的時刻，颱風中心在島嶼的正東方', '第6時甲站位在迎風面，所以甲站的雨量比乙站多', '從第6時到第18時，颱風中心繞著島嶼順時針移動', '三個時刻中，兩站時雨量的和以第12時最小', '兩站雨量的變化說明，颱風帶來的雨量和山脈的位置無關']
        hint: '先讀表：每一站的雨量在哪個時刻最大？兩站加起來呢？再判斷每個時刻風從哪一側吹向山脈：迎風面的空氣被迫沿山坡上升。'
        explain: '(1) 錯：乙站 $30$ mm/h 最大，是在第18時，中心在正西方。(2) 正確：第6時風從西方到北方之間吹來，吹向山脈的北坡，甲站在迎風面，空氣沿山坡上升冷卻成雲致雨；乙站在山的另一面，雨少。(3) 錯：中心從東方到北方再到西方，從上往下看是逆時針移動。(4) 正確：兩站時雨量的和，第6時 $24+3=27$、第12時 $6+11=17$、第18時 $2+30=32$ mm/h，第12時最小。(5) 錯：同一時刻兩站的雨量差很多，而且隨著哪一側是迎風面而互換，正說明地形的影響。答案是 (2)(4)。複習：颱風。'
      en:
        stem: '(Continuing item 54.) From the table and the typhoon''s near-surface winds, which statements are correct? (Choose all that apply.)'
        options: ['When the hourly rainfall at B is largest, the typhoon centre is due east of the island', 'At hour 6 station A is on the windward side, so it gets more rain than B', 'From hour 6 to hour 18 the typhoon centre moves clockwise around the island', 'Of the three hours, the two stations'' hourly rainfall added together is smallest at hour 12', 'The changes in the rainfall at the two stations show that the typhoon''s rainfall has nothing to do with where the mountains are']
        hint: 'Read the table first: at what hour is each station''s rainfall largest, and the two together? Then decide, for each hour, from which side the wind blows onto the range: on the windward side the air is forced up the slope.'
        explain: '(1) is wrong: B''s largest value, $30$ mm/h, comes at hour 18, when the centre is due west. (2) is correct: at hour 6 the wind comes from between west and north and blows onto the northern slope, so A is on the windward side, where the air rises up the slope, cools and forms cloud and rain; B is on the other side of the range and gets little rain. (3) is wrong: the centre goes from east to north to west, which seen from above is anticlockwise. (4) is correct: the two stations together get $24+3=27$ mm/h at hour 6, $6+11=17$ mm/h at hour 12 and $2+30=32$ mm/h at hour 18, smallest at hour 12. (5) is wrong: at the same hour the two stations get very different rainfall, and they swap as the windward side changes, which shows the effect of the terrain. The answer is (2)(4). Review: Typhoons.'
    answer: [1, 3]


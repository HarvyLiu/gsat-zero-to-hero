  - id: q39@1
    type: mixed
    origin: original
    codes: [nat:PBb-Vc-4, nat:PBa-Vc-2, nat:PNc-Vc-4]
    verify: m_inquiry_s116_sci_mock_phys:ph_mixed_heater_share
    text:
      zh-tw:
        stem: '（承第37題）（1）這 $5.0$ 分鐘內水吸收了多少熱？這些熱占電熱棒消耗電能的百分之幾？（2）其餘的電能到哪裡去了？這是否違反能量守恆？說明理由。（非選擇題，4分，須寫出計算過程與理由）'
        explain: '先用「熱量＝質量×比熱×溫度變化」算水吸收的熱，再和第38題的電能相比。能量守恆是說總能量不變，不是說電能全部變成水的熱能；沒有進到水裡的能量，也還在，只是散到別的地方。複習：溫度、熱與能量的品質、能量的形式、轉換與守恆。'
      en:
        stem: '(Continuing item 37.) (1) How much heat does the water absorb in these $5.0$ minutes? What percentage of the electrical energy used by the heater is this? (2) Where did the rest of the electrical energy go? Does this break the conservation of energy? Give your reasons. (Written item, 4 points: show your working and reasons.)'
        explain: 'First find the heat absorbed by the water with "heat = mass × specific heat × temperature change", then compare it with the electrical energy from item 38. Conservation of energy says the total energy stays the same, not that all the electrical energy ends up heating the water; the energy that did not go into the water still exists, it has just spread somewhere else. Review: Temperature, heat and the quality of energy, Forms of energy, conversion and conservation.'
    rubric:
      criteria:
        - id: heat
          points: 1
          text:
            zh-tw: '列式 $Q=ms\Delta T=0.50\times4.2\times10^{3}\times(80-25)$，算出 $Q=1.155\times10^{5}\ \mathrm{J}$（約 $1.2\times10^{5}\ \mathrm{J}$）。'
            en: 'Writes $Q=ms\Delta T=0.50\times4.2\times10^{3}\times(80-25)$ and gets $Q=1.155\times10^{5}\ \mathrm{J}$ (about $1.2\times10^{5}\ \mathrm{J}$).'
        - id: share
          points: 1
          text:
            zh-tw: '列出 $\dfrac{1.155\times10^{5}}{1.65\times10^{5}}$，得 $70\%$。'
            en: 'Writes $\dfrac{1.155\times10^{5}}{1.65\times10^{5}}$ and gets $70\%$.'
        - id: where
          points: 1
          text:
            zh-tw: '說明其餘約 $4.95\times10^{4}\ \mathrm{J}$ 變成熱，使玻璃杯、電熱棒本身或周圍空氣溫度升高，散到環境中。'
            en: 'States that the remaining $4.95\times10^{4}\ \mathrm{J}$ or so became heat that warmed the glass, the heater itself or the surrounding air, spreading into the surroundings.'
        - id: conserved
          points: 1
          text:
            zh-tw: '說明不違反能量守恆，理由是消耗的電能＝水吸收的熱＋散到杯子與環境的熱，總能量不變（只寫「不違反」而沒有理由不給分）。'
            en: 'States that energy conservation is not broken, with the reason: the electrical energy used = heat absorbed by the water + heat lost to the glass and surroundings, so the total energy is unchanged (no point for "not broken" without a reason).'
    model:
      zh-tw: '（1）水吸收的熱 $Q=ms\Delta T=0.50\times4.2\times10^{3}\times(80-25)=1.155\times10^{5}\ \mathrm{J}$。由第38題，電熱棒消耗的電能 $E=Pt=550\times300=1.65\times10^{5}\ \mathrm{J}$，所以 $\dfrac{Q}{E}=\dfrac{1.155\times10^{5}}{1.65\times10^{5}}=0.70$，即 $70\%$。（2）其餘 $1.65\times10^{5}-1.155\times10^{5}=4.95\times10^{4}\ \mathrm{J}$ 的電能也變成了熱，使玻璃杯、電熱棒本身和周圍的空氣溫度升高，散到環境中。這不違反能量守恆：消耗的電能＝水吸收的熱＋散到杯子與環境的熱，總能量不變；只是這部分能量分散到環境中，比較難再拿來利用。'
      en: '(1) The water absorbs $Q=ms\Delta T=0.50\times4.2\times10^{3}\times(80-25)=1.155\times10^{5}\ \mathrm{J}$. From item 38 the heater used $E=Pt=550\times300=1.65\times10^{5}\ \mathrm{J}$, so $\dfrac{Q}{E}=\dfrac{1.155\times10^{5}}{1.65\times10^{5}}=0.70$, that is $70\%$. (2) The remaining $1.65\times10^{5}-1.155\times10^{5}=4.95\times10^{4}\ \mathrm{J}$ of electrical energy also became heat, warming the glass, the heater itself and the surrounding air, and spread into the surroundings. This does not break the conservation of energy: the electrical energy used = heat absorbed by the water + heat lost to the glass and surroundings, so the total energy is unchanged; that share of the energy has simply spread out into the surroundings, where it is harder to use again.'


  # ---------- 第貳部分 生物＋化學跨科題組 q40–q43 ----------
  - id: q40@1
    type: single
    origin: original
    codes: [nat:CJd-Vc-1]
    verify: m_inquiry_s116_sci_mock_cross:x_tube_h_ratio
    text:
      zh-tw:
        stem: '第40至43題為題組。小芳想知道水蘊草在光照下和黑暗中，會怎樣改變水的酸鹼性。她在四支相同的試管中各裝入 $20\ \mathrm{mL}$ 同一桶池塘水，各滴入 $3$ 滴溴瑞香草藍，四管起初都是綠色，用pH計測得pH都是 $7.0$。甲、乙兩管各放入一段大小相近的水蘊草，丙、丁兩管不放；甲、丙放在燈下照光，乙、丁用鋁箔包住，和甲、丙放在同一盞燈下。溴瑞香草藍的顏色：pH約 $6.0$ 以下為黃色，約 $6.0$～$7.6$ 為綠色，約 $7.6$ 以上為藍色。$3$ 小時後的結果如下表（示意數據）。 $$\begin{array}{c|c|c}\text{試管}&\text{顏色}&\text{pH}\\ \hline \text{甲}&\text{藍}&9.0\\ \text{乙}&\text{黃}&5.8\\ \text{丙}&\text{綠}&7.0\\ \text{丁}&\text{綠}&7.0\end{array}$$ $3$ 小時後，甲管水中的 $[\mathrm{H^{+}}]$ 是開始時的幾倍？'
        options: ['$100$ 倍', '$2$ 倍', '$\dfrac{7}{9}$ 倍', '$\dfrac{1}{2}$ 倍', '$\dfrac{1}{100}$ 倍']
        hint: '$\mathrm{pH}=-\log[\mathrm{H^{+}}]$，pH每差 $1$，$[\mathrm{H^{+}}]$ 差幾倍？'
        explain: '開始時 $[\mathrm{H^{+}}]=10^{-7}\ \mathrm{M}$，$3$ 小時後 $[\mathrm{H^{+}}]=10^{-9}\ \mathrm{M}$，所以是開始時的 $\dfrac{10^{-9}}{10^{-7}}=\dfrac{1}{100}$ 倍。pH變大，$[\mathrm{H^{+}}]$ 變小；(1) 弄反了方向，(2)(3)(4) 把pH的數字直接相減或相除，忘了pH是 $[\mathrm{H^{+}}]$ 的10的次方。複習：酸鹼反應。'
      en:
        stem: 'Items 40 to 43 form a set. Fang wants to know how waterweed (水蘊草) changes the acidity of water in the light and in the dark. She fills four identical test tubes with $20\ \mathrm{mL}$ each of pond water from the same bucket and adds $3$ drops of bromothymol blue to each. All four tubes start green, and a pH meter reads pH $7.0$ in each. Tubes A and B each get a piece of waterweed of about the same size; tubes C and D get none. A and C are put under a lamp; B and D are wrapped in aluminium foil and put under the same lamp as A and C. Bromothymol blue is yellow below about pH $6.0$, green from about $6.0$ to $7.6$ and blue above about $7.6$. The table gives the results after $3$ hours (illustrative data). $$\begin{array}{c|c|c}\text{tube}&\text{colour}&\text{pH}\\ \hline \text{A}&\text{blue}&9.0\\ \text{B}&\text{yellow}&5.8\\ \text{C}&\text{green}&7.0\\ \text{D}&\text{green}&7.0\end{array}$$ After $3$ hours, how many times its starting value is $[\mathrm{H^{+}}]$ in the water of tube A?'
        options: ['$100$ times', '$2$ times', '$\dfrac{7}{9}$ times', '$\dfrac{1}{2}$ times', '$\dfrac{1}{100}$ times']
        hint: '$\mathrm{pH}=-\log[\mathrm{H^{+}}]$. When the pH changes by $1$, by what factor does $[\mathrm{H^{+}}]$ change?'
        explain: 'At the start $[\mathrm{H^{+}}]=10^{-7}\ \mathrm{M}$; after $3$ hours $[\mathrm{H^{+}}]=10^{-9}\ \mathrm{M}$, so it is $\dfrac{10^{-9}}{10^{-7}}=\dfrac{1}{100}$ times its starting value. A higher pH means a lower $[\mathrm{H^{+}}]$; option (1) has the direction backwards, and (2), (3) and (4) subtract or divide the pH numbers directly, forgetting that the pH is the power of ten in $[\mathrm{H^{+}}]$. Review: Acid–base reactions.'
    answer: 4


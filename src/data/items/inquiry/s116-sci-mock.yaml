# 128 points. Part 1 (72 points): q1–q9 physics, q10–q18 chemistry, q19–q27 biology, q28–q36 earth science,
# single and multi-select at 2 points each. Part 2 (56 points): six item sets, choice sub-items 2 points,
# written (mixed) sub-items 4 points: q37–q39 physics, q40–q43 biology + chemistry, q44–q46 chemistry,
# q47–q49 biology, q50–q53 earth science + physics, q54–q56 earth science.

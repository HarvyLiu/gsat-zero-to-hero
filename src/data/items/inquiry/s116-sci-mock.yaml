        hint: '一次比較兩管時，兩管之間只能有一個條件不同。呼吸作用什麼時候會停？碳酸是強酸還是弱酸？'
        explain: '(1) 對：甲、丙只差在有沒有水蘊草，丙不變色，所以光本身和指示劑都不會讓溶液變藍。(2) 對：甲、乙只差在有沒有光，甲的pH上升、乙的pH下降，方向相反。(3) 錯：乙、丙同時差了水蘊草和光照兩個條件，不能判斷是哪一個造成的。(4) 錯：細胞活著就一直進行呼吸作用，白天、晚上都一樣；照光時只是光合作用吸收的二氧化碳比呼吸作用放出的多。(5) 錯：$\mathrm{CO_2+H_2O\rightleftharpoons H_2CO_3}$，碳酸是弱酸，只有一小部分解離。答案是 (1)(2)。複習：ATP與光合、呼吸作用的能量轉換、環境汙染、永續發展與能源、發現問題與規劃研究。'
      en:
        stem: '(Continuing item 40.) From the results and what you have learnt, which of the following statements are correct? (Choose all that apply.)'
        options: ['Comparing tubes A and C shows that the colour change in A needs the waterweed', 'Comparing tubes A and B shows that light or its absence decides in which direction the waterweed changes the pH of the water', 'Comparing tubes B and C shows that darkness makes the waterweed give off carbon dioxide', 'The waterweed in tube A did not respire during its $3$ hours in the light', 'Tube B turned yellow because the carbonic acid formed when carbon dioxide dissolves in water is a strong acid that ionises completely']
        hint: 'When you compare two tubes, only one condition may differ between them. When does respiration stop? Is carbonic acid a strong or a weak acid?'

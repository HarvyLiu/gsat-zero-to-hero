        hint: 'Which difference do filtration, distillation, extraction and chromatography each use? In each option, is that difference there?'
        explain: 'Each method needs one difference: filtration needs insoluble particles, distillation a different boiling point or volatility, extraction a different solubility in two solvents that do not mix, and chromatography a different adsorption strength or solubility. In (2) the water boils off and the dye does not, so the difference is there and it works. In (1) the dissolved sugar passes through the filter paper with the water; in (3), (4) and (5) the stem says the needed difference is absent. Review: Classifying matter, states and separation.'

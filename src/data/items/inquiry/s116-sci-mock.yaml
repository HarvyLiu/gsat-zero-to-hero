        hint: 'Power is energy per second, so change the time to seconds first.'
        explain: '$5.0$ minutes $=300\ \mathrm{s}$, so the electrical energy used is $E=Pt=550\times300=1.65\times10^{5}\ \mathrm{J}$. Option (1) multiplies by "$5$ minutes" without changing to seconds; (5) multiplies by $60$ once too often. Review: Forms of energy, conversion and conservation.'

  - id: q35@1
    type: single
    origin: original
    codes: [nat:EIb-Vc-7]
    verify: m_inquiry_s116_sci_mock_earth:me_strong_upwelling_year
    text:
      zh-tw:
        stem: '某一年，赤道太平洋東側（南美洲西岸外海）的湧升流比平常更明顯，表層海溫比平常低。依海氣交互作用推論，這一年最可能還有下列哪一種情形？'
        options: ['信風比平常弱，雲多雨多的地區往東移', '東西兩側的表層海溫差比平常小', '信風比平常強，東側的降雨比平常多', '信風比平常弱，西側（印尼、澳洲一帶）比平常乾燥', '信風比平常強，雲多雨多的地區比平常更偏西']
        hint: '平常的時候，是什麼把東側的表層海水吹走、讓下方的冷水湧上來？湧升流更明顯，表示這股力量變強還是變弱？'
        explain: '東側的湧升流是信風把表層海水往西吹走造成的（動力作用）。湧升流更明顯、東側更冷，表示信風比平常強。信風強，暖水更集中在西側，東西兩側的海溫差變大；西側海面更暖，空氣上升、多雨的地區更偏西，東側更乾。這和聖嬰現象相反，是反聖嬰現象，答案是 (5)。(1)(4) 是信風減弱的聖嬰現象；(2) 方向相反；(3) 信風強時東側空氣下沉，降雨比平常少。複習：海水性質、表面海流與聖嬰現象。'
      en:
        stem: 'In a certain year, upwelling in the eastern equatorial Pacific (off the west coast of South America) is stronger than usual and the sea-surface temperature there is lower than usual. Reasoning from ocean–atmosphere interaction, which of these is most likely also true that year?'
        options: ['The trade winds are weaker than usual and the cloudy, rainy region moves east', 'The difference in sea-surface temperature between the west and east sides is smaller than usual', 'The trade winds are stronger than usual and the east side gets more rain than usual', 'The trade winds are weaker than usual and the west side (around Indonesia and Australia) is drier than usual', 'The trade winds are stronger than usual and the cloudy, rainy region lies farther west than usual']
        hint: 'Normally, what blows the surface water away on the east side and lets the cold water below rise? If the upwelling is stronger, has that push become stronger or weaker?'
        explain: 'Upwelling on the east side happens because the trade winds blow the surface water away to the west (a dynamic effect). Stronger upwelling and a colder east side mean the trade winds are stronger than usual. With stronger trade winds, warm water piles up even more on the west side, so the west–east temperature difference grows; the warmer sea in the west makes air rise there, so the rainy region lies farther west and the east is drier. This is the opposite of El Niño, called La Niña: (5). (1) and (4) describe El Niño, when the trade winds weaken; (2) has the direction reversed; (3) is wrong because with strong trade winds the air sinks on the east side and it rains less than usual. Review: Seawater properties, surface currents and El Niño.'
    answer: 4

  - id: q36@1
    type: multi
    origin: original
    codes: [nat:ENb-Vc-2, nat:ENb-Vc-4]
    verify: m_inquiry_s116_sci_mock_earth:me_coastal_city_measures
    text:
      zh-tw:
        stem: '某海邊城市為了面對氣候變遷，整理了下列說法與措施。哪些正確？（多選）'
        options: ['北極海冰融化，是這座城市海平面上升的主要原因', '在河岸興建較高的堤防，屬於調適', '只要調適做得夠好，就不必減少溫室氣體的排放', '陸地上的冰川融化與海水受熱膨脹，都會使海平面上升', '把燃油公車換成用太陽能發電來充電的電動公車，屬於減緩']
        hint: '浮在海上的冰融化後，海平面會變多少？減緩是從源頭減少溫室氣體，調適是減少衝擊帶來的損失。'
        explain: '(1) 錯：浮在海上的冰本來就排開了和自己一樣重的海水，融化後大約正好填回原本排開的部分，海平面幾乎不變。(4) 正確：陸地上的冰川融化，水是新加入海洋的；海水變暖也會稍微膨脹。(2) 正確：較高的堤防不改變暖化，而是減少淹水的損失，屬於調適。(5) 正確：少燒燃油，溫室氣體就少增加，屬於減緩。(3) 錯：調適只能減少損失，不能讓暖化停下來，減緩和調適要一起做。答案是 (2)(4)(5)。複習：氣候變遷。'
      en:
        stem: 'A coastal city facing climate change has listed the following statements and measures. Which are correct? (Choose all that apply.)'
        options: ['Melting Arctic sea ice is the main reason for sea-level rise at this city', 'Building higher embankments along the river is adaptation', 'As long as adaptation is done well enough, there is no need to cut greenhouse gas emissions', 'Melting glaciers on land and the expansion of seawater as it warms both raise sea level', 'Replacing fuel-burning buses with electric buses charged by solar power is mitigation']
        hint: 'When ice floating on the sea melts, how much does sea level change? Mitigation cuts greenhouse gases at the source; adaptation reduces the losses from the impacts.'
        explain: '(1) is wrong: ice floating on the sea already displaces its own weight of seawater, and when it melts it roughly fills the space it displaced, so sea level hardly changes. (4) is correct: meltwater from glaciers on land is new water added to the sea, and seawater also expands slightly as it warms. (2) is correct: higher embankments do not change the warming; they reduce the losses from flooding, so they are adaptation. (5) is correct: burning less fuel adds less greenhouse gas, so it is mitigation. (3) is wrong: adaptation can only reduce losses and cannot stop the warming, so mitigation and adaptation must go together. The answer is (2)(4)(5). Review: Climate change.'
    answer: [1, 3, 4]


  # ---------- 第貳部分 物理題組 q37–q39 ----------
  - id: q37@1
    type: single
    origin: original
    codes: [nat:PMc-Vc-1]
    verify: m_inquiry_s116_sci_mock_phys:ph_heater_current
    text:
      zh-tw:
        stem: '第37至39題為題組。小芸把一支標示「$110\ \mathrm{V}$、$550\ \mathrm{W}$」的電熱棒放進玻璃杯，加熱杯中 $0.50\ \mathrm{kg}$、$25\,{}^{\circ}\mathrm{C}$ 的水。電熱棒在 $110\ \mathrm{V}$ 下正常工作 $5.0$ 分鐘後關掉，攪拌後測得水溫為 $80\,{}^{\circ}\mathrm{C}$（示意數據）。水的比熱取 $4.2\times10^{3}\ \mathrm{J/(kg\cdot{}^{\circ}C)}$，$1\ \mathrm{W}=1\ \mathrm{J/s}$。電熱棒正常工作時，流過它的電流是多少？'
        options: ['$0.20\ \mathrm{A}$', '$2.0\ \mathrm{A}$', '$5.0\ \mathrm{A}$', '$50\ \mathrm{A}$', '$6.05\times10^{4}\ \mathrm{A}$']
        hint: '電功率 $P=IV$。'
        explain: '由 $P=IV$，$I=\dfrac{P}{V}=\dfrac{550}{110}=5.0\ \mathrm{A}$。(1) 是 $\dfrac{V}{P}$，(5) 是 $P\times V$，單位都不是電流。複習：電磁波與光，以及電在生活中的應用。'
      en:
        stem: 'Items 37 to 39 form a set. Yun puts an immersion heater marked "$110\ \mathrm{V}$, $550\ \mathrm{W}$" into a glass holding $0.50\ \mathrm{kg}$ of water at $25\,{}^{\circ}\mathrm{C}$. The heater runs normally at $110\ \mathrm{V}$ for $5.0$ minutes and is then switched off; after stirring, the water is at $80\,{}^{\circ}\mathrm{C}$ (illustrative data). Take the specific heat of water as $4.2\times10^{3}\ \mathrm{J/(kg\cdot{}^{\circ}C)}$ and $1\ \mathrm{W}=1\ \mathrm{J/s}$. While the heater runs normally, what current flows through it?'
        options: ['$0.20\ \mathrm{A}$', '$2.0\ \mathrm{A}$', '$5.0\ \mathrm{A}$', '$50\ \mathrm{A}$', '$6.05\times10^{4}\ \mathrm{A}$']
        hint: 'Electric power is $P=IV$.'
        explain: 'From $P=IV$, $I=\dfrac{P}{V}=\dfrac{550}{110}=5.0\ \mathrm{A}$. Option (1) is $\dfrac{V}{P}$ and (5) is $P\times V$; neither has the unit of a current. Review: Electromagnetic waves and light, and electricity in daily life.'
    answer: 2

  - id: q38@1

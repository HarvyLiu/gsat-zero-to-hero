    text:
      zh-tw:
        stem: '已知乙醇燃燒的熱化學反應式如下，$\Delta H=-1367\ \mathrm{kJ}$：$$\begin{aligned}&\ce{C2H5OH(l) + 3O2(g)}\\ &\ce{-> 2CO2(g) + 3H2O(l)}\end{aligned}$$取H＝$1$、C＝$12$、O＝$16$。完全燃燒 $4.6$ 公克的乙醇，放出多少kJ的熱？'
        options: ['$68.35$', '$136.7$', '$273.4$', '$1367$', '$6288$']
        hint: '$\Delta H$ 是依反應式的係數：$1$ 莫耳乙醇燃燒放出 $1367$ kJ。先把 $4.6$ 公克換成莫耳。'
        explain: '乙醇 $\ce{C2H5OH}$ 的分子量是 $2\times12+6\times1+16=46$，$4.6$ 公克是 $0.10$ 莫耳。反應式中乙醇的係數是 $1$，所以放出 $0.10\times1367=136.7$ kJ。(4) 是 $1$ 莫耳放出的熱；(5) 把公克數直接乘上 $1367$。複習：化學反應中的能量變化。'
      en:
        stem: 'The thermochemical equation for burning ethanol, with $\Delta H=-1367\ \mathrm{kJ}$, is $$\begin{aligned}&\ce{C2H5OH(l) + 3O2(g)}\\ &\ce{-> 2CO2(g) + 3H2O(l)}\end{aligned}$$ Take H = $1$, C = $12$ and O = $16$. How many kJ of heat are released when $4.6$ grams of ethanol burn completely?'
        options: ['$68.35$', '$136.7$', '$273.4$', '$1367$', '$6288$']
        hint: '$\Delta H$ goes with the coefficients: $1$ mole of ethanol burning releases $1367$ kJ. First turn $4.6$ grams into moles.'
        explain: 'Ethanol, $\ce{C2H5OH}$, has a molecular weight of $2\times12+6\times1+16=46$, so $4.6$ grams is $0.10$ moles. Its coefficient in the equation is $1$, so the heat released is $0.10\times1367=136.7$ kJ. Option (4) is the heat for $1$ mole; option (5) multiplies the mass in grams by $1367$. Review: Energy changes in reactions.'
    answer: 1


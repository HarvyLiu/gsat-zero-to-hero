        explain: '轉錄是以DNA為模板合成RNA，真核細胞的轉錄在細胞核中進行，所以最直接的影響是新RNA的合成減少，(1) 正確。核糖體上進行的是轉譯，(2)、(5) 說的是轉譯；轉譯所需的RNA變少後，蛋白質的合成才會跟著減少，這是間接的影響。DNA複製是另一個步驟，(3) 錯；蛋白質必須經由RNA才能合成，(4) 錯。複習：核酸、中心法則與基因轉殖。'
      en:
        stem: '(An imaginary situation.) A drug blocks only transcription in eukaryotic cells and does not directly affect any other step. After the drug is added to cultured eukaryotic cells, which of these is affected most directly?'
        options: ['The making of new RNA falls; this step normally happens in the nucleus', 'The making of new RNA falls; this step normally happens on ribosomes in the cytoplasm', 'DNA replication stops; this step normally happens in the nucleus', 'DNA can be translated straight into protein, so protein synthesis is unaffected', 'The step on the ribosomes that joins amino acids into protein is blocked directly']
        hint: 'In the central dogma, what does transcription make, and from what? Where does transcription happen in a eukaryotic cell?'
        explain: 'Transcription makes RNA using DNA as the template, and in eukaryotic cells it happens in the nucleus, so the most direct effect is that less new RNA is made: (1) is correct. What happens on ribosomes is translation, which is what (2) and (5) describe; protein synthesis falls only later, once less RNA is available for translation, which is an indirect effect. DNA replication is a different step, so (3) is wrong; protein can be made only by way of RNA, so (4) is wrong. Review: Nucleic acids, the central dogma and transgenic technology.'

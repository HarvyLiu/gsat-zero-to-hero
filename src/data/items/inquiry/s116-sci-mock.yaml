  - id: q16@1
    type: multi
    origin: original
    codes: [nat:CAb-Vc-3, nat:CCa-Vc-2, nat:CCb-Vc-1, nat:CCb-Vc-2]
    verify: m_inquiry_s116_sci_mock_chem:mc_bond_statements
    text:
      zh-tw:
        stem: '下列關於化學鍵與物質性質的敘述，哪些正確？（多選）'
        options: ['氯化鎂 $\ce{MgCl2}$ 固體不導電，熔融後能導電', '二氧化矽 $\ce{SiO2}$ 熔點很高，是因為它由許多獨立的小分子組成', '氨 $\ce{NH3}$ 分子中，氮原子上有 $1$ 對孤對電子', '鎂能導電，是因為價電子能在整塊金屬中自由移動', '二氧化碳 $\ce{CO2}$ 分子中，孤對電子共有 $2$ 對']
        hint: '先判斷每種物質屬於離子化合物、分子化合物、共價網狀固體還是金屬。路易斯結構可以用（需要的電子數－價電子總數）÷$2$ 求共用電子對。'
        explain: '(1) 鎂是金屬、氯是非金屬，氯化鎂是離子化合物：固體中離子不能移動，熔融後能移動，所以能導電。(2) 錯：$\ce{SiO2}$ 是共價網狀固體，由原子以共價鍵連成一整塊，沒有獨立的分子，所以熔點很高。(3) 氨的價電子共 $5+3=8$ 個，需要 $8+3\times2=14$ 個，共用 $\dfrac{14-8}{2}=3$ 對，氮的 $5$ 個價電子用掉 $3$ 個，剩下 $2$ 個成 $1$ 對孤對電子。(4) 金屬鍵的電子海模型。(5) 錯：$\ce{CO2}$ 共用 $4$ 對，剩下 $\dfrac{16-8}{2}=4$ 對孤對電子，每個氧上 $2$ 對。答案是(1)(3)(4)。複習：化學鍵與物質的性質。'
      en:
        stem: 'Which statements about chemical bonds and the properties of substances are correct? (Choose all that apply.)'
        options: ['Solid magnesium chloride, $\ce{MgCl2}$, does not conduct, but molten $\ce{MgCl2}$ does', 'Silicon dioxide, $\ce{SiO2}$, has a very high melting point because it is made of many separate small molecules', 'In an ammonia molecule, $\ce{NH3}$, the nitrogen atom carries $1$ lone pair', 'Magnesium conducts because its valence electrons move freely through the whole metal', 'A carbon dioxide molecule, $\ce{CO2}$, has $2$ lone pairs in all']
        hint: 'First decide whether each substance is an ionic compound, a molecular compound, a covalent network solid or a metal. For a Lewis structure, shared pairs = (electrons needed − valence electrons) ÷ $2$.'
        explain: '(1) Magnesium is a metal and chlorine a non-metal, so magnesium chloride is ionic: in the solid the ions cannot move, in the melt they can, so the melt conducts. (2) False: $\ce{SiO2}$ is a covalent network solid, atoms joined by covalent bonds into one piece with no separate molecules, which is why its melting point is so high. (3) Ammonia has $5+3=8$ valence electrons and needs $8+3\times2=14$, so it shares $\dfrac{14-8}{2}=3$ pairs; nitrogen uses $3$ of its $5$ valence electrons in them, and the other $2$ form $1$ lone pair. (4) This is the electron-sea model of the metallic bond. (5) False: $\ce{CO2}$ shares $4$ pairs and has $\dfrac{16-8}{2}=4$ lone pairs, $2$ on each oxygen. The answer is (1)(3)(4). Review: Chemical bonds and the properties of substances.'
    answer: [0, 2, 3]

  - id: q17@1
    type: multi
    origin: original
    codes: [nat:CJd-Vc-2, nat:CJd-Vc-4]
    verify: m_inquiry_s116_sci_mock_chem:mc_acid_statements
    text:
      zh-tw:
        stem: '25℃時，有一杯 $100$ mL、$0.010\ \mathrm{M}$ 的鹽酸。氫氧化鋇在水中完全解離：$\ce{Ba(OH)2}$ $\ce{-> Ba^2+ + 2OH-}$。下列敘述哪些正確？（多選）'
        options: ['相同濃度、相同體積的醋酸，pH也是 $2$', '這杯鹽酸的pH是 $2$', '恰好完全中和這杯鹽酸，需要 $0.010\ \mathrm{M}$ 的氫氧化鋇溶液 $100$ mL', '這杯鹽酸中 $[\ce{OH-}]=1.0\times10^{-12}\ \mathrm{M}$', '加水稀釋到 $1000$ mL後，pH變成 $3$']
        hint: '鹽酸是強酸，完全解離；醋酸是弱酸。中和時比的是 $\ce{H+}$ 和 $\ce{OH-}$ 的莫耳數，一個 $\ce{Ba(OH)2}$ 給出幾個 $\ce{OH-}$？'
        explain: '(2) 鹽酸完全解離，$[\ce{H+}]=1.0\times10^{-2}\ \mathrm{M}$，pH＝$2$。(4) $[\ce{OH-}]=\dfrac{1.00\times10^{-14}}{1.0\times10^{-2}}=1.0\times10^{-12}\ \mathrm{M}$。(5) $\ce{H+}$ 的莫耳數不變，體積變成 $10$ 倍，$[\ce{H+}]=1.0\times10^{-3}\ \mathrm{M}$，pH＝$3$。(1) 錯：醋酸是弱酸，只有一部分解離，$[\ce{H+}]$ 比 $0.010\ \mathrm{M}$ 小，pH大於 $2$。(3) 錯：$\ce{H+}$ 有 $0.100\times0.010=1.0\times10^{-3}$ 莫耳，每莫耳 $\ce{Ba(OH)2}$ 給出 $2$ 莫耳 $\ce{OH-}$，只需要 $5.0\times10^{-4}$ 莫耳，也就是 $50$ mL。答案是(2)(4)(5)。複習：酸鹼反應。'
      en:
        stem: 'At 25 ℃ there is $100$ mL of $0.010\ \mathrm{M}$ hydrochloric acid. Barium hydroxide ionises completely in water: $\ce{Ba(OH)2}$ $\ce{-> Ba^2+ + 2OH-}$. Which statements are correct? (Choose all that apply.)'
        options: ['Acetic acid of the same concentration and volume also has a pH of $2$', 'This hydrochloric acid has a pH of $2$', 'Exact neutralisation of this acid needs $100$ mL of $0.010\ \mathrm{M}$ barium hydroxide solution', 'In this acid $[\ce{OH-}]=1.0\times10^{-12}\ \mathrm{M}$', 'After dilution with water to $1000$ mL, the pH becomes $3$']
        hint: 'Hydrochloric acid is a strong acid and ionises completely; acetic acid is weak. Neutralisation compares moles of $\ce{H+}$ and $\ce{OH-}$: how many $\ce{OH-}$ does one $\ce{Ba(OH)2}$ give?'
        explain: '(2) The acid is fully ionised, so $[\ce{H+}]=1.0\times10^{-2}\ \mathrm{M}$ and the pH is $2$. (4) $[\ce{OH-}]=\dfrac{1.00\times10^{-14}}{1.0\times10^{-2}}=1.0\times10^{-12}\ \mathrm{M}$. (5) The moles of $\ce{H+}$ stay the same while the volume becomes $10$ times as large, so $[\ce{H+}]=1.0\times10^{-3}\ \mathrm{M}$ and the pH is $3$. (1) False: acetic acid is weak and only partly ionised, so $[\ce{H+}]$ is less than $0.010\ \mathrm{M}$ and the pH is above $2$. (3) False: there are $0.100\times0.010=1.0\times10^{-3}$ moles of $\ce{H+}$, and each mole of $\ce{Ba(OH)2}$ gives $2$ moles of $\ce{OH-}$, so only $5.0\times10^{-4}$ moles, that is $50$ mL, are needed. The answer is (2)(4)(5). Review: Acid–base reactions.'
    answer: [1, 3, 4]

  - id: q18@1

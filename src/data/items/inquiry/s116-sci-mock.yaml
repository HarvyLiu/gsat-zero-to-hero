    model:
      zh-tw: '北半球颱風近地面的風逆時針旋轉、斜斜地向中心吹入。第12時中心在正北方，島嶼在中心的南側，那裡的風向東吹、又向北吹入，所以風大致從南方到西方之間（西南方附近）吹來；第18時中心在正西方，島嶼在中心的東側，風向北吹、又向西吹入，所以風大致從東方到南方之間（東南方附近）吹來。兩個時刻的風都從偏南方吹來，而山脈是東西走向，所以南坡是迎風面。在迎風面，空氣被迫沿山坡上升，膨脹冷卻到露點，水氣凝結成雲而下雨；越過山脈到了北坡，雨就少得多。所以從第12時起，南坡的乙站雨多（第12時 $11$ mm/h、第18時 $30$ mm/h），北坡的甲站雨少（$6$ mm/h、$2$ mm/h）。'
      en: 'Near the surface, a northern-hemisphere typhoon''s winds turn anticlockwise and blow in towards the centre at a slant. At hour 12 the centre is due north, so the island is on the south side of the centre, where the wind blows eastwards and also in towards the north: it comes from between south and west (around the south-west). At hour 18 the centre is due west, so the island is on the east side of the centre, where the wind blows northwards and also in towards the west: it comes from between east and south (around the south-east). At both times the wind comes from the south side, and the range runs east–west, so the southern slope is windward. On the windward side the air is forced up the slope, expands and cools to the dew point, and the water vapour condenses into cloud and rain; on the far side of the range, the northern slope, there is much less rain. So from hour 12 on, B on the southern slope gets much rain ($11$ mm/h at hour 12, $30$ mm/h at hour 18) and A on the northern slope little ($6$ mm/h and $2$ mm/h).'

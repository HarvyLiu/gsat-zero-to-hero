  - id: q52@1
    type: mixed
    origin: original
    codes: [nat:EMd-Vc-4]
    verify: m_inquiry_s116_sci_mock_cross:x_mixed_quake_distance_warning
    text:
      zh-tw:
        stem: '（承第50題）（1）同一次地震中，測站丁記錄到P波與S波抵達的時間差為 $14.0$ 秒。利用表中數據求出P波與S波的波速，再計算測站丁離震源多遠。（2）若預警系統在時鐘讀數 $12.0$ 秒時發出警報，警報傳送的時間可以忽略，測站丁所在的城鎮在S波抵達前有幾秒可以應變？（非選擇題，4分，須寫出計算過程）'
        explain: 'S、P兩波從震源同時出發，走同一段距離 $d$，時間差是 $\dfrac{d}{v_{S}}-\dfrac{d}{v_{P}}$，它和 $d$ 成正比。算預警時間時要用地震發生的時刻（第51題），而不是時鐘的 $0$ 秒。複習：板塊邊界、臺灣的板塊環境與地震、作圖與列式。'
      en:
        stem: '(Continuing item 50.) (1) In the same earthquake, station D recorded a time difference of $14.0$ s between the arrival of the P wave and the S wave. Use the data in the table to find the speeds of the P and S waves, then work out how far station D is from the focus. (2) The warning system sends its alert at a clock reading of $12.0$ s, and the time the alert takes to arrive can be ignored. How many seconds does the town at station D have to respond before the S wave arrives? (Written item, 4 points: show your working.)'
        explain: 'The S and P waves leave the focus together and travel the same distance $d$, so their time difference is $\dfrac{d}{v_{S}}-\dfrac{d}{v_{P}}$, which is proportional to $d$. For the warning time, use the moment of the earthquake (item 51), not the clock''s $0$ s. Review: Plate boundaries, Taiwan''s tectonic setting and earthquakes, Plotting and showing working.'
    rubric:
      criteria:
        - id: speeds
          points: 1
          text:
            zh-tw: '由兩個測站的距離差與時刻差求出 $v_{P}=6.0\ \mathrm{km/s}$、$v_{S}=\dfrac{90-36}{27.0-12.0}=3.6\ \mathrm{km/s}$。'
            en: 'Finds $v_{P}=6.0\ \mathrm{km/s}$ and $v_{S}=\dfrac{90-36}{27.0-12.0}=3.6\ \mathrm{km/s}$ from the differences in distance and time between two stations.'
        - id: distance
          points: 1
          text:
            zh-tw: '列出 $\dfrac{d}{3.6}-\dfrac{d}{6.0}=14.0$（或用每 $1\ \mathrm{km}$ 時間差 $\dfrac{1}{9}\ \mathrm{s}$ 的比例），得 $d=126\ \mathrm{km}$。'
            en: 'Writes $\dfrac{d}{3.6}-\dfrac{d}{6.0}=14.0$ (or uses the proportion of $\dfrac{1}{9}\ \mathrm{s}$ of time difference per $1\ \mathrm{km}$) and gets $d=126\ \mathrm{km}$.'
        - id: s-arrival
          points: 1
          text:
            zh-tw: '用地震發生的時刻 $2.0$ 秒，算出S波抵達丁的時刻 $2.0+\dfrac{126}{3.6}=37.0$ 秒（直接用 $\dfrac{126}{3.6}=35$ 秒當成抵達時刻不給分）。'
            en: 'Uses the moment of the earthquake, $2.0$ s, to find that the S wave reaches D at $2.0+\dfrac{126}{3.6}=37.0$ s (no point for taking $\dfrac{126}{3.6}=35$ s as the arrival reading).'
        - id: warning
          points: 1
          text:
            zh-tw: '得出應變時間 $37.0-12.0=25.0$ 秒。'
            en: 'Gets the time to respond, $37.0-12.0=25.0$ s.'
    model:
      zh-tw: '（1）甲到丙：P波多走 $54\ \mathrm{km}$、多花 $9.0\ \mathrm{s}$，$v_{P}=6.0\ \mathrm{km/s}$；S波多走 $54\ \mathrm{km}$、多花 $27.0-12.0=15.0\ \mathrm{s}$，$v_{S}=3.6\ \mathrm{km/s}$。設丁離震源 $d$，則 $\dfrac{d}{3.6}-\dfrac{d}{6.0}=14.0$，$d\left(\dfrac{10-6}{36}\right)=14.0$，$\dfrac{d}{9}=14.0$，所以 $d=126\ \mathrm{km}$。（檢查：甲站 $36\ \mathrm{km}$ 的時間差是 $4.0\ \mathrm{s}=\dfrac{36}{9}$，符合。）（2）地震發生在時鐘讀數 $8.0-\dfrac{36}{6.0}=2.0$ 秒。S波抵達丁的時刻是 $2.0+\dfrac{126}{3.6}=2.0+35.0=37.0$ 秒，警報在 $12.0$ 秒發出，所以有 $37.0-12.0=25.0$ 秒可以應變。'
      en: '(1) From A to C the P wave travels $54\ \mathrm{km}$ further in $9.0\ \mathrm{s}$ more, so $v_{P}=6.0\ \mathrm{km/s}$; the S wave travels $54\ \mathrm{km}$ further in $27.0-12.0=15.0\ \mathrm{s}$ more, so $v_{S}=3.6\ \mathrm{km/s}$. Let D be $d$ from the focus. Then $\dfrac{d}{3.6}-\dfrac{d}{6.0}=14.0$, so $d\left(\dfrac{10-6}{36}\right)=14.0$, $\dfrac{d}{9}=14.0$ and $d=126\ \mathrm{km}$. (Check: station A at $36\ \mathrm{km}$ has a time difference of $4.0\ \mathrm{s}=\dfrac{36}{9}$, as it should.) (2) The earthquake happened at a clock reading of $8.0-\dfrac{36}{6.0}=2.0$ s. The S wave reaches D at $2.0+\dfrac{126}{3.6}=2.0+35.0=37.0$ s, and the alert goes out at $12.0$ s, so the town has $37.0-12.0=25.0$ s to respond.'

  - id: q53@1
    type: mixed
    origin: original
    codes: [nat:PKa-Vc-1, nat:PKa-Vc-3, nat:EFa-Vc-1]
    verify: m_inquiry_s116_sci_mock_cross:x_mixed_moho_refraction
    text:
      zh-tw:
        stem: '（承第50題）這一帶地殼的底部約在 $35\ \mathrm{km}$ 深處，再往下就是地函。P波在地殼中的波速取 $6.0\ \mathrm{km/s}$，進入地函頂部後變為 $8.0\ \mathrm{km/s}$（示意數據）。一段頻率為 $4.0\ \mathrm{Hz}$ 的P波斜向穿過這個交界，由地殼進入地函。（1）這段P波在地殼中和在地函中的頻率與波長各是多少？（2）P波進入地函時，傳播方向偏向法線還是偏離法線？說明理由。（非選擇題，4分，須寫出計算過程與理由）'
        explain: '波進入新介質，頻率由波源決定而不變，改變的是波速和波長；折射的方向看波速變快還是變慢。這是物理波動的規則，用在地震波上一樣成立。複習：波的性質、都卜勒效應與光的波動性、地球的分層與板塊構造學說。'
      en:
        stem: '(Continuing item 50.) In this area the base of the crust lies about $35\ \mathrm{km}$ deep, and below it is the mantle. Take the speed of the P wave as $6.0\ \mathrm{km/s}$ in the crust and $8.0\ \mathrm{km/s}$ at the top of the mantle (illustrative data). A stretch of P wave with a frequency of $4.0\ \mathrm{Hz}$ crosses this boundary at a slant, from the crust into the mantle. (1) What are the frequency and the wavelength of this P wave in the crust and in the mantle? (2) As the P wave enters the mantle, does it bend towards the normal or away from it? Give your reason. (Written item, 4 points: show your working and reasons.)'
        explain: 'When a wave enters a new medium, its frequency is set by the source and stays the same; what changes is the wave speed and the wavelength. The direction of refraction depends on whether the wave speeds up or slows down. These are rules of waves from physics, and they hold for seismic waves too. Review: Wave properties, the Doppler effect and light as a wave, Earth''s layers and the theory of plate tectonics.'
    rubric:
      criteria:
        - id: frequency
          points: 1
          text:
            zh-tw: '頻率在地殼和地函中都是 $4.0\ \mathrm{Hz}$，理由是頻率由波源決定，進入新介質不變。'
            en: 'The frequency is $4.0\ \mathrm{Hz}$ in both the crust and the mantle, because the frequency is set by the source and does not change in a new medium.'
        - id: wavelength
          points: 1
          text:
            zh-tw: '由 $\lambda=\dfrac{v}{f}$，地殼中 $\dfrac{6.0}{4.0}=1.5\ \mathrm{km}$，地函中 $\dfrac{8.0}{4.0}=2.0\ \mathrm{km}$（兩個都對才給分）。'
            en: 'From $\lambda=\dfrac{v}{f}$: $\dfrac{6.0}{4.0}=1.5\ \mathrm{km}$ in the crust and $\dfrac{8.0}{4.0}=2.0\ \mathrm{km}$ in the mantle (both needed for the point).'
        - id: direction
          points: 1
          text:
            zh-tw: '偏離法線。'
            en: 'Away from the normal.'
        - id: reason
          points: 1
          text:
            zh-tw: '理由：波由波速較慢的介質（$6.0\ \mathrm{km/s}$）進入波速較快的介質（$8.0\ \mathrm{km/s}$），折射線偏離法線（只寫「因為折射」不給分）。'
            en: 'Reason: the wave passes from a slower medium ($6.0\ \mathrm{km/s}$) into a faster one ($8.0\ \mathrm{km/s}$), and a wave entering a faster medium bends away from the normal (no point for just "because of refraction").'
    model:
      zh-tw: '（1）頻率由波源決定，波進入新介質時頻率不變，所以在地殼和地函中都是 $4.0\ \mathrm{Hz}$。由 $v=f\lambda$，地殼中 $\lambda=\dfrac{6.0}{4.0}=1.5\ \mathrm{km}$，地函中 $\lambda=\dfrac{8.0}{4.0}=2.0\ \mathrm{km}$：波速變快，波長變長。（2）偏離法線。P波由波速較慢的地殼（$6.0\ \mathrm{km/s}$）進入波速較快的地函（$8.0\ \mathrm{km/s}$）；波進入波速較快的介質時，折射線偏離法線。'
      en: '(1) The frequency is set by the source and does not change when a wave enters a new medium, so it is $4.0\ \mathrm{Hz}$ in both the crust and the mantle. From $v=f\lambda$, $\lambda=\dfrac{6.0}{4.0}=1.5\ \mathrm{km}$ in the crust and $\lambda=\dfrac{8.0}{4.0}=2.0\ \mathrm{km}$ in the mantle: the wave speeds up, so its wavelength gets longer. (2) Away from the normal. The P wave passes from the slower crust ($6.0\ \mathrm{km/s}$) into the faster mantle ($8.0\ \mathrm{km/s}$), and a wave entering a faster medium bends away from the normal.'


  # ---------- 第貳部分 地科題組 q54–q56 ----------
  - id: q54@1
    type: single
    origin: original
    codes: [nat:EMd-Vc-2]
    verify: m_inquiry_s116_sci_mock_earth:me_island_wind_east_centre
    text:
      zh-tw:
        stem: '第54至56題為題組。北半球有一座示意的島嶼，島的中央是一條東西走向的高大山脈。測站甲在山脈北側的山坡上，測站乙在山脈南側的山坡上。一個颱風經過島嶼附近：颱風中心先在島嶼的正東方，再移到正北方，最後移到正西方，離島嶼都約 $300$ km。下表是三個時刻（第6、12、18時）颱風中心的方位和兩站的時雨量（mm/h）（示意數據）。$$\begin{array}{c|c|c|c}\text{時刻}&\text{中心}&\text{甲}&\text{乙}\\ \hline 6&\text{正東方}&24&3\\ 12&\text{正北方}&6&11\\ 18&\text{正西方}&2&30\end{array}$$ 第6時，島上近地面的風大致是從哪個範圍吹來的？'
        options: ['北方到東方之間', '東方到南方之間', '南方到西方之間', '西方到北方之間', '幾乎無風，因為島嶼位在颱風眼中']
        hint: '北半球颱風近地面的風逆時針旋轉、斜斜地向中心吹入。也可以用「背風而立，低壓在左前方」反推。'
        explain: '颱風中心在正東方，島嶼在中心的西側。逆時針繞著中心轉的風，在中心的西側是向南吹，再加上向中心（東方）吹入的分量，風吹向南方到東方之間，也就是從西方到北方之間吹來，答案是 (4)。用口訣檢查：背對西北風就是面向東南，左前方是東方，正是颱風中心所在。(5) 錯：颱風眼在中心，島嶼離中心約 $300$ km。複習：颱風。'
      en:
        stem: 'Items 54 to 56 form a set. An illustrative island in the northern hemisphere has a high mountain range running east–west along its middle. Station A is on the northern slope of the range and station B on the southern slope. A typhoon passes near the island: its centre is first due east of the island, then due north, and finally due west, each time about $300$ km away. The table gives the bearing of the centre and the hourly rainfall at the two stations (mm/h) at hours 6, 12 and 18 (illustrative data). $$\begin{array}{c|c|c|c}\text{Hour}&\text{Centre}&\text{A}&\text{B}\\ \hline 6&\text{due E}&24&3\\ 12&\text{due N}&6&11\\ 18&\text{due W}&2&30\end{array}$$ At hour 6, roughly from which range of directions does the near-surface wind on the island blow?'
        options: ['Between north and east', 'Between east and south', 'Between south and west', 'Between west and north', 'There is almost no wind, because the island is in the eye of the typhoon']
        hint: 'Near the surface, a northern-hemisphere typhoon''s winds turn anticlockwise and blow in towards the centre at a slant. You can also work back from "back to the wind, low ahead on the left".'
        explain: 'The centre is due east, so the island is on the west side of the centre. Wind turning anticlockwise around the centre blows southwards on its west side; adding the part that blows in towards the centre (east), the wind blows towards between south and east, that is, it comes from between west and north: (4). Check with the rule: with your back to a north-west wind you face south-east, and ahead on the left is east, exactly where the centre is. (5) is wrong: the eye is at the centre, and the island is about $300$ km from it. Review: Typhoons.'
    answer: 3


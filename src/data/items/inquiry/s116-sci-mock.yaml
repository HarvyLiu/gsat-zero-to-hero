        options: ['Its frequency is $1.0\times10^{9}\ \mathrm{Hz}$', 'It travels faster than visible light in a vacuum', 'It is a microwave', 'One of its photons carries less energy than one photon of visible light', 'Its frequency is higher than that of X-rays']
        hint: 'Work out the frequency from $c=f\lambda$ first, then compare with the order of the electromagnetic spectrum.'
        explain: '$f=\dfrac{c}{\lambda}=\dfrac{3.0\times10^{8}}{0.30}=1.0\times10^{9}\ \mathrm{Hz}$, so (1) is correct. All electromagnetic waves travel at $c$ in a vacuum, so (2) is wrong. Wavelengths from about $1\ \mathrm{mm}$ to $1\ \mathrm{m}$ are microwaves, so (3) is correct. Visible light has wavelengths of only about $400$ to $700\ \mathrm{nm}$ and a much higher frequency; since $E=hf$, a photon of this wave carries less energy than a visible photon, so (4) is correct. X-rays have shorter wavelengths and higher frequencies, so (5) is wrong. Review: Electromagnetic waves and light, and electricity in daily life, Photons, the photoelectric effect and atomic energy levels.'
    answer: [0, 2, 3]



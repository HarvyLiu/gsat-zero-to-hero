  - id: q21@1
    type: single
    origin: original
    codes: [nat:BDa-Vc-4]
    verify: m_inquiry_s116_sci_mock_bio:bio_co2_three_phases
    text:
      zh-tw:
        stem: '把一盆植物放進密閉的透明箱，每小時記錄一次箱內 $\mathrm{CO_2}$ 的量（相對值，示意數據）。第 $0$ 到 $2$ 小時放在暗處，第 $2$ 到 $4$ 小時照弱光，第 $4$ 到 $6$ 小時照強光。 $$\begin{array}{c|c}\text{時間（小時）}&\mathrm{CO_2}\\ \hline 0&40\\ 1&43\\ 2&46\\ 3&45\\ 4&44\\ 5&38\\ 6&32\end{array}$$ 假設整個過程中呼吸作用的速率不變。照強光時，光合作用每小時實際吸收多少單位的 $\mathrm{CO_2}$？'
        options: ['$3$', '$4$', '$6$', '$9$', '$12$']
        hint: '先用暗處那一段求呼吸作用每小時放出多少；照光時看到的變化，是呼吸放出的減去光合吸收的。'
        explain: '暗處只有呼吸作用：每小時增加 $(46-40)\div2=3$ 單位。強光下每小時變化 $(32-44)\div2=-6$ 單位。看到的變化 $=$ 呼吸放出的 $-$ 光合吸收的，所以 $3-\text{吸收量}=-6$，吸收量 $=9$ 單位。(3) 只看了減少的 $6$，漏掉同時放出的 $3$；(2) 是弱光時的吸收量 $3-(-1)=4$。複習：ATP與光合、呼吸作用的能量轉換。'
      en:
        stem: 'A potted plant is put in a sealed transparent box, and the amount of $\mathrm{CO_2}$ in the box is recorded every hour (relative values, illustrative data). From hour $0$ to $2$ the box is in the dark, from hour $2$ to $4$ in dim light, and from hour $4$ to $6$ in bright light. $$\begin{array}{c|c}\text{time (h)}&\mathrm{CO_2}\\ \hline 0&40\\ 1&43\\ 2&46\\ 3&45\\ 4&44\\ 5&38\\ 6&32\end{array}$$ Assume the rate of respiration stays the same throughout. In bright light, how many units of $\mathrm{CO_2}$ does photosynthesis actually take up per hour?'
        options: ['$3$', '$4$', '$6$', '$9$', '$12$']
        hint: 'Use the dark stretch to find how much respiration releases per hour; the change seen in the light is what respiration releases minus what photosynthesis takes up.'
        explain: 'In the dark there is only respiration: an increase of $(46-40)\div2=3$ units per hour. In bright light the change is $(32-44)\div2=-6$ units per hour. Change seen $=$ released by respiration $-$ taken up by photosynthesis, so $3-\text{uptake}=-6$ and the uptake is $9$ units. Option (3) reads only the drop of $6$ and misses the $3$ released at the same time; option (2) is the uptake in dim light, $3-(-1)=4$. Review: ATP and energy conversion in photosynthesis and respiration.'
    answer: 3


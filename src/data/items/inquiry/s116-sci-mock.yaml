      en:
        stem: '(An imaginary situation.) On an island lives a seed-eating bird whose beak thickness varies between individuals and is heritable. After several years of drought, small soft seeds become scarce and only large hard seeds remain. Over the next few generations, the share of thick-beaked birds in the population rises. Which statements are correct? (Choose all that apply.)'
        options: ['The drought made the birds build up thicker beaks to crack the hard seeds, and they passed the thickened beaks on to their young', 'Before the drought the population already had birds with different beak thicknesses', 'Thick-beaked birds were better able to get food and survive, and left more offspring', 'If rain returns and small seeds become common again, the share of thick-beaked birds must keep rising', 'This is an example of artificial selection']
        hint: 'Natural selection picks among differences that are already in the population and can be inherited; who is "fit" depends on the environment at the time.'
        explain: 'The steps of natural selection: individuals already differ in heritable ways, so (2) is correct; in the drought, thick-beaked birds survived more easily and left more offspring, so (3) is correct. Option (1) is the idea of use and disuse with acquired traits being inherited, not natural selection. When the environment changes, who is fit changes too, so the "must" in (4) is wrong. Here the natural environment does the selecting, not people, so (5) is wrong. Review: Evolutionary ideas and natural selection.'
    answer: [1, 2]

  - id: q27@1
    type: single
    origin: original
    codes: [nat:BGb-Vc-3, nat:BGb-Vc-4]

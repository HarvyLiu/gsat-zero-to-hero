        explain: '先由颱風的風場（北半球逆時針、向中心吹入）定出每個時刻的風向，再由風向找出山脈的迎風面。風向和地形兩步都要寫出來，只寫「乙站在迎風面」而沒有說明風從哪裡來，理由就不完整。複習：颱風。'
      en:
        stem: '(Continuing item 54.) At hour 6 station A gets more rain than B, but from hour 12 on B always gets more rain than A. State roughly from which range of directions the near-surface wind on the island blows at hour 12 (centre due north) and at hour 18 (centre due west), and use the terrain to explain why B gets more rain than A from hour 12 on. (Written item, 4 points: give your reasons.)'
        explain: 'First use the typhoon''s wind field (anticlockwise and blowing in towards the centre in the northern hemisphere) to find the wind direction at each time, then use the wind direction to find the windward side of the range. Both steps, wind and terrain, must be written out: saying only "B is on the windward side" without saying where the wind comes from leaves the reasoning incomplete. Review: Typhoons.'

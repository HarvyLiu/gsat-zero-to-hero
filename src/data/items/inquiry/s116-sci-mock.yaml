        explain: 'Water has a molar mass of $18$, so $9.0$ grams is $0.50$ moles, containing $0.50$ moles of oxygen atoms. One glucose molecule has $6$ oxygen atoms, so you need $\dfrac{0.50}{6}$ moles of glucose, with a mass of $\dfrac{0.50}{6}\times180=15$ grams. Option (4) forgets to divide by $6$; option (5) multiplies by it instead. Review: Chemical formulas, atomic weight and the mole.'

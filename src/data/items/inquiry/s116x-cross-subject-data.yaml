  - id: q8@1
    type: mixed
    origin: original
    codes: [inq:argue-model/analyse-evidence, inq:share/evaluate-reflect]
    verify: m_inquiry_s116x_cross_subject_data:csd_q8_mixed_turbine
    text:
      zh-tw:
        stem: '根據第1題風力發電機的資料，寫出一個關於「等壓線間距」與「發電機電流」的主張，用表中的數據當證據，並用地科和物理複習過的觀念說明推理；最後指出這份資料的一個限制。（非選擇題，4分，須寫出推理過程）'
        explain: '照「主張、證據、推理、限制」四個方框來寫：證據要寫數字和單位，推理要說出每一步是哪一科的觀念，限制要說到資料的範圍。'
      en:
        stem: 'Using the wind-turbine data from item 1, write a claim about the isobar spacing and the turbine''s current, use numbers from the data as evidence, and explain your reasoning with ideas reviewed in earth science and physics; finally, point out one limitation of these data. (Written item, 4 points: show your reasoning.)'
        explain: 'Write it in the four boxes "claim, evidence, reasoning, limitation": the evidence needs numbers and units, the reasoning should say which subject each step comes from, and the limitation should talk about the range of the data.'
    rubric:
      criteria:
        - id: evidence
          points: 1
          text:
            zh-tw: '寫出主張（間距越小，電流越大），並引用表中的數據和單位當證據，例如 $400\ \mathrm{km}$ 時 $20\ \mathrm{mA}$、$100\ \mathrm{km}$ 時 $110\ \mathrm{mA}$。'
            en: 'States the claim (the smaller the spacing, the larger the current) and quotes data with units as evidence, for example $20\ \mathrm{mA}$ at $400\ \mathrm{km}$ and $110\ \mathrm{mA}$ at $100\ \mathrm{km}$.'
        - id: earth
          points: 1
          text:
            zh-tw: '用地科說明：等壓線越密，氣壓梯度力越大，風通常越強。'
            en: 'Explains with earth science: the closer the isobars, the larger the pressure-gradient force and usually the stronger the wind.'
        - id: physics
          points: 1
          text:
            zh-tw: '用物理說明：風越強，發電機轉得越快，穿過線圈的磁場變化越快，感應電流越大。'
            en: 'Explains with physics: the stronger the wind, the faster the turbine turns, so the magnetic field through the coil changes faster and the induced current is larger.'
        - id: limit
          points: 1
          text:
            zh-tw: '指出一個限制，例如只有5天、只在一個地點、間距只量到 $100$ 到 $400\ \mathrm{km}$，或風向等其他因素沒有控制，所以只能說兩者有關，不能證明是唯一原因。'
            en: 'Points out a limitation, for example only 5 days at one place, spacings measured only from $100$ to $400\ \mathrm{km}$, or other factors such as the wind direction not controlled, so the data show the two are related but cannot prove the spacing is the only cause.'
    model:
      zh-tw: '主張：等壓線的間距越小，發電機的電流越大。證據：間距 $400\ \mathrm{km}$ 那天電流 $20\ \mathrm{mA}$，間距 $100\ \mathrm{km}$ 那天 $110\ \mathrm{mA}$；把5天依間距由大到小排列，電流 $20$、$30$、$40$、$60$、$110\ \mathrm{mA}$ 一路增加。推理：等壓線越密，氣壓梯度力越大，風通常越強（地科）；風越強，發電機轉得越快，穿過線圈的磁場變化越快，感應電流就越大（物理）。限制：只有5天、一個地點，間距只量到 $100$ 到 $400\ \mathrm{km}$，風向等其他因素也沒有控制，所以只能說兩者有關，不能證明間距是唯一的原因。'
      en: 'Claim: the smaller the isobar spacing, the larger the turbine''s current. Evidence: on the day the spacing was $400\ \mathrm{km}$ the current was $20\ \mathrm{mA}$, and at $100\ \mathrm{km}$ it was $110\ \mathrm{mA}$; with the 5 days sorted from the widest spacing to the narrowest, the current rises all the way: $20$, $30$, $40$, $60$, $110\ \mathrm{mA}$. Reasoning: the closer the isobars, the larger the pressure-gradient force and usually the stronger the wind (earth science); the stronger the wind, the faster the turbine turns, so the magnetic field through the coil changes faster and the induced current is larger (physics). Limitation: only 5 days at one place, spacings only from $100$ to $400\ \mathrm{km}$, and other factors such as the wind direction were not controlled, so the data show the two are related but cannot prove the spacing is the only cause.'

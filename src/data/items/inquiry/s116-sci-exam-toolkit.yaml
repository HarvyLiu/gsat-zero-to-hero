# Practice items for inquiry/s116-sci-exam-toolkit (116 sprint, 自然 exam skills beyond the 必修 text:
# dimension checks nat:PEa-Va-1, ionic equations by atoms and charge nat:CJa-Vc-2 / nat:CJc-Vc-1,
# Lenz's law nat:PKc-Vc-3). All original.
# The chapter's worked settings: O2 from H2O2 on a balance (rate in g/min and mol/min), Cu + Ag+ (and a
# doubled answer), O2 + Fe2+ + H+, a magnet on a spring above a horizontal coil (N down; its height-time
# graph), two coaxial coils with the switch turned OFF, a dilution formula, Fe3+ + I-, a coil slid sideways
# from under a fixed S-down magnet, and a plate-speed formula named in one sentence.
# The quiz uses new ones: a seismic wave's wavelength, a rate per litre of solution, Al + H+, five other
# ionic equations, a coil lowered onto a fixed N-up magnet, and an electromagnet under a coil switched ON.
# Every key is recomputed by harness/checks/m_inquiry_s116_sci_exam_toolkit.py (verify:).
# Strings with TeX are single-quoted so YAML keeps backslashes.
chapter: inquiry/s116-sci-exam-toolkit
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [nat:PEa-Va-1]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_dimension_options
    text:
      zh-tw:
        stem: '要配製體積 $V$（單位L）、濃度 $C$（單位mol/L）的溶液，溶質的莫耳質量是 $M$（單位g/mol）。下面哪一個式子可能是需要的溶質質量 $m$（單位g）？'
        options: ['$m=\dfrac{CV}{M}$', '$m=CVM$', '$m=\dfrac{CM}{V}$', '$m=\dfrac{VM}{C}$', '$m=\dfrac{C}{VM}$']
        hint: '把每個式子的單位代進去約分，看看哪一個剩下g。'
        explain: '$CVM$ 的單位是 $\mathrm{\tfrac{mol}{L}\cdot L\cdot\tfrac{g}{mol}=g}$，只有它是公克。$\dfrac{CV}{M}$ 是 $\mathrm{mol^2/g}$，$\dfrac{CM}{V}$ 是 $\mathrm{g/L^2}$，$\dfrac{VM}{C}$ 是 $\mathrm{L^2\cdot g/mol^2}$，$\dfrac{C}{VM}$ 是 $\mathrm{mol^2/(L^2\cdot g)}$，都不是公克，一定錯。'
      en:
        stem: 'You are making a solution of volume $V$ (in L) and concentration $C$ (in mol/L), and the solute''s molar mass is $M$ (in g/mol). Which of these formulas could give the mass of solute needed, $m$ (in g)?'
        options: ['$m=\dfrac{CV}{M}$', '$m=CVM$', '$m=\dfrac{CM}{V}$', '$m=\dfrac{VM}{C}$', '$m=\dfrac{C}{VM}$']
        hint: 'Put the units into each formula and cancel: which one leaves g?'
        explain: 'The units of $CVM$ are $\mathrm{\tfrac{mol}{L}\cdot L\cdot\tfrac{g}{mol}=g}$, and it is the only one in grams. $\dfrac{CV}{M}$ is in $\mathrm{mol^2/g}$, $\dfrac{CM}{V}$ in $\mathrm{g/L^2}$, $\dfrac{VM}{C}$ in $\mathrm{L^2\cdot g/mol^2}$ and $\dfrac{C}{VM}$ in $\mathrm{mol^2/(L^2\cdot g)}$: none is in grams, so all four must be wrong.'
    answer: 1

  - id: q-lenz@1
    type: single
    origin: original
    codes: [nat:PKc-Vc-3]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_lenz_options
    text:
      zh-tw:
        stem: '一個水平的線圈平放在桌上，線圈正上方吊著一塊磁鐵，N極朝下。磁鐵正往下移動、靠近線圈。從上方往下看，線圈中的感應電流是順時針還是逆時針？'
        options: ['順時針', '逆時針', '沒有感應電流', '無法判斷']
        hint: '先問：線圈處的原磁場朝哪裡？正在增強還是減弱？'
        explain: 'N極朝下，線圈處的原磁場向下；磁鐵靠近，這個磁場增強。感應磁場反抗增強，所以向上，指向從上方看的人。右手大拇指朝自己，四指是逆時針。'
      en:
        stem: 'A horizontal coil lies flat on a table, and a magnet hangs directly above it, N pole down. The magnet is moving down, towards the coil. Looking down from above, is the induced current in the coil clockwise or anticlockwise?'
        options: ['Clockwise', 'Anticlockwise', 'There is no induced current', 'It cannot be decided']
        hint: 'Ask first: which way does the original field at the coil point, and is it getting stronger or weaker?'
        explain: 'With the N pole down, the original field at the coil points down; as the magnet approaches, this field gets stronger. The induced field opposes the strengthening, so it points up, towards someone looking from above. Right thumb towards you: the fingers curl anticlockwise.'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: [nat:PEa-Va-1]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_dimension_options
    text:
      zh-tw:
        stem: '某測站記錄到一列地震波，它的波速是 $v$（單位km/s）、頻率是 $f$（單位Hz）。不必背公式，只看單位，下列哪一個式子可能是這列波的波長 $\lambda$（單位km）？'
        options: ['$\lambda=\dfrac{v}{f}$', '$\lambda=\dfrac{f}{v}$', '$\lambda=vf$', '$\lambda=\dfrac{v^2}{f}$', '$\lambda=\dfrac{f^2}{v}$']
        hint: '$\mathrm{Hz}$ 就是 $\mathrm{s^{-1}}$。把每個式子的單位約分，看看哪一個剩下km。'
        explain: '$\dfrac{v}{f}$ 的單位是 $\dfrac{\mathrm{km/s}}{\mathrm{s^{-1}}}=\mathrm{km}$，可能對（這正是 $v=f\lambda$ 改寫的結果）。$\dfrac{f}{v}$ 是 $\mathrm{km^{-1}}$，$vf$ 是 $\mathrm{km/s^2}$，$\dfrac{v^2}{f}$ 是 $\mathrm{km^2/s}$，$\dfrac{f^2}{v}$ 是 $\mathrm{1/(km\cdot s)}$，都不是長度。'
      en:
        stem: 'A station records a seismic wave with speed $v$ (in km/s) and frequency $f$ (in Hz). Without recalling any formula, using only the units, which of these could be the wave''s wavelength $\lambda$ (in km)?'
        options: ['$\lambda=\dfrac{v}{f}$', '$\lambda=\dfrac{f}{v}$', '$\lambda=vf$', '$\lambda=\dfrac{v^2}{f}$', '$\lambda=\dfrac{f^2}{v}$']
        hint: '$\mathrm{Hz}$ is $\mathrm{s^{-1}}$. Cancel the units in each formula: which leaves km?'
        explain: 'The units of $\dfrac{v}{f}$ are $\dfrac{\mathrm{km/s}}{\mathrm{s^{-1}}}=\mathrm{km}$, so it could be right (it is $v=f\lambda$ rearranged). $\dfrac{f}{v}$ is in $\mathrm{km^{-1}}$, $vf$ in $\mathrm{km/s^2}$, $\dfrac{v^2}{f}$ in $\mathrm{km^2/s}$ and $\dfrac{f^2}{v}$ in $\mathrm{1/(km\cdot s)}$: none is a length.'
    answer: 0

  - id: q2@1
    type: single
    origin: original
    codes: [nat:PEa-Va-1]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_dimension_options
    text:
      zh-tw:
        stem: '某反應在體積 $V$（單位L）的溶液中進行，在 $\Delta t$（單位min）內生成 $\Delta n$（單位mol）的產物。若以每公升溶液、每分鐘生成的莫耳數表示平均速率 $r$（單位mol/(L·min)），下列哪一個式子可能正確？'
        options: ['$r=\dfrac{\Delta n}{V\,\Delta t}$', '$r=\dfrac{V\,\Delta n}{\Delta t}$', '$r=\dfrac{\Delta n\,\Delta t}{V}$', '$r=\dfrac{V}{\Delta n\,\Delta t}$', '$r=\dfrac{\Delta n}{V^2\,\Delta t}$']
        hint: '目標單位是 $\mathrm{mol/(L\cdot min)}$：mol在分子，L和min都在分母，而且各只有一次方。'
        explain: '$\dfrac{\Delta n}{V\,\Delta t}$ 的單位是 $\dfrac{\mathrm{mol}}{\mathrm{L\cdot min}}$，符合。其他依序是 $\mathrm{L\cdot mol/min}$、$\mathrm{mol\cdot min/L}$、$\mathrm{L/(mol\cdot min)}$、$\mathrm{mol/(L^2\cdot min)}$，都不符合。'
      en:
        stem: 'A reaction takes place in a solution of volume $V$ (in L), and in a time $\Delta t$ (in min) it forms $\Delta n$ (in mol) of product. If the average rate $r$ (in mol/(L·min)) is given as moles formed per litre of solution per minute, which formula could be right?'
        options: ['$r=\dfrac{\Delta n}{V\,\Delta t}$', '$r=\dfrac{V\,\Delta n}{\Delta t}$', '$r=\dfrac{\Delta n\,\Delta t}{V}$', '$r=\dfrac{V}{\Delta n\,\Delta t}$', '$r=\dfrac{\Delta n}{V^2\,\Delta t}$']
        hint: 'The target unit is $\mathrm{mol/(L\cdot min)}$: mol on top, L and min underneath, each to the first power.'
        explain: 'The units of $\dfrac{\Delta n}{V\,\Delta t}$ are $\dfrac{\mathrm{mol}}{\mathrm{L\cdot min}}$, which match. The others are, in order, $\mathrm{L\cdot mol/min}$, $\mathrm{mol\cdot min/L}$, $\mathrm{L/(mol\cdot min)}$ and $\mathrm{mol/(L^2\cdot min)}$: none matches.'
    answer: 0

  - id: q3@1
    type: fill
    origin: original
    codes: [nat:CJa-Vc-2, nat:CJc-Vc-1]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_fill_coefficient
    text:
      zh-tw:
        stem: '把離子反應式 $\ce{Al + H+ -> Al^3+ + H2}$ 配平成最簡整數係數時，$\ce{H+}$ 的係數是 ①。'
        hint: '設 $a\,\ce{Al}+c\,\ce{H+}\longrightarrow e\,\ce{Al^3+}+f\,\ce{H2}$，列出鋁、氫和電荷三條式子。'
        explain: '鋁：$a=e$；氫：$c=2f$；電荷：$c=3e$。令 $e=2$，得 $c=6$、$f=3$、$a=2$：$\ce{2Al + 6H+ -> 2Al^3+ + 3H2}$。檢查：兩邊都是 $+6$。所以 ① 劃 $6$。'
      en:
        stem: 'When the ionic equation $\ce{Al + H+ -> Al^3+ + H2}$ is balanced with the smallest whole-number coefficients, the coefficient of $\ce{H+}$ is ①.'
        hint: 'Write $a\,\ce{Al}+c\,\ce{H+}\longrightarrow e\,\ce{Al^3+}+f\,\ce{H2}$ and set up three equations: aluminium, hydrogen and charge.'
        explain: 'Aluminium: $a=e$. Hydrogen: $c=2f$. Charge: $c=3e$. Taking $e=2$ gives $c=6$, $f=3$ and $a=2$: $\ce{2Al + 6H+ -> 2Al^3+ + 3H2}$. Check: $+6$ on both sides. So ① is $6$.'
    answer: ['6']

  - id: q4@1
    type: multi
    origin: original
    codes: [nat:CJa-Vc-2, nat:CJc-Vc-1]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_balanced_options
    text:
      zh-tw:
        stem: '只看原子守恆與電荷守恆，下列哪些離子反應式已經配平？（多選）'
        options: ['$\begin{array}{l}\ce{Zn + Cu^2+}\\ \ce{-> Zn^2+ + Cu}\end{array}$', '$\begin{array}{l}\ce{Fe^2+ + Cl2}\\ \ce{-> Fe^3+ + 2Cl-}\end{array}$', '$\begin{array}{l}\ce{2Fe^2+ + Cl2}\\ \ce{-> 2Fe^3+ + 2Cl-}\end{array}$', '$\begin{array}{l}\ce{Sn^2+ + Fe^3+}\\ \ce{-> Sn^4+ + Fe^2+}\end{array}$', '$\begin{array}{l}\ce{Mg + 2H+}\\ \ce{-> Mg^2+ + H2}\end{array}$']
        hint: '每一條都數兩次：每種原子的個數，以及兩邊的總電荷。'
        explain: '(1) 原子各1對1，電荷 $+2$ 對 $+2$，平衡。(2) 原子平衡，但電荷左邊 $+2$、右邊 $+3-2=+1$，不平衡。(3) 電荷 $+4$ 對 $+6-2=+4$，原子也平衡。(4) 原子平衡，電荷 $+5$ 對 $+6$，不平衡（應為 $\ce{Sn^2+ + 2Fe^3+ -> Sn^4+ + 2Fe^2+}$）。(5) 原子平衡，電荷 $+2$ 對 $+2$，平衡。所以選 (1)(3)(5)。'
      en:
        stem: 'Looking only at conservation of atoms and of charge, which of these ionic equations are already balanced? (Choose all that apply.)'
        options: ['$\begin{array}{l}\ce{Zn + Cu^2+}\\ \ce{-> Zn^2+ + Cu}\end{array}$', '$\begin{array}{l}\ce{Fe^2+ + Cl2}\\ \ce{-> Fe^3+ + 2Cl-}\end{array}$', '$\begin{array}{l}\ce{2Fe^2+ + Cl2}\\ \ce{-> 2Fe^3+ + 2Cl-}\end{array}$', '$\begin{array}{l}\ce{Sn^2+ + Fe^3+}\\ \ce{-> Sn^4+ + Fe^2+}\end{array}$', '$\begin{array}{l}\ce{Mg + 2H+}\\ \ce{-> Mg^2+ + H2}\end{array}$']
        hint: 'Count each one twice: the atoms of each element, and the total charge on each side.'
        explain: '(1) Atoms 1 and 1 each, charge $+2$ and $+2$: balanced. (2) The atoms balance, but the charge is $+2$ on the left and $+3-2=+1$ on the right: not balanced. (3) Charge $+4$ and $+6-2=+4$, and the atoms balance too. (4) The atoms balance, but the charge is $+5$ against $+6$: not balanced (it should be $\ce{Sn^2+ + 2Fe^3+ -> Sn^4+ + 2Fe^2+}$). (5) The atoms balance, and the charge is $+2$ and $+2$: balanced. So the answer is (1)(3)(5).'
    answer: [0, 2, 4]

  - id: q5@1
    type: single
    origin: original
    codes: [nat:PKc-Vc-3]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_lenz_options
    text:
      zh-tw:
        stem: '一塊磁鐵固定在桌上，N極朝上。一個水平的線圈拿在磁鐵正上方，正往下移動、靠近磁鐵。從上方往下看，線圈中的感應電流是哪一種？'
        options: ['順時針', '逆時針', '沒有感應電流', '先順時針再逆時針', '無法判斷']
        hint: '這次動的是線圈，但只要相對位置在變，判斷方法一樣。先找出線圈處的原磁場朝哪裡，再看它在增強還是減弱。'
        explain: '磁力線從朝上的N極出來，所以線圈處的原磁場向上；線圈靠近磁鐵，這個磁場增強。感應磁場反抗增強，所以向下，背離從上方看的人。右手大拇指朝下、背離自己，四指是順時針。線圈一直在靠近，電流方向不會中途改變。'
      en:
        stem: 'A magnet is fixed on a table, N pole up. A horizontal coil is held directly above the magnet and is moving down, towards the magnet. Looking down from above, what is the induced current in the coil?'
        options: ['Clockwise', 'Anticlockwise', 'There is no induced current', 'Clockwise, then anticlockwise', 'It cannot be decided']
        hint: 'This time the coil moves, but as long as the distance between them is changing, the method is the same. First find which way the original field at the coil points, then whether it is getting stronger or weaker.'
        explain: 'Field lines leave the upward N pole, so the original field at the coil points up; as the coil approaches the magnet, this field gets stronger. The induced field opposes the strengthening, so it points down, away from someone looking from above. Right thumb pointing down, away from you: the fingers curl clockwise. The coil keeps approaching, so the direction does not change partway.'
    answer: 0

  - id: q6@1
    type: multi
    origin: original
    codes: [nat:PEa-Va-1, nat:CJa-Vc-2, nat:CJc-Vc-1, nat:PKc-Vc-3]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_tool_statements
    text:
      zh-tw:
        stem: '關於本章的三個工具，下列哪些敘述正確？（多選）'
        options: ['因次檢查通過的式子，仍可能少了一個沒有單位的數字，例如 $\tfrac{1}{2}$', '離子反應式只要每種原子的個數守恆，電荷就一定守恆', '依冷次定律，感應電流的磁場一定和原磁場方向相反', '等號兩邊因次不同的式子，一定是錯的', '線圈不動時，只要穿過它的磁場正在減弱，線圈中就會有感應電流']
        hint: '想一想每個工具能抓到什麼、抓不到什麼；冷次定律反抗的是磁場本身，還是磁場的變化？'
        explain: '(1) 正確：沒有單位的數字不影響單位，因次檢查抓不到。(2) 錯誤：$\ce{Cu + Ag+ -> Cu^2+ + Ag}$ 原子守恆，電荷卻是 $+1$ 對 $+2$。(3) 錯誤：反抗的是變化；磁場減弱時，感應磁場和原磁場同向。(4) 正確：等號兩邊因次必須相同，不同就一定錯。(5) 正確：只要穿過線圈的磁場在變化，就有感應電流，不一定要有東西在動，例如切斷旁邊線圈的電源。所以選 (1)(4)(5)。'
      en:
        stem: 'Which of these statements about the chapter''s three tools are correct? (Choose all that apply.)'
        options: ['A formula that passes a dimension check may still be missing a number with no unit, such as $\tfrac{1}{2}$', 'If an ionic equation conserves the atoms of each element, its charge is always conserved too', 'By Lenz''s law, the induced current''s field always points opposite to the original field', 'A formula whose two sides have different dimensions must be wrong', 'Even when a coil does not move, there is an induced current in it whenever the field through it is getting weaker']
        hint: 'Think about what each tool can and cannot catch. Does Lenz''s law oppose the field itself, or the change in the field?'
        explain: '(1) Correct: a number with no unit does not affect the units, so a dimension check cannot catch it. (2) Wrong: $\ce{Cu + Ag+ -> Cu^2+ + Ag}$ conserves atoms, but its charge is $+1$ against $+2$. (3) Wrong: it opposes the change; when the field gets weaker, the induced field points the same way as the original. (4) Correct: both sides of an equation must have the same dimensions, so different ones mean it is wrong. (5) Correct: whenever the field through a coil is changing there is an induced current, even if nothing moves, for example when the current in a neighbouring coil is switched off. So the answer is (1)(4)(5).'
    answer: [0, 3, 4]

  - id: q7@1
    type: mixed
    origin: original
    codes: [nat:PKc-Vc-3]
    verify: m_inquiry_s116_sci_exam_toolkit:tk_mixed_lenz
    text:
      zh-tw:
        stem: '一個水平的線圈平放在桌上，桌面下方正對線圈放著一個電磁鐵。電磁鐵通電時，它在線圈處的磁場向上。電磁鐵的電源原本是切斷的；把開關接通的瞬間，從上方往下看，線圈中的感應電流是順時針還是逆時針？說明理由。（非選擇題，4分，須寫出推理）'
        explain: '評分看的是推理，不只是結論：要寫出原磁場的方向和它怎麼變（沒有東西在動，但開關接通時磁場從無到有），感應磁場如何反抗這個變化，再由右手握法得出電流方向。只寫「由冷次定律，順時針」看不出推理。'
      en:
        stem: 'A horizontal coil lies flat on a table, with an electromagnet under the table directly beneath it. When the electromagnet carries a current, its field at the coil points up. Its power is off at first; at the instant the switch is turned on, looking down from above, is the induced current in the coil clockwise or anticlockwise? Explain your reasoning. (Written item, 4 points: show your reasoning.)'
        explain: 'The marks are for the reasoning, not just the conclusion: state which way the original field points and how it is changing (nothing moves, but at switch-on the field grows from nothing), how the induced field opposes that change, and then the current''s direction from the right-hand grip rule. "By Lenz''s law, clockwise" alone shows no reasoning.'
    rubric:
      criteria:
        - id: field
          points: 1
          text:
            zh-tw: '寫出線圈處的原磁場向上，而且開關接通時，這個磁場從無到有、正在增強（沒有東西在動也一樣）。'
            en: 'States that the original field at the coil points up and, at switch-on, grows from nothing, so it is getting stronger (even though nothing moves).'
        - id: oppose
          points: 1
          text:
            zh-tw: '依冷次定律，寫出感應電流的磁場反抗增強，所以在線圈內向下。'
            en: 'Using Lenz''s law, states that the induced current''s field opposes the strengthening, so it points down inside the coil.'
        - id: hand
          points: 1
          text:
            zh-tw: '用右手握法，由向下的感應磁場推出電流的繞行方向。'
            en: 'Uses the right-hand grip rule to go from the downward induced field to the direction the current circulates.'
        - id: answer
          points: 1
          text:
            zh-tw: '結論：從上方看是順時針。'
            en: 'Concludes: clockwise, seen from above.'
    model:
      zh-tw: '開關接通的瞬間，電磁鐵在線圈處的磁場向上，從零開始增強；雖然沒有東西在動，穿過線圈的磁場仍在變化。依冷次定律，感應電流的磁場要反抗增強，所以在線圈內向下。右手大拇指指向下方，背離從上方看的人，四指沿順時針方向彎曲。所以從上方看，感應電流是順時針。'
      en: 'At the instant the switch is turned on, the electromagnet''s field at the coil points up and grows from zero; nothing moves, but the field through the coil is changing. By Lenz''s law, the induced current''s field opposes the strengthening, so it points down inside the coil. With the right thumb pointing down, away from someone looking from above, the fingers curl clockwise. So, seen from above, the induced current is clockwise.'

items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_turn_below_axis
    text:
      zh-tw:
        stem: '$y=(x-1)(x-4)$ 的圖形是開口向上的拋物線，和 $x$ 軸交於 $x=1$ 與 $x=4$。哪些 $x$ 使 $y<0$？'
        options: ['$x<1$', '$1<x<4$', '$x>4$', '$x<1$ 或 $x>4$', '$x=1$ 或 $x=4$']
        hint: '$y<0$ 就是圖形在 $x$ 軸下方。開口向上的拋物線，哪一段在 $x$ 軸下方？'
        explain: '開口向上的拋物線只有在兩個交點之間會落到 $x$ 軸下方，所以 $y<0 \iff 1<x<4$。例如 $x=2$ 時 $y=(1)(-2)=-2<0$；$x=1$ 或 $x=4$ 時 $y=0$，不算小於 $0$。'
      en:
        stem: 'The graph of $y=(x-1)(x-4)$ is a parabola opening upward that meets the $x$-axis at $x=1$ and $x=4$. For which $x$ is $y<0$?'
        options: ['$x<1$', '$1<x<4$', '$x>4$', '$x<1$ or $x>4$', '$x=1$ or $x=4$']
        hint: '$y<0$ means the graph is below the $x$-axis. Which part of an upward parabola is below the axis?'
        explain: 'An upward parabola dips below the $x$-axis only between its two crossing points, so $y<0 \iff 1<x<4$. For example, at $x=2$, $y=(1)(-2)=-2<0$; at $x=1$ or $x=4$, $y=0$, which is not less than $0$.'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_quadratic_lt
    text:
      zh-tw:
        stem: '不等式 $x^2-x-12<0$ 的解為何？'
        options: ['$-3<x<4$', '$-4<x<3$', '$x<-3$ 或 $x>4$', '$x<-4$ 或 $x>3$', '$x>4$']
        hint: '先因式分解，找出兩個根，再想開口向上的拋物線哪一段在 $x$ 軸下方。'
        explain: '$x^2-x-12=(x+3)(x-4)$，兩根是 $-3$ 和 $4$。首項係數為正，「小於 $0$」取兩根之間：$-3<x<4$。選項 (2) 是把根的正負號弄反了。'
      en:
        stem: 'What is the solution of $x^2-x-12<0$?'
        options: ['$-3<x<4$', '$-4<x<3$', '$x<-3$ or $x>4$', '$x<-4$ or $x>3$', '$x>4$']
        hint: 'Factor first to find the two roots, then ask which part of an upward parabola is below the $x$-axis.'
        explain: '$x^2-x-12=(x+3)(x-4)$, with roots $-3$ and $4$. The leading coefficient is positive, so "less than $0$" means between the roots: $-3<x<4$. Option (2) has the signs of the roots flipped.'
    answer: 0

  - id: q2@1
    type: fill
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_integers_quadratic_le
    text:
      zh-tw:
        stem: '滿足 $3x^2-10x-8\le 0$ 的整數 $x$ 共有 ① 個。'
        hint: '$3x^2-10x-8$ 可以分解成 $(3x+2)(x-4)$。'
        explain: '$3x^2-10x-8=(3x+2)(x-4)\le 0$，兩根是 $-\frac{2}{3}$ 和 $4$，所以 $-\frac{2}{3}\le x\le 4$。其中的整數是 $0,1,2,3,4$，共 $5$ 個。$-1$ 不在範圍內，因為 $-1<-\frac{2}{3}$。'
      en:
        stem: 'The number of integers $x$ with $3x^2-10x-8\le 0$ is ①.'
        hint: '$3x^2-10x-8$ factors as $(3x+2)(x-4)$.'
        explain: '$3x^2-10x-8=(3x+2)(x-4)\le 0$ has roots $-\frac{2}{3}$ and $4$, so $-\frac{2}{3}\le x\le 4$. The integers in that range are $0,1,2,3,4$: $5$ of them. $-1$ is left out because $-1<-\frac{2}{3}$.'
    answer: ['5']

  - id: q3@1
    type: single
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_perfect_square_ge
    text:
      zh-tw:
        stem: '不等式 $-x^2+6x-9\ge 0$ 的解為何？'
        options: ['所有實數', '只有 $x=3$', '沒有實數解', '$x\ne 3$ 的所有實數', '$x\ge 3$']
        hint: '先兩邊同乘以 $-1$ 讓首項係數變正，記得不等號要反向。'
        explain: '同乘以 $-1$ 得 $x^2-6x+9\le 0$，也就是 $(x-3)^2\le 0$。平方數不會是負的，所以只能 $(x-3)^2=0$，解是 $x=3$。'
      en:
        stem: 'What is the solution of $-x^2+6x-9\ge 0$?'
        options: ['every real number', 'only $x=3$', 'no real solution', 'every real number except $3$', '$x\ge 3$']
        hint: 'Multiply both sides by $-1$ to make the leading coefficient positive, and remember to flip the inequality.'
        explain: 'Multiplying by $-1$ gives $x^2-6x+9\le 0$, that is $(x-3)^2\le 0$. A square is never negative, so it must be $(x-3)^2=0$, and the solution is $x=3$.'
    answer: 1

  - id: q4@1
    type: multi
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_always_true
    text:
      zh-tw:
        stem: '下列哪些不等式對所有實數 $x$ 都成立？（多選）'
        options: ['$x^2+x+1>0$', '$x^2-4x+4>0$', '$x^2-4x+4\ge 0$', '$-x^2+2x-3<0$', '$x^2+3x-1>0$']
        hint: '首項係數為正時，看判別式：$D<0$ 圖形整個在 $x$ 軸上方；$D=0$ 圖形碰到 $x$ 軸一點。'
        explain: '(1) $D=1-4<0$，恆正，成立。(2) $x^2-4x+4=(x-2)^2$，$x=2$ 時等於 $0$，不大於 $0$，不成立。(3) $(x-2)^2\ge 0$ 恆成立。(4) 同乘以 $-1$ 得 $x^2-2x+3>0$，$D=4-12<0$，成立。(5) $D=9+4>0$，在兩根之間是負的，不成立。所以選 (1)(3)(4)。'
      en:
        stem: 'Which of these inequalities hold for every real $x$? (Choose all that apply.)'
        options: ['$x^2+x+1>0$', '$x^2-4x+4>0$', '$x^2-4x+4\ge 0$', '$-x^2+2x-3<0$', '$x^2+3x-1>0$']
        hint: 'With a positive leading coefficient, look at the discriminant: $D<0$ puts the whole graph above the $x$-axis; $D=0$ means it touches the axis at one point.'
        explain: '(1) $D=1-4<0$, always positive: true. (2) $x^2-4x+4=(x-2)^2$ equals $0$ at $x=2$, which is not greater than $0$: false. (3) $(x-2)^2\ge 0$ always: true. (4) Multiplying by $-1$ gives $x^2-2x+3>0$ with $D=4-12<0$: true. (5) $D=9+4>0$, so it is negative between its roots: false. The answer is (1)(3)(4).'
    answer: [0, 2, 3]

  - id: q5@1
    type: fill
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_parameter_always_positive
    text:
      zh-tw:
        stem: '若不等式 $x^2-2kx+k+6>0$ 對所有實數 $x$ 都成立，則符合條件的整數 $k$ 共有 ① 個。'
        hint: '首項係數是 $1>0$，恆正的條件是判別式小於 $0$。'
        explain: '判別式 $D=(-2k)^2-4(k+6)=4k^2-4k-24<0$，即 $k^2-k-6<0$，$(k+2)(k-3)<0$，所以 $-2<k<3$。整數 $k$ 為 $-1,0,1,2$，共 $4$ 個。'
      en:
        stem: 'If $x^2-2kx+k+6>0$ holds for every real $x$, the number of integers $k$ that work is ①.'
        hint: 'The leading coefficient is $1>0$, so "always positive" means the discriminant is less than $0$.'
        explain: 'The discriminant is $D=(-2k)^2-4(k+6)=4k^2-4k-24<0$, so $k^2-k-6<0$, $(k+2)(k-3)<0$ and $-2<k<3$. The integers are $k=-1,0,1,2$: $4$ of them.'
    answer: ['4']

  - id: q6@1
    type: single
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_cubic_factored_lt
    text:
      zh-tw:
        stem: '不等式 $(x+1)(x-2)(x-5)<0$ 的解為何？'
        options: ['$x<-1$ 或 $2<x<5$', '$-1<x<2$ 或 $x>5$', '$-1<x<5$', '$x<-1$ 或 $x>5$', '$2<x<5$']
        hint: '在數線上標出 $-1$、$2$、$5$。最右邊一段的符號由最高次項決定，然後每過一個根變一次號。'
        explain: '三個根 $-1<2<5$ 把數線分成四段。$x>5$ 時三個因式都是正的，乘積為正；往左每過一個根變一次號：$2<x<5$ 為負、$-1<x<2$ 為正、$x<-1$ 為負。所以解是 $x<-1$ 或 $2<x<5$。可以用 $x=0$ 檢查：$(1)(-2)(-5)=10>0$，$0$ 不在解裡，正確。'
      en:
        stem: 'What is the solution of $(x+1)(x-2)(x-5)<0$?'
        options: ['$x<-1$ or $2<x<5$', '$-1<x<2$ or $x>5$', '$-1<x<5$', '$x<-1$ or $x>5$', '$2<x<5$']
        hint: 'Mark $-1$, $2$ and $5$ on a number line. The sign on the far right comes from the leading term, and it changes each time you pass a root.'
        explain: 'The roots $-1<2<5$ cut the number line into four pieces. For $x>5$ all three factors are positive, so the product is positive; moving left, the sign changes at each root: negative on $2<x<5$, positive on $-1<x<2$, negative on $x<-1$. So the solution is $x<-1$ or $2<x<5$. Check with $x=0$: $(1)(-2)(-5)=10>0$, so $0$ is not a solution, as expected.'
    answer: 0

  - id: q7@1
    type: fill
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_integers_double_root_lt
    text:
      zh-tw:
        stem: '滿足 $(x-2)^2(x+1)(x-4)<0$ 的整數 $x$ 共有 ① 個。'
        hint: '$(x-2)^2$ 除了 $x=2$ 以外都是正的。它在 $x=2$ 時等於多少？'
        explain: '$(x-2)^2\ge 0$，等號只在 $x=2$ 成立。所以乘積小於 $0$，要 $(x+1)(x-4)<0$ 而且 $x\ne 2$，也就是 $-1<x<4$ 且 $x\ne 2$。整數有 $0,1,3$，共 $3$ 個。$x=2$ 代入得 $0$，不小於 $0$，要排除。'
      en:
        stem: 'The number of integers $x$ with $(x-2)^2(x+1)(x-4)<0$ is ①.'
        hint: '$(x-2)^2$ is positive except at $x=2$. What is it at $x=2$?'
        explain: '$(x-2)^2\ge 0$, with equality only at $x=2$. So the product is negative exactly when $(x+1)(x-4)<0$ and $x\ne 2$, that is $-1<x<4$ with $x\ne 2$. The integers are $0,1,3$: $3$ of them. At $x=2$ the product is $0$, which is not less than $0$, so $2$ is left out.'
    answer: ['3']

  - id: q8@1
    type: single
    origin: original
    codes: [math:F-10-3]
    verify: m_s116_polynomial_inequalities:pi_negative_factor_interval
    text:
      zh-tw:
        stem: '不等式 $(3-x)(x+2)\ge 0$ 的解，用區間表示為何？'
        options: ['$[-2,3]$', '$(-2,3)$', '$(-\infty,-2]\cup[3,\infty)$', '$[-3,2]$', '$(-\infty,-2)\cup(3,\infty)$']
        hint: '把 $(3-x)$ 寫成 $-(x-3)$，兩邊同乘以 $-1$ 時不等號要反向。'
        explain: '$(3-x)(x+2)=-(x-3)(x+2)\ge 0 \iff (x-3)(x+2)\le 0 \iff -2\le x\le 3$。有等號，兩端點都包含，寫成 $[-2,3]$。若忘了變號，就會誤選 (3)。'
      en:
        stem: 'In interval notation, what is the solution of $(3-x)(x+2)\ge 0$?'
        options: ['$[-2,3]$', '$(-2,3)$', '$(-\infty,-2]\cup[3,\infty)$', '$[-3,2]$', '$(-\infty,-2)\cup(3,\infty)$']
        hint: 'Write $(3-x)$ as $-(x-3)$; multiplying both sides by $-1$ flips the inequality.'
        explain: '$(3-x)(x+2)=-(x-3)(x+2)\ge 0 \iff (x-3)(x+2)\le 0 \iff -2\le x\le 3$. The inequality includes equality, so both endpoints are in: $[-2,3]$. Forgetting to flip leads to option (3).'
    answer: 0

  - id: q-turn@1
    type: single
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3]
    verify: m_x_derivative_slope:ds_turn_secant
    text:
      zh-tw:
        stem: '$y=x^2$ 的圖形上有兩點 $A(1,1)$ 與 $B(1+t,(1+t)^2)$，其中 $t\ne 0$。直線 $AB$ 的斜率是？'
        options: ['$t$', '$2+t$', '$2$', '$1+2t$', '$(1+t)^2$']
        hint: '斜率是「$y$ 的變化量除以 $x$ 的變化量」，分子展開後可以約掉 $t$。'
        explain: '斜率 $=\dfrac{(1+t)^2-1}{(1+t)-1}=\dfrac{2t+t^2}{t}=2+t$（$t\ne 0$，所以可以約分）。注意它和 $t$ 有關，不是固定的 $2$；只有在 $t$ 越來越接近 $0$ 時，它才越來越接近 $2$。'
      en:
        stem: 'The points $A(1,1)$ and $B(1+t,(1+t)^2)$ lie on the graph of $y=x^2$, where $t\ne 0$. What is the slope of the line $AB$?'
        options: ['$t$', '$2+t$', '$2$', '$1+2t$', '$(1+t)^2$']
        hint: 'Slope is the change in $y$ divided by the change in $x$; after expanding the numerator you can cancel $t$.'
        explain: 'Slope $=\dfrac{(1+t)^2-1}{(1+t)-1}=\dfrac{2t+t^2}{t}=2+t$ (since $t\ne 0$ we may cancel). Notice that it depends on $t$; it is not a fixed $2$. Only as $t$ gets closer and closer to $0$ does it get closer and closer to $2$.'
    answer: 1

  - id: q1@1

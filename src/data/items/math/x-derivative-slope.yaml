    verify: m_x_derivative_slope:ds_derivative_fill
    text:
      zh-tw:
        stem: '設 $f(x)=2x^3-5x^2+x-4$，則 $f''(-1)=$ ①②。'
        hint: '先用 $(x^n)''=nx^{n-1}$ 逐項求出 $f''(x)$，再代 $x=-1$。'
        explain: '$f''(x)=6x^2-10x+1$，所以 $f''(-1)=6+10+1=17$。'
      en:
        stem: 'Let $f(x)=2x^3-5x^2+x-4$. Then $f''(-1)=$ ①②.'
        hint: 'Use $(x^n)''=nx^{n-1}$ term by term to get $f''(x)$, then put $x=-1$.'
        explain: '$f''(x)=6x^2-10x+1$, so $f''(-1)=6+10+1=17$.'
    answer: ['1', '7']

  - id: q2@1
    type: single
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3]
    verify: m_x_derivative_slope:ds_limit_value
    text:
      zh-tw:
        stem: '當 $h$ 越來越接近 $0$（$h\ne 0$）時，$\dfrac{(2+h)^3-8}{h}$ 越來越接近哪一個值？'
        options: ['$0$', '$4$', '$8$', '$12$', '不會接近任何定值']
        hint: '先展開 $(2+h)^3$，約掉 $h$ 之後再看。'
        explain: '$(2+h)^3-8=12h+6h^2+h^3$，除以 $h$ 得 $12+6h+h^2$。$h$ 越接近 $0$，它越接近 $12$。這正是 $y=x^3$ 在 $x=2$ 的導數：$3\cdot 2^2=12$。直接代 $h=0$ 會得到 $\frac{0}{0}$，沒有意義，所以要先化簡。'
      en:
        stem: 'As $h$ gets closer and closer to $0$ ($h\ne 0$), which value does $\dfrac{(2+h)^3-8}{h}$ get closer and closer to?'
        options: ['$0$', '$4$', '$8$', '$12$', 'it does not approach any fixed value']
        hint: 'Expand $(2+h)^3$ first, cancel $h$, then look.'
        explain: '$(2+h)^3-8=12h+6h^2+h^3$; dividing by $h$ gives $12+6h+h^2$, which gets closer and closer to $12$ as $h$ approaches $0$. This is the derivative of $y=x^3$ at $x=2$: $3\cdot 2^2=12$. Putting $h=0$ straight in gives $\frac{0}{0}$, which means nothing, so simplify first.'
    answer: 3

  - id: q3@1
    type: fill
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3, math:G-10-2]
    verify: m_x_derivative_slope:ds_tangent_fill
    text:
      zh-tw:
        stem: '$y=x^3-4x+3$ 的圖形在 $x=2$ 的切線為 $y=mx+b$，則 $m=$ ①，$b=$ ②③④。'
        hint: '切點是 $(2,f(2))$，斜率是 $f''(2)$，再用點斜式。'
        explain: '$f(2)=8-8+3=3$，$f''(x)=3x^2-4$，$f''(2)=8$。切線 $y-3=8(x-2)$，即 $y=8x-13$。所以 $m=8$、$b=-13$。'
      en:
        stem: 'The tangent to the graph of $y=x^3-4x+3$ at $x=2$ is $y=mx+b$. Then $m=$ ① and $b=$ ②③④.'
        hint: 'The point of tangency is $(2,f(2))$ and the slope is $f''(2)$; then use point–slope form.'
        explain: '$f(2)=8-8+3=3$, $f''(x)=3x^2-4$ and $f''(2)=8$. The tangent is $y-3=8(x-2)$, that is $y=8x-13$. So $m=8$ and $b=-13$.'
    answer: ['8', '−', '1', '3']

  - id: q4@1
    type: multi
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3, math:A-10-2]
    verify: m_x_derivative_slope:ds_statements
    text:
      zh-tw:
        stem: '設 $f(x)=x^3-3x^2+4$。下列哪些敘述正確？（多選）'
        options: ['$f''(x)=3x^2-6x$', '$(x-2)^2$ 是 $f(x)$ 的因式', '$y=f(x)$ 的圖形在 $x=0$ 的切線是水平線', '$y=f(x)$ 的圖形在 $x=1$ 的切線斜率是 $-2$', '$(x+1)^2$ 是 $f(x)$ 的因式']
        hint: '$(x-a)^2$ 是因式，恰好是 $f(a)=0$ 且 $f''(a)=0$。'
        explain: '$f''(x)=3x^2-6x$，(1) 正確。$f(2)=8-12+4=0$、$f''(2)=12-12=0$，所以 $(x-2)^2$ 是因式，(2) 正確；事實上 $f(x)=(x-2)^2(x+1)$。$f''(0)=0$，切線斜率是 $0$，(3) 正確。$f''(1)=3-6=-3$，(4) 錯。$f(-1)=0$ 但 $f''(-1)=3+6=9\ne 0$，所以 $x+1$ 是因式、$(x+1)^2$ 不是，(5) 錯。'
      en:
        stem: 'Let $f(x)=x^3-3x^2+4$. Which statements are true? (Choose all that apply.)'
        options: ['$f''(x)=3x^2-6x$', '$(x-2)^2$ is a factor of $f(x)$', 'the tangent to the graph of $y=f(x)$ at $x=0$ is horizontal', 'the tangent to the graph of $y=f(x)$ at $x=1$ has slope $-2$', '$(x+1)^2$ is a factor of $f(x)$']
        hint: '$(x-a)^2$ is a factor exactly when $f(a)=0$ and $f''(a)=0$.'
        explain: '$f''(x)=3x^2-6x$, so (1) is true. $f(2)=8-12+4=0$ and $f''(2)=12-12=0$, so $(x-2)^2$ is a factor and (2) is true; in fact $f(x)=(x-2)^2(x+1)$. $f''(0)=0$, so the tangent has slope $0$ and (3) is true. $f''(1)=3-6=-3$, so (4) is false. $f(-1)=0$ but $f''(-1)=3+6=9\ne 0$, so $x+1$ is a factor but $(x+1)^2$ is not, and (5) is false.'
    answer: [0, 1, 2]

  - id: q5@1
    type: fill
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3, math:A-10-2]
    verify: m_x_derivative_slope:ds_double_root_fill
    text:
      zh-tw:
        stem: '若 $(x+2)^2$ 是 $x^3+ax+b$ 的因式，則 $a=$ ①②③，$b=$ ④⑤⑥。'
        hint: '令 $f(x)=x^3+ax+b$，用 $f(-2)=0$ 與 $f''(-2)=0$ 列兩個方程式。也可以用 $x+2$ 連續做兩次綜合除法，要求兩個餘式都是 $0$。'
        explain: '$f''(x)=3x^2+a$，$f''(-2)=12+a=0$，得 $a=-12$。$f(-2)=-8-2a+b=-8+24+b=0$，得 $b=-16$。檢查：$x^3-12x-16=(x+2)^2(x-4)$。'
      en:
        stem: 'If $(x+2)^2$ is a factor of $x^3+ax+b$, then $a=$ ①②③ and $b=$ ④⑤⑥.'
        hint: 'Let $f(x)=x^3+ax+b$ and write down the two equations $f(-2)=0$ and $f''(-2)=0$. Or divide by $x+2$ twice with synthetic division and require both remainders to be $0$.'
        explain: '$f''(x)=3x^2+a$, so $f''(-2)=12+a=0$ gives $a=-12$. Then $f(-2)=-8-2a+b=-8+24+b=0$ gives $b=-16$. Check: $x^3-12x-16=(x+2)^2(x-4)$.'
    answer: ['−', '1', '2', '−', '1', '6']

  - id: q6@1
    type: single
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3, math:F-10-2]
    verify: m_x_derivative_slope:ds_other_intersection
    text:
      zh-tw:
        stem: '$y=x^3+x^2$ 的圖形在 $x=1$ 的切線，和這個圖形還有另一個交點。這個交點的 $x$ 坐標是？'
        options: ['$1$', '$-1$', '$-3$', '$3$', '$-2$']
        hint: '先求切線，再把「曲線減切線」因式分解：切點 $x=1$ 是重根。'
        explain: '$f(1)=2$，$f''(x)=3x^2+2x$，$f''(1)=5$，切線 $y=5x-3$。$x^3+x^2-(5x-3)=x^3+x^2-5x+3=(x-1)^2(x+3)$，所以另一個交點的 $x$ 坐標是 $-3$。也可以比較係數：設 $x^3+x^2-5x+3=(x-1)^2(x-s)$，右邊 $x^2$ 項係數 $-(2+s)$ 等於 $1$，得 $s=-3$。'
      en:
        stem: 'The tangent to the graph of $y=x^3+x^2$ at $x=1$ meets the graph at one other point. What is its $x$-coordinate?'
        options: ['$1$', '$-1$', '$-3$', '$3$', '$-2$']
        hint: 'Find the tangent, then factor "curve minus tangent": the point of tangency $x=1$ is a double root.'
        explain: '$f(1)=2$, $f''(x)=3x^2+2x$ and $f''(1)=5$, so the tangent is $y=5x-3$. Then $x^3+x^2-(5x-3)=x^3+x^2-5x+3=(x-1)^2(x+3)$, so the other point has $x$-coordinate $-3$. Or compare coefficients: let $x^3+x^2-5x+3=(x-1)^2(x-s)$; the coefficient of $x^2$ on the right, $-(2+s)$, equals $1$, so $s=-3$.'
    answer: 2

  - id: q7@1
    type: single
    origin: original
    codes: [math:F-12jia-3, math:F-12yi-3, math:F-10-1]
    verify: m_x_derivative_slope:ds_parallel_tangent
    text:
      zh-tw:
        stem: '$y=x^2+2x-1$ 的圖形有一條切線和直線 $y=4x+7$ 平行。這條切線是 $y=4x+c$，則 $c=$？'
        options: ['$-3$', '$-2$', '$0$', '$2$', '$7$']
        hint: '用導數：斜率 $f''(x)=4$ 解出切點。或用判別式：$x^2+2x-1=4x+c$ 只有一個解。'
        explain: '導數：$f''(x)=2x+2=4$，$x=1$，切點 $(1,2)$，切線 $y-2=4(x-1)$，即 $y=4x-2$。判別式：$x^2-2x-1-c=0$ 只有一個解，$4+4(1+c)=0$，$c=-2$。兩種做法一致，$c=-2$。'
      en:
        stem: 'One tangent to the graph of $y=x^2+2x-1$ is parallel to the line $y=4x+7$. If this tangent is $y=4x+c$, what is $c$?'
        options: ['$-3$', '$-2$', '$0$', '$2$', '$7$']
        hint: 'With the derivative: solve $f''(x)=4$ for the point of tangency. With the discriminant: $x^2+2x-1=4x+c$ has exactly one solution.'
        explain: 'Derivative: $f''(x)=2x+2=4$ gives $x=1$, so the point of tangency is $(1,2)$ and the tangent is $y-2=4(x-1)$, that is $y=4x-2$. Discriminant: $x^2-2x-1-c=0$ has exactly one solution, so $4+4(1+c)=0$ and $c=-2$. Both ways agree: $c=-2$.'
    answer: 1

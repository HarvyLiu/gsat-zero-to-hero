    text:
      zh-tw:
        stem: '（承第18題）若長期下來兩店的住戶比例穩定為 $X=\begin{bmatrix}x\\y\end{bmatrix}$，也就是 $TX=X$，且 $x+y=1$。求 $x$、$y$。（非選擇題，6分，須寫出計算過程）'
        explain: '把 $TX=X$ 展開成方程組，會發現兩條方程式其實是同一條，所以一定要再用 $x+y=1$ 才能解出唯一的比例。'
      en:
        stem: '(Continuing item 18.) Suppose that in the long run the proportions settle at $X=\begin{bmatrix}x\\y\end{bmatrix}$, that is $TX=X$, with $x+y=1$. Find $x$ and $y$. (Written item, 6 points: show your working.)'
        explain: 'Expanding $TX=X$ gives a system whose two equations are really the same one, so you must also use $x+y=1$ to pin down a single pair of proportions.'
    rubric:
      criteria:
        - id: equations
          points: 2
          text:
            zh-tw: '由 $TX=X$ 寫出 $0.9x+0.2y=x$、$0.1x+0.8y=y$（至少一式），並列出 $x+y=1$。'
            en: 'From $TX=X$ writes $0.9x+0.2y=x$ and $0.1x+0.8y=y$ (at least one), together with $x+y=1$.'
        - id: reduce
          points: 2
          text:
            zh-tw: '化簡得 $0.1x=0.2y$，即 $x=2y$。'
            en: 'Simplifies to $0.1x=0.2y$, that is $x=2y$.'
        - id: solve
          points: 2
          text:
            zh-tw: '解出 $x=\dfrac{2}{3}$、$y=\dfrac{1}{3}$。'
            en: 'Solves to get $x=\dfrac{2}{3}$ and $y=\dfrac{1}{3}$.'
    model:
      zh-tw: '$TX=X$ 即 $\begin{cases}0.9x+0.2y=x\\0.1x+0.8y=y\end{cases}$，兩式都化成 $0.1x=0.2y$，也就是 $x=2y$。再由 $x+y=1$ 得 $2y+y=1$，$y=\dfrac{1}{3}$，$x=\dfrac{2}{3}$。所以長期下來約有 $\dfrac{2}{3}$ 的住戶在甲店、$\dfrac{1}{3}$ 在乙店。（驗算：$0.9\times\frac{2}{3}+0.2\times\frac{1}{3}=\frac{1.8+0.2}{3}=\frac{2}{3}$。）'
      en: '$TX=X$ means $\begin{cases}0.9x+0.2y=x\\0.1x+0.8y=y\end{cases}$; both equations reduce to $0.1x=0.2y$, that is $x=2y$. With $x+y=1$ this gives $2y+y=1$, so $y=\dfrac{1}{3}$ and $x=\dfrac{2}{3}$. In the long run about $\dfrac{2}{3}$ of households buy at A and $\dfrac{1}{3}$ at B. (Check: $0.9\times\frac{2}{3}+0.2\times\frac{1}{3}=\frac{1.8+0.2}{3}=\frac{2}{3}$.)'

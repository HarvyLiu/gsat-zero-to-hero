  # ---------- 單選 1–6 ----------
  - id: q1@1
    type: single
    origin: original
    codes: [math:N-10-4, math:N-10-3]
    verify: m_s116_mock_a:ma_digits_3_pow_40
    text:
      zh-tw:
        stem: '已知 $\log 3\approx 0.4771$。$3^{40}$ 是幾位數？'
        options: ['$18$', '$19$', '$20$', '$21$', '$40$']
        hint: '$\log 3^{40}=40\log 3$。一個正整數 $N$ 若滿足 $10^{k}\le N<10^{k+1}$，它就是 $k+1$ 位數。'
        explain: '$\log 3^{40}=40\log 3\approx 40\times 0.4771=19.084$，所以 $10^{19}<3^{40}<10^{20}$，$3^{40}$ 是 $20$ 位數。常見的錯誤是把整數部分 $19$ 直接當成位數。'
      en:
        stem: 'Given $\log 3\approx 0.4771$, how many digits does $3^{40}$ have?'
        options: ['$18$', '$19$', '$20$', '$21$', '$40$']
        hint: '$\log 3^{40}=40\log 3$. A positive integer $N$ with $10^{k}\le N<10^{k+1}$ has $k+1$ digits.'
        explain: '$\log 3^{40}=40\log 3\approx 40\times 0.4771=19.084$, so $10^{19}<3^{40}<10^{20}$ and $3^{40}$ has $20$ digits. A common slip is to take the integer part $19$ as the number of digits.'
    answer: 2

  - id: q2@1
    type: single
    origin: original
    codes: [math:G-10-7, math:G-10-6]
    verify: m_s116_mock_a:ma_triangle_area
    text:
      zh-tw:
        stem: '$\triangle ABC$ 中，$\overline{AB}=3$、$\overline{AC}=8$、$\overline{BC}=7$。$\triangle ABC$ 的面積是多少？'
        options: ['$12$', '$6\sqrt{3}$', '$12\sqrt{3}$', '$24$', '$3\sqrt{3}$']
        hint: '先用餘弦定理求 $\cos A$，再用 $\frac{1}{2}\overline{AB}\cdot\overline{AC}\sin A$。'
        explain: '$\cos A=\dfrac{3^2+8^2-7^2}{2\times 3\times 8}=\dfrac{24}{48}=\dfrac{1}{2}$，所以 $A=60^\circ$，$\sin A=\dfrac{\sqrt{3}}{2}$。面積 $=\dfrac{1}{2}\times 3\times 8\times\dfrac{\sqrt{3}}{2}=6\sqrt{3}$。(3) 是忘了乘 $\frac{1}{2}$。'
      en:
        stem: 'In $\triangle ABC$, $\overline{AB}=3$, $\overline{AC}=8$ and $\overline{BC}=7$. What is the area of $\triangle ABC$?'
        options: ['$12$', '$6\sqrt{3}$', '$12\sqrt{3}$', '$24$', '$3\sqrt{3}$']
        hint: 'Find $\cos A$ with the law of cosines, then use $\frac{1}{2}\overline{AB}\cdot\overline{AC}\sin A$.'
        explain: '$\cos A=\dfrac{3^2+8^2-7^2}{2\times 3\times 8}=\dfrac{24}{48}=\dfrac{1}{2}$, so $A=60^\circ$ and $\sin A=\dfrac{\sqrt{3}}{2}$. Area $=\dfrac{1}{2}\times 3\times 8\times\dfrac{\sqrt{3}}{2}=6\sqrt{3}$. Option (3) forgets the $\frac{1}{2}$.'
    answer: 1

  - id: q3@1
    type: single
    origin: original
    codes: [math:F-11A-1, math:N-11A-1]
    verify: m_s116_mock_a:ma_cos_period_max
    text:
      zh-tw:
        stem: '函數 $f(x)=2\cos(3x)+1$（$x$ 以弧度計）的週期與最大值，下列哪一個正確？'
        options: ['週期 $2\pi$，最大值 $3$', '週期 $6\pi$，最大值 $3$', '週期 $\dfrac{2\pi}{3}$，最大值 $2$', '週期 $\dfrac{2\pi}{3}$，最大值 $3$', '週期 $\dfrac{\pi}{3}$，最大值 $1$']
        hint: '$\cos(3x)$ 在 $x$ 走過多長時，$3x$ 剛好走過 $2\pi$？$\cos$ 的最大值是 $1$。'
        explain: '$3x$ 走過 $2\pi$ 時，$x$ 只走過 $\dfrac{2\pi}{3}$，所以週期是 $\dfrac{2\pi}{3}$。$\cos(3x)$ 最大是 $1$，所以 $f(x)$ 最大是 $2\times 1+1=3$。(2) 把 $3$ 乘在週期上，方向弄反了。'
      en:
        stem: 'For $f(x)=2\cos(3x)+1$ ($x$ in radians), which period and maximum are correct?'
        options: ['period $2\pi$, maximum $3$', 'period $6\pi$, maximum $3$', 'period $\dfrac{2\pi}{3}$, maximum $2$', 'period $\dfrac{2\pi}{3}$, maximum $3$', 'period $\dfrac{\pi}{3}$, maximum $1$']
        hint: 'How far must $x$ move for $3x$ to move through $2\pi$? The maximum of $\cos$ is $1$.'
        explain: 'When $3x$ moves through $2\pi$, $x$ moves through only $\dfrac{2\pi}{3}$, so the period is $\dfrac{2\pi}{3}$. The largest value of $\cos(3x)$ is $1$, so the maximum of $f(x)$ is $2\times 1+1=3$. Option (2) multiplies the period by $3$, the wrong way round.'
    answer: 3

  - id: q4@1
    type: single
    origin: original
    codes: [math:A-11A-1]
    verify: m_s116_mock_a:ma_system_no_solution
    text:
      zh-tw:
        stem: '關於 $x$、$y$ 的方程組 $\begin{cases}x+ay=2\\ax+4y=4\end{cases}$ 無解。實數 $a$ 是多少？'
        options: ['$-4$', '$-2$', '$0$', '$2$', '$4$']
        hint: '係數行列式 $\begin{vmatrix}1&a\\a&4\end{vmatrix}=0$ 時，方程組不是無解就是無窮多組解，要再代回去判斷。'
        explain: '$\begin{vmatrix}1&a\\a&4\end{vmatrix}=4-a^2=0$，得 $a=2$ 或 $a=-2$。$a=2$ 時兩式是 $x+2y=2$ 與 $2x+4y=4$，第二式是第一式的 $2$ 倍，有無窮多組解；$a=-2$ 時兩式是 $x-2y=2$ 與 $-2x+4y=4$（即 $x-2y=-2$），互相矛盾，無解。所以 $a=-2$。'
      en:
        stem: 'The system $\begin{cases}x+ay=2\\ax+4y=4\end{cases}$ in $x$ and $y$ has no solution. What is the real number $a$?'
        options: ['$-4$', '$-2$', '$0$', '$2$', '$4$']
        hint: 'When the coefficient determinant $\begin{vmatrix}1&a\\a&4\end{vmatrix}$ is $0$, the system has either no solution or infinitely many; substitute back to tell which.'
        explain: '$\begin{vmatrix}1&a\\a&4\end{vmatrix}=4-a^2=0$ gives $a=2$ or $a=-2$. With $a=2$ the equations are $x+2y=2$ and $2x+4y=4$; the second is twice the first, so there are infinitely many solutions. With $a=-2$ they are $x-2y=2$ and $-2x+4y=4$ (that is, $x-2y=-2$), which contradict each other, so there is no solution. Hence $a=-2$.'
    answer: 1

  - id: q5@1
    type: single
    origin: original
    codes: [math:D-11A-2, math:D-10-4]
    verify: m_s116_mock_a:ma_dice_conditional
    text:
      zh-tw:
        stem: '同時擲兩顆公正的骰子。已知點數和為 $8$，至少有一顆骰子出現 $3$ 點的機率是多少？'
        options: ['$\dfrac{1}{18}$', '$\dfrac{1}{5}$', '$\dfrac{11}{36}$', '$\dfrac{1}{3}$', '$\dfrac{2}{5}$']
        hint: '已知條件把樣本空間縮小成「點數和為 $8$」的那幾種結果。'
        explain: '點數和為 $8$ 的結果有 $(2,6)$、$(3,5)$、$(4,4)$、$(5,3)$、$(6,2)$ 共 $5$ 種，其中有 $3$ 點的是 $(3,5)$、$(5,3)$ 共 $2$ 種，所以機率是 $\dfrac{2}{5}$。(1) 是 $P(\text{和為 }8\text{ 且有 }3)=\frac{2}{36}$，沒有除以條件的機率；(3) 是沒有條件時「至少一顆 $3$ 點」的機率。'
      en:
        stem: 'Two fair dice are rolled. Given that the sum is $8$, what is the probability that at least one die shows $3$?'
        options: ['$\dfrac{1}{18}$', '$\dfrac{1}{5}$', '$\dfrac{11}{36}$', '$\dfrac{1}{3}$', '$\dfrac{2}{5}$']
        hint: 'The condition shrinks the sample space to the outcomes whose sum is $8$.'
        explain: 'The outcomes with sum $8$ are $(2,6)$, $(3,5)$, $(4,4)$, $(5,3)$ and $(6,2)$: $5$ of them. Two of them, $(3,5)$ and $(5,3)$, contain a $3$, so the probability is $\dfrac{2}{5}$. Option (1) is $P(\text{sum }8\text{ and a }3)=\frac{2}{36}$, not divided by the probability of the condition; option (3) is the probability of at least one $3$ with no condition.'
    answer: 4

  - id: q6@1
    type: single
    origin: original
    codes: [math:G-11A-9]
    verify: m_s116_mock_a:ma_point_plane_distance
    text:
      zh-tw:
        stem: '點 $P(3,1,4)$ 到平面 $E:x-2y+2z=4$ 的距離是多少？'
        options: ['$\dfrac{5}{3}$', '$\dfrac{5}{9}$', '$1$', '$3$', '$\dfrac{13}{3}$']
        hint: '先把平面寫成 $x-2y+2z-4=0$，再用點到平面的距離公式。'
        explain: '距離 $=\dfrac{\lvert 3-2\times 1+2\times 4-4\rvert}{\sqrt{1^2+(-2)^2+2^2}}=\dfrac{\lvert 5\rvert}{3}=\dfrac{5}{3}$。(2) 把分母寫成法向量長度的平方 $9$；(5) 是常數項的正負號弄錯，算成 $\lvert 9+4\rvert$。'
      en:
        stem: 'What is the distance from the point $P(3,1,4)$ to the plane $E:x-2y+2z=4$?'
        options: ['$\dfrac{5}{3}$', '$\dfrac{5}{9}$', '$1$', '$3$', '$\dfrac{13}{3}$']
        hint: 'Write the plane as $x-2y+2z-4=0$ first, then use the point-to-plane distance formula.'
        explain: 'Distance $=\dfrac{\lvert 3-2\times 1+2\times 4-4\rvert}{\sqrt{1^2+(-2)^2+2^2}}=\dfrac{\lvert 5\rvert}{3}=\dfrac{5}{3}$. Option (2) divides by the squared length $9$ of the normal; option (5) gets the sign of the constant wrong and computes $\lvert 9+4\rvert$.'
    answer: 0

  # ---------- 多選 7–12 ----------
  - id: q7@1
    type: multi
    origin: original
    codes: [math:F-10-2, math:A-10-2]
    verify: m_s116_mock_a:ma_cubic_statements
    text:
      zh-tw:
        stem: '設 $f(x)=x^3-6x^2+9x+1$。下列哪些選項正確？（多選）'
        options: ['$y=f(x)$ 的圖形對稱於點 $(2,3)$', '$f(x)$ 除以 $x-2$ 的餘式為 $1$', '$f(1)+f(3)=6$', '$y=f(x)$ 的圖形可由 $y=x^3$ 的圖形平移得到', '在 $x=2$ 附近，$y=f(x)$ 的圖形很接近直線 $y=-3x+9$']
        hint: '把 $f(x)$ 寫成 $x-2$ 的多項式：$f(x)=a(x-2)^3+b(x-2)^2+c(x-2)+d$。'
        explain: '用綜合除法（或展開）可得 $f(x)=(x-2)^3-3(x-2)+3$。(1) $(x-2)^3-3(x-2)$ 是 $t^3-3t$ 向右平移 $2$，對稱於原點的圖形移到對稱於 $(2,0)$，再加 $3$ 就對稱於 $(2,3)$，正確。(2) 餘式是常數項 $3$，錯誤。(3) $1$ 和 $3$ 對稱於 $x=2$，所以 $f(1)+f(3)=2\times 3=6$；直接算也是 $5+1=6$，正確。(4) 圖形是 $y=x^3-3x$ 的平移，多了一次項 $-3(x-2)$，不能由 $y=x^3$ 平移得到，錯誤。(5) 在 $x=2$ 附近 $(x-2)^3$ 很小，$f(x)\approx -3(x-2)+3=-3x+9$，正確。所以選 (1)(3)(5)。'
      en:
        stem: 'Let $f(x)=x^3-6x^2+9x+1$. Which statements are correct? (Choose all that apply.)'
        options: ['The graph of $y=f(x)$ is symmetric about the point $(2,3)$', 'The remainder of $f(x)$ divided by $x-2$ is $1$', '$f(1)+f(3)=6$', 'The graph of $y=f(x)$ is a translation of the graph of $y=x^3$', 'Near $x=2$, the graph of $y=f(x)$ is very close to the line $y=-3x+9$']
        hint: 'Write $f(x)$ as a polynomial in $x-2$: $f(x)=a(x-2)^3+b(x-2)^2+c(x-2)+d$.'
        explain: 'Synthetic division (or expanding) gives $f(x)=(x-2)^3-3(x-2)+3$. (1) $(x-2)^3-3(x-2)$ is $t^3-3t$ moved $2$ to the right, so the graph symmetric about the origin becomes symmetric about $(2,0)$; adding $3$ makes it symmetric about $(2,3)$. Correct. (2) The remainder is the constant term $3$. Wrong. (3) $1$ and $3$ are symmetric about $x=2$, so $f(1)+f(3)=2\times 3=6$; computing directly also gives $5+1=6$. Correct. (4) The graph is a translation of $y=x^3-3x$; the linear term $-3(x-2)$ means it is not a translation of $y=x^3$. Wrong. (5) Near $x=2$, $(x-2)^3$ is tiny, so $f(x)\approx -3(x-2)+3=-3x+9$. Correct. So the answer is (1)(3)(5).'
    answer: [0, 2, 4]

  - id: q8@1
    type: multi
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_mock_a:ma_data_transform
    text:
      zh-tw:
        stem: '一組數據 $x$ 為 $2,4,6,8,10$。令 $y=-3x+2$，得到另一組數據 $y$。（標準差以除以數據個數 $n$ 的定義計算）下列哪些選項正確？（多選）'
        options: ['$y$ 的標準差為 $-6\sqrt{2}$', '$y$ 的平均數為 $-16$', '$y$ 的標準差為 $6\sqrt{2}$', '$x$ 與 $y$ 的相關係數為 $-1$', '$y$ 的全距為 $22$']
        hint: '$y=ax+b$ 時，平均數跟著變成 $a\mu_x+b$，標準差變成 $\lvert a\rvert\sigma_x$，常數 $b$ 不影響分散程度。'
        explain: '$x$ 的平均數是 $6$，離差是 $-4,-2,0,2,4$，$\sigma_x=\sqrt{\frac{16+4+0+4+16}{5}}=\sqrt{8}=2\sqrt{2}$。(1) 標準差不會是負數，錯誤。(2) $\mu_y=-3\times 6+2=-16$，正確。(3) $\sigma_y=\lvert -3\rvert\times 2\sqrt{2}=6\sqrt{2}$，正確。(4) $y$ 是 $x$ 的一次函數且斜率為負，所有點落在一條斜率為負的直線上，相關係數為 $-1$，正確。(5) $x$ 的全距是 $8$，$y$ 的全距是 $3\times 8=24$，錯誤。所以選 (2)(3)(4)。'
      en:
        stem: 'A data set $x$ is $2,4,6,8,10$. Let $y=-3x+2$, giving a second data set $y$. (Standard deviations divide by the number of data values $n$.) Which statements are correct? (Choose all that apply.)'
        options: ['The standard deviation of $y$ is $-6\sqrt{2}$', 'The mean of $y$ is $-16$', 'The standard deviation of $y$ is $6\sqrt{2}$', 'The correlation coefficient of $x$ and $y$ is $-1$', 'The range of $y$ is $22$']
        hint: 'For $y=ax+b$ the mean becomes $a\mu_x+b$ and the standard deviation becomes $\lvert a\rvert\sigma_x$; the constant $b$ does not change the spread.'
        explain: 'The mean of $x$ is $6$, the deviations are $-4,-2,0,2,4$, and $\sigma_x=\sqrt{\frac{16+4+0+4+16}{5}}=\sqrt{8}=2\sqrt{2}$. (1) A standard deviation is never negative. Wrong. (2) $\mu_y=-3\times 6+2=-16$. Correct. (3) $\sigma_y=\lvert -3\rvert\times 2\sqrt{2}=6\sqrt{2}$. Correct. (4) $y$ is a linear function of $x$ with negative slope, so every point lies on a line of negative slope and the correlation coefficient is $-1$. Correct. (5) The range of $x$ is $8$, so the range of $y$ is $3\times 8=24$. Wrong. So the answer is (2)(3)(4).'
    answer: [1, 2, 3]

  - id: q9@1
    type: multi
    origin: original
    codes: [math:G-11A-4, math:G-11A-7, math:G-11A-8]
    verify: m_s116_mock_a:ma_space_vectors
    text:
      zh-tw:
        stem: '空間中 $\vec{u}=(2,1,2)$、$\vec{v}=(1,-2,0)$。下列哪些選項正確？（多選）'
        options: ['$\vec{u}\perp\vec{v}$', '$\vec{u}\times\vec{v}$ 與 $(-4,-2,5)$ 平行', '$\lvert\vec{u}+\vec{v}\rvert=\lvert\vec{u}\rvert+\lvert\vec{v}\rvert$', '$\vec{u}$、$\vec{v}$ 所張出的平行四邊形面積為 $3\sqrt{5}$', '$\vec{u}$、$\vec{v}$、$\vec{w}=(1,1,1)$ 所張出的平行六面體體積為 $3$']
        hint: '先算 $\vec{u}\cdot\vec{v}$ 和 $\vec{u}\times\vec{v}$；體積是三階行列式的絕對值。'
        explain: '(1) $\vec{u}\cdot\vec{v}=2-2+0=0$，正確。(2) $\vec{u}\times\vec{v}=(1\cdot 0-2\cdot(-2),\ 2\cdot 1-2\cdot 0,\ 2\cdot(-2)-1\cdot 1)=(4,2,-5)=-(-4,-2,5)$，正確。(3) 三角不等式的等號只在兩向量同方向時成立；這裡 $\lvert\vec{u}+\vec{v}\rvert=\lvert(3,-1,2)\rvert=\sqrt{14}$，而 $\lvert\vec{u}\rvert+\lvert\vec{v}\rvert=3+\sqrt{5}$，錯誤。(4) 面積 $=\lvert\vec{u}\times\vec{v}\rvert=\sqrt{16+4+25}=3\sqrt{5}$，正確。(5) 體積 $=\lvert(\vec{u}\times\vec{v})\cdot\vec{w}\rvert=\lvert 4+2-5\rvert=1$，錯誤。所以選 (1)(2)(4)。'
      en:
        stem: 'In space, $\vec{u}=(2,1,2)$ and $\vec{v}=(1,-2,0)$. Which statements are correct? (Choose all that apply.)'
        options: ['$\vec{u}\perp\vec{v}$', '$\vec{u}\times\vec{v}$ is parallel to $(-4,-2,5)$', '$\lvert\vec{u}+\vec{v}\rvert=\lvert\vec{u}\rvert+\lvert\vec{v}\rvert$', 'The parallelogram spanned by $\vec{u}$ and $\vec{v}$ has area $3\sqrt{5}$', 'The parallelepiped spanned by $\vec{u}$, $\vec{v}$ and $\vec{w}=(1,1,1)$ has volume $3$']
        hint: 'Work out $\vec{u}\cdot\vec{v}$ and $\vec{u}\times\vec{v}$ first; the volume is the absolute value of a $3\times 3$ determinant.'
        explain: '(1) $\vec{u}\cdot\vec{v}=2-2+0=0$. Correct. (2) $\vec{u}\times\vec{v}=(1\cdot 0-2\cdot(-2),\ 2\cdot 1-2\cdot 0,\ 2\cdot(-2)-1\cdot 1)=(4,2,-5)=-(-4,-2,5)$. Correct. (3) Equality in the triangle inequality needs the two vectors to point the same way; here $\lvert\vec{u}+\vec{v}\rvert=\lvert(3,-1,2)\rvert=\sqrt{14}$ while $\lvert\vec{u}\rvert+\lvert\vec{v}\rvert=3+\sqrt{5}$. Wrong. (4) Area $=\lvert\vec{u}\times\vec{v}\rvert=\sqrt{16+4+25}=3\sqrt{5}$. Correct. (5) Volume $=\lvert(\vec{u}\times\vec{v})\cdot\vec{w}\rvert=\lvert 4+2-5\rvert=1$. Wrong. So the answer is (1)(2)(4).'
    answer: [0, 1, 3]

  - id: q10@1
    type: multi
    origin: original
    codes: [math:F-11A-2, math:G-11A-5, math:F-11A-1]
    verify: m_s116_mock_a:ma_harmonic_form
    text:
      zh-tw:
        stem: '設 $f(x)=\sqrt{3}\sin x-\cos x$（$x$ 以弧度計）。下列哪些選項正確？（多選）'
        options: ['$f(x)$ 的最大值為 $\sqrt{3}+1$', '$f(x)$ 的週期為 $\pi$', '$f\left(\dfrac{2\pi}{3}\right)=2$', '對所有實數 $x$，$f(x)=2\sin\left(x+\dfrac{\pi}{6}\right)$', '方程式 $f(x)=0$ 在 $0\le x<2\pi$ 中恰有 $2$ 個解']
        hint: '疊合：$\sqrt{3}\sin x-\cos x=2\left(\frac{\sqrt{3}}{2}\sin x-\frac{1}{2}\cos x\right)$，用差角公式。'
        explain: '$f(x)=2\left(\sin x\cos\frac{\pi}{6}-\cos x\sin\frac{\pi}{6}\right)=2\sin\left(x-\frac{\pi}{6}\right)$。(1) 最大值是 $2$，不是兩個係數相加，錯誤。(2) 週期仍是 $2\pi$，錯誤。(3) $f\left(\frac{2\pi}{3}\right)=2\sin\frac{\pi}{2}=2$，正確。(4) 正確的式子是 $2\sin\left(x-\frac{\pi}{6}\right)$；例如 $x=0$ 時 $f(0)=-1$，但 $2\sin\frac{\pi}{6}=1$，錯誤。(5) $x-\frac{\pi}{6}=0$ 或 $\pi$，得 $x=\frac{\pi}{6}$ 或 $\frac{7\pi}{6}$，恰有 $2$ 個解，正確。所以選 (3)(5)。'

        stem: 'Let $f(x)=\sqrt{3}\sin x-\cos x$ ($x$ in radians). Which statements are correct? (Choose all that apply.)'
        options: ['The maximum of $f(x)$ is $\sqrt{3}+1$', 'The period of $f(x)$ is $\pi$', '$f\left(\dfrac{2\pi}{3}\right)=2$', 'For every real $x$, $f(x)=2\sin\left(x+\dfrac{\pi}{6}\right)$', 'The equation $f(x)=0$ has exactly $2$ solutions with $0\le x<2\pi$']
        hint: 'Combine the waves: $\sqrt{3}\sin x-\cos x=2\left(\frac{\sqrt{3}}{2}\sin x-\frac{1}{2}\cos x\right)$, then use the difference formula.'
        explain: '$f(x)=2\left(\sin x\cos\frac{\pi}{6}-\cos x\sin\frac{\pi}{6}\right)=2\sin\left(x-\frac{\pi}{6}\right)$. (1) The maximum is $2$, not the sum of the coefficients. Wrong. (2) The period is still $2\pi$. Wrong. (3) $f\left(\frac{2\pi}{3}\right)=2\sin\frac{\pi}{2}=2$. Correct. (4) The right form is $2\sin\left(x-\frac{\pi}{6}\right)$; for example $f(0)=-1$ but $2\sin\frac{\pi}{6}=1$. Wrong. (5) $x-\frac{\pi}{6}=0$ or $\pi$ gives $x=\frac{\pi}{6}$ or $\frac{7\pi}{6}$: exactly $2$ solutions. Correct. So the answer is (3)(5).'
    answer: [2, 4]


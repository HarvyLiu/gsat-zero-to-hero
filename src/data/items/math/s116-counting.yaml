chapter: math/s116-counting
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_turn_three_digit
    text:
      zh-tw:
        stem: '用 $1$、$2$、$3$、$4$ 這四個數字排成三位數，數字不可重複使用，共可排出幾個三位數？'
        options: ['$4$', '$12$', '$24$', '$64$', '$81$']
        hint: '一位一位填：百位有幾種選法？填好百位後，十位還剩幾種？'
        explain: '百位有 $4$ 種選法，十位剩 $3$ 種，個位剩 $2$ 種，依乘法原理共 $4\times 3\times 2=24$ 個。若數字可以重複，才是 $4^3=64$ 個。'
      en:
        stem: 'Using the digits $1$, $2$, $3$ and $4$ with no digit repeated, how many three-digit numbers can you make?'
        options: ['$4$', '$12$', '$24$', '$64$', '$81$']
        hint: 'Fill one place at a time: how many choices for the hundreds digit? Once it is filled, how many are left for the tens?'
        explain: 'The hundreds digit has $4$ choices, the tens digit $3$ left, the units digit $2$ left, so by the multiplication principle there are $4\times 3\times 2=24$ numbers. Only if digits could repeat would there be $4^3=64$.'
    answer: 2

  - id: q1@1
    type: single
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_officers
    text:
      zh-tw:
        stem: '從 $8$ 位同學中選出班長、副班長各一人（不可由同一人兼任），共有幾種選法？'
        options: ['$15$', '$16$', '$28$', '$56$', '$64$']
        hint: '班長和副班長是不同的職位，對調算不算同一種？'
        explain: '職位不同，所以順序有差別，是直線排列：$P^{8}_{2}=8\times 7=56$。若只是「選兩位代表」不分職位，才是 $C^{8}_{2}=28$。'
      en:
        stem: 'From $8$ students, choose a class leader and a deputy (two different people). How many ways are there?'
        options: ['$15$', '$16$', '$28$', '$56$', '$64$']
        hint: 'The two posts are different. If you swap the two people, is it the same choice?'
        explain: 'The posts are different, so order matters: this is a linear arrangement, $P^{8}_{2}=8\times 7=56$. Only if you were choosing two representatives with no posts would it be $C^{8}_{2}=28$.'
    answer: 3

  - id: q2@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_odd_three_digit
    text:
      zh-tw:
        stem: '用 $0$、$1$、$2$、$3$、$4$、$5$ 排成數字不重複的三位數奇數，共有 ①② 個。'
        hint: '限制最多的位數先填：個位必須是奇數，百位不能是 $0$。'
        explain: '個位從 $1$、$3$、$5$ 選，有 $3$ 種；百位不能是 $0$，也不能和個位相同，剩 $4$ 種；十位從其餘 $4$ 個數字中選，有 $4$ 種。共 $3\times 4\times 4=48$ 個。'
      en:
        stem: 'Using the digits $0$, $1$, $2$, $3$, $4$, $5$ with no digit repeated, the number of odd three-digit numbers is ①②.'
        hint: 'Fill the most restricted places first: the units digit must be odd, and the hundreds digit cannot be $0$.'
        explain: 'The units digit is one of $1$, $3$, $5$: $3$ choices. The hundreds digit cannot be $0$ or the units digit: $4$ choices. The tens digit is any of the $4$ digits left: $4$ choices. In total $3\times 4\times 4=48$.'
    answer: ['4', '8']

  - id: q3@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_first_to_three
    text:
      zh-tw:
        stem: '甲、乙兩人比賽，每局一定分出勝負，先贏 $3$ 局的人獲勝，比賽隨即結束。記錄每一局由誰獲勝，比賽過程共有 ①② 種。'
        hint: '依比賽打了幾局分類：$3$ 局、$4$ 局、$5$ 局結束。最後一局一定是獲勝者贏的。'
        explain: '設甲獲勝。打 $3$ 局結束：$1$ 種；打 $4$ 局：前 $3$ 局中乙贏 $1$ 局，$C^{3}_{1}=3$ 種；打 $5$ 局：前 $4$ 局中乙贏 $2$ 局，$C^{4}_{2}=6$ 種。甲獲勝共 $1+3+6=10$ 種，乙獲勝也是 $10$ 種，合計 $20$ 種。畫樹狀圖也會得到 $20$ 條路徑。'
      en:
        stem: 'A and B play a match; every game has a winner, and the first to win $3$ games wins the match, which then stops. Recording who wins each game, the number of possible match histories is ①②.'
        hint: 'Split by how many games are played: $3$, $4$ or $5$. The last game is always won by the match winner.'
        explain: 'Say A wins. Over in $3$ games: $1$ way. In $4$ games: B wins $1$ of the first $3$, $C^{3}_{1}=3$ ways. In $5$ games: B wins $2$ of the first $4$, $C^{4}_{2}=6$ ways. That is $1+3+6=10$ histories with A winning, and $10$ with B winning, $20$ in all. A tree diagram also has $20$ paths.'
    answer: ['2', '0']

  - id: q4@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_mixed_committee
    text:
      zh-tw:
        stem: '從 $6$ 位男生、$5$ 位女生中選出 $4$ 人，男生、女生都至少要有 $1$ 人，共有 ①②③ 種選法。'
        hint: '從全部的選法扣掉「全是男生」和「全是女生」。'
        explain: '全部選法 $C^{11}_{4}=330$；全是男生 $C^{6}_{4}=15$；全是女生 $C^{5}_{4}=5$。所以共 $330-15-5=310$ 種。'
      en:
        stem: 'From $6$ boys and $5$ girls, choose $4$ people so that there is at least $1$ boy and at least $1$ girl. The number of ways is ①②③.'
        hint: 'Take all the choices and remove “all boys” and “all girls”.'
        explain: 'All choices: $C^{11}_{4}=330$. All boys: $C^{6}_{4}=15$. All girls: $C^{5}_{4}=5$. So there are $330-15-5=310$ ways.'
    answer: ['3', '1', '0']

  - id: q5@1
    type: multi
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_equal_c10_3
    text:
      zh-tw:
        stem: '下列哪些數等於 $C^{10}_{3}$？（多選）'
        options: ['$C^{10}_{7}$', '$\dfrac{P^{10}_{3}}{3!}$', '$10\times 9\times 8$', '$C^{9}_{2}+C^{9}_{3}$', '$\dfrac{10!}{3!}$']
        hint: '$C^{10}_{3}=\dfrac{10!}{3!\,7!}$。想一想「取 $3$ 個」和「留下 $7$ 個」的關係，以及某一個物件「有選」或「沒選」。'
        explain: '$C^{10}_{3}=120$。(1) 取 $3$ 個等於決定留下哪 $7$ 個，所以 $C^{10}_{7}=120$。(2) $P^{10}_{3}=720$ 把每組 $3$ 個的 $3!=6$ 種順序都算了，除以 $6$ 得 $120$。(3) $720$ 是排列數，不是組合數。(4) 某一個物件有選：$C^{9}_{2}=36$；沒選：$C^{9}_{3}=84$，合計 $120$。(5) $\frac{10!}{3!}=604800$。所以選 (1)(2)(4)。'
      en:
        stem: 'Which of these equal $C^{10}_{3}$? (Choose all that apply.)'
        options: ['$C^{10}_{7}$', '$\dfrac{P^{10}_{3}}{3!}$', '$10\times 9\times 8$', '$C^{9}_{2}+C^{9}_{3}$', '$\dfrac{10!}{3!}$']
        hint: '$C^{10}_{3}=\dfrac{10!}{3!\,7!}$. Think about “take $3$” versus “leave $7$”, and about one particular object being chosen or not.'
        explain: '$C^{10}_{3}=120$. (1) Taking $3$ is the same as deciding which $7$ stay, so $C^{10}_{7}=120$. (2) $P^{10}_{3}=720$ counts each group of $3$ in all $3!=6$ orders; dividing by $6$ gives $120$. (3) $720$ is the number of arrangements, not of combinations. (4) A particular object chosen: $C^{9}_{2}=36$; not chosen: $C^{9}_{3}=84$; together $120$. (5) $\frac{10!}{3!}=604800$. So the answer is (1)(2)(4).'
    answer: [0, 1, 3]

  - id: q6@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_multiples_3_or_5
    text:
      zh-tw:
        stem: '從 $1$ 到 $200$ 的整數中，是 $3$ 的倍數或是 $5$ 的倍數的共有 ①② 個。'
        hint: '$15$ 的倍數同時是 $3$ 和 $5$ 的倍數，會被算兩次。'
        explain: '$3$ 的倍數有 $66$ 個（$3\times 66=198$），$5$ 的倍數有 $40$ 個，$15$ 的倍數有 $13$ 個（$15\times 13=195$）。依取捨原理，共 $66+40-13=93$ 個。'
      en:
        stem: 'Among the integers from $1$ to $200$, the number that are multiples of $3$ or multiples of $5$ is ①②.'
        hint: 'Multiples of $15$ are multiples of both $3$ and $5$, so they get counted twice.'
        explain: 'There are $66$ multiples of $3$ ($3\times 66=198$), $40$ multiples of $5$, and $13$ multiples of $15$ ($15\times 13=195$). By inclusion–exclusion there are $66+40-13=93$.'
    answer: ['9', '3']

  - id: q7@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_coprime_60
    text:
      zh-tw:
        stem: '從 $1$ 到 $60$ 的整數中，與 $60$ 互質的共有 ①② 個。'
        hint: '$60=2^2\times 3\times 5$。與 $60$ 互質，就是不是 $2$、$3$、$5$ 任何一個的倍數。'
        explain: '設 $A$、$B$、$C$ 分別是 $2$、$3$、$5$ 的倍數。$n(A)=30$、$n(B)=20$、$n(C)=12$，$n(A\cap B)=10$、$n(A\cap C)=6$、$n(B\cap C)=4$，$n(A\cap B\cap C)=2$。所以 $n(A\cup B\cup C)=30+20+12-10-6-4+2=44$，與 $60$ 互質的有 $60-44=16$ 個。'
      en:
        stem: 'Among the integers from $1$ to $60$, the number that are coprime to $60$ is ①②.'
        hint: '$60=2^2\times 3\times 5$. Coprime to $60$ means not a multiple of $2$, $3$ or $5$.'
        explain: 'Let $A$, $B$, $C$ be the multiples of $2$, $3$, $5$. Then $n(A)=30$, $n(B)=20$, $n(C)=12$, $n(A\cap B)=10$, $n(A\cap C)=6$, $n(B\cap C)=4$ and $n(A\cap B\cap C)=2$. So $n(A\cup B\cup C)=30+20+12-10-6-4+2=44$, and $60-44=16$ numbers are coprime to $60$.'
    answer: ['1', '6']

  - id: q8@1
    type: fill
    origin: original
    codes: [math:D-10-3]
    verify: m_s116_counting:ct_binomial_coefficient
    text:
      zh-tw:
        stem: '$(2x-1)^6$ 的展開式中，$x^4$ 項的係數是 ①②③。'
        hint: '一般項是 $C^{6}_{k}(2x)^{6-k}(-1)^{k}$。要得到 $x^4$，$k$ 是多少？'
        explain: '要 $6-k=4$，所以 $k=2$。這一項是 $C^{6}_{2}(2x)^{4}(-1)^{2}=15\times 16x^4=240x^4$，係數是 $240$。注意 $2$ 也要一起四次方。'
      en:
        stem: 'In the expansion of $(2x-1)^6$, the coefficient of $x^4$ is ①②③.'
        hint: 'The general term is $C^{6}_{k}(2x)^{6-k}(-1)^{k}$. Which $k$ gives $x^4$?'
        explain: 'We need $6-k=4$, so $k=2$. That term is $C^{6}_{2}(2x)^{4}(-1)^{2}=15\times 16x^4=240x^4$, so the coefficient is $240$. Remember that the $2$ is raised to the fourth power too.'
    answer: ['2', '4', '0']

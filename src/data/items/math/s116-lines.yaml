chapter: math/s116-lines
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_turn_slope
    text:
      zh-tw:
        stem: '通過 $(1,2)$ 與 $(4,8)$ 兩點的直線，斜率是多少？'
        options: ['$\dfrac{1}{2}$', '$2$', '$6$', '$-2$', '$3$']
        hint: '斜率是「$y$ 的變化量」除以「$x$ 的變化量」。'
        explain: '$x$ 從 $1$ 變到 $4$，增加 $3$；$y$ 從 $2$ 變到 $8$，增加 $6$。斜率是 $\frac{8-2}{4-1}=\frac{6}{3}=2$。選項 (1) 是把分子分母顛倒了。'
      en:
        stem: 'What is the slope of the line through $(1,2)$ and $(4,8)$?'
        options: ['$\dfrac{1}{2}$', '$2$', '$6$', '$-2$', '$3$']
        hint: 'Slope is the change in $y$ divided by the change in $x$.'
        explain: '$x$ goes from $1$ to $4$, up $3$; $y$ goes from $2$ to $8$, up $6$. The slope is $\frac{8-2}{4-1}=\frac{6}{3}=2$. Option (1) has the fraction upside down.'
    answer: 1

  - id: q1@1
    type: multi
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_line_properties
    text:
      zh-tw:
        stem: '關於直線 $L:2x+3y-6=0$，下列哪些敘述正確？（多選）'
        options: ['$L$ 的斜率為 $-\dfrac{2}{3}$', '$L$ 通過點 $(3,1)$', '$L$ 與直線 $4x+6y+1=0$ 平行', '$L$ 與直線 $2x-3y=0$ 垂直', '原點與點 $(1,1)$ 在 $L$ 的同一側']
        hint: '把 $L$ 化成 $y=mx+k$ 看斜率；判斷同側，就把兩點代入 $2x+3y-6$，看正負號是否相同。'
        explain: '$L$ 可寫成 $y=-\frac{2}{3}x+2$，斜率 $-\frac{2}{3}$，(1) 對。代入 $(3,1)$ 得 $6+3-6=3\ne 0$，(2) 錯。$4x+6y+1=0$ 的斜率也是 $-\frac{2}{3}$，而且 $4x+6y+1=0$ 即 $2x+3y+\frac{1}{2}=0$，和 $L$ 不是同一條線，所以平行，(3) 對。$2x-3y=0$ 的斜率是 $\frac{2}{3}$，$\left(-\frac{2}{3}\right)\cdot\frac{2}{3}=-\frac{4}{9}\ne -1$，(4) 錯。代入原點得 $-6$，代入 $(1,1)$ 得 $-1$，兩者同為負，所以在同側，(5) 對。答案是 (1)(3)(5)。'
      en:
        stem: 'Which statements about the line $L:2x+3y-6=0$ are true? (Choose all that apply.)'
        options: ['$L$ has slope $-\dfrac{2}{3}$', '$L$ passes through $(3,1)$', '$L$ is parallel to the line $4x+6y+1=0$', '$L$ is perpendicular to the line $2x-3y=0$', 'the origin and the point $(1,1)$ lie on the same side of $L$']
        hint: 'Rewrite $L$ as $y=mx+k$ to read off the slope. For the same side, substitute both points into $2x+3y-6$ and compare the signs.'
        explain: '$L$ is $y=-\frac{2}{3}x+2$, so its slope is $-\frac{2}{3}$: (1) is true. Substituting $(3,1)$ gives $6+3-6=3\ne 0$: (2) is false. $4x+6y+1=0$ also has slope $-\frac{2}{3}$, and it is $2x+3y+\frac{1}{2}=0$, a different line from $L$, so the two are parallel: (3) is true. $2x-3y=0$ has slope $\frac{2}{3}$, and $\left(-\frac{2}{3}\right)\cdot\frac{2}{3}=-\frac{4}{9}\ne -1$: (4) is false. The origin gives $-6$ and $(1,1)$ gives $-1$; both are negative, so they are on the same side: (5) is true. The answer is (1)(3)(5).'
    answer: [0, 2, 4]

  - id: q2@1
    type: fill
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_translate_intercept
    text:
      zh-tw:
        stem: '把直線 $y=-x+4$ 向左平移 $2$ 單位、再向下平移 $3$ 單位，所得直線的 $y$ 截距為 ①②。'
        hint: '向左平移 $2$、向下平移 $3$，就是把 $x$ 換成 $x+2$、$y$ 換成 $y+3$。'
        explain: '新直線是 $y+3=-(x+2)+4$，整理得 $y=-x-1$，所以 $y$ 截距是 $-1$。也可以拿原直線上的點 $(0,4)$ 來看：它移到 $(-2,1)$，新直線斜率仍是 $-1$，所以 $y-1=-(x+2)$，同樣得到 $y=-x-1$。'
      en:
        stem: 'Move the line $y=-x+4$ $2$ units to the left and then $3$ units down. The $y$-intercept of the new line is ①②.'
        hint: 'Moving $2$ left and $3$ down means replacing $x$ by $x+2$ and $y$ by $y+3$.'
        explain: 'The new line is $y+3=-(x+2)+4$, which simplifies to $y=-x-1$, so the $y$-intercept is $-1$. Or follow the point $(0,4)$ on the original line: it moves to $(-2,1)$, and the slope stays $-1$, so $y-1=-(x+2)$, again $y=-x-1$.'
    answer: ['−', '1']

  - id: q3@1
    type: single
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_perpendicular
    text:
      zh-tw:
        stem: '下列哪一條直線與直線 $3x-y+2=0$ 垂直？'
        options: ['$y=3x-1$', '$y=-3x+2$', '$x+3y-6=0$', '$3x+y=0$', '$x-3y+1=0$']
        hint: '先求 $3x-y+2=0$ 的斜率，垂直的直線斜率和它相乘要等於 $-1$。'
        explain: '$3x-y+2=0$ 即 $y=3x+2$，斜率 $3$，所以垂直線的斜率是 $-\frac{1}{3}$。$x+3y-6=0$ 即 $y=-\frac{1}{3}x+2$，正是所求。(1) 斜率相同，是平行線；(2)(4) 的斜率 $-3$ 只變了正負號；(5) 的斜率 $\frac{1}{3}$ 只取了倒數。'
      en:
        stem: 'Which line is perpendicular to the line $3x-y+2=0$?'
        options: ['$y=3x-1$', '$y=-3x+2$', '$x+3y-6=0$', '$3x+y=0$', '$x-3y+1=0$']
        hint: 'Find the slope of $3x-y+2=0$ first. A perpendicular line’s slope times it must be $-1$.'
        explain: '$3x-y+2=0$ is $y=3x+2$, with slope $3$, so a perpendicular line has slope $-\frac{1}{3}$. $x+3y-6=0$ is $y=-\frac{1}{3}x+2$: that is the one. (1) has the same slope, so it is parallel; (2) and (4) have slope $-3$, which only flips the sign; (5) has slope $\frac{1}{3}$, which only takes the reciprocal.'
    answer: 2

  - id: q4@1
    type: single
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_coincide_parallel
    text:
      zh-tw:
        stem: '設兩直線 $L_1:x+ay=2$、$L_2:ax+4y=4$，其中 $a$ 為實數。下列哪一個敘述正確？'
        options: ['$a=2$ 時，$L_1$ 與 $L_2$ 平行', '$a=-2$ 時，$L_1$ 與 $L_2$ 重合', '$a=-2$ 時，$L_1$ 與 $L_2$ 平行', '$a=0$ 時，$L_1$ 與 $L_2$ 平行', '$a=1$ 時，$L_1$ 與 $L_2$ 沒有交點']
        hint: '先找出哪些 $a$ 讓兩條線斜率相同，再把那個 $a$ 代回去，看兩條線是不是同一條。'
        explain: '$a\ne 0$ 時，$L_1$ 的斜率是 $-\frac{1}{a}$，$L_2$ 的斜率是 $-\frac{a}{4}$；斜率相同需要 $\frac{1}{a}=\frac{a}{4}$，即 $a^2=4$，$a=\pm 2$。$a=2$ 時 $L_1:x+2y=2$、$L_2:2x+4y=4$，$L_2$ 除以 $2$ 就是 $L_1$，兩線重合，所以 (1) 錯。$a=-2$ 時 $L_1:x-2y=2$、$L_2:-2x+4y=4$ 即 $x-2y=-2$，斜率相同但常數不同，兩線平行，所以 (3) 對、(2) 錯。$a=0$ 時是鉛直線 $x=2$ 與水平線 $y=1$，交於 $(2,1)$；$a=1$ 時斜率 $-1$ 與 $-\frac{1}{4}$ 不同，恰有一個交點。'
      en:
        stem: 'Let $L_1:x+ay=2$ and $L_2:ax+4y=4$, where $a$ is a real number. Which statement is true?'
        options: ['when $a=2$, $L_1$ and $L_2$ are parallel', 'when $a=-2$, $L_1$ and $L_2$ coincide', 'when $a=-2$, $L_1$ and $L_2$ are parallel', 'when $a=0$, $L_1$ and $L_2$ are parallel', 'when $a=1$, $L_1$ and $L_2$ have no common point']
        hint: 'First find which values of $a$ give the two lines the same slope, then substitute that $a$ back and see whether they are the same line.'
        explain: 'For $a\ne 0$, $L_1$ has slope $-\frac{1}{a}$ and $L_2$ has slope $-\frac{a}{4}$; equal slopes need $\frac{1}{a}=\frac{a}{4}$, so $a^2=4$ and $a=\pm 2$. When $a=2$, $L_1:x+2y=2$ and $L_2:2x+4y=4$; dividing $L_2$ by $2$ gives $L_1$, so the lines coincide and (1) is false. When $a=-2$, $L_1:x-2y=2$ and $L_2:-2x+4y=4$, which is $x-2y=-2$: same slope, different constant, so they are parallel. (3) is true and (2) is false. When $a=0$ the lines are the vertical line $x=2$ and the horizontal line $y=1$, meeting at $(2,1)$; when $a=1$ the slopes $-1$ and $-\frac{1}{4}$ differ, so there is exactly one common point.'
    answer: 2

  - id: q5@1
    type: fill
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_point_distance
    text:
      zh-tw:
        stem: '點 $(1,3)$ 到直線 $5x-12y+5=0$ 的距離為 ①。'
        hint: '代入公式 $\dfrac{\lvert ax_0+by_0+c\rvert}{\sqrt{a^2+b^2}}$。'
        explain: '$\frac{\lvert 5\cdot 1-12\cdot 3+5\rvert}{\sqrt{5^2+12^2}}=\frac{\lvert -26\rvert}{13}=2$。分子要取絕對值，距離不會是負的。'
      en:
        stem: 'The distance from the point $(1,3)$ to the line $5x-12y+5=0$ is ①.'
        hint: 'Use the formula $\dfrac{\lvert ax_0+by_0+c\rvert}{\sqrt{a^2+b^2}}$.'
        explain: '$\frac{\lvert 5\cdot 1-12\cdot 3+5\rvert}{\sqrt{5^2+12^2}}=\frac{\lvert -26\rvert}{13}=2$. Take the absolute value of the top: a distance is never negative.'
    answer: ['2']

  - id: q6@1
    type: fill
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_parallel_distance
    text:
      zh-tw:
        stem: '兩平行線 $5x+12y-3=0$ 與 $10x+24y+7=0$ 之間的距離為 $\dfrac{a}{b}$（最簡分數），則 $a=$ ①，$b=$ ②。'
        hint: '先把兩條直線的 $x$、$y$ 係數調成一樣，才能用平行線距離公式。'
        explain: '把第二條線除以 $2$：$5x+12y+\frac{7}{2}=0$。距離是 $\frac{\lvert -3-\frac{7}{2}\rvert}{\sqrt{5^2+12^2}}=\frac{13/2}{13}=\frac{1}{2}$，所以 $a=1$、$b=2$。如果沒有先調係數，直接算 $\frac{\lvert -3-7\rvert}{13}=\frac{10}{13}$ 就錯了。'
      en:
        stem: 'The distance between the parallel lines $5x+12y-3=0$ and $10x+24y+7=0$ is $\dfrac{a}{b}$ in lowest terms. Then $a=$ ① and $b=$ ②.'
        hint: 'Make the $x$ and $y$ coefficients of the two lines the same before using the parallel-line formula.'
        explain: 'Divide the second line by $2$: $5x+12y+\frac{7}{2}=0$. The distance is $\frac{\lvert -3-\frac{7}{2}\rvert}{\sqrt{5^2+12^2}}=\frac{13/2}{13}=\frac{1}{2}$, so $a=1$ and $b=2$. Skipping that step and computing $\frac{\lvert -3-7\rvert}{13}=\frac{10}{13}$ is wrong.'
    answer: ['1', '2']

  - id: q7@1
    type: fill
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_lattice_points
    text:
      zh-tw:
        stem: '坐標平面上，同時滿足 $x\ge 0$、$y\ge 0$、$x+2y\le 6$ 的點中，$x$、$y$ 坐標都是整數的點共有 ①② 個。'
        hint: '這三個不等式圍出一個三角形區域（含邊界）。按 $y=0,1,2,3$ 一列一列數。'
        explain: '$x+2y\le 6$ 是直線 $x+2y=6$ 上和原點同側的半平面（含直線）。$y=0$ 時 $0\le x\le 6$，有 $7$ 個；$y=1$ 時 $0\le x\le 4$，有 $5$ 個；$y=2$ 時 $0\le x\le 2$，有 $3$ 個；$y=3$ 時只有 $x=0$，$1$ 個。共 $7+5+3+1=16$ 個。'
      en:
        stem: 'In the coordinate plane, the number of points with integer coordinates that satisfy $x\ge 0$, $y\ge 0$ and $x+2y\le 6$ is ①②.'
        hint: 'The three inequalities enclose a triangle (edges included). Count row by row for $y=0,1,2,3$.'
        explain: '$x+2y\le 6$ is the half-plane on the origin’s side of the line $x+2y=6$, line included. For $y=0$, $0\le x\le 6$: $7$ points; for $y=1$, $0\le x\le 4$: $5$; for $y=2$, $0\le x\le 2$: $3$; for $y=3$, only $x=0$: $1$. In all $7+5+3+1=16$.'
    answer: ['1', '6']

  - id: q8@1
    type: fill
    origin: original
    codes: [math:G-10-2]
    verify: m_s116_lines:ln_triangle_area
    text:
      zh-tw:
        stem: '設 $O$ 為原點，$P(5,2)$、$Q(-1,3)$，則 $\triangle OPQ$ 的面積為 $\dfrac{a}{b}$（最簡分數），其中 $a=$ ①②，$b=$ ③。'
        hint: '$\triangle OPQ$ 的面積是 $\dfrac{1}{2}\lvert x_1y_2-x_2y_1\rvert$。'
        explain: '$\frac{1}{2}\lvert 5\cdot 3-(-1)\cdot 2\rvert=\frac{1}{2}\lvert 15+2\rvert=\frac{17}{2}$，所以 $a=17$、$b=2$。注意 $(-1)\cdot 2=-2$，減掉它變成加 $2$。'
      en:
        stem: 'Let $O$ be the origin, $P(5,2)$ and $Q(-1,3)$. The area of $\triangle OPQ$ is $\dfrac{a}{b}$ in lowest terms, where $a=$ ①② and $b=$ ③.'
        hint: 'The area of $\triangle OPQ$ is $\dfrac{1}{2}\lvert x_1y_2-x_2y_1\rvert$.'
        explain: '$\frac{1}{2}\lvert 5\cdot 3-(-1)\cdot 2\rvert=\frac{1}{2}\lvert 15+2\rvert=\frac{17}{2}$, so $a=17$ and $b=2$. Watch the sign: $(-1)\cdot 2=-2$, and subtracting it adds $2$.'
    answer: ['1', '7', '2']

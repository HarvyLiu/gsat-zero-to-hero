    text:
      zh-tw:
        stem: '（數A）函數 $y=\tan 2x$ 的週期是多少？'
        options: ['$\dfrac{\pi}{4}$', '$\dfrac{\pi}{2}$', '$\pi$', '$2\pi$', '$4\pi$']
        hint: '$y=\tan x$ 的週期是 $\pi$，不是 $2\pi$。'
        explain: '$\tan x$ 的週期是 $\pi$，所以 $\tan 2x$ 的週期是 $\frac{\pi}{2}$：$x$ 增加 $\frac{\pi}{2}$ 時，$2x$ 增加 $\pi$。若誤用正弦的 $2\pi$，會得到錯誤的 $\pi$。'
      en:
        stem: '(Math A) What is the period of $y=\tan 2x$?'
        options: ['$\dfrac{\pi}{4}$', '$\dfrac{\pi}{2}$', '$\pi$', '$2\pi$', '$4\pi$']
        hint: 'The period of $y=\tan x$ is $\pi$, not $2\pi$.'
        explain: 'The period of $\tan x$ is $\pi$, so the period of $\tan 2x$ is $\frac{\pi}{2}$: when $x$ grows by $\frac{\pi}{2}$, $2x$ grows by $\pi$. Using the sine period $2\pi$ by mistake gives the wrong answer $\pi$.'
    answer: 1

  - id: q-turn@1
    type: single
    origin: original
    codes: [math:D-11A-3]
    verify: m_s116a_bayes_matrix_applications:ba_turn_total_late
    text:
      zh-tw:
        stem: '氣象預報說明天下雨的機率是 $30\%$。小明下雨天上學遲到的機率是 $20\%$，不下雨時遲到的機率是 $5\%$。小明明天上學遲到的機率是多少？'
        options: ['$5\%$', '$9.5\%$', '$12.5\%$', '$20\%$', '$25\%$']
        hint: '分成「下雨」與「不下雨」兩種情況，各自算「這種天氣的機率 $\times$ 這種天氣遲到的機率」，再相加。'
        explain: '下雨而且遲到的機率是 $0.3\times 0.2=0.06$，不下雨而且遲到的機率是 $0.7\times 0.05=0.035$，兩種情況互斥，所以遲到的機率是 $0.06+0.035=0.095=9.5\%$。選 $12.5\%$ 是把兩個遲到機率直接平均，但下雨和不下雨的機率不一樣大。'
      en:
        stem: 'The forecast gives a $30\%$ chance of rain tomorrow. On a rainy day, Ming is late for school with probability $20\%$; on a day without rain, with probability $5\%$. What is the probability that Ming is late for school tomorrow?'
        options: ['$5\%$', '$9.5\%$', '$12.5\%$', '$20\%$', '$25\%$']
        hint: 'Split into two cases, "rain" and "no rain". For each, work out "probability of that weather $\times$ probability of being late in that weather", then add.'
        explain: 'The probability of "rain and late" is $0.3\times 0.2=0.06$, and of "no rain and late" is $0.7\times 0.05=0.035$. The two cases cannot both happen, so the probability of being late is $0.06+0.035=0.095=9.5\%$. Choosing $12.5\%$ averages the two lateness probabilities, but rain and no rain are not equally likely.'
    answer: 1

  - id: q1@1
    type: fill
    origin: original
    codes: [math:D-11A-3]
    verify: m_s116a_bayes_matrix_applications:ba_second_ball_red
    text:
      zh-tw:
        stem: '袋中有 $4$ 顆紅球、$6$ 顆白球。依序取出兩顆球，取出後不放回。第二顆是紅球的機率寫成最簡分數為 $\dfrac{a}{b}$，則 $a=$ ①、$b=$ ②。'
        hint: '依第一顆的顏色分成兩種情況，每種情況用乘法公式 $P(A\cap B)=P(A)\,P(B\mid A)$，再相加。'
        explain: '第一紅、第二紅：$\frac{4}{10}\times\frac{3}{9}=\frac{12}{90}$；第一白、第二紅：$\frac{6}{10}\times\frac{4}{9}=\frac{24}{90}$。相加得 $\frac{36}{90}=\frac{2}{5}$，所以 $a=2$、$b=5$。它剛好等於第一顆是紅球的機率 $\frac{4}{10}$：在還不知道第一顆是什麼的時候，第二顆和第一顆的處境是一樣的。'
      en:
        stem: 'A bag holds $4$ red balls and $6$ white balls. Draw two balls one after the other, without putting the first one back. The probability that the second ball is red, as a fraction in lowest terms, is $\dfrac{a}{b}$. Then $a=$ ① and $b=$ ②.'
        hint: 'Split into two cases by the colour of the first ball. In each case use the multiplication rule $P(A\cap B)=P(A)\,P(B\mid A)$, then add.'
        explain: 'Red then red: $\frac{4}{10}\times\frac{3}{9}=\frac{12}{90}$. White then red: $\frac{6}{10}\times\frac{4}{9}=\frac{24}{90}$. Adding gives $\frac{36}{90}=\frac{2}{5}$, so $a=2$ and $b=5$. This equals the probability that the first ball is red, $\frac{4}{10}$: while you do not know what the first ball was, the second ball is in the same position as the first.'
    answer: ['2', '5']

  - id: q2@1
    type: fill
    origin: original
    codes: [math:D-11A-3]
    verify: m_s116a_bayes_matrix_applications:ba_bag_from_red
    text:
      zh-tw:
        stem: '甲袋有 $3$ 紅球、$2$ 白球，乙袋有 $1$ 紅球、$3$ 白球。擲一枚公正硬幣，正面就從甲袋、反面就從乙袋任取一球。已知取到的是紅球，它來自甲袋的機率寫成最簡分數為 $\dfrac{a}{b}$，則 $a=$ ①②、$b=$ ③④。'
        hint: '先分別算「甲袋而且紅球」與「乙袋而且紅球」的機率，再用「甲袋而且紅球」除以「紅球」的機率。'
        explain: '甲袋而且紅球：$\frac{1}{2}\times\frac{3}{5}=\frac{3}{10}$；乙袋而且紅球：$\frac{1}{2}\times\frac{1}{4}=\frac{1}{8}$。紅球的機率是 $\frac{3}{10}+\frac{1}{8}=\frac{17}{40}$，所以 $P(\text{甲}\mid\text{紅})=\frac{3/10}{17/40}=\frac{12}{17}$，$a=12$、$b=17$。'
      en:
        stem: 'Bag A holds $3$ red and $2$ white balls; bag B holds $1$ red and $3$ white balls. Toss a fair coin: on heads draw one ball from bag A, on tails one ball from bag B. Given that the ball drawn is red, the probability that it came from bag A, as a fraction in lowest terms, is $\dfrac{a}{b}$. Then $a=$ ①② and $b=$ ③④.'
        hint: 'First find the probabilities of "bag A and red" and "bag B and red", then divide "bag A and red" by the probability of "red".'
        explain: 'Bag A and red: $\frac{1}{2}\times\frac{3}{5}=\frac{3}{10}$. Bag B and red: $\frac{1}{2}\times\frac{1}{4}=\frac{1}{8}$. The probability of red is $\frac{3}{10}+\frac{1}{8}=\frac{17}{40}$, so $P(\text{A}\mid\text{red})=\frac{3/10}{17/40}=\frac{12}{17}$: $a=12$ and $b=17$.'
    answer: ['1', '2', '1', '7']

  - id: q3@1
    type: single
    origin: original
    codes: [math:D-11A-3]
    verify: m_s116a_bayes_matrix_applications:ba_screening_band
    text:
      zh-tw:
        stem: '某地區有 $2\%$ 的人患有某種疾病。一種篩檢對患者有 $95\%$ 會呈陽性，對未患病的人有 $10\%$ 會呈陽性。某人篩檢呈陽性，他真的患病的機率落在哪個範圍？'
        options: ['小於 $10\%$', '介於 $10\%$ 與 $20\%$ 之間', '介於 $20\%$ 與 $50\%$ 之間', '介於 $50\%$ 與 $90\%$ 之間', '大於 $90\%$']
        hint: '想像 $10000$ 人：患者有幾人、其中幾人陽性？未患病的有幾人、其中幾人陽性？'
        explain: '$10000$ 人中患者 $200$ 人，陽性 $190$ 人；未患病 $9800$ 人，陽性 $980$ 人。陽性共 $1170$ 人，其中真的患病的是 $190$ 人，所以機率是 $\frac{190}{1170}=\frac{19}{117}\approx 16.2\%$。選「大於 $90\%$」是把 $P(\text{陽性}\mid\text{患病})$ 誤當成 $P(\text{患病}\mid\text{陽性})$。'
      en:
        stem: 'In a region, $2\%$ of people have a certain disease. A screening test is positive for $95\%$ of people with the disease and for $10\%$ of people without it. Someone tests positive. In which range is the probability that they really have the disease?'
        options: ['below $10\%$', 'between $10\%$ and $20\%$', 'between $20\%$ and $50\%$', 'between $50\%$ and $90\%$', 'above $90\%$']
        hint: 'Imagine $10000$ people. How many have the disease, and how many of them test positive? How many do not, and how many of them test positive?'
        explain: 'Of $10000$ people, $200$ have the disease and $190$ of them test positive; $9800$ do not, and $980$ of them test positive. That makes $1170$ positives, of whom $190$ really have the disease, so the probability is $\frac{190}{1170}=\frac{19}{117}\approx 16.2\%$. Choosing "above $90\%$" mistakes $P(\text{positive}\mid\text{ill})$ for $P(\text{ill}\mid\text{positive})$.'
    answer: 1

  - id: q4@1
    type: multi
    origin: original
    codes: [math:F-11A-3]
    verify: m_s116a_bayes_matrix_applications:ba_lunch_transition
    text:
      zh-tw:
        stem: '小安每天中午在甲、乙兩家店中選一家吃飯。今天去甲店，明天去甲店的機率是 $0.9$、去乙店是 $0.1$；今天去乙店，明天去甲店的機率是 $0.4$、去乙店是 $0.6$。令轉移矩陣 $T=\begin{bmatrix}0.9&0.4\\0.1&0.6\end{bmatrix}$（第 $1$、$2$ 行代表今天在甲、乙，第 $1$、$2$ 列代表明天在甲、乙）。下列哪些選項是正確的？'
        options: ['$T$ 的每一行元素和都是 $1$', '$T$ 的每一列元素和都是 $1$', '若今天去甲店，則後天去乙店的機率是 $0.15$', '長期來看，小安去甲店的天數比例會接近 $0.8$', '若今天去乙店，則明天仍去乙店的機率是 $0.4$']
        hint: '每一行是「從同一家店出發」的所有去向。後天的機率用 $T^2$ 乘以今天的狀態；長期比例 $\begin{bmatrix}x\\y\end{bmatrix}$ 滿足 $T\begin{bmatrix}x\\y\end{bmatrix}=\begin{bmatrix}x\\y\end{bmatrix}$。'
        explain: '(1) 正確：$0.9+0.1=1$、$0.4+0.6=1$，從同一家店出發，明天一定去甲或乙。(2) 錯誤：第一列是 $0.9+0.4=1.3$。(3) 正確：$T\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}0.9\\0.1\end{bmatrix}$，再乘一次 $T$ 得 $\begin{bmatrix}0.85\\0.15\end{bmatrix}$；也就是 $0.9\times 0.1+0.1\times 0.6=0.15$。(4) 正確：由 $0.9x+0.4y=x$ 得 $0.1x=0.4y$，又 $x+y=1$，所以 $x=0.8$。(5) 錯誤：今天乙、明天乙的機率是 $0.6$，$0.4$ 是今天乙、明天甲。'
      en:
        stem: 'Every day at noon, An eats at one of two shops, A or B. If she goes to A today, she goes to A tomorrow with probability $0.9$ and to B with probability $0.1$; if she goes to B today, she goes to A tomorrow with probability $0.4$ and to B with probability $0.6$. Let the transition matrix be $T=\begin{bmatrix}0.9&0.4\\0.1&0.6\end{bmatrix}$ (columns $1$ and $2$ stand for being at A or B today; rows $1$ and $2$ for A or B tomorrow). Which statements are true?'
        options: ['every column of $T$ adds up to $1$', 'every row of $T$ adds up to $1$', 'if she goes to A today, the probability that she goes to B the day after tomorrow is $0.15$', 'in the long run, the share of days she goes to A gets close to $0.8$', 'if she goes to B today, the probability that she goes to B again tomorrow is $0.4$']
        hint: 'Each column lists everywhere you can go from one shop. For the day after tomorrow, multiply today''s state by $T^2$; the long-run shares $\begin{bmatrix}x\\y\end{bmatrix}$ satisfy $T\begin{bmatrix}x\\y\end{bmatrix}=\begin{bmatrix}x\\y\end{bmatrix}$.'
        explain: '(1) True: $0.9+0.1=1$ and $0.4+0.6=1$; starting from one shop, tomorrow she certainly goes to A or B. (2) False: the first row is $0.9+0.4=1.3$. (3) True: $T\begin{bmatrix}1\\0\end{bmatrix}=\begin{bmatrix}0.9\\0.1\end{bmatrix}$, and one more multiplication by $T$ gives $\begin{bmatrix}0.85\\0.15\end{bmatrix}$; that is, $0.9\times 0.1+0.1\times 0.6=0.15$. (4) True: $0.9x+0.4y=x$ gives $0.1x=0.4y$, and with $x+y=1$ we get $x=0.8$. (5) False: B today and B tomorrow has probability $0.6$; $0.4$ is B today and A tomorrow.'
    answer: [0, 2, 3]

  - id: q5@1
    type: fill
    origin: original

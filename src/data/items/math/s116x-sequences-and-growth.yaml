    text:
      zh-tw:
        stem: '下列各題都要處理某一個數。哪一題的數超過 $15$ 位，用手一項一項乘出來很不實際，最適合改用常用對數？'
        options: ['求 $2^{20}$ 的值', '求 $3^{40}$ 是幾位數', '求 $1.2^{3}$ 的值', '數列 $a_1=2$、$a_{n+1}=2a_n-1$，求 $a_8$', '求 $11^{4}$ 的值']

  - id: q-turn@1
    type: single
    origin: original
    codes: [math:N-10-6]
    verify: m_s116x_sequences_and_growth:sg_turn_recursion
    text:
      zh-tw:
        stem: '數列滿足 $a_1=3$，且 $a_{n+1}=2a_n-2$。則 $a_5=$？'
        options: ['$10$', '$16$', '$18$', '$34$', '$48$']
        hint: '可以一項一項算；也可以先看每一項比 $2$ 多多少。'
        explain: '逐項算：$3,4,6,10,18$，所以 $a_5=18$。另一種看法：$2$ 是不動點（$c=2c-2$），$a_n-2$ 依序是 $1,2,4,8,16$，每次乘 $2$，所以 $a_5=2+16=18$。選 $10$ 是只算到 $a_4$。'
      en:
        stem: 'A sequence has $a_1=3$ and $a_{n+1}=2a_n-2$. What is $a_5$?'
        options: ['$10$', '$16$', '$18$', '$34$', '$48$']
        hint: 'You can work term by term, or first look at how far each term is above $2$.'
        explain: 'Term by term: $3,4,6,10,18$, so $a_5=18$. Another view: $2$ is the fixed point ($c=2c-2$), and $a_n-2$ runs $1,2,4,8,16$, doubling each time, so $a_5=2+16=18$. Choosing $10$ means stopping at $a_4$.'
    answer: 2

  - id: q1@1

        explain: '$3^{40}$ 約有 $40\times 0.4771\approx 19.08$，也就是 $20$ 位，乘出來太長，取對數最省事。其他的數都很小：$2^{20}=1048576$（$7$ 位），$1.2^{3}=1.728$，$a_8=129$，$11^{4}=14641$，直接算或逐項推比較快。'
      en:
        stem: 'Each task below involves one number. In which task is that number more than $15$ digits long, so multiplying it out by hand is impractical and the common logarithm suits it best?'
        options: ['find the value of $2^{20}$', 'find how many digits $3^{40}$ has', 'find the value of $1.2^{3}$', 'for $a_1=2$, $a_{n+1}=2a_n-1$, find $a_8$', 'find the value of $11^{4}$']
        hint: 'Roughly estimate how many digits each number has first.'
        explain: '$\log 3^{40}\approx 40\times 0.4771\approx 19.08$, so $3^{40}$ has $20$ digits; multiplying it out is far too long, and a logarithm is the quickest tool. The others are small: $2^{20}=1048576$ ($7$ digits), $1.2^{3}=1.728$, $a_8=129$, $11^{4}=14641$; computing directly or term by term is faster.'
    answer: 1


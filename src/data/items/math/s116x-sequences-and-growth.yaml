  - id: q7@1
    type: multi
    origin: original
    codes: [math:N-10-4]
    verify: m_s116x_sequences_and_growth:sg_compare_powers
    text:
      zh-tw:
        stem: '已知 $\log 2\approx 0.3010$、$\log 3\approx 0.4771$。關於 $2^{40}$ 與 $3^{25}$，下列哪些敘述正確？（多選）'
        options: ['$2^{40}>3^{25}$', '$2^{40}$ 是 $13$ 位數', '$3^{25}$ 是 $12$ 位數', '$2^{8}<3^{5}$', '$\dfrac{2^{40}}{3^{25}}>10$']
        hint: '可以比較 $40\log 2$ 和 $25\log 3$；也可以把兩個數都寫成某個數的 $5$ 次方。'
        explain: '對數：$\log 2^{40}\approx 12.04$，$\log 3^{25}\approx 11.93$，所以 $2^{40}>3^{25}$，分別是 $13$ 位和 $12$ 位，(1)(2)(3) 正確。夾擠：$2^{8}=256>243=3^{5}$，(4) 錯；兩邊 $5$ 次方得 $2^{40}>3^{25}$，與對數的結論一致。(5) $\log\dfrac{2^{40}}{3^{25}}\approx 12.04-11.93=0.11<1$，比值約 $1.3$，不到 $10$，錯。所以選 (1)(2)(3)。'
      en:
        stem: 'Given $\log 2\approx 0.3010$ and $\log 3\approx 0.4771$, which statements about $2^{40}$ and $3^{25}$ are true? (Choose all that apply.)'
        options: ['$2^{40}>3^{25}$', '$2^{40}$ has $13$ digits', '$3^{25}$ has $12$ digits', '$2^{8}<3^{5}$', '$\dfrac{2^{40}}{3^{25}}>10$']
        hint: 'Compare $40\log 2$ with $25\log 3$; or write both numbers as fifth powers.'
        explain: 'Logarithms: $\log 2^{40}\approx 12.04$ and $\log 3^{25}\approx 11.93$, so $2^{40}>3^{25}$, with $13$ and $12$ digits: (1)(2)(3) are true. Bounds: $2^{8}=256>243=3^{5}$, so (4) is false; raising both sides to the fifth power gives $2^{40}>3^{25}$, agreeing with the logarithms. (5) $\log\dfrac{2^{40}}{3^{25}}\approx 12.04-11.93=0.11<1$; the ratio is about $1.3$, not more than $10$: false. The answer is (1)(2)(3).'
    answer: [0, 1, 2]

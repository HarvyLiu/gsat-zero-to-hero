  - id: q-turn@1
    type: single
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_turn_area
    text:
      zh-tw:
        stem: '三角形的兩邊長是 $6$ 和 $8$，這兩邊的夾角是 $30^\circ$。這個三角形的面積是多少？'
        options: ['$12$', '$24$', '$12\sqrt{3}$', '$24\sqrt{3}$', '$48$']
        hint: '把長 $8$ 的邊當底。長 $6$ 的邊的另一端離底邊多高？'
        explain: '以長 $8$ 的邊為底，高是 $6\sin 30^\circ=3$，所以面積是 $\frac{1}{2}\times 8\times 3=12$。也就是 $\frac{1}{2}\times 6\times 8\times\sin 30^\circ=12$。'
      en:
        stem: 'A triangle has two sides of length $6$ and $8$, and the angle between them is $30^\circ$. What is its area?'
        options: ['$12$', '$24$', '$12\sqrt{3}$', '$24\sqrt{3}$', '$48$']
        hint: 'Take the side of length $8$ as the base. How high above the base is the far end of the side of length $6$?'
        explain: 'With the side of length $8$ as the base, the height is $6\sin 30^\circ=3$, so the area is $\frac{1}{2}\times 8\times 3=12$. In one line: $\frac{1}{2}\times 6\times 8\times\sin 30^\circ=12$.'
    answer: 0

  - id: q1@1
    type: fill
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_area_sas
    text:
      zh-tw:
        stem: '在 $\triangle ABC$ 中，$\overline{AB}=8$、$\overline{AC}=5$、$\angle A=150^\circ$，則 $\triangle ABC$ 的面積為 ①②。'
        hint: '兩邊和它們的夾角都知道了，用 $\frac{1}{2}bc\sin A$。'
        explain: '面積 $=\frac{1}{2}\times 8\times 5\times\sin 150^\circ=20\times\frac{1}{2}=10$。$\sin 150^\circ=\sin 30^\circ=\frac{1}{2}$，鈍角也能直接代入公式。'
      en:
        stem: 'In $\triangle ABC$, $\overline{AB}=8$, $\overline{AC}=5$ and $\angle A=150^\circ$. The area of $\triangle ABC$ is ①②.'
        hint: 'You know two sides and the angle between them: use $\frac{1}{2}bc\sin A$.'
        explain: 'Area $=\frac{1}{2}\times 8\times 5\times\sin 150^\circ=20\times\frac{1}{2}=10$. Since $\sin 150^\circ=\sin 30^\circ=\frac{1}{2}$, an obtuse angle goes straight into the formula.'
    answer: ['1', '0']

  - id: q2@1
    type: single
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_sines_side
    text:
      zh-tw:
        stem: '在 $\triangle ABC$ 中，$\angle A=30^\circ$、$\angle B=45^\circ$、$a=6$，則 $b=$？'
        options: ['$3\sqrt{2}$', '$6\sqrt{2}$', '$6\sqrt{3}$', '$12$', '$3\sqrt{6}$']
        hint: '已知兩角和一邊，用正弦定理 $\frac{a}{\sin A}=\frac{b}{\sin B}$。'
        explain: '$b=\frac{a\sin B}{\sin A}=\frac{6\times\frac{\sqrt{2}}{2}}{\frac{1}{2}}=6\sqrt{2}$。檢查：$\angle B>\angle A$，所以 $b>a$，合理。'
      en:
        stem: 'In $\triangle ABC$, $\angle A=30^\circ$, $\angle B=45^\circ$ and $a=6$. What is $b$?'
        options: ['$3\sqrt{2}$', '$6\sqrt{2}$', '$6\sqrt{3}$', '$12$', '$3\sqrt{6}$']
        hint: 'Two angles and a side are known: use the law of sines, $\frac{a}{\sin A}=\frac{b}{\sin B}$.'
        explain: '$b=\frac{a\sin B}{\sin A}=\frac{6\times\frac{\sqrt{2}}{2}}{\frac{1}{2}}=6\sqrt{2}$. Check: $\angle B>\angle A$, so $b>a$, which fits.'
    answer: 1

  - id: q3@1
    type: fill
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_circumradius
    text:
      zh-tw:
        stem: '在 $\triangle ABC$ 中，$\angle A=120^\circ$、$a=6\sqrt{3}$，則 $\triangle ABC$ 的外接圓半徑為 ①。'
        hint: '正弦定理的比值等於外接圓的直徑：$\frac{a}{\sin A}=2R$。'
        explain: '$2R=\frac{a}{\sin A}=\frac{6\sqrt{3}}{\frac{\sqrt{3}}{2}}=12$，所以 $R=6$。注意比值是直徑 $2R$，不是半徑。'
      en:
        stem: 'In $\triangle ABC$, $\angle A=120^\circ$ and $a=6\sqrt{3}$. The radius of the circumcircle of $\triangle ABC$ is ①.'
        hint: 'The ratio in the law of sines is the diameter of the circumcircle: $\frac{a}{\sin A}=2R$.'
        explain: '$2R=\frac{a}{\sin A}=\frac{6\sqrt{3}}{\frac{\sqrt{3}}{2}}=12$, so $R=6$. The ratio is the diameter $2R$, not the radius.'
    answer: ['6']

  - id: q4@1
    type: fill
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_cosines_side
    text:
      zh-tw:
        stem: '在 $\triangle ABC$ 中，$b=7$、$c=8$、$\angle A=120^\circ$，則 $a=$ ①②。'
        hint: '兩邊夾一角，用餘弦定理 $a^2=b^2+c^2-2bc\cos A$。$\cos 120^\circ$ 是負的。'
        explain: '$a^2=49+64-2\times 7\times 8\times\left(-\frac{1}{2}\right)=113+56=169$，所以 $a=13$。$\cos 120^\circ=-\frac{1}{2}$，減去負數等於加上 $56$。'
      en:
        stem: 'In $\triangle ABC$, $b=7$, $c=8$ and $\angle A=120^\circ$. Then $a=$ ①②.'
        hint: 'Two sides and the angle between them: use the law of cosines, $a^2=b^2+c^2-2bc\cos A$. Note that $\cos 120^\circ$ is negative.'
        explain: '$a^2=49+64-2\times 7\times 8\times\left(-\frac{1}{2}\right)=113+56=169$, so $a=13$. Since $\cos 120^\circ=-\frac{1}{2}$, subtracting a negative adds $56$.'
    answer: ['1', '3']

  - id: q5@1
    type: multi
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_triangle_568
    text:
      zh-tw:
        stem: '$\triangle ABC$ 的三邊長為 $a=5$、$b=6$、$c=8$。下列哪些敘述正確？（多選）'
        options: ['$\angle C$ 是最大的角', '$\cos C=-\frac{1}{20}$', '$\triangle ABC$ 是鈍角三角形', '$\sin A:\sin B=6:5$', '$\triangle ABC$ 的外接圓半徑小於 $4$']
        hint: '大邊對大角；$\cos C$ 用餘弦定理；外接圓半徑用 $\frac{c}{\sin C}=2R$，想想 $\sin C$ 和 $1$ 的大小。'
        explain: '最長邊 $c=8$ 對的 $\angle C$ 最大。$\cos C=\frac{25+36-64}{2\times 5\times 6}=-\frac{3}{60}=-\frac{1}{20}<0$，所以 $\angle C$ 是鈍角。由正弦定理 $\sin A:\sin B=a:b=5:6$，不是 $6:5$。又 $2R=\frac{8}{\sin C}$，而 $\sin C<1$，所以 $2R>8$、$R>4$。選 (1)(2)(3)。'
      en:
        stem: '$\triangle ABC$ has sides $a=5$, $b=6$ and $c=8$. Which statements are true? (Choose all that apply.)'
        options: ['$\angle C$ is the largest angle', '$\cos C=-\frac{1}{20}$', '$\triangle ABC$ is an obtuse triangle', '$\sin A:\sin B=6:5$', 'the circumradius of $\triangle ABC$ is less than $4$']
        hint: 'The longest side faces the largest angle; find $\cos C$ with the law of cosines; for the circumradius use $\frac{c}{\sin C}=2R$ and compare $\sin C$ with $1$.'
        explain: 'The longest side $c=8$ faces $\angle C$, so $\angle C$ is the largest. $\cos C=\frac{25+36-64}{2\times 5\times 6}=-\frac{3}{60}=-\frac{1}{20}<0$, so $\angle C$ is obtuse. By the law of sines $\sin A:\sin B=a:b=5:6$, not $6:5$. And $2R=\frac{8}{\sin C}$ with $\sin C<1$, so $2R>8$ and $R>4$. The answer is (1)(2)(3).'
    answer: [0, 1, 2]

  - id: q6@1
    type: fill
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_area_sss
    text:
      zh-tw:
        stem: '三角形的三邊長為 $3$、$7$、$8$，它的面積可寫成 $m\sqrt{n}$（$m$、$n$ 是正整數，$n$ 不是完全平方數），則 $m=$ ①，$n=$ ②。'
        hint: '先用餘弦定理求長 $7$ 的邊所對的角，再用 $\frac{1}{2}ab\sin C$。'
        explain: '長 $7$ 的邊所對的角 $\theta$ 滿足 $\cos\theta=\frac{9+64-49}{2\times 3\times 8}=\frac{24}{48}=\frac{1}{2}$，所以 $\theta=60^\circ$。面積 $=\frac{1}{2}\times 3\times 8\times\sin 60^\circ=12\times\frac{\sqrt{3}}{2}=6\sqrt{3}$。'
      en:
        stem: 'A triangle has sides $3$, $7$ and $8$. Its area can be written $m\sqrt{n}$, where $m$ and $n$ are positive integers and $n$ is not a perfect square. Then $m=$ ① and $n=$ ②.'
        hint: 'First find the angle facing the side of length $7$ with the law of cosines, then use $\frac{1}{2}ab\sin C$.'
        explain: 'The angle $\theta$ facing the side of length $7$ has $\cos\theta=\frac{9+64-49}{2\times 3\times 8}=\frac{24}{48}=\frac{1}{2}$, so $\theta=60^\circ$. Area $=\frac{1}{2}\times 3\times 8\times\sin 60^\circ=12\times\frac{\sqrt{3}}{2}=6\sqrt{3}$.'
    answer: ['6', '3']

  - id: q7@1
    type: fill
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_lines_angle
    text:
      zh-tw:
        stem: '直線 $L_1:x-\sqrt{3}y=0$ 與 $L_2:x+y=1$ 相交，兩直線所夾的銳角是 ①② 度。'
        hint: '先求兩條直線的斜率，再由「斜率 $=\tan\theta$」找出各自的斜角 $\theta$（$0^\circ\le\theta<180^\circ$）。'
        explain: '$L_1$ 的斜率是 $\frac{1}{\sqrt{3}}$，斜角 $30^\circ$；$L_2$ 的斜率是 $-1$，斜角 $135^\circ$。兩斜角相差 $105^\circ$，所以兩直線的夾角是 $105^\circ$ 和 $180^\circ-105^\circ=75^\circ$，銳角是 $75^\circ$。'
      en:
        stem: 'The lines $L_1:x-\sqrt{3}y=0$ and $L_2:x+y=1$ meet. The acute angle between them is ①② degrees.'
        hint: 'Find each slope, then use "slope $=\tan\theta$" to get each angle of inclination $\theta$ ($0^\circ\le\theta<180^\circ$).'
        explain: '$L_1$ has slope $\frac{1}{\sqrt{3}}$, so its angle of inclination is $30^\circ$; $L_2$ has slope $-1$, so its angle is $135^\circ$. They differ by $105^\circ$, so the lines meet at angles $105^\circ$ and $180^\circ-105^\circ=75^\circ$; the acute one is $75^\circ$.'
    answer: ['7', '5']

  - id: q8@1
    type: single
    origin: original
    codes: [math:G-10-7]
    verify: m_s116_sine_cosine_laws:slc_cuboid_angle
    text:
      zh-tw:
        stem: '長方體 $ABCD\text{-}EFGH$ 的底面是 $ABCD$，$E$、$F$、$G$、$H$ 分別在 $A$、$B$、$C$、$D$ 的正上方，且 $\overline{AB}=3$、$\overline{AD}=4$、$\overline{AE}=5$。在截面 $ACGE$ 上，$\angle GAC$ 是多少度？'
        options: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$75^\circ$', '$90^\circ$']
        hint: '截面 $ACGE$ 是長方形。先求底面對角線 $\overline{AC}$，再看直角三角形 $ACG$。'
        explain: '$\overline{AC}=\sqrt{3^2+4^2}=5$，$\overline{CG}=\overline{AE}=5$，而 $\angle ACG=90^\circ$。所以 $\tan\angle GAC=\frac{5}{5}=1$，$\angle GAC=45^\circ$。'
      en:
        stem: 'In the cuboid $ABCD\text{-}EFGH$, the base is $ABCD$ and $E$, $F$, $G$, $H$ lie directly above $A$, $B$, $C$, $D$, with $\overline{AB}=3$, $\overline{AD}=4$ and $\overline{AE}=5$. In the cross-section $ACGE$, what is $\angle GAC$?'
        options: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$75^\circ$', '$90^\circ$']
        hint: 'The cross-section $ACGE$ is a rectangle. Find the base diagonal $\overline{AC}$ first, then look at the right triangle $ACG$.'
        explain: '$\overline{AC}=\sqrt{3^2+4^2}=5$, $\overline{CG}=\overline{AE}=5$ and $\angle ACG=90^\circ$. So $\tan\angle GAC=\frac{5}{5}=1$ and $\angle GAC=45^\circ$.'
    answer: 1

items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_turn_counterexample
    text:
      zh-tw:
        stem: '設 $x$ 為實數。下列哪一個 $x$ 是敘述「若 $x^2>4$，則 $x>2$」的反例？'
        options: ['$x=3$', '$x=-3$', '$x=1$', '$x=2$', '$x=0$']
        hint: '反例要讓「若」後面的部分成立，「則」後面的部分不成立。'
        explain: '$x=-3$ 時 $x^2=9>4$ 成立，但 $x>2$ 不成立，所以它是反例。$x=3$ 兩部分都成立；$x=1$、$x=2$、$x=0$ 都不滿足 $x^2>4$（$2^2=4$ 不大於 $4$），不能拿來當反例。'
      en:
        stem: 'Let $x$ be a real number. Which $x$ is a counterexample to the statement “if $x^2>4$, then $x>2$”?'
        options: ['$x=3$', '$x=-3$', '$x=1$', '$x=2$', '$x=0$']
        hint: 'A counterexample makes the “if” part true and the “then” part false.'
        explain: 'For $x=-3$, $x^2=9>4$ is true but $x>2$ is false, so it is a counterexample. For $x=3$ both parts are true; $x=1$, $x=2$ and $x=0$ do not satisfy $x^2>4$ ($2^2=4$ is not greater than $4$), so none of them can be a counterexample.'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_negate_forall
    text:
      zh-tw:
        stem: '命題「所有實數 $x$ 都滿足 $x^2\ge x$」的否定是下列哪一個？'
        options: ['所有實數 $x$ 都滿足 $x^2<x$', '存在實數 $x$ 滿足 $x^2<x$', '存在實數 $x$ 滿足 $x^2\ge x$', '沒有實數 $x$ 滿足 $x^2\ge x$', '沒有實數 $x$ 滿足 $x^2<x$']
        hint: '「所有都成立」的否定，是「至少有一個不成立」。'
        explain: '「所有 $x$ 都滿足」的否定是「存在 $x$ 不滿足」，而「不滿足 $x^2\ge x$」就是 $x^2<x$，所以選 (2)。選項 (1) 太強了，它不是否定；選項 (5) 和原命題意思相同。原命題其實是假的：$x=\frac{1}{2}$ 時 $x^2=\frac{1}{4}<\frac{1}{2}$，所以它的否定 (2) 是真的。'
      en:
        stem: 'Which is the negation of the proposition “every real number $x$ satisfies $x^2\ge x$”?'
        options: ['every real number $x$ satisfies $x^2<x$', 'there is a real number $x$ with $x^2<x$', 'there is a real number $x$ with $x^2\ge x$', 'no real number $x$ satisfies $x^2\ge x$', 'no real number $x$ satisfies $x^2<x$']
        hint: 'The negation of “it holds for all” is “it fails for at least one”.'
        explain: 'The negation of “every $x$ satisfies it” is “some $x$ does not satisfy it”, and “not $x^2\ge x$” is $x^2<x$, so the answer is (2). Option (1) is too strong to be the negation; option (5) says the same as the original. The original is in fact false: for $x=\frac{1}{2}$, $x^2=\frac{1}{4}<\frac{1}{2}$, so its negation (2) is true.'
    answer: 1

  - id: q2@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_and_or_truth
    text:
      zh-tw:
        stem: '下列哪一個命題為真？'
        options: ['$\sqrt{4}$ 是無理數或 $3$ 是偶數', '$2$ 是質數且 $2$ 是奇數', '$\pi$ 是無理數或 $\pi>4$', '$5$ 是質數且 $5^2<20$', '$-3>-2$ 或 $(-3)^2<(-2)^2$']
        hint: '「且」要兩部分都真才真；「或」只要有一部分真就真。'
        explain: '(1) $\sqrt{4}=2$ 是有理數，$3$ 是奇數，兩部分都假，所以假。(2) $2$ 是質數，但不是奇數，「且」的一部分假，所以假。(3) $\pi$ 是無理數，「或」有一部分真就真。(4) $5^2=25$ 不小於 $20$，所以假。(5) $-3<-2$，而 $(-3)^2=9>4=(-2)^2$，兩部分都假。所以選 (3)。'
      en:
        stem: 'Which proposition is true?'
        options: ['$\sqrt{4}$ is irrational or $3$ is even', '$2$ is prime and $2$ is odd', '$\pi$ is irrational or $\pi>4$', '$5$ is prime and $5^2<20$', '$-3>-2$ or $(-3)^2<(-2)^2$']
        hint: '“And” is true only when both parts are true; “or” is true as soon as one part is true.'
        explain: '(1) $\sqrt{4}=2$ is rational and $3$ is odd: both parts false, so false. (2) $2$ is prime but not odd: one part of the “and” is false, so false. (3) $\pi$ is irrational, and one true part makes an “or” true. (4) $5^2=25$ is not less than $20$, so false. (5) $-3<-2$, and $(-3)^2=9>4=(-2)^2$: both parts false. So the answer is (3).'
    answer: 2

  - id: q3@1
    type: fill
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_count_even_or_mult3
    text:
      zh-tw:
        stem: '在 $1$ 到 $30$ 的整數 $n$ 中，使命題「$n$ 是偶數或 $n$ 是 $3$ 的倍數」為真的 $n$ 共有 ①② 個。'
        hint: '數學上的「或」包含兩者都成立的情況。偶數和 $3$ 的倍數各有幾個？哪些被數了兩次？'
        explain: '偶數有 $15$ 個，$3$ 的倍數有 $10$ 個，兩者都是的（$6$ 的倍數）有 $5$ 個，被數了兩次。所以共有 $15+10-5=20$ 個。'
      en:
        stem: 'Among the integers $n$ from $1$ to $30$, the number of $n$ that make the proposition “$n$ is even or $n$ is a multiple of $3$” true is ①②.'
        hint: 'In mathematics “or” includes the case where both parts hold. How many even numbers and how many multiples of $3$ are there? Which ones were counted twice?'
        explain: 'There are $15$ even numbers and $10$ multiples of $3$; the $5$ numbers that are both (the multiples of $6$) were counted twice. So the count is $15+10-5=20$.'
    answer: ['2', '0']

  - id: q4@1
    type: multi
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_which_implications
    text:
      zh-tw:
        stem: '設 $x$ 為實數。下列哪些敘述為真？（多選）'
        options: ['若 $x>3$，則 $x^2>9$', '若 $x^2>9$，則 $x>3$', '若 $|x|<1$，則 $x<1$', '若 $x<1$，則 $|x|<1$', '若 $x^2<0$，則 $x>5$']
        hint: '要說一個「若…則…」是假的，只要找到一個反例。'
        explain: '(1) 真：$x>3$ 時 $x^2>9$。(2) 假：反例 $x=-4$，$x^2=16>9$，但 $x>3$ 不成立。(3) 真：$|x|<1$ 表示 $-1<x<1$。(4) 假：反例 $x=-2$。(5) 真：沒有實數滿足 $x^2<0$，前提永遠不成立，找不到反例，所以這個敘述為真。所以選 (1)(3)(5)。'
      en:
        stem: 'Let $x$ be a real number. Which statements are true? (Choose all that apply.)'
        options: ['if $x>3$, then $x^2>9$', 'if $x^2>9$, then $x>3$', 'if $|x|<1$, then $x<1$', 'if $x<1$, then $|x|<1$', 'if $x^2<0$, then $x>5$']
        hint: 'To show an “if … then …” statement is false, one counterexample is enough.'
        explain: '(1) True: if $x>3$ then $x^2>9$. (2) False: take $x=-4$; $x^2=16>9$, but $x>3$ fails. (3) True: $|x|<1$ means $-1<x<1$. (4) False: take $x=-2$. (5) True: no real number has $x^2<0$, so the hypothesis never holds and there is no counterexample; the statement is true. So the answer is (1)(3)(5).'
    answer: [0, 2, 4]

  - id: q5@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_condition_kind
    text:
      zh-tw:
        stem: '設 $x$ 為實數。「$x^2-5x+6=0$」是「$x=2$」的什麼條件？'
        options: ['充分條件，但不是必要條件', '必要條件，但不是充分條件', '充要條件', '既不是充分條件，也不是必要條件']
        hint: '分別檢查「若 $x^2-5x+6=0$，則 $x=2$」和「若 $x=2$，則 $x^2-5x+6=0$」。'
        explain: '$x^2-5x+6=(x-2)(x-3)=0$ 的解是 $x=2$ 或 $x=3$。「若 $x=2$，則 $x^2-5x+6=0$」為真，所以它是必要條件；「若 $x^2-5x+6=0$，則 $x=2$」有反例 $x=3$，所以不是充分條件。選 (2)。'
      en:
        stem: 'Let $x$ be a real number. What kind of condition is “$x^2-5x+6=0$” for “$x=2$”?'
        options: ['sufficient, but not necessary', 'necessary, but not sufficient', 'necessary and sufficient', 'neither sufficient nor necessary']
        hint: 'Check “if $x^2-5x+6=0$, then $x=2$” and “if $x=2$, then $x^2-5x+6=0$” separately.'
        explain: '$x^2-5x+6=(x-2)(x-3)=0$ has the solutions $x=2$ and $x=3$. “If $x=2$, then $x^2-5x+6=0$” is true, so it is a necessary condition; “if $x^2-5x+6=0$, then $x=2$” has the counterexample $x=3$, so it is not sufficient. The answer is (2).'
    answer: 1

  - id: q6@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_negate_or
    text:
      zh-tw:
        stem: '設 $a$、$b$ 為給定的實數。命題「$a\ge 1$ 或 $b<0$」的否定是下列哪一個？'
        options: ['$a<1$ 或 $b\ge 0$', '$a<1$ 且 $b\ge 0$', '$a\le 1$ 且 $b>0$', '$a\ge 1$ 且 $b<0$', '$a<1$ 且 $b>0$']
        hint: '否定「或」的命題時，「或」要換成「且」，兩部分也都要否定。'
        explain: '「$p$ 或 $q$」的否定是「$p$ 不成立且 $q$ 不成立」。「$a\ge 1$」不成立就是 $a<1$，「$b<0$」不成立就是 $b\ge 0$，所以選 (2)。選項 (1) 忘了把「或」換成「且」；選項 (3)、(5) 把等號的情況弄錯了，例如 $a=0$、$b=0$ 時原命題為假，否定應該為真，但 (3)、(5) 都是假的。'
      en:
        stem: 'Let $a$ and $b$ be given real numbers. Which is the negation of the proposition “$a\ge 1$ or $b<0$”?'
        options: ['$a<1$ or $b\ge 0$', '$a<1$ and $b\ge 0$', '$a\le 1$ and $b>0$', '$a\ge 1$ and $b<0$', '$a<1$ and $b>0$']
        hint: 'When you negate an “or” proposition, “or” becomes “and”, and both parts are negated.'
        explain: 'The negation of “$p$ or $q$” is “$p$ fails and $q$ fails”. “$a\ge 1$” fails exactly when $a<1$, and “$b<0$” fails exactly when $b\ge 0$, so the answer is (2). Option (1) forgets to change “or” into “and”; options (3) and (5) get the equal case wrong: for $a=0$, $b=0$ the original is false, so its negation should be true, but (3) and (5) are both false.'
    answer: 1

  - id: q7@1
    type: single
    origin: original
    codes: [math:N-10-7]
    verify: m_s116_logic_toolbox:lg_condition_abs
    text:
      zh-tw:
        stem: '設 $x$ 為實數。「$|x|=x$」是「$x\ge 0$」的什麼條件？'
        options: ['充分條件，但不是必要條件', '必要條件，但不是充分條件', '充要條件', '既不是充分條件，也不是必要條件']
        hint: '分別檢查兩個方向。$x$ 是負數時，$|x|$ 等於什麼？'
        explain: '若 $x\ge 0$，則 $|x|=x$，所以「若 $x\ge 0$，則 $|x|=x$」為真。若 $x<0$，則 $|x|=-x>0>x$，所以 $|x|\ne x$；也就是說 $|x|=x$ 時 $x$ 不可能是負數，「若 $|x|=x$，則 $x\ge 0$」也為真。兩個方向都為真，所以是充要條件，選 (3)。'
      en:
        stem: 'Let $x$ be a real number. What kind of condition is “$|x|=x$” for “$x\ge 0$”?'
        options: ['sufficient, but not necessary', 'necessary, but not sufficient', 'necessary and sufficient', 'neither sufficient nor necessary']
        hint: 'Check the two directions separately. What is $|x|$ when $x$ is negative?'
        explain: 'If $x\ge 0$, then $|x|=x$, so “if $x\ge 0$, then $|x|=x$” is true. If $x<0$, then $|x|=-x>0>x$, so $|x|\ne x$; in other words, when $|x|=x$ the number $x$ cannot be negative, so “if $|x|=x$, then $x\ge 0$” is true as well. Both directions are true, so it is necessary and sufficient: the answer is (3).'
    answer: 2

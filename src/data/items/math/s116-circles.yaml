items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:G-10-3]
    verify: m_s116_circles:ci_turn_distance
    text:
      zh-tw:
        stem: '坐標平面上，下列哪一個點和點 $(1,2)$ 的距離恰好是 $5$？'
        options: ['$(4,6)$', '$(3,5)$', '$(5,4)$', '$(1,-2)$', '$(6,3)$']
        hint: '用距離公式：兩點的 $x$ 坐標差、$y$ 坐標差各平方，相加再開根號。'
        explain: '$(4,6)$ 和 $(1,2)$ 的坐標差是 $3$ 和 $4$，距離 $\sqrt{3^2+4^2}=5$。其他各點的距離分別是 $\sqrt{13}$、$\sqrt{20}$、$4$、$\sqrt{26}$，都不是 $5$。'
      en:
        stem: 'In the coordinate plane, which point is exactly $5$ away from the point $(1,2)$?'
        options: ['$(4,6)$', '$(3,5)$', '$(5,4)$', '$(1,-2)$', '$(6,3)$']
        hint: 'Use the distance formula: square the difference in $x$ and the difference in $y$, add, then take the square root.'
        explain: '$(4,6)$ differs from $(1,2)$ by $3$ and $4$, so the distance is $\sqrt{3^2+4^2}=5$. The other points are $\sqrt{13}$, $\sqrt{20}$, $4$ and $\sqrt{26}$ away, none of which is $5$.'
    answer: 0

  - id: q1@1
    type: single
    origin: original
    codes: [math:G-10-3]
    verify: m_s116_circles:ci_read_centre_radius
    text:
      zh-tw:
        stem: '圓 $(x+3)^2+(y-4)^2=9$ 的圓心與半徑為何？'
        options: ['圓心 $(-3,4)$，半徑 $3$', '圓心 $(3,-4)$，半徑 $3$', '圓心 $(-3,4)$，半徑 $9$', '圓心 $(3,-4)$，半徑 $9$', '圓心 $(-3,-4)$，半徑 $3$']
        hint: '把式子寫成 $(x-h)^2+(y-k)^2=r^2$ 的樣子：$x+3=x-(-3)$。'
        explain: '$(x+3)^2+(y-4)^2=9$ 就是 $(x-(-3))^2+(y-4)^2=3^2$，所以圓心是 $(-3,4)$，半徑是 $3$。等號右邊的 $9$ 是半徑的平方，不是半徑。'
      en:
        stem: 'What are the centre and radius of the circle $(x+3)^2+(y-4)^2=9$?'
        options: ['centre $(-3,4)$, radius $3$', 'centre $(3,-4)$, radius $3$', 'centre $(-3,4)$, radius $9$', 'centre $(3,-4)$, radius $9$', 'centre $(-3,-4)$, radius $3$']
        hint: 'Write it as $(x-h)^2+(y-k)^2=r^2$: $x+3=x-(-3)$.'
        explain: '$(x+3)^2+(y-4)^2=9$ is $(x-(-3))^2+(y-4)^2=3^2$, so the centre is $(-3,4)$ and the radius is $3$. The $9$ on the right is the square of the radius, not the radius.'
    answer: 0

  - id: q2@1
    type: fill
    origin: original
    codes: [math:G-10-3]
    verify: m_s116_circles:ci_r2_through_point
    text:
      zh-tw:
        stem: '圓心為 $(1,-2)$ 且通過點 $(4,4)$ 的圓，方程式可寫成 $(x-1)^2+(y+2)^2=r^2$，則 $r^2=$ ①②。'
        hint: '半徑就是圓心到 $(4,4)$ 的距離。'
        explain: '$r^2=(4-1)^2+(4-(-2))^2=9+36=45$。所以圓方程式是 $(x-1)^2+(y+2)^2=45$，半徑是 $\sqrt{45}=3\sqrt{5}$。'
      en:
        stem: 'The circle with centre $(1,-2)$ through the point $(4,4)$ has equation $(x-1)^2+(y+2)^2=r^2$. Then $r^2=$ ①②.'
        hint: 'The radius is the distance from the centre to $(4,4)$.'
        explain: '$r^2=(4-1)^2+(4-(-2))^2=9+36=45$. So the circle is $(x-1)^2+(y+2)^2=45$, with radius $\sqrt{45}=3\sqrt{5}$.'
    answer: ['4', '5']

  - id: q3@1
    type: single
    origin: original
    codes: [math:G-10-4]
    verify: m_s116_circles:ci_line_meets_circle
    text:
      zh-tw:
        stem: '直線 $3x+4y-12=0$ 與圓 $(x-1)^2+(y-1)^2=4$ 的關係為何？'
        options: ['相交於兩點', '恰交於一點（相切）', '沒有交點', '直線通過圓心', '交點有無限多個']
        hint: '算圓心到直線的距離 $d$，和半徑 $r$ 比較。'
        explain: '圓心 $(1,1)$、半徑 $r=2$。$d=\dfrac{\lvert 3+4-12\rvert}{\sqrt{3^2+4^2}}=\dfrac{5}{5}=1<2$，所以直線和圓相交於兩點。直線沒有通過圓心，因為 $3+4-12\ne 0$。'
      en:
        stem: 'How does the line $3x+4y-12=0$ meet the circle $(x-1)^2+(y-1)^2=4$?'
        options: ['in two points', 'in exactly one point (tangent)', 'not at all', 'the line passes through the centre', 'in infinitely many points']
        hint: 'Find the distance $d$ from the centre to the line and compare it with the radius $r$.'
        explain: 'The centre is $(1,1)$ and $r=2$. $d=\dfrac{\lvert 3+4-12\rvert}{\sqrt{3^2+4^2}}=\dfrac{5}{5}=1<2$, so the line meets the circle in two points. It does not pass through the centre, because $3+4-12\ne 0$.'
    answer: 0

  - id: q4@1
    type: fill
    origin: original
    codes: [math:G-10-4]
    verify: m_s116_circles:ci_tangent_intercept
    text:
      zh-tw:
        stem: '直線 $y=x+k$ 與圓 $x^2+y^2=8$ 相切，且 $k>0$，則 $k=$ ①。'
        hint: '相切代表圓心 $(0,0)$ 到直線的距離等於半徑 $2\sqrt{2}$。也可以代入後令判別式為 $0$。'
        explain: '直線寫成 $x-y+k=0$，圓心到直線的距離 $\dfrac{\lvert k\rvert}{\sqrt{2}}=2\sqrt{2}$，得 $\lvert k\rvert=4$。因為 $k>0$，所以 $k=4$。用代數方法：代入得 $2x^2+2kx+k^2-8=0$，判別式 $4k^2-8(k^2-8)=64-4k^2=0$，同樣得 $k=\pm 4$。'
      en:
        stem: 'The line $y=x+k$ is tangent to the circle $x^2+y^2=8$, and $k>0$. Then $k=$ ①.'
        hint: 'Tangent means the distance from the centre $(0,0)$ to the line equals the radius $2\sqrt{2}$. Or substitute and set the discriminant to $0$.'
        explain: 'Write the line as $x-y+k=0$. The distance from the centre is $\dfrac{\lvert k\rvert}{\sqrt{2}}=2\sqrt{2}$, so $\lvert k\rvert=4$, and since $k>0$, $k=4$. Algebraically: substituting gives $2x^2+2kx+k^2-8=0$, with discriminant $4k^2-8(k^2-8)=64-4k^2=0$, which again gives $k=\pm 4$.'
    answer: ['4']

  - id: q5@1
    type: multi
    origin: original
    codes: [math:G-10-3, math:G-10-4]
    verify: m_s116_circles:ci_statements
    text:
      zh-tw:
        stem: '設圓 $C:(x-2)^2+(y+1)^2=10$。下列哪些敘述正確？（多選）'
        options: ['點 $(5,0)$ 在 $C$ 上', '原點在 $C$ 的內部', '直線 $x=6$ 與 $C$ 有交點', '$C$ 的半徑是 $10$', '$C$ 的圓心是 $(-2,1)$']
        hint: '把點代入 $(x-2)^2+(y+1)^2$ 和 $10$ 比較；直線 $x=6$ 到圓心的距離是兩者 $x$ 坐標的差。'
        explain: '(1) $(5-2)^2+(0+1)^2=10$，在圓上。(2) $(0-2)^2+(0+1)^2=5<10$，在圓內。(3) 圓心 $(2,-1)$ 到 $x=6$ 的距離是 $4$，而半徑 $\sqrt{10}<4$，所以沒有交點。(4) 半徑是 $\sqrt{10}$，不是 $10$。(5) 圓心是 $(2,-1)$。所以選 (1)(2)。'
      en:
        stem: 'Let $C$ be the circle $(x-2)^2+(y+1)^2=10$. Which statements are true? (Choose all that apply.)'
        options: ['the point $(5,0)$ is on $C$', 'the origin is inside $C$', 'the line $x=6$ meets $C$', 'the radius of $C$ is $10$', 'the centre of $C$ is $(-2,1)$']
        hint: 'Substitute each point into $(x-2)^2+(y+1)^2$ and compare with $10$; the distance from the centre to $x=6$ is the difference of the $x$-coordinates.'
        explain: '(1) $(5-2)^2+(0+1)^2=10$: on the circle. (2) $(0-2)^2+(0+1)^2=5<10$: inside. (3) The centre $(2,-1)$ is $4$ away from $x=6$, and the radius is $\sqrt{10}<4$, so they do not meet. (4) The radius is $\sqrt{10}$, not $10$. (5) The centre is $(2,-1)$. So the answer is (1)(2).'
    answer: [0, 1]

  - id: q6@1
    type: fill
    origin: original
    codes: [math:G-10-4]
    verify: m_s116_circles:ci_tangent_at_point
    text:
      zh-tw:
        stem: '點 $P(4,-1)$ 在圓 $(x-1)^2+(y-3)^2=25$ 上。過 $P$ 的切線方程式可寫成 $3x+ay=b$，則 $a=$ ①②，$b=$ ③④。'
        hint: '切線和半徑 $\overline{CP}$ 垂直，圓心是 $C(1,3)$。'
        explain: '$\overline{CP}$ 的斜率是 $\dfrac{-1-3}{4-1}=-\dfrac{4}{3}$，所以切線斜率是 $\dfrac{3}{4}$：$y+1=\dfrac{3}{4}(x-4)$，整理得 $3x-4y=16$。所以 $a=-4$、$b=16$。'
      en:
        stem: 'The point $P(4,-1)$ is on the circle $(x-1)^2+(y-3)^2=25$. The tangent at $P$ can be written $3x+ay=b$. Then $a=$ ①② and $b=$ ③④.'
        hint: 'The tangent is perpendicular to the radius $\overline{CP}$, where the centre is $C(1,3)$.'
        explain: 'The slope of $\overline{CP}$ is $\dfrac{-1-3}{4-1}=-\dfrac{4}{3}$, so the tangent has slope $\dfrac{3}{4}$: $y+1=\dfrac{3}{4}(x-4)$, which tidies up to $3x-4y=16$. So $a=-4$ and $b=16$.'
    answer: ['−', '4', '1', '6']

  - id: q7@1
    type: fill
    origin: original
    codes: [math:G-10-4]
    verify: m_s116_circles:ci_chord_length
    text:
      zh-tw:
        stem: '直線 $3x+4y=15$ 與圓 $x^2+y^2=25$ 交於 $A$、$B$ 兩點，則弦長 $\overline{AB}=$ ①。'
        hint: '先算圓心到直線的距離 $d$，弦長是 $2\sqrt{r^2-d^2}$。'
        explain: '圓心 $(0,0)$ 到直線的距離 $d=\dfrac{\lvert -15\rvert}{\sqrt{3^2+4^2}}=3$，半徑 $r=5$。弦長 $=2\sqrt{5^2-3^2}=2\cdot 4=8$。（直接解聯立也可以：兩交點是 $(5,0)$ 與 $\left(-\frac{7}{5},\frac{24}{5}\right)$，距離是 $8$。）'
      en:
        stem: 'The line $3x+4y=15$ meets the circle $x^2+y^2=25$ at $A$ and $B$. Then the chord length $\overline{AB}=$ ①.'
        hint: 'Find the distance $d$ from the centre to the line first; the chord length is $2\sqrt{r^2-d^2}$.'
        explain: 'The distance from the centre $(0,0)$ to the line is $d=\dfrac{\lvert -15\rvert}{\sqrt{3^2+4^2}}=3$, and the radius is $r=5$. The chord length is $2\sqrt{5^2-3^2}=2\cdot 4=8$. (Solving the system also works: the meeting points are $(5,0)$ and $\left(-\frac{7}{5},\frac{24}{5}\right)$, which are $8$ apart.)'
    answer: ['8']

  - id: q8@1
    type: fill
    origin: original
    codes: [math:G-10-4]
    verify: m_s116_circles:ci_tangent_length
    text:
      zh-tw:
        stem: '從點 $P(7,5)$ 對圓 $(x-1)^2+(y-2)^2=9$ 作切線，切點為 $T$，則切線段長 $\overline{PT}=$ ①。'
        hint: '半徑 $\overline{CT}$ 和切線垂直，所以 $\triangle CTP$ 是直角三角形。'
        explain: '圓心 $C(1,2)$、半徑 $3$。$\overline{PC}^2=(7-1)^2+(5-2)^2=45$。因為 $\overline{CT}\perp\overline{PT}$，由畢氏定理 $\overline{PT}=\sqrt{45-3^2}=\sqrt{36}=6$。'
      en:
        stem: 'From the point $P(7,5)$ a tangent is drawn to the circle $(x-1)^2+(y-2)^2=9$, touching it at $T$. Then the tangent length $\overline{PT}=$ ①.'
        hint: 'The radius $\overline{CT}$ is perpendicular to the tangent, so $\triangle CTP$ has a right angle.'
        explain: 'The centre is $C(1,2)$ and the radius is $3$. $\overline{PC}^2=(7-1)^2+(5-2)^2=45$. Since $\overline{CT}\perp\overline{PT}$, the Pythagorean theorem gives $\overline{PT}=\sqrt{45-3^2}=\sqrt{36}=6$.'
    answer: ['6']

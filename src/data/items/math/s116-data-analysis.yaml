chapter: math/s116-data-analysis
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_turn_spread
    text:
      zh-tw:
        stem: '甲組數據是 $68,70,72$，乙組數據是 $50,70,90$，兩組的平均數都是 $70$。兩組的標準差相比，下列何者正確？'
        options: ['甲組較大', '兩組一樣大', '乙組較大，是甲組的 $2$ 倍', '乙組較大，是甲組的 $10$ 倍']
        hint: '先看每個數據離平均數 $70$ 有多遠。'
        explain: '甲組的離差是 $-2,0,2$，乙組是 $-20,0,20$，每一個都是甲組的 $10$ 倍。標準差是「離差平方的平均再開根號」，所以乙組的標準差也是甲組的 $10$ 倍：甲組是 $\sqrt{\frac{8}{3}}$，乙組是 $\sqrt{\frac{800}{3}}=10\sqrt{\frac{8}{3}}$。平均數相同，不代表分散程度相同。'
      en:
        stem: 'Group A is $68,70,72$ and group B is $50,70,90$; both have mean $70$. Comparing their standard deviations, which statement is true?'
        options: ['A is larger', 'they are equal', 'B is larger, $2$ times A', 'B is larger, $10$ times A']
        hint: 'First look at how far each value is from the mean $70$.'
        explain: 'The deviations in A are $-2,0,2$ and in B they are $-20,0,20$, each $10$ times as big. The standard deviation is the square root of the mean of the squared deviations, so B has $10$ times the standard deviation of A: A has $\sqrt{\frac{8}{3}}$ and B has $\sqrt{\frac{800}{3}}=10\sqrt{\frac{8}{3}}$. The same mean does not mean the same spread.'
    answer: 3

  - id: q1@1
    type: fill
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_sd_value
    text:
      zh-tw:
        stem: '某生五次小考的成績是 $11,14,18,20,22$。這五個數據的標準差為 ?。'
        hint: '先算平均數，再算每個數據的離差平方，平均後開根號。'
        explain: '平均數是 $\frac{11+14+18+20+22}{5}=\frac{85}{5}=17$。離差是 $-6,-3,1,3,5$，平方和是 $36+9+1+9+25=80$，平均是 $\frac{80}{5}=16$，所以標準差是 $\sqrt{16}=4$。'
      en:
        stem: 'A student scored $11,14,18,20,22$ on five quizzes. The standard deviation of these five values is ?.'
        hint: 'Find the mean, then square each deviation, average the squares and take the square root.'
        explain: 'The mean is $\frac{11+14+18+20+22}{5}=\frac{85}{5}=17$. The deviations are $-6,-3,1,3,5$; their squares add to $36+9+1+9+25=80$, whose average is $\frac{80}{5}=16$. So the standard deviation is $\sqrt{16}=4$.'
    answer: ['4']

  - id: q2@1
    type: multi
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_linear_transform
    text:
      zh-tw:
        stem: '某班數學成績 $X$ 的平均數是 $64$、標準差是 $8$。老師把每位學生的成績調成 $Y=1.5X-20$。下列哪些選項正確？（多選）'
        options: ['$Y$ 的平均數是 $76$', '$Y$ 的標準差是 $12$', '$Y$ 的變異數是 $96$', '若改用 $W=100-X$，則 $W$ 的標準差是 $-8$', '每位學生在 $X$ 與 $Y$ 的標準化分數都相同']
        hint: '$Y=aX+b$ 時，平均數變成 $a\mu_X+b$，標準差變成 $\lvert a\rvert\sigma_X$。'
        explain: '$\mu_Y=1.5\cdot 64-20=76$，(1) 對。$\sigma_Y=1.5\cdot 8=12$，(2) 對。變異數是標準差的平方，$12^2=144$，不是 $1.5\cdot 64=96$，(3) 錯。$W=-X+100$ 的標準差是 $\lvert -1\rvert\cdot 8=8$，標準差不會是負的，(4) 錯。$\frac{Y-\mu_Y}{\sigma_Y}=\frac{1.5(X-\mu_X)}{1.5\sigma_X}=\frac{X-\mu_X}{\sigma_X}$，(5) 對。答案 (1)(2)(5)。'
      en:
        stem: 'The math scores $X$ of a class have mean $64$ and standard deviation $8$. The teacher changes every score to $Y=1.5X-20$. Which statements are true? (Choose all that apply.)'
        options: ['the mean of $Y$ is $76$', 'the standard deviation of $Y$ is $12$', 'the variance of $Y$ is $96$', 'with $W=100-X$ instead, the standard deviation of $W$ is $-8$', 'every student has the same standardized score in $X$ and in $Y$']
        hint: 'For $Y=aX+b$, the mean becomes $a\mu_X+b$ and the standard deviation becomes $\lvert a\rvert\sigma_X$.'
        explain: '$\mu_Y=1.5\cdot 64-20=76$: (1) is true. $\sigma_Y=1.5\cdot 8=12$: (2) is true. The variance is the square of the standard deviation, $12^2=144$, not $1.5\cdot 64=96$: (3) is false. $W=-X+100$ has standard deviation $\lvert -1\rvert\cdot 8=8$; a standard deviation is never negative, so (4) is false. $\frac{Y-\mu_Y}{\sigma_Y}=\frac{1.5(X-\mu_X)}{1.5\sigma_X}=\frac{X-\mu_X}{\sigma_X}$: (5) is true. The answer is (1)(2)(5).'
    answer: [0, 1, 4]

  - id: q3@1
    type: fill
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_percentile
    text:
      zh-tw:
        stem: '第 $k$ 百分位數的定義如下：把 $n$ 筆數據由小到大排好，若 $\frac{nk}{100}$ 是整數 $m$，取第 $m$ 與第 $m+1$ 筆的平均；若不是整數，取第 $\left\lceil\frac{nk}{100}\right\rceil$ 筆（大於 $\frac{nk}{100}$ 的最小整數）。依此定義，數據 $42,35,50,61,38,47,54,40,58,44$ 的第 $70$ 百分位數為 ?。'
        hint: '先排序。$10\cdot\frac{70}{100}$ 是不是整數？'
        explain: '排序後是 $35,38,40,42,44,47,50,54,58,61$。$\frac{10\cdot 70}{100}=7$ 是整數，所以取第 $7$ 與第 $8$ 筆的平均：$\frac{50+54}{2}=52$。只取第 $7$ 筆得 $50$ 是常見的錯。'
      en:
        stem: 'Define the $k$th percentile like this: sort the $n$ values from smallest to largest; if $\frac{nk}{100}$ is an integer $m$, take the average of the $m$th and $(m+1)$th values; if not, take the value in position $\left\lceil\frac{nk}{100}\right\rceil$ (the smallest integer greater than $\frac{nk}{100}$). By this definition, the $70$th percentile of $42,35,50,61,38,47,54,40,58,44$ is ?.'
        hint: 'Sort first. Is $10\cdot\frac{70}{100}$ an integer?'
        explain: 'Sorted: $35,38,40,42,44,47,50,54,58,61$. $\frac{10\cdot 70}{100}=7$ is an integer, so average the $7$th and $8$th values: $\frac{50+54}{2}=52$. Taking only the $7$th value, $50$, is the usual slip.'
    answer: ['5', '2']

  - id: q4@1
    type: single
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_r_transform
    text:
      zh-tw:
        stem: '二維數據 $(X,Y)$ 的相關係數是 $0.6$。令 $U=-2X+5$、$V=3Y-1$，則 $U$ 與 $V$ 的相關係數為何？'
        options: ['$0.6$', '$-0.6$', '$-3.6$', '$-0.2$', '$0.36$']
        hint: '相關係數不受「加減常數」和「乘正數」影響；乘負數會怎樣？'
        explain: '$U$ 的係數是 $-2$，$V$ 的係數是 $3$，兩者相乘是負的，所以相關係數只變號，大小不變：$-0.6$。相關係數一定在 $-1$ 和 $1$ 之間，(3) 的 $-3.6$ 不可能。'
      en:
        stem: 'Two-variable data $(X,Y)$ has correlation coefficient $0.6$. Let $U=-2X+5$ and $V=3Y-1$. What is the correlation coefficient of $U$ and $V$?'
        options: ['$0.6$', '$-0.6$', '$-3.6$', '$-0.2$', '$0.36$']
        hint: 'Adding a constant or multiplying by a positive number does not change the correlation coefficient. What does multiplying by a negative number do?'
        explain: 'The coefficient of $U$ is $-2$ and that of $V$ is $3$; their product is negative, so the correlation coefficient only changes sign, not size: $-0.6$. A correlation coefficient always lies between $-1$ and $1$, so $-3.6$ in (3) is impossible.'
    answer: 1

  - id: q5@1
    type: fill
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_regression_predict
    text:
      zh-tw:
        stem: '某二維數據 $(X,Y)$ 中，$\mu_X=10$、$\sigma_X=2$、$\mu_Y=50$、$\sigma_Y=6$，相關係數 $r=0.5$。用 $Y$ 對 $X$ 的迴歸直線，估計 $x=14$ 時的 $y$ 值為 ?。'
        hint: '迴歸直線是 $y-\mu_Y=r\cdot\dfrac{\sigma_Y}{\sigma_X}(x-\mu_X)$。'
        explain: '斜率是 $0.5\cdot\frac{6}{2}=1.5$，直線是 $y-50=1.5(x-10)$。代入 $x=14$：$y=50+1.5\cdot 4=56$。'
      en:
        stem: 'For two-variable data $(X,Y)$, $\mu_X=10$, $\sigma_X=2$, $\mu_Y=50$, $\sigma_Y=6$ and the correlation coefficient is $r=0.5$. Using the regression line of $Y$ on $X$, the estimated $y$ when $x=14$ is ?.'
        hint: 'The regression line is $y-\mu_Y=r\cdot\dfrac{\sigma_Y}{\sigma_X}(x-\mu_X)$.'
        explain: 'The slope is $0.5\cdot\frac{6}{2}=1.5$, so the line is $y-50=1.5(x-10)$. At $x=14$: $y=50+1.5\cdot 4=56$.'
    answer: ['5', '6']

  - id: q6@1
    type: multi
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_scatter_statements
    text:
      zh-tw:
        stem: '二維數據有五筆：$(2,9)$、$(4,7)$、$(6,8)$、$(8,4)$、$(10,2)$。下列哪些選項正確？（多選）'
        options: ['$X$ 與 $Y$ 為負相關', '$Y$ 對 $X$ 的迴歸直線斜率是 $-0.85$', '迴歸直線通過點 $(6,6)$', '相關係數等於迴歸直線的斜率', '若把每個 $y$ 值都加 $10$，相關係數會變大']
        hint: '先算 $\mu_X$、$\mu_Y$ 和每一點的離差，迴歸直線的斜率是「離差乘積和」除以「$x$ 離差平方和」。'
        explain: '$\mu_X=6$、$\mu_Y=6$。$x$ 的離差是 $-4,-2,0,2,4$，$y$ 的離差是 $3,1,2,-2,-4$，乘積和是 $-12-2+0-4-16=-34<0$，所以負相關，(1) 對。$x$ 離差平方和是 $40$，斜率 $\frac{-34}{40}=-0.85$，(2) 對。迴歸直線一定通過 $(\mu_X,\mu_Y)=(6,6)$，(3) 對。$y$ 離差平方和是 $34$，$r=\frac{-34}{\sqrt{40\cdot 34}}\approx -0.92$，和斜率不同；斜率是 $r\cdot\frac{\sigma_Y}{\sigma_X}$，$r\ne 0$ 時只有 $\sigma_X=\sigma_Y$ 兩者才相等，(4) 錯。每個 $y$ 都加 $10$，離差不變，相關係數不變，(5) 錯。答案 (1)(2)(3)。'
      en:
        stem: 'Two-variable data has five points: $(2,9)$, $(4,7)$, $(6,8)$, $(8,4)$, $(10,2)$. Which statements are true? (Choose all that apply.)'
        options: ['$X$ and $Y$ are negatively correlated', 'the regression line of $Y$ on $X$ has slope $-0.85$', 'the regression line passes through $(6,6)$', 'the correlation coefficient equals the slope of the regression line', 'adding $10$ to every $y$ value makes the correlation coefficient larger']
        hint: 'Find $\mu_X$, $\mu_Y$ and every deviation first. The slope of the regression line is the sum of the deviation products divided by the sum of the squared $x$ deviations.'
        explain: '$\mu_X=6$ and $\mu_Y=6$. The $x$ deviations are $-4,-2,0,2,4$ and the $y$ deviations are $3,1,2,-2,-4$; the products add to $-12-2+0-4-16=-34<0$, so the correlation is negative: (1) is true. The squared $x$ deviations add to $40$, so the slope is $\frac{-34}{40}=-0.85$: (2) is true. The regression line always passes through $(\mu_X,\mu_Y)=(6,6)$: (3) is true. The squared $y$ deviations add to $34$, so $r=\frac{-34}{\sqrt{40\cdot 34}}\approx -0.92$, not the slope; the slope is $r\cdot\frac{\sigma_Y}{\sigma_X}$, so when $r\ne 0$ the two are equal only if $\sigma_X=\sigma_Y$: (4) is false. Adding $10$ to every $y$ leaves the deviations, and so the correlation coefficient, unchanged: (5) is false. The answer is (1)(2)(3).'
    answer: [0, 1, 2]

  - id: q7@1
    type: fill
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_standard_score
    text:
      zh-tw:
        stem: '某次考試物理的平均數是 $58$、標準差是 $6$；化學的平均數是 $45$、標準差是 $14$。小華物理考 $67$ 分。他的化學要考 ? 分，兩科的標準化分數才會相同。'
        hint: '標準化分數 $z=\dfrac{x-\mu}{\sigma}$，先算物理的 $z$。'
        explain: '物理的 $z=\frac{67-58}{6}=1.5$。化學要 $\frac{x-45}{14}=1.5$，所以 $x=45+1.5\cdot 14=66$。化學只考 $66$ 分，在班上的相對位置就和物理的 $67$ 分一樣。'
      en:
        stem: 'In one exam, physics has mean $58$ and standard deviation $6$; chemistry has mean $45$ and standard deviation $14$. Hua scores $67$ in physics. For the two standardized scores to be equal, his chemistry score must be ?.'
        hint: 'The standardized score is $z=\dfrac{x-\mu}{\sigma}$. Find the physics $z$ first.'
        explain: 'In physics $z=\frac{67-58}{6}=1.5$. In chemistry we need $\frac{x-45}{14}=1.5$, so $x=45+1.5\cdot 14=66$. A chemistry score of only $66$ puts him in the same relative position as $67$ in physics.'
    answer: ['6', '6']

  - id: q8@1
    type: single
    origin: original
    codes: [math:D-10-2]
    verify: m_s116_data_analysis:da_choose_statistic
    text:
      zh-tw:
        stem: '一家小店九個人的月薪（萬元）是 $3,3,4,4,4,5,5,6,47$，其中 $47$ 是老闆。下列何者正確？'
        options: ['平均數是 $4$ 萬元', '中位數是 $9$ 萬元', '平均數比九人中的八個人都高', '拿掉 $47$ 之後，中位數會從 $4$ 變成 $5$', '拿掉 $47$ 之後，標準差會變大']
        hint: '先算平均數與中位數，再想一個極端值會影響哪一個。'
        explain: '總和是 $81$，平均數 $9$；排序後第 $5$ 筆是 $4$，中位數 $4$，所以 (1)(2) 都錯。除了老闆，其他八人都不到 $9$ 萬，(3) 對。拿掉 $47$ 後剩八筆，中位數是第 $4$、$5$ 筆的平均 $\frac{4+4}{2}=4$，沒有變，(4) 錯。拿掉離平均最遠的 $47$，數據變集中，標準差變小，(5) 錯。這種有極端值的數據，中位數比平均數更能代表「一般人」。'
      en:
        stem: 'The monthly salaries (in units of $10\,000$ NT dollars) of nine people at a small shop are $3,3,4,4,4,5,5,6,47$, where $47$ is the owner. Which statement is true?'
        options: ['the mean is $4$', 'the median is $9$', 'the mean is higher than eight of the nine salaries', 'removing $47$ changes the median from $4$ to $5$', 'removing $47$ makes the standard deviation larger']
        hint: 'Find the mean and the median, then think about which one an extreme value moves.'
        explain: 'The total is $81$, so the mean is $9$; the $5$th sorted value is $4$, so the median is $4$. (1) and (2) are false. Everyone except the owner earns less than $9$: (3) is true. Without $47$ there are eight values, and the median is the average of the $4$th and $5$th, $\frac{4+4}{2}=4$, unchanged: (4) is false. Removing $47$, the value farthest from the mean, makes the data less spread out, so the standard deviation gets smaller: (5) is false. With an extreme value like this, the median says more about a typical person than the mean does.'
    answer: 2

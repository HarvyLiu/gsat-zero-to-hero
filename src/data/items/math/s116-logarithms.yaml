  - id: q-turn@1
    type: single
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_turn_digits
    text:
      zh-tw:
        stem: '$3.2\times 10^{5}$ 是幾位數？'
        options: ['$4$ 位數', '$5$ 位數', '$6$ 位數', '$7$ 位數', '$8$ 位數']
        hint: '把它寫成一般的整數看看。'
        explain: '$3.2\times 10^{5}=320000$，是 $6$ 位數。$10^{5}$ 本身就是 $6$ 位數（$1$ 後面接 $5$ 個 $0$），而 $3.2$ 介於 $1$ 和 $10$ 之間，乘上去不會多出一位。'
      en:
        stem: 'How many digits does $3.2\times 10^{5}$ have?'
        options: ['$4$ digits', '$5$ digits', '$6$ digits', '$7$ digits', '$8$ digits']
        hint: 'Write it out as an ordinary whole number.'
        explain: '$3.2\times 10^{5}=320000$, which has $6$ digits. $10^{5}$ itself has $6$ digits (a $1$ followed by five $0$s), and $3.2$ lies between $1$ and $10$, so multiplying by it does not add a digit.'
    answer: 2

  - id: q1@1
    type: single
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_log_thousandth
    text:
      zh-tw:
        stem: '$\log 0.001$ 的值是多少？'
        options: ['$-3$', '$3$', '$-2$', '$\dfrac{1}{1000}$', '$-\dfrac{1}{3}$']
        hint: '$0.001$ 是 $10$ 的幾次方？'
        explain: '$0.001=\frac{1}{1000}=10^{-3}$，所以 $\log 0.001=-3$。小於 $1$ 的正數，常用對數是負的。'
      en:
        stem: 'What is $\log 0.001$?'
        options: ['$-3$', '$3$', '$-2$', '$\dfrac{1}{1000}$', '$-\dfrac{1}{3}$']
        hint: '$0.001$ is $10$ to what power?'
        explain: '$0.001=\frac{1}{1000}=10^{-3}$, so $\log 0.001=-3$. A positive number less than $1$ has a negative common logarithm.'
    answer: 0

  - id: q4@1
    type: multi
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_true_statements
    text:
      zh-tw:
        stem: '下列哪些敘述正確？（多選）'
        options: ['$\log 1=0$', '$\log 200=2\log 2$', '$10^{\log 7}=7$', '$1<\log 50<2$', '若 $a$ 是 $5$ 位數的正整數，則 $4<\log a<5$']
        hint: '每一個都回到定義：$\log a$ 是「$10$ 的幾次方等於 $a$」。'
        explain: '(1) $10^{0}=1$，正確。(2) $200=2\times 10^{2}=10^{\log 2+2}$，所以 $\log 200=2+\log 2\approx 2.3010$，不是 $2\log 2\approx 0.6020$。(3) 由定義，$10^{\log 7}=7$，正確。(4) $10<50<100$，所以 $1<\log 50<2$，正確。(5) 最小的 $5$ 位數 $10000=10^{4}$，$\log 10000=4$，不滿足 $4<\log a$；正確的寫法是 $4\le\log a<5$。所以選 (1)(3)(4)。'
      en:
        stem: 'Which of these statements are true? (Choose all that apply.)'
        options: ['$\log 1=0$', '$\log 200=2\log 2$', '$10^{\log 7}=7$', '$1<\log 50<2$', 'If $a$ is a $5$-digit positive integer, then $4<\log a<5$']
        hint: 'Take each one back to the definition: $\log a$ is the power of $10$ that equals $a$.'
        explain: '(1) $10^{0}=1$: true. (2) $200=2\times 10^{2}=10^{\log 2+2}$, so $\log 200=2+\log 2\approx 2.3010$, not $2\log 2\approx 0.6020$. (3) By definition $10^{\log 7}=7$: true. (4) $10<50<100$, so $1<\log 50<2$: true. (5) The smallest $5$-digit number is $10000=10^{4}$ and $\log 10000=4$, which fails $4<\log a$; the correct statement is $4\le\log a<5$. So the answer is (1)(3)(4).'
    answer: [0, 2, 3]

  - id: q2@1
    type: fill
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_five_pow_40
    text:
      zh-tw:
        stem: '已知 $\log 3\approx 0.4771$、$\log 5\approx 0.6990$。$5^{40}$ 是 ①② 位數，它的首位數字是 ③。'
        hint: '先算 $\log 5^{40}=40\log 5$，再把它拆成整數部分和介於 $0$ 與 $1$ 之間的部分。'
        explain: '$5^{40}=(10^{\log 5})^{40}=10^{40\log 5}\approx 10^{27.96}=10^{0.96}\times 10^{27}$。整數部分是 $27$，所以 $5^{40}$ 是 $27+1=28$ 位數。首位數字看 $0.96$：$\log 9=2\log 3\approx 0.9542<0.96<1=\log 10$，所以 $10^{0.96}$ 介於 $9$ 和 $10$ 之間，首位數字是 $9$。'
      en:
        stem: 'Given $\log 3\approx 0.4771$ and $\log 5\approx 0.6990$: $5^{40}$ has ①② digits, and its leading digit is ③.'
        hint: 'Work out $\log 5^{40}=40\log 5$ first, then split it into a whole-number part and a part between $0$ and $1$.'
        explain: '$5^{40}=(10^{\log 5})^{40}=10^{40\log 5}\approx 10^{27.96}=10^{0.96}\times 10^{27}$. The whole-number part is $27$, so $5^{40}$ has $27+1=28$ digits. For the leading digit look at $0.96$: $\log 9=2\log 3\approx 0.9542<0.96<1=\log 10$, so $10^{0.96}$ lies between $9$ and $10$ and the leading digit is $9$.'
    answer: ['2', '8', '9']

  - id: q7@1
    type: single
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_twelve_pow_20_leading
    text:
      zh-tw:
        stem: '已知 $\log 2\approx 0.3010$、$\log 3\approx 0.4771$。$12^{20}$ 的首位數字是多少？'
        options: ['$1$', '$2$', '$3$', '$4$', '$5$']
        hint: '$12=2\times 2\times 3$，先求 $\log 12$。'
        explain: '$12=2^{2}\times 3=10^{2\log 2+\log 3}$，所以 $\log 12\approx 2(0.3010)+0.4771=1.0791$。$\log 12^{20}=20\log 12\approx 21.582$，看小數部分 $0.582$：$\log 3\approx 0.4771<0.582<0.6020\approx\log 4$，所以首位數字是 $3$。（順帶一提，$12^{20}$ 是 $22$ 位數。）'
      en:
        stem: 'Given $\log 2\approx 0.3010$ and $\log 3\approx 0.4771$, what is the leading digit of $12^{20}$?'
        options: ['$1$', '$2$', '$3$', '$4$', '$5$']
        hint: '$12=2\times 2\times 3$. Find $\log 12$ first.'
        explain: '$12=2^{2}\times 3=10^{2\log 2+\log 3}$, so $\log 12\approx 2(0.3010)+0.4771=1.0791$. Then $\log 12^{20}=20\log 12\approx 21.582$; look at the part after the decimal point, $0.582$: $\log 3\approx 0.4771<0.582<0.6020\approx\log 4$, so the leading digit is $3$. (By the way, $12^{20}$ has $22$ digits.)'
    answer: 2

  - id: q6@1
    type: fill
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_three_pow_twenty_digits
    text:
      zh-tw:
        stem: '已知 $\log 3\approx 0.4771$。使 $3^{n}$ 為 $20$ 位數的正整數 $n$ 中，最大的是 ①②。'
        hint: '$20$ 位數 $N$ 滿足 $19\le\log N<20$。'
        explain: '$3^{n}$ 是 $20$ 位數 $\iff 19\le\log 3^{n}<20 \iff 19\le 0.4771n<20$（近似）。$19\div 0.4771\approx 39.8$、$20\div 0.4771\approx 41.9$，所以 $n=40$ 或 $41$，最大的是 $41$。檢查邊界：$42\times 0.4771\approx 20.04$，$3^{42}$ 已經是 $21$ 位數。'
      en:
        stem: 'Given $\log 3\approx 0.4771$: among the positive integers $n$ for which $3^{n}$ has $20$ digits, the largest is ①②.'
        hint: 'A $20$-digit number $N$ satisfies $19\le\log N<20$.'
        explain: '$3^{n}$ has $20$ digits $\iff 19\le\log 3^{n}<20 \iff 19\le 0.4771n<20$ (approximately). $19\div 0.4771\approx 39.8$ and $20\div 0.4771\approx 41.9$, so $n=40$ or $41$, and the largest is $41$. Check the edge: $42\times 0.4771\approx 20.04$, so $3^{42}$ already has $21$ digits.'
    answer: ['4', '1']

  - id: q3@1
    type: single
    origin: original
    codes: [math:N-10-4]
    verify: m_s116_logarithms:lg_point3_pow_10
    text:
      zh-tw:
        stem: '已知 $\log 3\approx 0.4771$。把 $(0.3)^{10}$ 寫成小數，從小數點後第幾位開始出現不為 $0$ 的數字？'
        options: ['第 $4$ 位', '第 $5$ 位', '第 $6$ 位', '第 $7$ 位', '第 $10$ 位']
        hint: '$0.3=3\times 10^{-1}$。把 $\log(0.3)^{10}$ 寫成「負整數 $+$ 介於 $0$ 與 $1$ 之間的數」。'
        explain: '$0.3=10^{\log 3-1}$，所以 $\log(0.3)^{10}=10(\log 3-1)\approx -5.229=-6+0.771$。也就是 $(0.3)^{10}\approx 10^{0.771}\times 10^{-6}$，而 $1\le 10^{0.771}<10$，所以第一個不為 $0$ 的數字在小數點後第 $6$ 位。（實際上 $(0.3)^{10}=0.0000059049$。）注意不要直接用 $-5.229$ 小數點前的 $-5$ 判斷：拆開後的整數是 $-6$。'
      en:
        stem: 'Given $\log 3\approx 0.4771$: when $(0.3)^{10}$ is written as a decimal, in which decimal place does the first non-zero digit appear?'
        options: ['the $4$th', 'the $5$th', 'the $6$th', 'the $7$th', 'the $10$th']
        hint: '$0.3=3\times 10^{-1}$. Write $\log(0.3)^{10}$ as a negative integer plus a number between $0$ and $1$.'
        explain: '$0.3=10^{\log 3-1}$, so $\log(0.3)^{10}=10(\log 3-1)\approx -5.229=-6+0.771$. That is, $(0.3)^{10}\approx 10^{0.771}\times 10^{-6}$ with $1\le 10^{0.771}<10$, so the first non-zero digit is in the $6$th decimal place. (In fact $(0.3)^{10}=0.0000059049$.) Do not read the answer off the $-5$ in front of the decimal point of $-5.229$: after splitting, the integer is $-6$.'
    answer: 2

  - id: q5@1
    type: single
    origin: original
    codes: [math:N-10-4, math:N-10-5]
    verify: m_s116_logarithms:lg_two_pow_1000_error
    text:
      zh-tw:
        stem: '甲用 $\log 2\approx 0.3$、乙用 $\log 2\approx 0.3010$，各自估計 $2^{1000}$ 是幾位數。下列哪一個敘述正確？'
        options: ['兩人都得到 $301$ 位，兩人都對', '甲得到 $301$ 位、乙得到 $302$ 位，乙對', '甲得到 $302$ 位、乙得到 $301$ 位，甲對', '甲得到 $301$ 位、乙得到 $302$ 位，甲對', '兩人都得到 $302$ 位，兩人都對']
        hint: '近似值的誤差乘上 $1000$ 之後有多大？'
        explain: '甲：$1000\times 0.3=300$，得到 $301$ 位。乙：$1000\times 0.3010=301.0$，得到 $302$ 位。$\log 2$ 的真值約為 $0.30103$，$1000\log 2\approx 301.03$，所以 $2^{1000}$ 是 $302$ 位數，乙對。甲的近似值只差約 $0.001$，乘上 $1000$ 後誤差變成約 $1$，剛好讓整數部分少了 $1$。'
      en:
        stem: 'A uses $\log 2\approx 0.3$ and B uses $\log 2\approx 0.3010$ to estimate how many digits $2^{1000}$ has. Which statement is correct?'
        options: ['both get $301$ digits, and both are right', 'A gets $301$, B gets $302$, and B is right', 'A gets $302$, B gets $301$, and A is right', 'A gets $301$, B gets $302$, and A is right', 'both get $302$ digits, and both are right']
        hint: 'How big does the error in the approximation become once it is multiplied by $1000$?'
        explain: 'A: $1000\times 0.3=300$, giving $301$ digits. B: $1000\times 0.3010=301.0$, giving $302$ digits. The true value of $\log 2$ is about $0.30103$, so $1000\log 2\approx 301.03$ and $2^{1000}$ has $302$ digits: B is right. A’s approximation is off by only about $0.001$, but multiplied by $1000$ the error grows to about $1$, which is exactly enough to lose one from the whole-number part.'
    answer: 1

    verify: m_x_sigma_and_infinite_series:xs_linearity_sum
    text:
      zh-tw:
        stem: '$\displaystyle\sum_{k=1}^{12}(2k^2-k)=$ ①②③④。'
        hint: '先拆成 $2\sum k^2-\sum k$，再用平方和與 $1+2+\cdots+n$ 的公式。'
        explain: '$\sum_{k=1}^{12}k^2=\frac{12\times 13\times 25}{6}=650$，$\sum_{k=1}^{12}k=\frac{12\times 13}{2}=78$。所以和為 $2\times 650-78=1222$。'

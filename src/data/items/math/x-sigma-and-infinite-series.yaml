        hint: 'Split it as $2\sum k^2-\sum k$, then use the formulas for the sum of squares and for $1+2+\cdots+n$.'
        explain: '$\sum_{k=1}^{12}k^2=\frac{12\times 13\times 25}{6}=650$ and $\sum_{k=1}^{12}k=\frac{12\times 13}{2}=78$. So the sum is $2\times 650-78=1222$.'
    answer: ['1', '2', '2', '2']

  - id: q3@1
    type: multi
    origin: original
    codes: [math:N-12jia-2, math:N-12yi-2]
    verify: m_x_sigma_and_infinite_series:xs_linearity_statements
    text:
      zh-tw:
        stem: '對任意正整數 $n$ 與任意數列 $\langle a_k\rangle$、$\langle b_k\rangle$，下列哪些等式一定成立？（所有的 $\Sigma$ 都是從 $k=1$ 加到 $n$）'
        options:
          - '$\sum(a_k+b_k)=\sum a_k+\sum b_k$'
          - '$\sum 5a_k=5\sum a_k$'
          - '$\sum a_kb_k=\left(\sum a_k\right)\left(\sum b_k\right)$'
          - '$\sum(a_k+2)=\sum a_k+2$'
          - '$\displaystyle\sum_{k=1}^{n}a_k=\sum_{j=1}^{n}a_j$'
        hint: '每個不確定的等式，都拿 $n=2$ 展開成兩項看看。'
        explain: '（1）（2）是線性性質，成立。（3）不成立：$n=2$ 時左邊 $a_1b_1+a_2b_2$，右邊多出 $a_1b_2+a_2b_1$。（4）不成立：$2$ 加了 $n$ 次，應為 $\sum a_k+2n$。（5）成立：$k$ 換成 $j$ 只是換個名字，展開都是 $a_1+a_2+\cdots+a_n$。答案是（1）（2）（5）。'
      en:
        stem: 'For every positive integer $n$ and all sequences $\langle a_k\rangle$, $\langle b_k\rangle$, which equations must hold? (Every $\Sigma$ runs from $k=1$ to $n$.)'
        options:
          - '$\sum(a_k+b_k)=\sum a_k+\sum b_k$'
          - '$\sum 5a_k=5\sum a_k$'
          - '$\sum a_kb_k=\left(\sum a_k\right)\left(\sum b_k\right)$'
          - '$\sum(a_k+2)=\sum a_k+2$'
          - '$\displaystyle\sum_{k=1}^{n}a_k=\sum_{j=1}^{n}a_j$'
        hint: 'For any equation you are unsure of, write it out with $n=2$, two terms.'
        explain: '(1) and (2) are the linearity rules, so they hold. (3) fails: for $n=2$ the left side is $a_1b_1+a_2b_2$, while the right side has the extra $a_1b_2+a_2b_1$. (4) fails: the $2$ is added $n$ times, so it should be $\sum a_k+2n$. (5) holds: changing $k$ to $j$ only renames the index; both sides are $a_1+a_2+\cdots+a_n$. The answer is (1)(2)(5).'
    answer: [0, 1, 4]

  - id: q4@1
    type: single
    origin: original
    codes: [math:N-12jia-2, math:N-12yi-2]
    verify: m_x_sigma_and_infinite_series:xs_which_converges
    text:
      zh-tw:
        stem: '下列哪一個無窮等比級數的和存在（收斂）？'
        options:
          - '$1+2+4+8+\cdots$'
          - '$1-1+1-1+\cdots$'
          - '$2-\frac43+\frac89-\cdots$'
          - '$1+1.01+1.01^2+\cdots$'
          - '$3+3+3+\cdots$'
        hint: '先找出每個級數的公比 $r$，看看是否 $-1<r<1$。'
        explain: '公比依序是 $2$、$-1$、$-\frac23$、$1.01$、$1$。只有（3）滿足 $-1<r<1$，和為 $\dfrac{2}{1-(-\frac23)}=\frac65$。（2）的部分和在 $1$ 與 $0$ 之間跳來跳去，不會靠近某一個數，所以也沒有和。'
      en:
        stem: 'Which infinite geometric series has a sum (converges)?'
        options:
          - '$1+2+4+8+\cdots$'
          - '$1-1+1-1+\cdots$'
          - '$2-\frac43+\frac89-\cdots$'
          - '$1+1.01+1.01^2+\cdots$'
          - '$3+3+3+\cdots$'
        hint: 'Find each common ratio $r$ first, and check whether $-1<r<1$.'
        explain: 'The ratios are $2$, $-1$, $-\frac23$, $1.01$ and $1$. Only (3) has $-1<r<1$; its sum is $\dfrac{2}{1-(-\frac23)}=\frac65$. In (2) the partial sums jump between $1$ and $0$ and never settle on one number, so it has no sum either.'
    answer: 2


  - id: q6@1
    type: fill
    origin: original
    codes: [math:N-12jia-2, math:N-12yi-2, math:N-10-1]
    verify: m_x_sigma_and_infinite_series:xs_repeating_decimal
    text:
      zh-tw:
        stem: '循環小數 $0.2\overline{45}=0.24545\cdots$ 化成最簡分數為 $\dfrac{①②}{③④⑤}$。'
        hint: '先拆成 $0.2$ 加上 $0.0454545\cdots$，後者是首項 $\frac{45}{1000}$、公比 $\frac{1}{100}$ 的無窮等比級數。'
        explain: '$0.0\overline{45}=\dfrac{\frac{45}{1000}}{1-\frac{1}{100}}=\dfrac{45}{990}$，所以原數 $=\dfrac{2}{10}+\dfrac{45}{990}=\dfrac{198+45}{990}=\dfrac{243}{990}=\dfrac{27}{110}$。用學測的方法也一樣：$1000x-10x=245.45\cdots-2.45\cdots=243$，$x=\frac{243}{990}=\frac{27}{110}$。'
      en:
        stem: 'The repeating decimal $0.2\overline{45}=0.24545\cdots$ in lowest terms is $\dfrac{①②}{③④⑤}$.'
        hint: 'Split it into $0.2$ plus $0.0454545\cdots$; the second part is an infinite geometric series with first term $\frac{45}{1000}$ and ratio $\frac{1}{100}$.'
        explain: '$0.0\overline{45}=\dfrac{\frac{45}{1000}}{1-\frac{1}{100}}=\dfrac{45}{990}$, so the number is $\dfrac{2}{10}+\dfrac{45}{990}=\dfrac{198+45}{990}=\dfrac{243}{990}=\dfrac{27}{110}$. The GSAT method agrees: $1000x-10x=245.45\cdots-2.45\cdots=243$, so $x=\frac{243}{990}=\frac{27}{110}$.'
    answer: ['2', '7', '1', '1', '0']

  - id: q7@1
    type: single
    origin: original
    codes: [math:N-12jia-2, math:N-12yi-2]
    verify: m_x_sigma_and_infinite_series:xs_first_term_from_two_sums
    text:
      zh-tw:
        stem: '某無窮等比級數的和為 $12$，把它的每一項平方後所成的無窮等比級數，和為 $48$。這個級數的首項是多少？'
        options: ['$2$', '$4$', '$6$', '$8$', '$9$']
        hint: '設首項 $a$、公比 $r$。平方後的級數首項 $a^2$、公比 $r^2$。把兩個和的式子相除。'
        explain: '$\frac{a}{1-r}=12$，$\frac{a^2}{1-r^2}=48$。後式除以前式：$\frac{a}{1+r}=4$。再與 $\frac{a}{1-r}=12$ 相除得 $\frac{1+r}{1-r}=3$，$r=\frac12$（符合 $-1<r<1$），$a=12\times\frac12=6$。檢查：$6+3+\frac32+\cdots=12$，$36+9+\frac94+\cdots=\frac{36}{1-\frac14}=48$。'
      en:
        stem: 'An infinite geometric series has sum $12$. Squaring each of its terms gives another infinite geometric series, with sum $48$. What is the first term of the original series?'
        options: ['$2$', '$4$', '$6$', '$8$', '$9$']
        hint: 'Let the first term be $a$ and the ratio $r$. The squared series has first term $a^2$ and ratio $r^2$. Divide one sum equation by the other.'
        explain: '$\frac{a}{1-r}=12$ and $\frac{a^2}{1-r^2}=48$. Dividing the second by the first gives $\frac{a}{1+r}=4$. Dividing $\frac{a}{1-r}=12$ by this gives $\frac{1+r}{1-r}=3$, so $r=\frac12$ (and $-1<r<1$ holds) and $a=12\times\frac12=6$. Check: $6+3+\frac32+\cdots=12$ and $36+9+\frac94+\cdots=\frac{36}{1-\frac14}=48$.'
    answer: 2

  - id: q8@1
    type: multi
    origin: original
    codes: [math:N-12jia-2, math:N-12yi-2]
    verify: m_x_sigma_and_infinite_series:xs_convergence_range
    text:
      zh-tw:
        stem: '無窮等比級數 $1+(x-1)+(x-1)^2+(x-1)^3+\cdots$ 的和存在。$x$ 可能是下列哪些數？'
        options: ['$-0.5$', '$0.5$', '$1.5$', '$1.99$', '$2$']
        hint: '公比是 $x-1$。和存在的條件是什麼？'
        explain: '公比 $r=x-1$，和存在的條件是 $-1<x-1<1$，也就是 $0<x<2$。$-0.5$ 使 $r=-1.5$，不行；$2$ 使 $r=1$，各項都是 $1$，部分和越來越大，也不行。答案是（2）（3）（4）。'
      en:
        stem: 'The infinite geometric series $1+(x-1)+(x-1)^2+(x-1)^3+\cdots$ has a sum. Which of these could $x$ be?'
        options: ['$-0.5$', '$0.5$', '$1.5$', '$1.99$', '$2$']
        hint: 'The ratio is $x-1$. What is the condition for the sum to exist?'
        explain: 'The ratio is $r=x-1$, and the sum exists exactly when $-1<x-1<1$, that is $0<x<2$. $x=-0.5$ gives $r=-1.5$, so no; $x=2$ gives $r=1$, every term is $1$ and the partial sums keep growing, so no. The answer is (2)(3)(4).'
    answer: [1, 2, 3]

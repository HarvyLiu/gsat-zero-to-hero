  - id: q-turn@1
    type: single
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_turn_min
    text:
      zh-tw:
        stem: '$y=(x-2)^2+3$ 的最小值是多少？'
        options: ['$-2$', '$2$', '$3$', '$4$', '$7$']
        hint: '$(x-2)^2$ 是一個數的平方，它最小可以是多少？'
        explain: '$(x-2)^2\ge 0$，而且 $x=2$ 時等於 $0$，所以 $y$ 的最小值是 $0+3=3$。注意 $2$ 是取到最小值的 $x$，不是最小值本身。'
      en:
        stem: 'What is the minimum value of $y=(x-2)^2+3$?'
        options: ['$-2$', '$2$', '$3$', '$4$', '$7$']
        hint: '$(x-2)^2$ is a square. What is the smallest it can be?'
        explain: '$(x-2)^2\ge 0$, and it equals $0$ when $x=2$, so the minimum value of $y$ is $0+3=3$. Note that $2$ is the $x$ where the minimum happens, not the minimum value itself.'
    answer: 2

  - id: q1@1
    type: single
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_vertex
    text:
      zh-tw:
        stem: '二次函數 $f(x)=3x^2+12x+7$ 的圖形頂點是哪一點？'
        options: ['$(2,-5)$', '$(-2,-5)$', '$(-2,7)$', '$(2,43)$', '$(-4,7)$']
        hint: '先把 $3$ 從 $x^2$ 項與 $x$ 項提出來，再配方。'
        explain: '$f(x)=3(x^2+4x)+7=3(x+2)^2-12+7=3(x+2)^2-5$，所以頂點是 $(-2,-5)$。配方時括號裡加上的 $4$ 要乘以 $3$ 再減掉，忘了乘 $3$ 就會得到錯的 $k$。'
      en:
        stem: 'Which point is the vertex of the graph of the quadratic function $f(x)=3x^2+12x+7$?'
        options: ['$(2,-5)$', '$(-2,-5)$', '$(-2,7)$', '$(2,43)$', '$(-4,7)$']
        hint: 'Take the $3$ out of the $x^2$ and $x$ terms first, then complete the square.'
        explain: '$f(x)=3(x^2+4x)+7=3(x+2)^2-12+7=3(x+2)^2-5$, so the vertex is $(-2,-5)$. The $4$ added inside the bracket has to be multiplied by $3$ before you subtract it; forget the $3$ and you get the wrong $k$.'
    answer: 1

  - id: q2@1
    type: fill
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_max_value
    text:
      zh-tw:
        stem: '當 $x$ 為實數時，$f(x)=-2x^2+12x-7$ 的最大值為 ①②。'
        hint: '$x^2$ 的係數是負的，圖形開口向下，頂點就是最高點。'
        explain: '$f(x)=-2(x^2-6x)-7=-2(x-3)^2+18-7=-2(x-3)^2+11$。因為 $-2(x-3)^2\le 0$，所以 $x=3$ 時有最大值 $11$。'
      en:
        stem: 'For real $x$, the maximum value of $f(x)=-2x^2+12x-7$ is ①②.'
        hint: 'The $x^2$ coefficient is negative, so the graph opens downward and its vertex is the highest point.'
        explain: '$f(x)=-2(x^2-6x)-7=-2(x-3)^2+18-7=-2(x-3)^2+11$. Since $-2(x-3)^2\le 0$, the maximum value is $11$, at $x=3$.'
    answer: ['1', '1']

  - id: q3@1
    type: multi
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_signs_from_graph
    text:
      zh-tw:
        stem: '二次函數 $y=ax^2+bx+c$ 的圖形開口向上，頂點在第三象限，且圖形與 $y$ 軸的交點在原點上方。下列哪些選項一定正確？（多選）'
        options: ['$a>0$', '$b<0$', '$c>0$', '$b^2-4ac>0$', '$a+b+c<0$']
        hint: '開口看 $a$，與 $y$ 軸的交點看 $c$，對稱軸 $x=-\frac{b}{2a}$ 在哪一側看 $b$，和 $x$ 軸有幾個交點看 $b^2-4ac$。'
        explain: '開口向上，所以 $a>0$。圖形與 $y$ 軸交於 $(0,c)$，在原點上方，所以 $c>0$。頂點在第三象限，對稱軸在 $y$ 軸左邊：$-\frac{b}{2a}<0$，又 $a>0$，所以 $b>0$，(2) 錯。開口向上而頂點在 $x$ 軸下方，圖形和 $x$ 軸有兩個交點，所以 $b^2-4ac>0$。$a+b+c=f(1)$：對稱軸在 $y$ 軸左邊，所以從 $x=0$ 往右圖形一路上升，$f(1)>f(0)=c>0$，(5) 錯。選 (1)(3)(4)。'
      en:
        stem: 'The graph of the quadratic function $y=ax^2+bx+c$ opens upward, its vertex is in the third quadrant, and it meets the $y$-axis above the origin. Which statements must be true? (Choose all that apply.)'
        options: ['$a>0$', '$b<0$', '$c>0$', '$b^2-4ac>0$', '$a+b+c<0$']
        hint: 'The opening tells you $a$; where it crosses the $y$-axis tells you $c$; which side the axis of symmetry $x=-\frac{b}{2a}$ is on tells you $b$; how many times it meets the $x$-axis tells you $b^2-4ac$.'
        explain: 'It opens upward, so $a>0$. It meets the $y$-axis at $(0,c)$, above the origin, so $c>0$. The vertex is in the third quadrant, so the axis of symmetry is left of the $y$-axis: $-\frac{b}{2a}<0$, and with $a>0$ that gives $b>0$, so (2) is false. It opens upward with its vertex below the $x$-axis, so it meets the $x$-axis twice and $b^2-4ac>0$. $a+b+c=f(1)$: the axis is left of the $y$-axis, so the graph keeps rising to the right of $x=0$ and $f(1)>f(0)=c>0$, so (5) is false. The answer is (1)(3)(4).'
    answer: [0, 2, 3]

  - id: q4@1
    type: multi
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_shift_reflect
    text:
      zh-tw:
        stem: '設 $f(x)=x^2-2x+5$。下列哪些選項正確？（多選）'
        options: ['$y=f(x-3)$ 的圖形頂點是 $(4,4)$', '$y=f(x)+3$ 的圖形頂點是 $(1,7)$', '$y=f(-x)$ 的圖形頂點是 $(1,-4)$', '$y=f(-x)$ 與 $y=f(x)$ 的圖形對 $y$ 軸對稱', '$y=f(x+3)$ 的圖形頂點是 $(4,4)$']
        hint: '先配方找出 $y=f(x)$ 的頂點，再想每一種變化把頂點搬到哪裡。'
        explain: '$f(x)=(x-1)^2+4$，頂點 $(1,4)$。$y=f(x-3)$ 是往右移 $3$，頂點 $(4,4)$，(1) 對；$y=f(x)+3$ 是往上移 $3$，頂點 $(1,7)$，(2) 對；$y=f(-x)$ 是對 $y$ 軸翻面，頂點 $(-1,4)$，所以 (3) 錯、(4) 對；$y=f(x+3)$ 是往左移 $3$，頂點 $(-2,4)$，(5) 錯。選 (1)(2)(4)。'
      en:
        stem: 'Let $f(x)=x^2-2x+5$. Which statements are true? (Choose all that apply.)'
        options: ['The graph of $y=f(x-3)$ has vertex $(4,4)$', 'The graph of $y=f(x)+3$ has vertex $(1,7)$', 'The graph of $y=f(-x)$ has vertex $(1,-4)$', 'The graphs of $y=f(-x)$ and $y=f(x)$ are symmetric about the $y$-axis', 'The graph of $y=f(x+3)$ has vertex $(4,4)$']
        hint: 'Complete the square to find the vertex of $y=f(x)$, then ask where each change moves that vertex.'
        explain: '$f(x)=(x-1)^2+4$, with vertex $(1,4)$. $y=f(x-3)$ moves it right by $3$, to $(4,4)$, so (1) is true; $y=f(x)+3$ moves it up by $3$, to $(1,7)$, so (2) is true; $y=f(-x)$ flips it across the $y$-axis, to $(-1,4)$, so (3) is false and (4) is true; $y=f(x+3)$ moves it left by $3$, to $(-2,4)$, so (5) is false. The answer is (1)(2)(4).'
    answer: [0, 1, 3]

  - id: q5@1
    type: fill
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_division_point
    text:
      zh-tw:
        stem: '數線上有兩點 $A(-4)$、$B(9)$，點 $P$ 在線段 $\overline{AB}$ 上，且 $\overline{AP}:\overline{PB}=3:2$。把 $P$ 的坐標寫成最簡分數 $\dfrac{a}{b}$，則 $a=$ ①②，$b=$ ③。'
        hint: '分點公式：$A(x_1)$、$B(x_2)$，比是 $m:n$ 時，$P=\dfrac{nx_1+mx_2}{m+n}$，注意是「交叉」相乘。'
        explain: '$P=\dfrac{2\cdot(-4)+3\cdot 9}{3+2}=\dfrac{19}{5}$。檢查：$\overline{AP}=\frac{19}{5}+4=\frac{39}{5}$，$\overline{PB}=9-\frac{19}{5}=\frac{26}{5}$，比是 $39:26=3:2$。所以 $a=19$，$b=5$。'
      en:
        stem: 'On the number line, $A(-4)$ and $B(9)$ are two points and $P$ is on the segment $\overline{AB}$ with $\overline{AP}:\overline{PB}=3:2$. Write the coordinate of $P$ as a fraction in lowest terms $\dfrac{a}{b}$. Then $a=$ ①② and $b=$ ③.'
        hint: 'The division point formula: for $A(x_1)$, $B(x_2)$ and the ratio $m:n$, $P=\dfrac{nx_1+mx_2}{m+n}$. Note the weights cross over.'
        explain: '$P=\dfrac{2\cdot(-4)+3\cdot 9}{3+2}=\dfrac{19}{5}$. Check: $\overline{AP}=\frac{19}{5}+4=\frac{39}{5}$ and $\overline{PB}=9-\frac{19}{5}=\frac{26}{5}$, and $39:26=3:2$. So $a=19$ and $b=5$.'
    answer: ['1', '9', '5']

  - id: q6@1
    type: single
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_interpolation
    text:
      zh-tw:
        stem: '一個水箱持續注水，第 $2$ 分鐘時水深 $14$ 公分，第 $7$ 分鐘時水深 $34$ 公分。假設水深是時間的一次函數，第 $4$ 分鐘時水深是多少公分？'
        options: ['$20$', '$21$', '$22$', '$23$', '$24$']
        hint: '第 $4$ 分鐘把 $2$ 到 $7$ 分鐘這段時間分成幾比幾？水深就照同樣的比例分。'
        explain: '第 $4$ 分鐘把第 $2$ 到第 $7$ 分鐘這段時間分成 $2:3$，所以水深是 $\dfrac{3\cdot 14+2\cdot 34}{5}=\dfrac{110}{5}=22$ 公分。也可以算斜率：每分鐘升高 $\frac{34-14}{7-2}=4$ 公分，$14+2\cdot 4=22$。'
      en:
        stem: 'A tank is being filled. At minute $2$ the water is $14$ cm deep and at minute $7$ it is $34$ cm deep. If the depth is a linear function of time, how deep, in cm, is the water at minute $4$?'
        options: ['$20$', '$21$', '$22$', '$23$', '$24$']
        hint: 'In what ratio does minute $4$ divide the stretch from minute $2$ to minute $7$? The depth divides in the same ratio.'
        explain: 'Minute $4$ divides the stretch from minute $2$ to minute $7$ in the ratio $2:3$, so the depth is $\dfrac{3\cdot 14+2\cdot 34}{5}=\dfrac{110}{5}=22$ cm. Or use the slope: the water rises $\frac{34-14}{7-2}=4$ cm a minute, and $14+2\cdot 4=22$.'
    answer: 2

  - id: q7@1
    type: fill
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_profit_interval
    text:
      zh-tw:
        stem: '某商品每個成本 $10$ 元。定價 $x$ 元時，每天可賣出 $100-2x$ 個。若規定定價必須滿足 $15\le x\le 25$，則每天的利潤最多是 ①②③ 元。'
        hint: '利潤 $=(x-10)(100-2x)$。先配方找頂點，再看頂點在不在 $15\le x\le 25$ 裡面。'
        explain: '利潤 $P(x)=(x-10)(100-2x)=-2x^2+120x-1000=-2(x-30)^2+800$。頂點在 $x=30$，不在 $15\le x\le 25$ 裡；在這個範圍內 $x$ 都在對稱軸左邊，開口向下的圖形一路上升，所以最大值在右端點：$P(25)=15\cdot 50=750$ 元。直接回答 $800$ 就掉進陷阱了。'
      en:
        stem: 'An item costs $10$ dollars to make. At a price of $x$ dollars, $100-2x$ items sell each day. If the price must satisfy $15\le x\le 25$, the largest possible daily profit is ①②③ dollars.'
        hint: 'Profit $=(x-10)(100-2x)$. Complete the square to find the vertex, then ask whether the vertex lies in $15\le x\le 25$.'
        explain: 'The profit is $P(x)=(x-10)(100-2x)=-2x^2+120x-1000=-2(x-30)^2+800$. The vertex is at $x=30$, outside $15\le x\le 25$; on this range every $x$ is left of the axis of symmetry, where the downward-opening graph keeps rising, so the maximum is at the right endpoint: $P(25)=15\cdot 50=750$ dollars. Answering $800$ is the trap.'
    answer: ['7', '5', '0']

  - id: q8@1
    type: fill
    origin: original
    codes: [math:F-10-1]
    verify: m_s116_linear_quadratic:lq_max_min_interval
    text:
      zh-tw:
        stem: '在 $-3\le x\le 2$ 的範圍內，$f(x)=x^2+2x-3$ 的最大值 $M=$ ①，最小值 $m=$ ②③。'
        hint: '配方找頂點；頂點在範圍內，就比較頂點和兩個端點的函數值。'
        explain: '$f(x)=(x+1)^2-4$，頂點 $x=-1$ 在範圍內，所以最小值 $m=f(-1)=-4$。最大值在離對稱軸比較遠的端點：$f(-3)=0$，$f(2)=5$，所以 $M=5$。'
      en:
        stem: 'On the range $-3\le x\le 2$, the maximum value of $f(x)=x^2+2x-3$ is $M=$ ① and the minimum value is $m=$ ②③.'
        hint: 'Complete the square to find the vertex. If the vertex is in the range, compare the values at the vertex and at both endpoints.'
        explain: '$f(x)=(x+1)^2-4$. The vertex $x=-1$ is in the range, so the minimum is $m=f(-1)=-4$. The maximum is at the endpoint farther from the axis of symmetry: $f(-3)=0$ and $f(2)=5$, so $M=5$.'
    answer: ['5', '−', '4']

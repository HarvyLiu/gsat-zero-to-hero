  - id: q-turn@1
    type: single
    origin: original
    codes: [math:G-11A-6]
    verify: m_s116a_vector_operations:vo_turn_angle
    text:
      zh-tw:
        stem: '向量 $\vec{a}=(1,2)$ 與 $\vec{b}=(3,1)$ 的夾角是多少？'
        options: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$90^\circ$', '$135^\circ$']
        hint: '先算內積 $\vec{a}\cdot\vec{b}$ 和兩個向量的長度，再求 $\cos\theta$。'
        explain: '$\vec{a}\cdot\vec{b}=1\times 3+2\times 1=5$，$|\vec{a}|=\sqrt{5}$、$|\vec{b}|=\sqrt{10}$，所以 $\cos\theta=\frac{5}{\sqrt{5}\sqrt{10}}=\frac{5}{5\sqrt{2}}=\frac{\sqrt{2}}{2}$，$\theta=45^\circ$。'
      en:
        stem: 'What is the angle between $\vec{a}=(1,2)$ and $\vec{b}=(3,1)$?'
        options: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$90^\circ$', '$135^\circ$']
        hint: 'Work out the inner product $\vec{a}\cdot\vec{b}$ and both lengths first, then find $\cos\theta$.'
        explain: '$\vec{a}\cdot\vec{b}=1\times 3+2\times 1=5$, $|\vec{a}|=\sqrt{5}$ and $|\vec{b}|=\sqrt{10}$, so $\cos\theta=\frac{5}{\sqrt{5}\sqrt{10}}=\frac{5}{5\sqrt{2}}=\frac{\sqrt{2}}{2}$ and $\theta=45^\circ$.'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: [math:G-11A-6]
    verify: m_s116a_vector_operations:vo_projection_vector
    text:
      zh-tw:
        stem: '向量 $\vec{a}=(3,4)$ 在向量 $\vec{b}=(2,1)$ 上的正射影是下列哪一個向量？'
        options: ['$(4,2)$', '$(2,1)$', '$\left(\frac{6}{5},\frac{8}{5}\right)$', '$(8,4)$', '$(10,5)$']
        hint: '正射影是 $\dfrac{\vec{a}\cdot\vec{b}}{|\vec{b}|^2}\,\vec{b}$，方向和 $\vec{b}$ 平行。'
        explain: '$\vec{a}\cdot\vec{b}=6+4=10$，$|\vec{b}|^2=5$，所以正射影是 $\frac{10}{5}(2,1)=(4,2)$。選項 (3) 是把順序弄反了：那是 $\vec{b}$ 在 $\vec{a}$ 上的正射影 $\frac{10}{25}(3,4)$。'
      en:
        stem: 'Which vector is the orthogonal projection of $\vec{a}=(3,4)$ onto $\vec{b}=(2,1)$?'
        options: ['$(4,2)$', '$(2,1)$', '$\left(\frac{6}{5},\frac{8}{5}\right)$', '$(8,4)$', '$(10,5)$']
        hint: 'The projection is $\dfrac{\vec{a}\cdot\vec{b}}{|\vec{b}|^2}\,\vec{b}$, so it is parallel to $\vec{b}$.'
        explain: '$\vec{a}\cdot\vec{b}=6+4=10$ and $|\vec{b}|^2=5$, so the projection is $\frac{10}{5}(2,1)=(4,2)$. Option (3) has the roles swapped: it is the projection of $\vec{b}$ onto $\vec{a}$, $\frac{10}{25}(3,4)$.'
    answer: 0

  - id: q2@1
    type: multi
    origin: original
    codes: [math:G-11A-7]
    verify: m_s116a_vector_operations:vo_space_relations
    text:
      zh-tw:
        stem: '設 $\vec{u}=(1,2,-2)$、$\vec{v}=(2,-2,-1)$、$\vec{w}=(-2,-4,4)$。下列哪些選項正確？（多選）'
        options: ['$\vec{u}$ 與 $\vec{v}$ 垂直', '$\vec{u}$ 與 $\vec{w}$ 平行', '$|\vec{u}\times\vec{v}|=9$', '$\vec{u}\cdot\vec{w}=18$', '$\vec{u}\times\vec{w}$ 不是零向量']
        hint: '垂直看內積是否為 $0$；平行看是不是彼此的實數倍。$|\vec{u}\times\vec{v}|=|\vec{u}||\vec{v}|\sin\theta$。'
        explain: '$\vec{u}\cdot\vec{v}=2-4+2=0$，所以垂直，(1) 對。$\vec{w}=-2\vec{u}$，所以平行，(2) 對。$|\vec{u}|=|\vec{v}|=3$ 且夾角 $90^\circ$，$|\vec{u}\times\vec{v}|=3\times 3\times\sin 90^\circ=9$，(3) 對。$\vec{u}\cdot\vec{w}=-2|\vec{u}|^2=-18$，(4) 錯。平行向量的外積是零向量，(5) 錯。所以選 (1)(2)(3)。'
      en:
        stem: 'Let $\vec{u}=(1,2,-2)$, $\vec{v}=(2,-2,-1)$ and $\vec{w}=(-2,-4,4)$. Which statements are true? (Choose all that apply.)'
        options: ['$\vec{u}$ and $\vec{v}$ are perpendicular', '$\vec{u}$ and $\vec{w}$ are parallel', '$|\vec{u}\times\vec{v}|=9$', '$\vec{u}\cdot\vec{w}=18$', '$\vec{u}\times\vec{w}$ is not the zero vector']
        hint: 'Perpendicular: is the inner product $0$? Parallel: is one a real multiple of the other? And $|\vec{u}\times\vec{v}|=|\vec{u}||\vec{v}|\sin\theta$.'
        explain: '$\vec{u}\cdot\vec{v}=2-4+2=0$, so they are perpendicular: (1) is true. $\vec{w}=-2\vec{u}$, so they are parallel: (2) is true. $|\vec{u}|=|\vec{v}|=3$ and the angle is $90^\circ$, so $|\vec{u}\times\vec{v}|=3\times 3\times\sin 90^\circ=9$: (3) is true. $\vec{u}\cdot\vec{w}=-2|\vec{u}|^2=-18$: (4) is false. The cross product of parallel vectors is the zero vector: (5) is false. So the answer is (1)(2)(3).'
    answer: [0, 1, 2]

  - id: q3@1
    type: fill
    origin: original
    codes: [math:G-11A-6]
    verify: m_s116a_vector_operations:vo_cauchy_max
    text:
      zh-tw:
        stem: '設實數 $x$、$y$ 滿足 $x^2+y^2=10$，則 $3x-y$ 的最大值為 ①②。'
        hint: '柯西不等式：$(3x-y)^2\le(3^2+(-1)^2)(x^2+y^2)$。'
        explain: '由柯西不等式，$(3x-y)^2\le(9+1)(x^2+y^2)=100$，所以 $-10\le 3x-y\le 10$。等號成立時 $(x,y)$ 與 $(3,-1)$ 平行：取 $(x,y)=(3,-1)$，確實 $x^2+y^2=10$ 且 $3x-y=10$。最大值是 $10$。'
      en:
        stem: 'Real numbers $x$ and $y$ satisfy $x^2+y^2=10$. The largest value of $3x-y$ is ①②.'
        hint: 'Cauchy inequality: $(3x-y)^2\le(3^2+(-1)^2)(x^2+y^2)$.'
        explain: 'By the Cauchy inequality, $(3x-y)^2\le(9+1)(x^2+y^2)=100$, so $-10\le 3x-y\le 10$. Equality needs $(x,y)$ parallel to $(3,-1)$: take $(x,y)=(3,-1)$, which does satisfy $x^2+y^2=10$ and gives $3x-y=10$. The largest value is $10$.'
    answer: ['1', '0']

  - id: q4@1
    type: fill
    origin: original
    codes: [math:G-11A-6]
    verify: m_s116a_vector_operations:vo_triangle_area_det
    text:
      zh-tw:
        stem: '坐標平面上 $A(-1,2)$、$B(3,1)$、$C(1,5)$，則 $\triangle ABC$ 的面積為 ①。'
        hint: '先寫出 $\overrightarrow{AB}$ 和 $\overrightarrow{AC}$，三角形面積是它們二階行列式絕對值的一半。'
        explain: '$\overrightarrow{AB}=(4,-1)$、$\overrightarrow{AC}=(2,3)$，$\begin{vmatrix}4&-1\\2&3\end{vmatrix}=12-(-2)=14$。平行四邊形面積是 $14$，三角形面積是一半：$7$。'
      en:
        stem: 'In the coordinate plane, $A(-1,2)$, $B(3,1)$ and $C(1,5)$. The area of $\triangle ABC$ is ①.'
        hint: 'Write down $\overrightarrow{AB}$ and $\overrightarrow{AC}$ first; the triangle’s area is half the absolute value of their 2×2 determinant.'
        explain: '$\overrightarrow{AB}=(4,-1)$ and $\overrightarrow{AC}=(2,3)$, so $\begin{vmatrix}4&-1\\2&3\end{vmatrix}=12-(-2)=14$. The parallelogram has area $14$, and the triangle has half of it: $7$.'
    answer: ['7']

  - id: q5@1
    type: fill
    origin: original
    codes: [math:G-11A-7]
    verify: m_s116a_vector_operations:vo_cross_product
    text:
      zh-tw:
        stem: '設 $\vec{a}=(2,1,-1)$、$\vec{b}=(1,3,2)$，且 $\vec{a}\times\vec{b}=(p,q,r)$，則 $p=$ ①，$q=$ ②③，$r=$ ④。'
        hint: '每個分量都是一個二階行列式：第一個分量蓋掉第一行，看 $\begin{vmatrix}1&-1\\3&2\end{vmatrix}$。'
        explain: '$\vec{a}\times\vec{b}=\left(\begin{vmatrix}1&-1\\3&2\end{vmatrix},\begin{vmatrix}-1&2\\2&1\end{vmatrix},\begin{vmatrix}2&1\\1&3\end{vmatrix}\right)=(2+3,\,-1-4,\,6-1)=(5,-5,5)$。檢查：$(5,-5,5)\cdot\vec{a}=10-5-5=0$，$(5,-5,5)\cdot\vec{b}=5-15+10=0$，和兩個向量都垂直。它的長度 $5\sqrt{3}$ 就是 $\vec{a}$、$\vec{b}$ 張出的平行四邊形面積。'
      en:
        stem: 'Let $\vec{a}=(2,1,-1)$ and $\vec{b}=(1,3,2)$. If $\vec{a}\times\vec{b}=(p,q,r)$, then $p=$ ①, $q=$ ②③ and $r=$ ④.'
        hint: 'Each component is a 2×2 determinant: for the first, cover the first column and use $\begin{vmatrix}1&-1\\3&2\end{vmatrix}$.'
        explain: '$\vec{a}\times\vec{b}=\left(\begin{vmatrix}1&-1\\3&2\end{vmatrix},\begin{vmatrix}-1&2\\2&1\end{vmatrix},\begin{vmatrix}2&1\\1&3\end{vmatrix}\right)=(2+3,\,-1-4,\,6-1)=(5,-5,5)$. Check: $(5,-5,5)\cdot\vec{a}=10-5-5=0$ and $(5,-5,5)\cdot\vec{b}=5-15+10=0$, so it is perpendicular to both. Its length $5\sqrt{3}$ is the area of the parallelogram spanned by $\vec{a}$ and $\vec{b}$.'
    answer: ['5', '−', '5', '5']

  - id: q6@1
    type: single
    origin: original
    codes: [math:G-11A-8]
    verify: m_s116a_vector_operations:vo_coplanar_k
    text:
      zh-tw:
        stem: '若三個向量 $(1,2,3)$、$(2,k,1)$、$(1,1,1)$ 共平面，則 $k=$？'
        options: ['$\frac{1}{2}$', '$1$', '$\frac{3}{2}$', '$2$', '$3$']
        hint: '三向量共平面時，它們張出的平行六面體體積是 $0$，也就是三階行列式等於 $0$。'
        explain: '$\begin{vmatrix}1&2&3\\2&k&1\\1&1&1\end{vmatrix}=1\times(k-1)-2\times(2-1)+3\times(2-k)=3-2k$。令它等於 $0$，得 $k=\frac{3}{2}$。'
      en:
        stem: 'The three vectors $(1,2,3)$, $(2,k,1)$ and $(1,1,1)$ lie in one plane. What is $k$?'
        options: ['$\frac{1}{2}$', '$1$', '$\frac{3}{2}$', '$2$', '$3$']
        hint: 'Three vectors in one plane span a parallelepiped of volume $0$, so the 3×3 determinant is $0$.'
        explain: '$\begin{vmatrix}1&2&3\\2&k&1\\1&1&1\end{vmatrix}=1\times(k-1)-2\times(2-1)+3\times(2-k)=3-2k$. Setting it equal to $0$ gives $k=\frac{3}{2}$.'
    answer: 2

  - id: q7@1
    type: fill
    origin: original
    codes: [math:G-11A-8]
    verify: m_s116a_vector_operations:vo_tetrahedron_volume
    text:
      zh-tw:
        stem: '空間中 $O(0,0,0)$、$A(1,1,0)$、$B(0,1,1)$、$C(1,0,1)$，則四面體 $OABC$ 的體積為 $\dfrac{①}{②}$（最簡分數）。'
        hint: '四面體體積是 $\overrightarrow{OA}$、$\overrightarrow{OB}$、$\overrightarrow{OC}$ 張出的平行六面體體積的 $\frac{1}{6}$。'
        explain: '$\begin{vmatrix}1&1&0\\0&1&1\\1&0&1\end{vmatrix}=1\times(1-0)-1\times(0-1)+0=2$，平行六面體體積是 $2$。四面體體積是 $\frac{1}{6}\times 2=\frac{1}{3}$。'
      en:
        stem: 'In space, $O(0,0,0)$, $A(1,1,0)$, $B(0,1,1)$ and $C(1,0,1)$. The volume of the tetrahedron $OABC$ is $\dfrac{①}{②}$ (in lowest terms).'
        hint: 'The tetrahedron has $\frac{1}{6}$ of the volume of the parallelepiped spanned by $\overrightarrow{OA}$, $\overrightarrow{OB}$ and $\overrightarrow{OC}$.'
        explain: '$\begin{vmatrix}1&1&0\\0&1&1\\1&0&1\end{vmatrix}=1\times(1-0)-1\times(0-1)+0=2$, so the parallelepiped has volume $2$. The tetrahedron has volume $\frac{1}{6}\times 2=\frac{1}{3}$.'
    answer: ['1', '3']

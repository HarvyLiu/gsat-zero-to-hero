  - id: q-turn@1
    type: single
    origin: original
    codes: [math:G-11A-1, math:G-11B-1]
    verify: m_s116_plane_vectors:pv_turn_ab
    text:
      zh-tw:
        stem: '從 $A(1,2)$ 走到 $B(4,6)$，向量 $\overrightarrow{AB}$ 用坐標要怎麼寫？'
        options: ['$(3,4)$', '$(-3,-4)$', '$(5,8)$', '$(4,3)$', '$(4,6)$']
        hint: '看 $x$ 坐標和 $y$ 坐標各增加了多少。'
        explain: '終點減始點：$\overrightarrow{AB}=(4-1,\,6-2)=(3,4)$。$(-3,-4)$ 是 $\overrightarrow{BA}$；$(5,8)$ 是把坐標相加；$(4,6)$ 是 $B$ 的位置向量。'
      en:
        stem: 'You walk from $A(1,2)$ to $B(4,6)$. How do you write the vector $\overrightarrow{AB}$ in coordinates?'
        options: ['$(3,4)$', '$(-3,-4)$', '$(5,8)$', '$(4,3)$', '$(4,6)$']
        hint: 'How much do the $x$-coordinate and the $y$-coordinate each go up by?'
        explain: 'End point minus start point: $\overrightarrow{AB}=(4-1,\,6-2)=(3,4)$. $(-3,-4)$ is $\overrightarrow{BA}$; $(5,8)$ adds the coordinates; $(4,6)$ is the position vector of $B$.'
    answer: 0

  - id: q1@1
    type: fill
    origin: original
    codes: [math:G-11A-1, math:G-11B-1]
    verify: m_s116_plane_vectors:pv_combo_2a_minus_3b
    text:
      zh-tw:
        stem: '$\vec{a}=(3,-2)$、$\vec{b}=(-1,4)$，若 $2\vec{a}-3\vec{b}=(p,q)$，則 $p=$ ①，$q=$ ②③④。'
        hint: '先算 $2\vec{a}$ 和 $3\vec{b}$，再把坐標各自相減。'
        explain: '$2\vec{a}=(6,-4)$、$3\vec{b}=(-3,12)$，所以 $2\vec{a}-3\vec{b}=(6-(-3),\,-4-12)=(9,-16)$。'
      en:
        stem: '$\vec{a}=(3,-2)$ and $\vec{b}=(-1,4)$. If $2\vec{a}-3\vec{b}=(p,q)$, then $p=$ ① and $q=$ ②③④.'
        hint: 'Work out $2\vec{a}$ and $3\vec{b}$ first, then subtract coordinate by coordinate.'
        explain: '$2\vec{a}=(6,-4)$ and $3\vec{b}=(-3,12)$, so $2\vec{a}-3\vec{b}=(6-(-3),\,-4-12)=(9,-16)$.'
    answer: ['9', '−', '1', '6']

  - id: q2@1
    type: single
    origin: original
    codes: [math:G-11A-1, math:G-11B-1]
    verify: m_s116_plane_vectors:pv_parallel_k
    text:
      zh-tw:
        stem: '向量 $(k,-4)$ 與 $(3,6)$ 平行，則 $k=$？'
        options: ['$-2$', '$2$', '$-8$', '$8$', '$-\dfrac{9}{2}$']
        hint: '平行就是其中一個是另一個的實數倍，坐標要成比例。'
        explain: '$\frac{k}{3}=\frac{-4}{6}$，所以 $k=-2$。檢查：$(-2,-4)=-\frac{2}{3}(3,6)$，方向相反但平行。'
      en:
        stem: 'The vectors $(k,-4)$ and $(3,6)$ are parallel. What is $k$?'
        options: ['$-2$', '$2$', '$-8$', '$8$', '$-\dfrac{9}{2}$']
        hint: 'Parallel means one is a real multiple of the other, so the coordinates are in proportion.'
        explain: '$\frac{k}{3}=\frac{-4}{6}$, so $k=-2$. Check: $(-2,-4)=-\frac{2}{3}(3,6)$, which points the opposite way but is parallel.'
    answer: 0

  - id: q3@1
    type: fill
    origin: original
    codes: [math:G-11A-1, math:G-11B-1]
    verify: m_s116_plane_vectors:pv_linear_combination
    text:
      zh-tw:
        stem: '$\vec{a}=(2,1)$、$\vec{b}=(-1,3)$，若 $(4,9)=x\vec{a}+y\vec{b}$，則 $x=$ ①，$y=$ ②。'
        hint: '把 $x\vec{a}+y\vec{b}$ 寫成坐標，和 $(4,9)$ 比較，得到一個二元一次方程組。'
        explain: '$x\vec{a}+y\vec{b}=(2x-y,\,x+3y)=(4,9)$。由 $2x-y=4$ 得 $y=2x-4$，代入 $x+3y=9$：$7x-12=9$，$x=3$、$y=2$。檢查：$3(2,1)+2(-1,3)=(4,9)$。'
      en:
        stem: '$\vec{a}=(2,1)$ and $\vec{b}=(-1,3)$. If $(4,9)=x\vec{a}+y\vec{b}$, then $x=$ ① and $y=$ ②.'
        hint: 'Write $x\vec{a}+y\vec{b}$ in coordinates and match it with $(4,9)$: that gives a pair of linear equations.'
        explain: '$x\vec{a}+y\vec{b}=(2x-y,\,x+3y)=(4,9)$. From $2x-y=4$, $y=2x-4$; substituting into $x+3y=9$ gives $7x-12=9$, so $x=3$ and $y=2$. Check: $3(2,1)+2(-1,3)=(4,9)$.'
    answer: ['3', '2']

  - id: q4@1
    type: fill
    origin: original
    codes: [math:G-11A-1, math:G-11B-1]
    verify: m_s116_plane_vectors:pv_division_point
    text:
      zh-tw:
        stem: '$A(-2,5)$、$B(6,1)$，點 $P$ 在線段 $\overline{AB}$ 上，且 $\overline{AP}:\overline{PB}=3:1$。若 $P$ 的坐標為 $(p,q)$，則 $p=$ ①，$q=$ ②。'
        hint: '$\overrightarrow{OP}=\frac{n}{m+n}\overrightarrow{OA}+\frac{m}{m+n}\overrightarrow{OB}$，係數交叉。'
        explain: '$\overrightarrow{OP}=\frac{1}{4}(-2,5)+\frac{3}{4}(6,1)=\left(\frac{-2+18}{4},\,\frac{5+3}{4}\right)=(4,2)$。$P$ 離 $B$ 比較近，所以 $\overrightarrow{OB}$ 的係數 $\frac{3}{4}$ 比較大。'
      en:
        stem: '$A(-2,5)$ and $B(6,1)$; the point $P$ is on the segment $\overline{AB}$ with $\overline{AP}:\overline{PB}=3:1$. If $P$ has coordinates $(p,q)$, then $p=$ ① and $q=$ ②.'
        hint: '$\overrightarrow{OP}=\frac{n}{m+n}\overrightarrow{OA}+\frac{m}{m+n}\overrightarrow{OB}$: the coefficients cross over.'
        explain: '$\overrightarrow{OP}=\frac{1}{4}(-2,5)+\frac{3}{4}(6,1)=\left(\frac{-2+18}{4},\,\frac{5+3}{4}\right)=(4,2)$. $P$ is nearer $B$, so $\overrightarrow{OB}$ gets the larger coefficient, $\frac{3}{4}$.'
    answer: ['4', '2']

  - id: q5@1
    type: single
    origin: original
    codes: [math:G-11B-2]
    verify: m_s116_plane_vectors:pv_angle
    text:
      zh-tw:
        stem: '$\vec{a}=(2,1)$、$\vec{b}=(-3,1)$，兩向量的夾角是多少？'
        options: ['$45^\circ$', '$60^\circ$', '$90^\circ$', '$120^\circ$', '$135^\circ$']
        hint: '$\cos\theta=\dfrac{\vec{a}\cdot\vec{b}}{|\vec{a}||\vec{b}|}$。內積是負的，夾角是銳角還是鈍角？'
        explain: '$\vec{a}\cdot\vec{b}=-6+1=-5$，$|\vec{a}|=\sqrt{5}$、$|\vec{b}|=\sqrt{10}$，所以 $\cos\theta=\frac{-5}{\sqrt{50}}=\frac{-5}{5\sqrt{2}}=-\frac{1}{\sqrt{2}}$，$\theta=135^\circ$。'
      en:
        stem: '$\vec{a}=(2,1)$ and $\vec{b}=(-3,1)$. What is the angle between them?'
        options: ['$45^\circ$', '$60^\circ$', '$90^\circ$', '$120^\circ$', '$135^\circ$']
        hint: '$\cos\theta=\dfrac{\vec{a}\cdot\vec{b}}{|\vec{a}||\vec{b}|}$. The inner product is negative: is the angle acute or obtuse?'
        explain: '$\vec{a}\cdot\vec{b}=-6+1=-5$, $|\vec{a}|=\sqrt{5}$ and $|\vec{b}|=\sqrt{10}$, so $\cos\theta=\frac{-5}{\sqrt{50}}=\frac{-5}{5\sqrt{2}}=-\frac{1}{\sqrt{2}}$ and $\theta=135^\circ$.'
    answer: 4

  - id: q6@1
    type: fill
    origin: original
    codes: [math:G-11B-2]
    verify: m_s116_plane_vectors:pv_perpendicular_k
    text:
      zh-tw:
        stem: '向量 $(k,3)$ 與 $(4,k-7)$ 垂直，則 $k=$ ①。'
        hint: '兩個向量垂直，內積等於 $0$。'
        explain: '$(k,3)\cdot(4,k-7)=4k+3(k-7)=7k-21=0$，所以 $k=3$。檢查：$(3,3)\cdot(4,-4)=12-12=0$，而且兩個都是非零向量。'
      en:
        stem: 'The vectors $(k,3)$ and $(4,k-7)$ are perpendicular. Then $k=$ ①.'
        hint: 'Two perpendicular vectors have inner product $0$.'
        explain: '$(k,3)\cdot(4,k-7)=4k+3(k-7)=7k-21=0$, so $k=3$. Check: $(3,3)\cdot(4,-4)=12-12=0$, and both are non-zero vectors.'
    answer: ['3']

  - id: q7@1
    type: multi
    origin: original
    codes: [math:G-11A-1, math:G-11B-1, math:G-11B-2]
    verify: m_s116_plane_vectors:pv_statements
    text:
      zh-tw:
        stem: '$\vec{a}=(4,-2)$、$\vec{b}=(1,2)$。下列哪些敘述正確？（多選）'
        options: ['$\vec{a}$ 與 $\vec{b}$ 垂直', '$|\vec{a}|=20$', '$\vec{a}$ 與 $(-2,1)$ 平行', '$\vec{a}\cdot\vec{b}>0$', '$|\vec{a}+\vec{b}|=|\vec{a}-\vec{b}|$']
        hint: '先算 $\vec{a}\cdot\vec{b}$；長度記得開根號。'
        explain: '$\vec{a}\cdot\vec{b}=4-4=0$，所以 (1) 對、(4) 錯。$|\vec{a}|=\sqrt{16+4}=2\sqrt{5}$，$20$ 是 $|\vec{a}|^2$，(2) 錯。$\vec{a}=-2(-2,1)$，(3) 對。$\vec{a}+\vec{b}=(5,0)$、$\vec{a}-\vec{b}=(3,-4)$，長度都是 $5$，(5) 對。選 (1)(3)(5)。'
      en:
        stem: '$\vec{a}=(4,-2)$ and $\vec{b}=(1,2)$. Which statements are true? (Choose all that apply.)'
        options: ['$\vec{a}$ and $\vec{b}$ are perpendicular', '$|\vec{a}|=20$', '$\vec{a}$ is parallel to $(-2,1)$', '$\vec{a}\cdot\vec{b}>0$', '$|\vec{a}+\vec{b}|=|\vec{a}-\vec{b}|$']
        hint: 'Work out $\vec{a}\cdot\vec{b}$ first; remember the square root for a length.'
        explain: '$\vec{a}\cdot\vec{b}=4-4=0$, so (1) is true and (4) is false. $|\vec{a}|=\sqrt{16+4}=2\sqrt{5}$; $20$ is $|\vec{a}|^2$, so (2) is false. $\vec{a}=-2(-2,1)$, so (3) is true. $\vec{a}+\vec{b}=(5,0)$ and $\vec{a}-\vec{b}=(3,-4)$ both have length $5$, so (5) is true. The answer is (1)(3)(5).'
    answer: [0, 2, 4]

  - id: q8@1
    type: fill
    origin: original
    codes: [math:G-11B-2]
    verify: m_s116_plane_vectors:pv_projection
    text:
      zh-tw:
        stem: '$\vec{a}=(6,2)$ 在 $\vec{b}=(1,2)$ 上的正射影為 $(p,q)$，則 $p=$ ①，$q=$ ②。'
        hint: '正射影 $=\dfrac{\vec{a}\cdot\vec{b}}{|\vec{b}|^2}\,\vec{b}$。'
        explain: '$\vec{a}\cdot\vec{b}=6+4=10$，$|\vec{b}|^2=5$，所以正射影是 $\frac{10}{5}(1,2)=(2,4)$。檢查：$\vec{a}-(2,4)=(4,-2)$，和 $\vec{b}$ 的內積是 $4-4=0$。'
      en:
        stem: 'The orthogonal projection of $\vec{a}=(6,2)$ on $\vec{b}=(1,2)$ is $(p,q)$. Then $p=$ ① and $q=$ ②.'
        hint: 'Projection $=\dfrac{\vec{a}\cdot\vec{b}}{|\vec{b}|^2}\,\vec{b}$.'
        explain: '$\vec{a}\cdot\vec{b}=6+4=10$ and $|\vec{b}|^2=5$, so the projection is $\frac{10}{5}(1,2)=(2,4)$. Check: $\vec{a}-(2,4)=(4,-2)$, whose inner product with $\vec{b}$ is $4-4=0$.'
    answer: ['2', '4']

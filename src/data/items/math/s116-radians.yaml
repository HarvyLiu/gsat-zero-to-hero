chapter: math/s116-radians
items:
  - id: q-turn@1
    type: single
    origin: original
    codes: [math:N-11A-1, math:N-11B-1]
    verify: m_s116_radians:rad_turn_full_circle
    text:
      zh-tw:
        stem: '一個圓的半徑是 $r$。繞圓一整圈的弧長（也就是圓周長）是半徑的幾倍？'
        options: ['$\pi$ 倍', '$2\pi$ 倍', '$4$ 倍', '$6$ 倍', '$\pi^2$ 倍']
        hint: '圓周長的公式是什麼？把它除以 $r$。'
        explain: '圓周長是 $2\pi r$，除以半徑 $r$ 得 $2\pi$，而且和 $r$ 是多少無關。所以一整圈的弧長是半徑的 $2\pi$ 倍（大約 $6.28$ 倍，比 $6$ 倍多一點）。'
      en:
        stem: 'A circle has radius $r$. The arc length of one full turn (the circumference) is how many times the radius?'
        options: ['$\pi$ times', '$2\pi$ times', '$4$ times', '$6$ times', '$\pi^2$ times']
        hint: 'What is the formula for the circumference? Divide it by $r$.'
        explain: 'The circumference is $2\pi r$; dividing by the radius $r$ gives $2\pi$, whatever $r$ is. So one full turn of arc is $2\pi$ radii (about $6.28$, a little more than $6$).'
    answer: 1

  - id: q1@1
    type: single
    origin: original
    codes: [math:N-11A-1, math:N-11B-1]
    verify: m_s116_radians:rad_240_to_radians
    text:
      zh-tw:
        stem: '$240^\circ$ 等於多少弧度？'
        options: ['$\dfrac{2\pi}{3}$', '$\dfrac{4\pi}{3}$', '$\dfrac{3\pi}{4}$', '$\dfrac{5\pi}{3}$', '$\dfrac{4\pi}{9}$']
        hint: '度化弧度，乘以 $\dfrac{\pi}{180}$。'
        explain: '$240\times\frac{\pi}{180}=\frac{240\pi}{180}=\frac{4\pi}{3}$。也可以這樣想：$240^\circ=180^\circ+60^\circ$，就是 $\pi+\frac{\pi}{3}=\frac{4\pi}{3}$。'
      en:
        stem: 'How many radians is $240^\circ$?'
        options: ['$\dfrac{2\pi}{3}$', '$\dfrac{4\pi}{3}$', '$\dfrac{3\pi}{4}$', '$\dfrac{5\pi}{3}$', '$\dfrac{4\pi}{9}$']
        hint: 'To go from degrees to radians, multiply by $\dfrac{\pi}{180}$.'
        explain: '$240\times\frac{\pi}{180}=\frac{240\pi}{180}=\frac{4\pi}{3}$. Or think of it as $240^\circ=180^\circ+60^\circ$, which is $\pi+\frac{\pi}{3}=\frac{4\pi}{3}$.'
    answer: 1


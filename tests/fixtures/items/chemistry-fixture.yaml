chapter: chemistry/fixture-items
items:
  - id: fx-three-atoms@1
    type: multi
    origin: original
    verify: fixtures:three_atom_molecules
    text:
      zh-tw:
        stem: '下列哪些分子，一個分子中恰有$3$個原子？'
        options: ['$\ce{H2O}$', '$\ce{CO2}$', '$\ce{O3}$', '$\ce{NH3}$']
        hint: '化學式中元素符號右下角的數字是該原子的個數，沒寫就是$1$。'
        explain: '$\ce{H2O}$有$2+1=3$個原子、$\ce{CO2}$有$1+2=3$個、$\ce{O3}$有$3$個；$\ce{NH3}$有$1+3=4$個。'
      en:
        stem: 'Which of these molecules have exactly $3$ atoms in one molecule?'
        options: ['$\ce{H2O}$', '$\ce{CO2}$', '$\ce{O3}$', '$\ce{NH3}$']
        hint: 'A subscript counts the atoms of the element before it; no subscript means $1$.'
        explain: '$\ce{H2O}$ has $2+1=3$ atoms, $\ce{CO2}$ has $1+2=3$ and $\ce{O3}$ has $3$; $\ce{NH3}$ has $1+3=4$.'
    answer: [0, 1, 2]
